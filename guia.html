      <h2 class="mag-title">Os imperdíveis do bairro</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">📚</span><h3>The Wild Detectives</h3><p>408 W 8th St. Uma das melhores livrarias independentes dos EUA — e também um bar. Cerveja artesanal, vinho natural e lançamentos literários no mesmo espaço. Curadoria excepcional, com foco em literatura latinoamericana, ficção independente e não-ficção política. Frequentado por escritores.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Murais de Rua</h3><p>Uma galeria a céu aberto em constante evolução. O mais famoso é o "Bishop Arts" na parede sul do cruzamento principal. Explore os becos de W 7th e W 8th Street — cada um esconde pelo menos um mural novo. Alguns dos melhores artistas de Dallas trabalharam nessas paredes.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>Billie Rutter's</h3><p>A boutique de moda alternativa mais conhecida do bairro. Roupas de marcas independentes, acessórios locais e peças vintage curadas com bom gosto. O espaço é aconchegante e o atendimento genuinamente prestativo — sem intimidamento.</p></div>
        <div class="mag-card"><span class="ic">🍫</span><h3>Dude Sweet Chocolate</h3><p>Chocolateria artesanal com criações que fogem do convencional: chocolates com pimenta do Texas, flor de sal, especiarias mexicanas, whisky local. A chef Katherine Clapner é respeitada na confeitaria americana. Leve uma caixa — o melhor souvenir comestível de Dallas.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Casa de Arte</h3><p>Galeria com foco em artistas emergentes de Dallas e do Texas. Programação rotativa que reflete a diversidade do bairro — arte chicana, fotografia documental, instalação contemporânea. Entrada gratuita. A loja vende prints acessíveis de artistas locais.</p></div>
        <div class="mag-card"><span class="ic">🛒</span><h3>Bishop Street Market</h3><p>Mercado de produtores e artesãos locais aos fins de semana na praça central. Frutas e vegetais da região, artesanato têxtil, comida de rua na hora, músicos ao vivo. É o coração social do bairro — onde Oak Cliff se encontra aos sábados.</p></div>

    <section class="mag-section">

      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">📅</span>Melhor dia e horário</h4><p>Sábado pela manhã é o pico — mercado na praça, lojas abertas, brunch. Se preferir tranquilidade para explorar as lojas, vá na tarde de quinta ou sexta-feira.</p></div>
        <div class="mag-tip"><h4><span class="ic">📚</span>A livraria com bar</h4><p>The Wild Detectives abre às 8h nos fins de semana para café. À noite, vira bar com eventos literários frequentes. Confira o calendário no site — há lançamentos, shows acústicos e leituras toda semana.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>Reserva para Lucia</h4><p>O restaurante Lucia (408 W 8th St) é nominado ao James Beard Award e requer reserva com semanas de antecedência, especialmente nos fins de semana. Reserve pelo OpenTable assim que confirmar as datas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Transporte: DART ou Uber</h4><p>O bairro fica em Oak Cliff, a 15 minutos do centro. O Trinity Railway Express e a linha Oak Cliff têm estação próxima. Uber é conveniente — do Dallas Arts District custa ~$12.</p></div>
        <div class="mag-tip"><h4><span class="ic">🗺️</span>Murais: mapa dos artistas</h4><p>Baixe o mapa de murais nos cafés do bairro ou no site da Bishop Arts District Corporation. Há mais de 20 obras mapeadas — alguns murais ficam em becos que não aparecem no Google Maps.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍖</span>Jantar no bairro</h4><p>O Lockhart Smokehouse lota após as 18h nos fins de semana. Para BBQ sem espera, vá no almoço de semana. Para jantares casuais sem reserva, o Oddfellows serve brunch e jantar excelentes até tarde.</p></div>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Oak Cliff era uma cidade separada</b><span>Até 1903, Oak Cliff era uma cidade independente com prefeitura, câmara e identidade próprias. Quando foi incorporada a Dallas, os moradores protestaram — e um certo orgulho de ser "diferente" persiste até hoje. O Bishop Arts é, em parte, a expressão contemporânea dessa resistência identitária.</span></div></li>
        <li><div><b>A livraria que virou referência nacional</b><span>The Wild Detectives foi fundada em 2014 por dois espanhóis, Paco Vique e Javier García. Em menos de dois anos, foi incluída na lista das melhores livrarias dos EUA pela Poets &amp; Writers e pelo New York Times. O modelo livraria + bar + espaço cultural virou referência para livreiros independentes no país.</span></div></li>
        <li><div><b>Oswald morou aqui</b><span>Lee Harvey Oswald, o assassino de John F. Kennedy, viveu em Oak Cliff nos meses que antecederam o assassinato de novembro de 1963. Sua casa fica a alguns quarteirões do Bishop Arts. O bairro tem, portanto, uma presença involuntária na história americana que raramente aparece nos guias convencionais.</span></div></li>
        <li><div><b>O Lockhart BBQ tem uma história épica</b><span>O Lockhart Smokehouse é franquia do lendário Kreuz Market de Lockhart, Texas — a "Capital do BBQ do Texas" oficialmente reconhecida pelo estado. A família Kreuz divide a receita original há mais de um século. É o único Lockhart Smokehouse fora de Lockhart. A carne é defumada com carvalho vermelho local, sem molho — como manda a tradição.</span></div></li>

    <section class="mag-section">

      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Fine Dining · Italian-Texas Fusion · James Beard Nominee</div><h3>Lucia</h3><div class="addr">📍 408 W 8th St</div><p>O restaurante mais celebrado do Bishop Arts: cozinha italiana interpretada com ingredientes do Texas. Massas artesanais, porchetta com ervas locais, vinhos naturais. O chef David Uygur foi indicado várias vezes ao James Beard Award. Apenas 40 lugares — reserva com semanas de antecedência é indispensável.</p><span class="order">$$$ · Reserva: luciadallas.com</span></div>
      <div class="mag-resto"><div class="tier">Texas BBQ · Casual · Pit-Smoked</div><h3>Lockhart Smokehouse</h3><div class="addr">📍 400 W Davis St · Seg–Dom 11h–22h</div><p>BBQ estilo Central Texas com a herança do lendário Kreuz Market de Lockhart. Brisket, costelas e salsichas defumadas em carvalho vermelho por até 18 horas, sem molho. Mesas comunais, música ao vivo nos fins de semana e cervejas texanas artesanais. A fila faz parte — e vale.</p><span class="order">$$</span></div>
      <div class="mag-resto"><div class="tier">Brunch · Jantar Casual · Bistro</div><h3>Oddfellows</h3><div class="addr">📍 316 W 7th St · Seg–Dom 8h–23h</div><p>O bistro mais charmoso do bairro: cardápio eclético com influências americanas, mexicanas e europeias. O brunch é lendário — panquecas de massa fermentada, huevos rancheros com salsa verde, bloody mary com habanero. À noite, hambúrgueres artesanais e pratos de compartilhar. Animado, barulhento e delicioso.</p><span class="order">$$</span></div>

        <div class="mag-tip"><h4><span class="ic">🚊</span>DART Streetcar</h4><p>A linha Oak Cliff Streetcar conecta o centro de Dallas ao bairro. Estação mais próxima: Bishop &amp; Davis. Bilhete $1,25. Verifique horários no site da DART.</p></div>

<template id="tpl-page-congress_bridge">
<article class="mag" data-theme="austin">

  <nav class="mag-crumbs">

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i36" alt="Congress Avenue Bridge — revoada dos morcegos">
    <div class="mag-eyebrow">Texas · Austin · Espetáculo Natural</div>
    <h1>Congress Avenue <em>Bridge</em></h1>
    <p class="mag-tagline">A maior colônia urbana de morcegos do mundo emerge toda noite ao pôr do sol — 1,5 milhão de morcegos que escurecem o céu por 20 minutos num espetáculo que Austin abraçou como símbolo da própria cidade.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>Grátis</b><span>Espetáculo aberto</span></div>
      <div class="m"><b>1,5M</b><span>Morcegos</span></div>
      <div class="m"><b>1980</b><span>Início da colônia</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Endereço</span><span class="v">Congress Ave Bridge, Austin</span></div>
    <div class="f"><span class="k">Temporada</span><span class="v">Março – Outubro</span></div>
    <div class="f"><span class="k">Horário</span><span class="v">Minutos após o pôr do sol</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">Gratuita</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 8</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Como morcegos viraram o símbolo de Austin</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Em 1980, a reforma da Congress Avenue Bridge criou acidentalmente o habitat urbano mais improvável do mundo: frestas de concreto de 3 cm de largura e 50 cm de profundidade sob o tabuleiro da ponte — dimensões perfeitas para os <strong>Mexican Free-Tailed Bats</strong> (Tadarida brasiliensis) que migram do México para o Texas todo verão.</p>
        <p>Quando a colônia começou a crescer, a reação inicial de Austin foi de pânico. Residentes protestaram, a mídia local publicou reportagens alarmistas sobre "invasão de morcegos" e políticos discutiram remoção. Biólogos da Bat Conservation International, sediada em Austin, intervieram com uma campanha de educação que mudou a narrativa completamente.</p>
        <p>A virada aconteceu quando os dados sobre o papel ecológico dos morcegos foram divulgados: cada morcego consome até 10 gramas de insetos por noite. A colônia inteira — 1,5 milhão de indivíduos — consome <strong>4,5 toneladas de insetos por noite</strong>, protegendo fazendas num raio de 80 km de Austin de pragas agrícolas. Os morcegos que Austin queria remover estavam salvando a agricultura regional.</p>
        <p>Hoje, os morcegos são um orgulho municipal. A revoada ao anoitecer atrai dezenas de milhares de turistas por ano, está em todo o material de marketing da cidade e é considerada um dos maiores espetáculos naturais urbanos da América do Norte. Austin transformou um suposto problema em identidade — coisa que a cidade faz muito bem.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i37" alt="Congress Avenue Bridge ao entardecer">
        <figcaption>Congress Avenue Bridge — a revoada que tapa o céu crepuscular</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">O espetáculo em números</span>
        <p>A colônia da Congress Bridge é a maior concentração urbana de morcegos do mundo. No pico do verão (julho–agosto), a população chega a <strong>1,5 milhão</strong> de morcegos. A revoada ao anoitecer dura de 20 a 45 minutos. As fêmeas dão à luz um filhote cada — e é possível ver os filhotes aprendendo a voar entre julho e agosto, quando a colônia atinge o tamanho máximo.</p>
      </div>
      <div class="mag-chips"><span class="mag-chip">1,5M morcegos</span><span class="mag-chip">4,5t insetos/noite</span><span class="mag-chip">Raio de 80 km protegido</span><span class="mag-chip soft">Descoberta acidental em 1980</span><span class="mag-chip soft">Revoada ~30 min</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Evento em Si</div>
      <h2 class="mag-title">Como assistir à revoada</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">📍</span><h3>Melhor Posição</h3><p>Fique na margem sul da ponte, no gramado que desce até o Lago Lady Bird. Daqui você vê a revoada emergindo das frestas ao nível dos olhos. A beira norte também funciona, mas a perspectiva é menos dramática. Chegue 30 minutos antes do pôr do sol.</p></div>
        <div class="mag-card"><span class="ic">⏰</span><h3>Horário Exato</h3><p>Os morcegos emergem entre 15 e 30 minutos após o pôr do sol. No verão (jun–ago), por volta das 20h15–20h45. Consulte austinbats.org para a previsão do dia — o site é atualizado diariamente com base no horário do pôr do sol local.</p></div>
        <div class="mag-card"><span class="ic">🌤️</span><h3>Condições Ideais</h3><p>Noites quentes e secas produzem revoadas espetaculares. Chuva forte ou queda brusca de temperatura podem atrasar ou cancelar a saída — os morcegos são sensíveis ao clima. Verifique a previsão e monitore austinbats.org.</p></div>
        <div class="mag-card"><span class="ic">👁️</span><h3>O Fenômeno Visual</h3><p>A saída começa com dezenas de morcegos e explode em minutos. Em 10 minutos, há centenas de milhares no ar — uma nuvem escura e ondulante. O som é inacreditável: um zumbido grave e contínuo que você sente na pele antes de ouvir.</p></div>
        <div class="mag-card"><span class="ic">🚤</span><h3>Tour de Barco</h3><p>Várias empresas oferecem tours de caiaque e de barco no Lago Lady Bird para a revoada. Ver os morcegos emergindo da ponte a partir da água é uma perspectiva ainda mais espetacular. Capital Cruises e Lone Star River Boats são opções confiáveis.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Antes e Depois</h3><p>O Bat Bar (na Congress Ave próximo à ponte) tem a varanda perfeita para esperar a revoada com uma cerveja texana. Após o espetáculo, a South Congress Avenue está a 5 minutos a pé, com dezenas de restaurantes e bares para encerrar a noite.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para não perder o espetáculo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🔎</span>Verifique austinbats.org</h4><p>O site é atualizado diariamente com previsão de horário e condições. Indispensável antes de sair — há casos de visitas planejadas em que os morcegos não saíram por causa de chuva.</p></div>
        <div class="mag-tip"><h4><span class="ic">⏳</span>Chegue cedo</h4><p>O gramado sul enche rápido, especialmente nos fins de semana de verão. Chegue com 40–45 minutos de antecedência para boa posição. O espetáculo de luzes do pôr do sol no lago já vale a espera.</p></div>
        <div class="mag-tip"><h4><span class="ic">📷</span>Não use flash</h4><p>O flash estressa os morcegos e pode interromper a revoada. Use ISO alto para fotos noturnas. Os melhores registros são feitos com lentes 50mm+ abertas e velocidade baixa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🦟</span>Repelente é obrigatório</h4><p>Irônico, mas os morcegos comem os mosquitos — que ainda não chegaram. No lago ao entardecer, especialmente no verão, o repelente é indispensável para aguardar confortavelmente.</p></div>
        <div class="mag-tip"><h4><span class="ic">📅</span>Temporada vs. quantidade</h4><p>A revoada acontece de março a outubro, mas o pico é julho–agosto, quando a colônia está no tamanho máximo. Em junho a revoada já é impressionante. Março/abril a colônia é menor.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚫</span>Fique afastado das frestas</h4><p>Não toque na estrutura da ponte nem tente se aproximar das frestas onde os morcegos habitam. Além do risco de mordidas (raras, mas a regra existe), a perturbação pode deslocar a colônia permanentemente.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos surpreendentes</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O acidente arquitetônico perfeito</b><span>As frestas sob a Congress Bridge foram criadas por engenheiros sem a menor intenção de criar habitat para morcegos — eram detalhes de drenagem e ventilação. As dimensões (3 cm de largura, 50 cm de profundidade) são acidentalmente idênticas às fendas rochosas que os Mexican Free-Tailed Bats usam no México. A natureza encontrou o nicho perfeito num projeto humano.</span></div></li>
        <li><div><b>As fêmeas chegam primeiro</b><span>A colônia é predominantemente feminina durante o verão: as fêmeas chegam do México em março para dar à luz (uma cria cada) em ambiente quente e seguro. Os machos ficam dispersos em grupos menores pelo Texas. Em julho, a ponte abriga principalmente mães e filhotes — o que explica o pico de 1,5 milhão.</span></div></li>
        <li><div><b>Echolocation em escala industrial</b><span>Os morcegos navegam por ecolocalização — emitindo sons ultrassônicos e mapeando o ambiente pelas ondas de retorno. Numa colônia de 1,5 milhão, o "barulho" seria ensurdecedor. Estudos descobriram que cada morcego desenvolveu variações únicas de frequência para distinguir o próprio sinal do ruído dos vizinhos.</span></div></li>
        <li><div><b>A Wonder Woman de Austin</b><span>Na beira sul da Congress Bridge existe um mural icônico de Wonder Woman, pintado por um artista local em homenagem à heroína de Gal Gadot. Tornou-se ponto obrigatório de selfie durante a espera pelos morcegos — combinando dois dos espetáculos visuais mais esperados da cidade num só local.</span></div></li>
        <li><div><b>Morcegos inspiraram uma lei estadual</b><span>Em 1995, a Bat Conservation International, baseada em Austin, ajudou a aprovar o Texas Bat Protection Act, que proíbe a perturbação intencional de colônias. A lei foi inspirada diretamente pela luta para proteger a colônia da Congress Bridge nos anos 1980 e hoje protege centenas de colônias em todo o Texas.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé do centro</h4><p>Do centro histórico (6th Street), são apenas 10 minutos a pé para o sul pela Congress Avenue. O passeio pela avenida já é parte da experiência.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Ride-share</h4><p>Uber e Lyft entregam diretamente na Congress Ave &amp; Lady Bird Lake. O ponto de embarque/desembarque mais próximo é na esquina com Riverside Drive.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚴</span>MetroBike</h4><p>Várias estações de bike-share ao longo do Lady Bird Lake Trail. Combine a revoada com um passeio de bicicleta pelas margens do lago ao entardecer.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Estacionamento pago nos lotes próximos ao Auditorium Shores. No verão fica lotado 1h antes do pôr do sol. Prefira transporte público ou ride-share.</p></div>
      </div>
    </section>

      <div class="mag-rule"></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">De trailer a lenda mundial</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Em 2009, Aaron Franklin estacionou um trailer de BBQ na E 11th Street com US$ 10.000 emprestados e uma obsessão com a técnica perfeita de defumação. Seis anos depois, era o <strong>primeiro pitmaster da história a ganhar o James Beard Award</strong> — o Oscar da gastronomia americana.</p>
        <p>A trajetória de Franklin é improvável: ele não tem formação culinária formal, não veio de uma família de pitmasters e não seguiu nenhuma tradição estabelecida de BBQ texano. O que ele fez foi estudar cada variável do processo de defumação com a precisão de um cientista — tipo de madeira, temperatura, umidade, duração, corte da carne — até chegar a um resultado que nenhum concorrente conseguiu replicar.</p>
        <p>O Texas Monthly, a bíblia gastronômica do estado, publicou em 2011 uma crítica que declarou o Franklin "o melhor BBQ do Texas" — o que, no Texas, equivale ao melhor do mundo. A fila que já existia explodiu. Pessoas passaram a vir de outros estados especificamente para almoçar ali. Barack Obama visitou em 2014 e, segundo relatos, furou a fila (único conhecido a conseguir isso).</p>
        <p>Hoje o Franklin Barbecue funciona num prédio próprio construído especialmente para a demanda — mas mantém os mesmos princípios do trailer original: produção limitada, qualidade sem compromisso, sem molho, sem atalhos. Quando a carne acaba, fecha. Todo dia.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i39" alt="Franklin Barbecue — o brisket">
        <figcaption>Franklin Barbecue — o brisket de casca negra e smoke ring rosado</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Texas Monthly, 2011</span>
        <p>O brisket do Franklin é tão bom que faz tudo que você comeu antes parecer um ensaio geral para a coisa real.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Cardápio</div>
      <h2 class="mag-title">O que pedir — sem negociação</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Brisket — obrigatório</b><span>A obra-prima. Peito de boi defumado por 14–18 horas em carvalho branco. A casca preta de sal grosso e pimenta do reino — o "bark" — cede para revelar um anel de fumaça rosado perfeito e carne que se desfaz sem esforço. Peça gordurosa (fatty), não magra.</span></div></li>
        <li><div><b>Pork Ribs — obrigatório</b><span>Costelas de porco defumadas até o ponto perfeito — a carne solta do osso com um puxão leve, sem desmanchar (sinal de que foi cozida na temperatura certa). Tempero minimalista: apenas sal, pimenta e fumaça.</span></div></li>
        <li><div><b>Jalapeño Cheddar Sausage — altamente recomendado</b><span>Salsicha artesanal feita in-house com carne de boi e porco, queijo cheddar derretendo por dentro e jalapeño fresco. Casca que estoura ao morder, interior suculento. Um dos melhores embutidos artesanais dos EUA.</span></div></li>
        <li><div><b>Sides: Feijão &amp; Coleslaw — complete o prato</b><span>Os acompanhamentos são tão cuidadosos quanto a carne: feijão defumado cozido com pontas de brisket, coleslaw cremoso com acidez equilibrada, pão de forma branco para enxugar o caldo. Simples e perfeitos.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">O Ritual da Fila</div>
      <h2 class="mag-title">A espera que faz parte da experiência</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">A fila do Franklin não é um inconveniente — é uma instituição social. Nessas 2 a 4 horas de espera, você vai conversar com estranhos vindos de todos os estados e de países diferentes, todos unidos pela mesma missão. É Austin em forma pura.</p>
      <div class="mag-timeline">
        <div class="mag-tl"><div class="time">7h30–8h</div><div class="track"><div class="dot"></div>
          <div class="act">Chegue</div>
          <p class="det">As primeiras pessoas chegam às 7h ou antes nos fins de semana. Traga cadeira dobrável, protetor solar e água. Nos dias de semana, às 8h você costuma estar em boa posição.</p>
        </div></div>
        <div class="mag-tl"><div class="time">8h–10h</div><div class="track"><div class="dot"></div>
          <div class="act">A fila cresce</div>
          <p class="det">Cerveja aparece — é completamente normal e aceito beber na fila. Conversas surgem naturalmente. Os funcionários passam às vezes para atualizar sobre o estoque do dia (quando há brisket suficiente, há celebração coletiva).</p>
        </div></div>
        <div class="mag-tl"><div class="time">10h–11h</div><div class="track"><div class="dot"></div>
          <div class="act">O cheiro da fumaça fica impossível de ignorar</div>
          <p class="det">A antecipação é física. A fila se organiza espontaneamente e as pessoas começam a combinar pedidos — é eficiente pedir junto com quem está ao lado para experimentar mais cortes.</p>
        </div></div>
        <div class="mag-tl"><div class="time">11h</div><div class="track"><div class="dot eat"></div>
          <div class="act">Abertura</div>
          <p class="det">A fila avança. O atendimento é eficiente — você vai a uma bancada, pede por peso, paga em dinheiro ou cartão. Os funcionários são diretos e amistosos. Leve a bandeja para as mesas externas cobertas ou internas simples.</p>
        </div></div>
        <div class="mag-tl"><div class="time">~13h</div><div class="track"><div class="dot"></div>
          <div class="act">Esgotamento</div>
          <p class="det">O Franklin fecha quando a carne acaba — geralmente entre 13h e 14h. Quem chegou depois de 10h nos fins de semana pode sair de mãos vazias. Já aconteceu. Não arrisque.</p>
        </div></div>

    <section class="mag-section tint">

      <h2 class="mag-title">Para não sair em branco</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">📅</span>Dia da semana</h4><p>Terça, quarta ou quinta são os melhores dias. A fila nos fins de semana pode ter o dobro do tamanho. Às terças o restaurante é menos lotado — chegue às 8h30 e estará bem posicionado.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>Venha de estômago vazio</h4><p>Não coma nada no café da manhã, ou coma muito pouco. A quantidade de carne é substancial. Um bom pedido para duas pessoas custa US$ 50–80 e é mais que suficiente.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Traga dinheiro e cartão</h4><p>O Franklin aceita cartão, mas dinheiro agiliza o pagamento. Tenha US$ 40–60 por pessoa. O brisket é cobrado por onça (US$ 3–4/oz) — peça pelo menos meia libra (227g) para a experiência completa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🥩</span>O segredo do fatty vs. lean</h4><p>Sempre peça o brisket "fatty" (gorduroso), não "lean" (magro). O ponto brilhante de gordura entremeada é onde toda a magia acontece. O corte magro é bom, mas é uma versão incompleta. Não economize na gordura.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚫</span>Sem molho é a regra</h4><p>O Franklin serve molho BBQ à parte — use com moderação ou não use. A carne é boa demais para cobrir com molho. Se você sentir necessidade de muito molho, é sinal de BBQ ruim. Aqui, não é o caso.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚪</span>Segunda-feira: fechado</h4><p>O Franklin fecha às segundas. O horário é terça a domingo. Em feriados nacionais pode haver fechamentos extras — verifique franklinbbq.com antes de planejar o dia.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">A ciência por trás da fumaça</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O James Beard Award que mudou a história do BBQ</b><span>Em 2015, Aaron Franklin tornou-se o primeiro pitmaster na história a ganhar o James Beard Award na categoria Outstanding Chef — a mais disputada do prêmio. Antes disso, o BBQ era considerado "comida popular" pela elite gastronômica americana. Franklin mudou a percepção da cozinha de fumaça para sempre.</span></div></li>
        <li><div><b>Carvalho branco: a escolha científica</b><span>Franklin usa exclusivamente carvalho branco (post oak) do Hill Country, Texas. A escolha não é arbitrária: queima em temperatura mais constante, produz fumaça com menos taninos amargos e cria o perfil de sabor mais limpo para a carne bovina. Ele escreveu um livro inteiro — "Franklin Barbecue: A Meat-Smoking Manifesto" — detalhando a ciência por trás de cada decisão.</span></div></li>
        <li><div><b>14 a 18 horas por peça</b><span>Cada brisket passa 14 a 18 horas no defumador a 110°C constante. Isso exige atenção contínua — alguém monitora a temperatura e adiciona lenha a cada 30–45 minutos a noite toda. Franklin e a equipe chegam antes da madrugada. O que você come às 11h30 começou a ser preparado às 18h do dia anterior.</span></div></li>
        <li><div><b>Obama furou a fila</b><span>Em julho de 2014, o presidente Barack Obama visitou Austin e decidiu almoçar no Franklin. O Secret Service não permitiu que ele ficasse na fila aberta — pela única vez na história do restaurante, alguém foi atendido sem esperar. Segundo relatos, Obama pediu brisket e costelas, comeu muito e deixou gorjeta generosa. A foto na parede é o único autógrafo de um presidente naquele espaço.</span></div></li>

        <div class="mag-tip"><h4><span class="ic">🚴</span>Bicicleta</h4><p>Do centro histórico, 15 minutos de bicicleta. A E 11th St tem ciclovia. MetroBike tem estação a 3 quadras. Bike é a opção mais prática para não se preocupar com estacionamento.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Estacionamento gratuito no lote do próprio restaurante — chegue antes das 8h. Nos fins de semana o lote enche. Há vagas na rua nas quadras adjacentes.</p></div>

    <p class="mag-tagline">A antiga Pearl Brewery de 1883 ressuscitou como o bairro mais sofisticado de San Antonio — cervejaria artesanal, culinária mexicana de autor, mercado de produtores e o River Walk passando pela porta.</p>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Da fábrica de cerveja ao coração gastronômico de SA</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Em 1883, a Pearl Brewing Company abriu às margens do Rio San Antonio, ao norte do centro histórico. Por 118 anos produziu a cerveja Pearl — um ícone cultural texano. Em 2001, a produção encerrou e os enormes prédios industriais ficaram vazios. O que aconteceu depois é uma das histórias de revitalização urbana mais bem-sucedidas do Texas.</p>
      <div class="mag-prose">
        <p>A transformação começou em 2009, quando a Silver Ventures adquiriu o complexo e iniciou uma restauração meticulosa dos edifícios históricos de tijolos aparentes. A filosofia foi preservar o máximo possível da estrutura industrial original — vigas de aço expostas, pisos de madeira centenária, tanques de fermentação decorativos — e inserir nesse espaço uma programação gastronômica e cultural de altíssimo nível.</p>
        <p>O resultado é um bairro de uso misto com cerca de 20 restaurantes, bares e cafés, boutiques independentes, o <strong>Hotel Emma</strong> (dentro da própria brewhouse histórica), o campus texano do <strong>Culinary Institute of America</strong> e um mercado de produtores aos fins de semana. O River Walk de San Antonio foi estendido especialmente para conectar o Pearl ao centro histórico, tornando o percurso a pé uma das caminhadas mais agradáveis da cidade.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i41" alt="The Pearl San Antonio — detalhe">
        <figcaption>The Pearl — a brewhouse histórica de 1883 reinventada como distrito gastronômico</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Pearl Brewing Company — 118 anos de história</span>
        <p>Fundada pelo imigrante alemão <strong>Otto Koehler</strong> em 1883, a Pearl tornou-se a cerveja mais consumida no Texas por décadas — era a cerveja dos rodeios, dos jogos de baseball e das festas de quintal em todo o estado. Após o encerramento em 2001, o complexo ficou abandonado por anos até a revitalização. Hoje a Southerleigh Brewing funciona dentro da brewhouse original, usando parte dos equipamentos históricos restaurados. A continuidade com a tradição cervejeira é proposital e simbólica.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências no Pearl</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🍺</span><h3>Southerleigh Brewing</h3><p>A nova cervejaria funciona dentro da brewhouse histórica original. Cervejas artesanais in-house, frutos do mar frescos do Golfo, cardápio que celebra a culinária costeira do Texas. Ambiente industrial-chic com vista para os tanques de fermentação restaurados. Um dos bares mais bonitos do Texas.</p></div>
        <div class="mag-card"><span class="ic">🛒</span><h3>Pearl Farmers Market</h3><p>Aos sábados e domingos pela manhã, os gramados viram um mercado de produtores: frutas e vegetais da região, artesanato local, flores frescas, pães artesanais e comida de rua na hora. É onde os chefs de San Antonio fazem as compras de fim de semana — um endosso que diz tudo.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>River Walk Extension</h3><p>O trecho do River Walk que passa pelo Pearl é diferente do turístico centro histórico: mais verde, menos comercial, com bicicletas e corredores locais. O passeio de 2,5 km desde o centro até o Pearl é uma das melhores experiências da cidade — faça de ida a pé e de volta de ride-share.</p></div>
        <div class="mag-card"><span class="ic">🏨</span><h3>Hotel Emma</h3><p>Instalado na própria brewhouse original, é considerado um dos melhores hotéis boutique dos EUA. O lobby mantém os caldeirões de cobre originais como decoração. Mesmo sem se hospedar, entre para ver o espaço e tome um drinque no bar Sternewirth — o mais bonito de San Antonio.</p></div>
        <div class="mag-card"><span class="ic">👨‍🍳</span><h3>Culinary Institute of America</h3><p>O campus texano do CIA fica dentro do Pearl, visível do gramado central. Os alunos frequentemente fazem pop-ups e degustações no mercado de fins de semana. É parte do DNA gastronômico do bairro — não à toa San Antonio tem alguns dos melhores restaurantes do Texas.</p></div>
        <div class="mag-card"><span class="ic">🎵</span><h3>Shows e eventos</h3><p>O gramado central tem programação cultural constante: shows ao vivo nos fins de semana, feiras de artesanato, eventos sazonais. No verão, cinema ao ar livre às quartas-feiras. Consulte atpearl.com — raramente há um fim de semana sem algum evento.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">📅</span>Mixtli: reserve com semanas</h4><p>O Restaurant Mixtli tem apenas 14 lugares por noite e exige reserva com semanas — às vezes meses — de antecedência. Reserve assim que confirmar as datas da viagem em mixtlirestaurant.com. Vale cada esforço.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌅</span>Mercado: chegue cedo</h4><p>O Farmers Market começa às 9h aos sábados e as melhores bancas esgotam por volta das 11h. Chegue antes das 10h para encontrar o mercado em plena atividade e sem as multidões.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍸</span>Bar do Hotel Emma</h4><p>O Sternewirth Bar não exige que você seja hóspede. Entre e tome um drinque no espaço mais impressionante de San Antonio — caldeirões de cobre do século XIX como decoração, iluminação perfeita. Um dos bares mais fotografados do Texas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>Combine com La Villita</h4><p>Depois do Pearl, percorra o River Walk até o La Villita Historic Arts Village — bairro do século XVIII convertido em galerias e ateliês. São 2 km pela margem do rio, uma das caminhadas mais agradáveis da cidade.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧀</span>Cured: sem reserva possível</h4><p>O Cured não aceita reservas — é fila. Chegue 15 minutos antes da abertura (11h no almoço, 17h no jantar) para garantir mesa. O charcuterie board de entrada é um dos melhores dos EUA.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍺</span>Southerleigh: vá no almoço</h4><p>O Southerleigh fica superlotado ao jantar, com esperas de 45+ minutos. No almoço de semana é muito mais tranquilo, com o mesmo menu e qualidade. A happy hour das 15h às 18h tem preços imbatíveis na cerveja artesanal.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Histórias do Pearl</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O restaurante mais difícil de reservar no Texas</b><span>O Restaurant Mixtli serve apenas 14 pessoas por noite, seis noites por semana. O menu de degustação explora uma região diferente da culinária mexicana a cada mês — Oaxaca, Veracruz, Yucatán, Baja California — com ingredientes importados das regiões retratadas. Indicado ao James Beard Award múltiplas vezes. A lista de espera pode ultrapassar dois meses.</span></div></li>
        <li><div><b>O CIA escolheu San Antonio deliberadamente</b><span>Quando o Culinary Institute of America decidiu abrir seu único campus fora de Nova York, escolheu San Antonio por uma razão específica: a cidade é considerada a capital gastronômica da culinária mexicana nos EUA. A influência cultural mexicana na cozinha local é mais profunda aqui do que em qualquer outra cidade americana, incluindo Los Angeles e Houston.</span></div></li>
        <li><div><b>Otto Koehler e o escândalo</b><span>O fundador da Pearl Brewery, Otto Koehler, foi assassinado em 1914 por sua amante, Emma Dumpke — cujo nome inspirou o Hotel Emma. O caso foi um dos maiores escândalos de San Antonio no início do século XX. Emma foi julgada duas vezes e absolvida ambas — o júri local aparentemente simpatizou com ela. Uma história digna de novela, que o hotel celebra com discreta elegância.</span></div></li>
        <li><div><b>O River Walk foi estendido para chegar aqui</b><span>O famoso River Walk, criado nos anos 1930, terminava no centro histórico. A extensão até o Pearl foi construída especialmente para conectar a revitalização ao coração turístico — um investimento público de US$ 14 milhões que transformou os 2,5 km entre os dois pontos num dos passeios fluviais mais agradáveis do Texas.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Os melhores do Pearl</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Menu Degustação · Culinária Mexicana Regional · James Beard Nominee</div><h3>Restaurant Mixtli</h3><p>O restaurante mais singular de San Antonio: menu de degustação de 10 pratos que explora uma região diferente da culinária mexicana a cada mês. Apenas 14 lugares por noite, ingredientes importados das regiões retratadas. Diego Galicia e Rico Torres, os chefs, são dois dos cozinheiros mais importantes do Texas. A experiência é uma imersão cultural tanto quanto gastronômica.</p><span class="order">$$$$ · mixtlirestaurant.com · Reserva obrigatória com semanas de antecedência</span></div>
      <div class="mag-resto"><div class="tier">Charcuterie · Farm-to-Table · Prédio Histórico</div><h3>Cured</h3><div class="addr">📍 306 Pearl Pkwy · Seg–Dom 11h–22h</div><p>Instalado no prédio mais antigo do complexo Pearl, o Cured especializou-se em charcuterie artesanal feita in-house: presuntos curados, salsichas, pâtés e terrines. O charcuterie board de entrada é obrigatório — talvez o melhor dos EUA. Pratos principais seguem a filosofia farm-to-table com ingredientes de produtores texanos. Sem reservas.</p></div>
      <div class="mag-resto"><div class="tier">Cervejaria Artesanal · Frutos do Mar · Brewhouse Histórica</div><h3>Southerleigh Fine Food &amp; Brewery</h3><div class="addr">📍 136 E Grayson St · Seg–Dom 11h–23h</div><p>A cervejaria do Pearl dentro da brewhouse original de 1883. As cervejas são produzidas in-house com equipamentos modernos ao lado dos tanques históricos restaurados. O cardápio foca em frutos do mar frescos do Golfo — ostras, camarão, peixes — com influências da culinária costeira texana e cajun. Um dos bares mais bonitos do Texas.</p><span class="order">$$$ · Reserva recomendada</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Ao Redor do Pearl</div>
      <h2 class="mag-title">Combine com estas atrações</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <div class="mag-card"><span class="ic">🎨</span><h3>La Villita Historic Arts Village</h3><p>2 km pelo River Walk. Bairro do século XVIII convertido em galerias e ateliês de artistas locais. Entrada gratuita, arquitetura colonial espanhola preservada. Combine com a caminhada pelo River Walk entre os dois pontos.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>El Mercado</h3><p>3 km pelo River Walk. O maior mercado mexicano fora do México — artesanato, comida tradicional, músicos de mariachi, lojas de especiarias. Colorido, autêntico e inescapável em San Antonio.</p></div>
        <a class="mag-card" href="#page/the_alamo"><span class="ic">🏰</span><h3>The Alamo</h3><p>3,5 km · Uber recomendado. O símbolo mais icônico do Texas. A missão franciscana de 1718 onde, em 1836, 189 defensores resistiram por 13 dias ao exército mexicano. Entrada gratuita, aberto diariamente.</p><span class="go">Guia completo →</span></a>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚶</span>River Walk a pé</h4><p>Do centro histórico, 2,5 km pelo River Walk — 30 min de caminhada agradável pela margem do rio. A melhor forma de chegar para sentir a transição do centro turístico ao bairro.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Ride-Share</h4><p>Uber e Lyft do Alamo: 8–10 min, US$ 6–10. Do aeroporto SAT: 20 min, US$ 18–25. Ponto de embarque no Pearl na E Grayson St.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>VIA Bus</h4><p>A linha 20 (Broadway) conecta o centro histórico ao Pearl. Parada na N St. Mary's St &amp; Grayson St. Bilhete US$ 1,30. Rápido e barato.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Estacionamento gratuito nos lotes do Pearl Complex em dias de semana. Nos fins de semana com mercado, chega a encher — chegue antes das 9h30 ou use ride-share.</p></div>
      </div>
    </section>

    <h1>Vieux-<em>Montréal</em></h1>
    <p class="mag-tagline">Pedras de calçamento do século XVII, arquitetura que mistura o francês e o inglês, o Rio São Lourenço ao fundo e a Basílica de Notre-Dame iluminando tudo em azul — o coração histórico de Montréal.</p>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Onde Montréal começou</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Em 1642, o missionário Paul Chomedey de Maisonneuve desembarcou numa ilha do Rio São Lourenço com 50 colonos e fundou Ville-Marie — o que viria a ser Montréal. O bairro que hoje chamamos de Vieux-Montréal é exatamente esse ponto de origem: as ruas seguem o traçado da colônia do século XVII, e os edifícios de pedra cinzenta são testemunhas diretas de quatro séculos de história.</p>
        <p>O que torna o Vieux-Montréal único entre os centros históricos da América do Norte é a autenticidade da preservação: não é uma reconstrução ou cenografia turística, mas um bairro vivo onde escritórios, restaurantes, hotéis boutique e galerias funcionam em edifícios dos séculos XVIII e XIX. As pedras de calçamento da Rue Saint-Paul são as mesmas que os carroceiros viraram há 200 anos.</p>
        <p>A tensão cultural entre o francês e o inglês que define Montréal está inscrita na arquitetura do Vieux: igrejas católicas neo-góticas convivem com bancos protestantes neoclássicos, mansões dos marchands franceses lado a lado com os armazéns dos comerciantes escoceses que dominaram o comércio no século XIX. É uma coexistência tensa e fértil que produziu uma das culturas urbanas mais ricas da América do Norte.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i43" alt="Ruas de calçamento do Vieux-Montréal">
        <figcaption>Vieux-Montréal — ruas de calçamento do século XVII</figcaption>
      </figure>
      <div class="mag-cards">
        <div class="mag-card"><span class="ic">🛣️</span><h3>Rue Saint-Paul <span class="go">Fundada em 1672</span></h3><p>A rua mais antiga de Montréal. Galerias de arte, restaurantes em caves históricas, ateliês de joalheria e lojas de artesanato québécois. À noite, iluminação a gás e musique de rue criam uma atmosfera única.</p></div>
        <div class="mag-card"><span class="ic">⛪</span><h3>Rue Notre-Dame <span class="go">Século XVIII</span></h3><p>A artéria principal do Vieux, com a Basílica Notre-Dame como ponto focal. Edifícios neoclássicos que abrigaram os mais poderosos bancos e firmas comerciais do Canadá do século XIX.</p></div>
        <div class="mag-card"><span class="ic">🎭</span><h3>Place Jacques-Cartier <span class="go">Praça central</span></h3><p>A praça central do Vieux — animada com músicos de rua, retratistas, turistas e locais tomando vinho ao ar livre. A coluna de Nelson ao centro é controversa: celebra o almirante britânico num bairro francófono.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">As atrações essenciais</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Destaque Principal</span>
        <p><strong>Basílica Notre-Dame de Montréal</strong> — a joia do Vieux: construída entre 1824 e 1829, a basílica neo-gótica tem um interior que rivaliza com as grandes igrejas europeias — azul profundo, dourado, vitrais, o órgão Casavant. É a igreja mais fotografada do Canadá por uma boa razão. O show imersivo AURA projeta luz e música na arquitetura interna por 50 minutos. Reserve com antecedência, especialmente no verão.</p>
      </div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/notre_dame_montreal"><span class="ic">⛪</span><h3>Basílica Notre-Dame</h3><p>Veja a página completa da basílica: o interior azul-cobalto, o órgão de 11.000 tubos, os vitrais de Limoges e o espetáculo AURA da Moment Factory.</p><span class="go">Página completa →</span></a>
        <div class="mag-card"><span class="ic">🎡</span><h3>La Grande Roue de Montréal</h3><p>A roda-gigante de 60 metros no Vieux-Port oferece gôndolas fechadas com ar-condicionado — perfeitas para o calor de julho. Em 20 minutos de rotação lenta, a vista do Rio São Lourenço, das ilhas e do skyline é de tirar o fôlego. À noite, o espetáculo de luzes da cidade é memorável.</p></div>
        <div class="mag-card"><span class="ic">🏰</span><h3>Château Ramezay</h3><p>280 Notre-Dame E. Construído em 1705 como residência do governador de Montréal, é hoje um museu que documenta quatro séculos de história com notável rigor. Os jardins à francesa nos fundos são uma surpresa deliciosa. Entrada $10.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Marché Bonsecours</h3><p>350 Saint-Paul E. O mercado público de 1847, com sua famosa cúpula prateada visível de toda a orla, foi transformado em espaço de boutiques de design québécois e exposições temporárias. Ideal para comprar artesanato local de qualidade.</p></div>
        <div class="mag-card"><span class="ic">⛵</span><h3>Vieux-Port: Orla do Saint-Laurent</h3><p>As docas históricas viraram um parque linear ao longo do Rio São Lourenço. Ciclistas, corredores, food trucks sazonais, eventos de verão. O Quai de l'Horloge, com seu relógio marítimo de 1922, é o ponto mais fotogênico da orla.</p></div>
        <div class="mag-card"><span class="ic">🚲</span><h3>Passeio de bicicleta pela orla</h3><p>O Vieux-Port tem ciclovias excelentes ao longo do rio. As bicicletas Bixi têm estações em toda a área. O percurso até a Île Sainte-Hélène, com vista da ponte Jacques-Cartier, é uma das melhores experiências ao ar livre da cidade.</p></div>
        <div class="mag-card"><span class="ic">🗺️</span><h3>Ruelle des Fortifications</h3><p>Os becos e ruelles entre as grandes ruas guardam os melhores segredos do bairro: murais de artistas locais, cafés minúsculos escondidos em cave, boutiques que não estão em nenhum guia. Reserve tempo para se perder deliberadamente — o Vieux recompensa quem abandona o roteiro.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">The Guardian, 2023</span>
        <p>Montréal é a cidade mais europeia da América do Norte — e o Vieux-Montréal é onde essa europeidade está mais concentrada, mais viva e mais sedutora.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🎫</span>AURA: reserve com antecedência</h4><p>O show imersivo na Basílica Notre-Dame esgota semanas antes nos meses de verão. Reserve assim que confirmar as datas. Vale muito — a experiência noturna é completamente diferente da visita diurna.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎡</span>La Grande Roue: vá ao anoitecer</h4><p>A roda-gigante é bonita de dia, mas à noite com a cidade iluminada é outro nível. Reserve o ingresso online para evitar filas — nos fins de semana de julho a fila sem reserva pode ser longa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🙋</span>Fale francês (tente)</h4><p>"Bonjour" e "merci" são recebidos com genuíno prazer em Montréal. Mesmo com sotaque, a tentativa de cumprimentar em francês abre sorrisos. A maioria dos estabelecimentos do Vieux atende perfeitamente em inglês também.</p></div>
        <div class="mag-tip"><h4><span class="ic">👟</span>Calçado para calçamento</h4><p>As pedras irregulares da Rue Saint-Paul e das ruelles são pitorescas mas implacáveis com saltos e solas finas. Sapatos confortáveis são indispensáveis — você vai caminhar muito mais do que planeja.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛍️</span>Marché Bonsecours: compras inteligentes</h4><p>Para souvenirs de qualidade, o Marché tem design québécois genuíno — cerâmica local, joalheria artesanal, peles, produtos de bordo (maple). Evite as lojas de lembranças genéricas da Place Jacques-Cartier.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏔️</span>Combine com o Mont-Royal</h4><p>O Vieux fica no sul da cidade. Suba o Mont-Royal pelo Parc no mesmo dia — o contraste entre a vista do Rio São Lourenço (do Vieux) e a vista da cidade do alto do parque completa a perspectiva de Montréal.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Histórias que as pedras guardam</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>A Rue Saint-Paul tinha outro nome</b><span>A rua mais antiga de Montréal foi chamada de Rue du Marché, Rue Saint-Joseph e Rue des Commissaires antes do nome definitivo. Por séculos foi o coração comercial — era aqui que os coureurs des bois chegavam com canoas carregadas de peles. Os edifícios que hoje abrigam restaurantes chiques eram armazéns cheirando a castor e lontra.</span></div></li>
        <li><div><b>O casamento de Céline Dion</b><span>Em 1994, Céline Dion casou-se com René Angélil na Basílica Notre-Dame. A cerimônia foi transmitida ao vivo pela TV canadense e assistida por milhões. Dion usou um vestido de 20 kg com tiara de diamantes. O evento transformou a basílica num ícone pop além do religioso.</span></div></li>
        <li><div><b>Benjamin Franklin ficou no Château Ramezay</b><span>Em 1776, Benjamin Franklin passou semanas no Château Ramezay como emissário do Congresso Continental, tentando convencer os canadenses franceses a se juntarem à Revolução Americana. Falhou — os québécois preferiram a proteção britânica da Lei de Québec (1774). Um dos "e se" mais fascinantes da história norte-americana.</span></div></li>
        <li><div><b>A Coluna de Nelson: 200 anos de polêmica</b><span>A Coluna de Nelson na Place Jacques-Cartier, inaugurada em 1809, celebra o almirante britânico Horatio Nelson. É a única estátua de Nelson no mundo fora do Reino Unido — e sua presença no coração do bairro francófono nunca foi aceita sem protesto. A placa original em inglês foi substituída por uma bilíngue em 1997.</span></div></li>
        <li><div><b>O porto que construiu o Canadá</b><span>No século XIX, o Porto de Montréal era o mais movimentado do Canadá — toda a produção agrícola do interior escoava por aqui para a Europa. Os imensos armazéns de pedra na orla do Vieux-Port são a escala física dessa prosperidade. O canal de Lachine, de 1825, foi o projeto de infraestrutura mais ambicioso do Canadá colonial.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Onde comer no Vieux-Montréal</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Bistrô Québécois · Cave Histórica · $$$</div><h3>Restaurant Chez Queux</h3><div class="addr">📍 158 Rue Notre-Dame E · Reserva recomendada</div><p>Instalado numa cave de pedra do século XVIII, serve cozinha quebequense clássica: tourtière, ragoût de boulettes, poutine refinada, carnes de caça no inverno. A adega tem vinhos franceses e de Ontário. Ambiente autenticamente histórico — as paredes de pedra e as velas criam uma atmosfera inesquecível.</p></div>
      <div class="mag-resto"><div class="tier">Fine Dining · Contemporâneo · $$$</div><h3>Le Serpent</h3><div class="addr">📍 257 Rue Prince · Ter–Sáb · Reserva obrigatória</div><p>Num antigo complexo industrial do século XIX, serve cozinha italiana-montréalaise numa sala de tetos de 8 metros com vigas de ferro expostas. Massas artesanais, ossobuco, peixes do Saint-Laurent. O bar de cocktails é tão bom quanto o restaurante. Frequentado pela elite criativa da cidade.</p></div>
      <div class="mag-resto"><div class="tier">Café · Brunch · Vieux-Port · $</div><h3>Crew Collective &amp; Café</h3><div class="addr">📍 360 Rue Saint-Jacques · Seg–Dom 7h–19h</div><p>No antigo Royal Bank of Canada de 1928, com tetos de 15 metros, colunas de mármore e vitrais art-déco preservados, é o café mais belo e o coworking mais impressionante de Montréal. Café especialidade, croissants de manteiga, sanduíches. Obrigatório para entender a ambição arquitetônica da cidade no início do século XX.</p></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>Métro STM</h4><p>Linha Orange: estação Place-d'Armes (saída para Notre-Dame) ou Champ-de-Mars (saída para Jacques-Cartier). Bilhete único C$3,75 ou passe diário C$11.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé do centro</h4><p>Do centro comercial (Rue Sainte-Catherine), 20 minutos a pé para o sul pela Rue McGill ou Rue University. O percurso desce gradualmente até o rio.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚲</span>Bixi (Bike-Share)</h4><p>Estações Bixi em todo o Vieux e no Vieux-Port. Passe diário C$8. Ideal para explorar a orla do Saint-Laurent e o bairro ao mesmo tempo.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Ride-Share</h4><p>Uber funciona bem em Montréal. Do Plateau Mont-Royal: 12 min, C$10–14. Do aeroporto Pierre-Elliott Trudeau: 30 min, C$40–55.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">No roteiro · Dia 14 · 2 de julho</span>
        <p>Vieux-Montréal + Basílica Notre-Dame + AURA show + Vieux-Port ao anoitecer. <a href="#day/14">Ver programação do dia →</a></p>

<template id="tpl-page-space_center_houston">
<article class="mag" data-theme="houston">

  <nav class="mag-crumbs">
    <a href="#home" class="home">◆ Roteiro</a>
    <span class="sep">/</span><a href="#city/houston">Houston</a>
    <span class="sep">/</span><span class="here">Space Center</span>
  </nav>

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i61" alt="Space Center Houston">
    <div class="mag-eyebrow">Texas · Houston · Atração</div>
    <h1>Space Center <em>Houston</em></h1>
    <p class="mag-tagline">Onde a humanidade falou com a Lua: o centro oficial de visitantes da NASA, ao lado do controle de missão que conduziu a Apollo 11.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>1992</b><span>Abertura ao público</span></div>
      <div class="m"><b>4–6 h</b><span>Duração ideal</span></div>
      <div class="m"><b>+400 mil</b><span>Objetos no acervo</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Endereço</span><span class="v">1601 E NASA Pkwy, Houston, TX</span></div>
    <div class="f"><span class="k">Horário</span><span class="v">10h–17h (varia por temporada)</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">A partir de US$ 29,95 (online)</span></div>
    <div class="f"><span class="k">Melhor época</span><span class="v">Abrir o portão · dia de semana</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 11</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">"Houston, aqui é a Base da Tranquilidade"</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Quando Neil Armstrong pousou na Lua em 20 de julho de 1969, a primeira palavra que ele pronunciou da superfície lunar foi <strong>"Houston"</strong>. Não por acaso: era para esta cidade do Texas que todas as transmissões das missões tripuladas americanas convergiam. O <em>Lyndon B. Johnson Space Center</em>, inaugurado em 1961 como Manned Spacecraft Center, é desde então o coração do programa de voo espacial humano dos Estados Unidos — a casa do controle de missão, do treinamento de astronautas e do desenvolvimento das naves que levaram o homem ao espaço.</p>
        <p>O complexo da NASA em si é um campus de trabalho fechado. Mas em 1992 foi inaugurado, ao lado dele, o <strong>Space Center Houston</strong> — o centro oficial de visitantes, projetado pela mesma empresa por trás da Disney e administrado por uma organização educacional sem fins lucrativos. É aqui que o público entra em contato direto com a história espacial: cápsulas que voltaram da órbita, rochas lunares trazidas pelas missões Apollo, trajes de astronautas e um ônibus espacial em escala real montado sobre o avião que o transportava.</p>
        <p>Hoje o Space Center Houston é Smithsonian Affiliate e recebe mais de um milhão de visitantes por ano. Não é um parque de diversões nem um museu poeirento — é um lugar onde a engenharia que mudou o século XX é apresentada com reverência e didatismo. Para quem cresceu vendo a corrida espacial nos livros, pisar onde tudo foi coordenado é uma experiência genuinamente emocionante.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i62" alt="Astronauta e exploração espacial">
        <figcaption>Space Center Houston — o legado da exploração espacial tripulada</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Da Apollo ao ônibus espacial</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🚀</span><h3>NASA Tram Tour</h3><p>O passeio de tram é a alma da visita: leva os visitantes para dentro do campus ativo da NASA. Inclui o histórico controle de missão da era Apollo, restaurado ao estado de 1969, e o laboratório onde astronautas treinam hoje.</p></div>
        <div class="mag-card"><span class="ic">🛰️</span><h3>Independence Plaza</h3><p>O réplica do ônibus espacial <em>Independence</em> montado sobre o Shuttle Carrier Aircraft (um Boeing 747 real). É possível entrar nos dois — único lugar do mundo onde se vê essa configuração completa.</p></div>
        <div class="mag-card"><span class="ic">🌕</span><h3>Rochas lunares e Apollo</h3><p>Toque numa amostra de rocha lunar trazida por uma missão Apollo e veja a cápsula da Apollo 17 — a última a levar humanos à Lua. O acervo de naves originais é impressionante.</p></div>
        <div class="mag-card"><span class="ic">🛸</span><h3>Starship Gallery</h3><p>Uma galeria Smithsonian com a cápsula Mercury Faith 7, a Gemini 5 e o módulo de comando Apollo. Cada nave aqui realmente voou ao espaço — não são réplicas.</p></div>
        <div class="mag-card"><span class="ic">🪐</span><h3>Mission Mars</h3><p>Exposição interativa sobre a próxima fronteira: amostras reais de Marte (meteoritos marcianos), simuladores de habitat e o programa Artemis de retorno à Lua.</p></div>
        <div class="mag-card"><span class="ic">👨‍🚀</span><h3>Astronaut Gallery</h3><p>A maior coleção de trajes espaciais usados em missões reais do mundo — do macacão da Mercury aos trajes pressurizados do ônibus espacial. Histórias humanas por trás de cada um.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">⏰</span>Chegue na abertura</h4><p>Vá direto ao balcão do NASA Tram Tour assim que entrar — as filas crescem rápido e os horários esgotam. É a atração que não pode faltar.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Compre online</h4><p>O ingresso online sai mais barato e evita fila na bilheteria. Há combos com tour estendido (Level 9 Tour) que entram em áreas restritas — reserve com antecedência.</p></div>
        <div class="mag-tip"><h4><span class="ic">📅</span>Evite fins de semana</h4><p>Em dias de semana o tram tour acessa o controle de missão atual em operação. Aos fins de semana e feriados, esse acesso pode ser limitado.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧥</span>Leve um casaco leve</h4><p>O ar-condicionado interno é forte e o contraste com o calor texano de junho (que passa de 35°C) é grande. Calçado confortável é essencial — caminha-se muito.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Baixe o app</h4><p>O app do Space Center traz a grade de palestras com astronautas, horários dos tours e mapa. As palestras ao vivo de quem foi ao espaço valem ouro.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍔</span>Coma antes do tram</h4><p>O food court fica lotado no almoço. Faça o tram tour cedo e almoce depois das 13h30, quando as filas afrouxam.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades Fascinantes</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>A primeira palavra da Lua foi "Houston"</b><span>Ao confirmar o pouso, Armstrong disse: "Houston, Tranquility Base here. The Eagle has landed." Toda comunicação das missões tripuladas passava pelo controle de missão neste campus.</span></div></li>
        <li><div><b>O controle de missão é um marco nacional</b><span>A histórica Mission Operations Control Room foi restaurada ao estado exato de 1969 — cinzeiros, xícaras de café e papéis de parede da época — e declarada National Historic Landmark.</span></div></li>
        <li><div><b>"Apollo 13" foi filmado com a ajuda daqui</b><span>A NASA assessorou o filme de Ron Howard, e cenas usaram referências do controle real. A famosa frase "Houston, we have a problem" nasceu nesta sala.</span></div></li>
        <li><div><b>O 747 que carrega o ônibus é real</b><span>O Shuttle Carrier Aircraft em Independence Plaza é um Boeing 747 verdadeiro, modificado pela NASA para transportar ônibus espaciais nas costas entre bases.</span></div></li>
        <li><div><b>Você pode tocar a Lua</b><span>Uma das poucas amostras de rocha lunar do mundo disponíveis ao toque público fica na Starship Gallery — trazida por uma missão Apollo e polida por milhões de mãos.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Onde Comer</div>
      <h2 class="mag-title">Pausa entre as estrelas</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Food Court · Interno</div><h3>Zero-G Diner</h3><div class="addr">📍 Dentro do Space Center Houston</div><p>O restaurante principal do complexo: hambúrgueres, pizzas, saladas e opções para crianças. Prático para não perder tempo de visita, embora os preços sejam de atração turística.</p><span class="order">Peça: Astronaut Burger + sorvete liofilizado de lembrança</span></div>
      <div class="mag-resto"><div class="tier">Frutos do mar · Texana</div><h3>Tookie's Seafood</h3><div class="addr">📍 1202 Bayport Blvd, Seabrook</div><p>A poucos minutos do centro, na região de Clear Lake/Kemah. Famoso pelos hambúrgueres e frutos do mar frescos da costa do Golfo — parada clássica de quem visita a NASA.</p><span class="order">Peça: Squealer Burger + camarão frito</span></div>
      <div class="mag-resto"><div class="tier">Beira-mar · Boardwalk</div><h3>Kemah Boardwalk</h3><div class="addr">📍 215 Kipp Ave, Kemah</div><p>Um calçadão à beira da baía com vários restaurantes (Landry's, Saltgrass Steak House) e parquinho. Ótimo para encerrar o dia com vista para a água depois da NASA.</p><span class="order">Peça: Frutos do mar com vista para a Galveston Bay</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Rumo ao espaço (de carro)</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚗</span>Do Downtown Houston</h4><p>Cerca de 40 km ao sudeste pela I-45 South até a saída NASA Road 1. São 35–45 minutos sem trânsito; calcule mais no horário de pico.</p></div>
        <div class="mag-tip"><h4><span class="ic">✈️</span>Do aeroporto Hobby (HOU)</h4><p>Aproximadamente 25–30 minutos pela I-45 South. É o aeroporto mais próximo; do Bush Intercontinental (IAH) são quase 50 minutos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>O estacionamento próprio cobra cerca de US$ 5–8/dia e fica ao lado da entrada. Espaço amplo, mas chegue cedo para ficar perto do portão.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚙</span>Uber e Lyft</h4><p>Funcionam bem para chegar, mas na saída pode haver espera — a região é afastada. Combine o retorno com antecedência ou alugue carro para o dia.</p></div>
      </div>
    </section>

    <div data-rel-kind="attraction" data-rel-id="space_center_houston"></div>

    <footer class="mag-footer">
      <span class="big">Space Center Houston · Houston</span>
      Texas, Estados Unidos<br><br>

    </footer>

  </div>
</article>

<template id="tpl-page-tampa_riverwalk">
<article class="mag" data-theme="tampa">

  <nav class="mag-crumbs">
    <a href="#home" class="home">◆ Roteiro</a>
    <span class="sep">/</span><a href="#city/tampa">Tampa</a>
    <span class="sep">/</span><span class="here">Tampa Riverwalk</span>
  </nav>

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i63" alt="Tampa Riverwalk">
    <div class="mag-eyebrow">Flórida · Tampa Bay · Atração</div>
    <h1>Tampa <em>Riverwalk</em></h1>
    <p class="mag-tagline">Quase quatro quilômetros de calçadão à beira do rio que costuram o centro de Tampa numa só caminhada de parques, museus e pôr do sol sobre a água.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>3,8 km</b><span>Extensão do calçadão</span></div>
      <div class="m"><b>Grátis</b><span>Acesso público 24h</span></div>
      <div class="m"><b>2016</b><span>Conclusão integral</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Endereço</span><span class="v">Margem do Hillsborough River, Downtown Tampa</span></div>
    <div class="f"><span class="k">Horário</span><span class="v">Aberto 24h · Atrações 10–18h</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">Gratuita (calçadão)</span></div>
    <div class="f"><span class="k">Melhor época</span><span class="v">Fim de tarde · pôr do sol</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 1</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">O rio que Tampa redescobriu</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Por boa parte do século XX, o <strong>Hillsborough River</strong> foi as costas de Tampa — uma faixa industrial de docas e armazéns que a cidade preferia ignorar. A ideia de um calçadão contínuo às margens do rio circulava desde os anos 1970, mas só ganhou força real nas décadas seguintes, quando Tampa decidiu reconquistar sua orla urbana. O <em>Tampa Riverwalk</em> foi sendo construído em trechos, e em 2016 a cidade finalmente conectou todos os segmentos numa única passarela contínua de cerca de 3,8 quilômetros.</p>
        <p>O resultado transformou o centro. O que era um corredor de concreto esquecido virou a espinha dorsal da vida pública de Tampa: famílias caminhando, corredores ao amanhecer, casais no pôr do sol, food trucks e festivais o ano inteiro. O calçadão liga uma sequência impressionante de pontos — parques, museus, arenas, restaurantes — sem que se precise pegar o carro uma única vez.</p>
        <p>Hoje o Riverwalk é o orgulho cívico de Tampa e o melhor ponto de partida para conhecer o downtown a pé. Placas históricas ao longo do percurso (o <em>Tampa Historical Monument Trail</em>) homenageiam figuras que moldaram a cidade, e a vista do rio com os arranha-céus ao fundo, especialmente ao entardecer, é uma das imagens mais bonitas da Flórida.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i64" alt="Beira-rio e centro de Tampa">
        <figcaption>Tampa Riverwalk — o calçadão à beira do Hillsborough River</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Pontos ao longo do calçadão</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏭</span><h3>Armature Works</h3><p>Antigo galpão de bondes de 1910 transformado num vibrante food hall. Dezenas de barracas gastronômicas, bar central, eventos e um gramado à beira-rio. Parada obrigatória, sobretudo no fim de tarde.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Tampa Museum of Art</h3><p>Arte clássica e contemporânea num prédio moderno à beira do rio, com uma fachada de painéis luminosos que muda de cor à noite. À margem fica a icônica escultura interativa de água.</p></div>
        <div class="mag-card"><span class="ic">🔬</span><h3>Glazer Children's Museum</h3><p>Vizinho ao museu de arte, no Curtis Hixon Waterfront Park: mais de 170 atividades interativas para crianças. Casa cheia de famílias e um dos melhores museus infantis do estado.</p></div>
        <div class="mag-card"><span class="ic">🐠</span><h3>The Florida Aquarium</h3><p>A poucos passos do extremo sul do calçadão, no Channel District: tubarões, recifes, lontras e um habitat externo. Um dos principais aquários do sudeste dos EUA.</p></div>
        <div class="mag-card"><span class="ic">🌳</span><h3>Curtis Hixon Waterfront Park</h3><p>O grande gramado central do downtown, palco de festivais, cinema ao ar livre e mercados. Tem fontes interativas que as crianças adoram nos dias quentes.</p></div>
        <div class="mag-card"><span class="ic">🚤</span><h3>Pirate Water Taxi</h3><p>Um táxi aquático temático de piratas faz paradas ao longo do rio, ligando os principais pontos. Forma divertida (e refrescante) de cruzar o Riverwalk pela água.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌅</span>Vá ao fim de tarde</h4><p>O calor de junho-julho em Tampa é intenso ao meio-dia. Comece a caminhada por volta das 17h para pegar a luz dourada e o pôr do sol sobre o rio.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>Jantar no Armature Works</h4><p>Chegue com fome: o food hall reúne cozinhas de todo o mundo num só lugar. O gramado externo com vista para o rio é perfeito para comer ao ar livre.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚲</span>Alugue uma bike ou patinete</h4><p>O calçadão é plano e contínuo — fazer os 3,8 km a pé leva tempo. Patinetes elétricos (Spin, Lime) e bikes compartilhadas cobrem tudo rapidinho.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚋</span>Combine com Ybor City</h4><p>O TECO Line Streetcar parte do downtown (perto do aquário) e leva à histórica Ybor City por US$ 2,50. Encaixe os dois no mesmo dia.</p></div>
        <div class="mag-tip"><h4><span class="ic">☔</span>Chuva de fim de tarde</h4><p>No verão da Flórida pancadas curtas surgem quase diariamente por volta das 15–16h. Geralmente passam rápido — leve guarda-chuva compacto e siga o plano.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>A melhor foto</h4><p>Do trecho perto do Tampa Museum of Art, olhando rio acima com a Universidade de Tampa (com seus minaretes prateados) ao fundo. Mágico no entardecer.</p></div>
      </div>
    </section>

      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Os minaretes do outro lado do rio</b><span>A Universidade de Tampa ocupa o antigo Tampa Bay Hotel (1891), com seus minaretes de prata em estilo mouro — construído pelo magnata ferroviário Henry B. Plant e visível de quase todo o Riverwalk.</span></div></li>
        <li><div><b>Levou décadas para se conectar</b><span>O sonho de um calçadão contínuo vinha dos anos 1970, mas obras, desapropriações e travessias sob pontes adiaram a obra por gerações. A passarela só virou um percurso ininterrupto em 2016.</span></div></li>
        <li><div><b>Um galpão de bondes virou food hall</b><span>O Armature Works era a oficina e garagem dos bondes de Tampa, inaugurada por volta de 1910. Abandonado por décadas, foi restaurado e reaberto em 2018 como food hall.</span></div></li>
        <li><div><b>A trilha dos monumentos</b><span>Ao longo do calçadão, o Tampa Historical Monument Trail instala bustos e placas de personagens decisivos da história da cidade — uma aula a céu aberto entre uma parada e outra.</span></div></li>
        <li><div><b>Gasparilla começa na água</b><span>O Riverwalk é o palco da Gasparilla, festa-pirata anual de Tampa em que um navio "invade" a cidade pelo rio. A temática pirata do water taxi é um aceno a essa tradição centenária.</span></div></li>
      </ul>
    </section>

// --- Local image cache (IndexedDB) ---
// Each remote image is stored as a Blob after its first download, so later
// page views are served from disk with no network use. All failures degrade
// gracefully to a direct network load, so images always render either way.
const ImgCache = {
  _db: null,
  _open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve) => {
      try {
        const req = indexedDB.open('guia-img-cache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('imgs');
        req.onsuccess = () => { this._db = req.result; resolve(this._db); };
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  async get(key) {
    const db = await this._open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const r = db.transaction('imgs', 'readonly').objectStore('imgs').get(key);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  async put(key, blob) {
    const db = await this._open();
    if (!db) return;
    try { db.transaction('imgs', 'readwrite').objectStore('imgs').put(blob, key); } catch (e) {}
  },
};

async function loadImg(img, key, url) {
  // 1) Try the local cache first, but TIME-BOX it: a disabled or stuck
  //    IndexedDB (e.g. on file:// in some browsers) must never gate display.
  //    On a hit we use the cached blob and make zero network requests.
  try {
    const cached = await Promise.race([
      ImgCache.get(key),
      new Promise((r) => setTimeout(() => r(null), 1200)),
    ]);
    if (cached) { img.src = URL.createObjectURL(cached); return; }
  } catch (e) {}

  // 2) Cache miss: show the image straight from the network NOW, so it always
  //    renders regardless of fetch/cache support.
  img.src = url;

  // 3) In the background, store a copy for next time (CORS permitting). With
  //    cache:'force-cache' this reuses the bytes the <img> just loaded, so it
  //    does not double-download — and future views become zero-network.
  try {
    const resp = await fetch(url, { mode: 'cors', cache: 'force-cache' });
    if (resp.ok) ImgCache.put(key, await resp.blob());
  } catch (e) {}
}
