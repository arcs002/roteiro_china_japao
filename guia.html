    <section class="mag-section">
      <div class="mag-eyebrow">A Grande Questão de Montréal</div>
      <h2 class="mag-title">A Guerra dos Bagels</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Há uma divisão que atravessa Montréal há décadas, mais profunda que qualquer fronteira linguística: <strong>Fairmount Bagel ou St-Viateur Bagel?</strong> Ambos são assados em forno a lenha, enrolados à mão e cozidos em água com mel. Ambos existem há gerações. Os dois lados têm argumentos fervorosos. A resposta correta é: experimente os dois e forme sua própria opinião.</p>
      </div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🥯</span><h3>Fairmount Bagel</h3><p>Fundado em 1919, o mais antigo. Aberto 24h/7 dias. Bagel levemente maior, mais denso, menos doce. Os puristas juram que este é o original. <em>74 Ave Fairmount O, Mile End.</em></p></div>
        <div class="mag-card"><span class="ic">🥯</span><h3>St-Viateur Bagel</h3><p>Fundado em 1957 por Myer Lewkowicz. Bagel menor, mais fino, levemente mais doce e crocante. Os modernos tendem a preferir este. Opera 24h também. <em>263 Rue Saint-Viateur O, Mile End.</em></p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Programação do dia</div>
      <h2 class="mag-title">Hora a hora</h2>
      <div class="mag-rule"></div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">09h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">🥯 Fairmount Bagel — café da manhã de 1919</div>
          <p class="det">Comece o último dia inteiro no lugar certo: <strong>Fairmount Bagel</strong> (74 Ave Fairmount Ouest), aberto desde 1919 — o bagel mais antigo de Montréal. O forno a lenha nunca para; você pode ver os bagels sendo enrolados à mão e assados. Peça um com <strong>cream cheese e salmão defumado</strong> (lox), ou só cream cheese e cebolinha. Coma na calçada, olhando o Mile End acordar.</p>
        </div></div>

        <div class="mag-tl"><div class="time">10h30</div><div class="track"><div class="dot"></div>
          <div class="act">🏔 Parc du Mont-Royal — subida pelo Chemin Olmsted</div>
          <p class="det">O <strong>Parc du Mont-Royal</strong> foi desenhado por <strong>Frederick Law Olmsted</strong>, o mesmo paisagista do Central Park — o que explica a sensação familiar de escala. O caminho principal, <strong>Chemin Olmsted</strong>, sobe a montanha em curvas suaves através de floresta densa. A pé, cerca de 40 minutos até o topo. Percurso agradável, sombreado no verão, com famílias, ciclistas e corredores. Veja o <a href="#page/mont_royal">guia completo do Mont-Royal</a>.</p>
        </div></div>

        <div class="mag-tl"><div class="time">11h30</div><div class="track"><div class="dot"></div>
          <div class="act">🌆 Chalet du Mont-Royal — panorama de Montréal</div>
          <p class="det">O <strong>Chalet du Mont-Royal</strong> é o ponto de chegada, e a vista daqui é a mais completa da cidade. O skyline se estende em 180 graus: da <strong>Tour de Montréal</strong> ao Stade Olympique à direita, ao centro com seus arranha-céus, ao Rio Saint-Laurent e às pontes, até a Montanha Saint-Bruno no horizonte. Em dias claros de julho, a visibilidade é extraordinária. Este é o lugar para a foto: você, Montréal ao fundo, e a consciência de que esta viagem está quase no fim.</p>
        </div></div>

        <div class="mag-tl"><div class="time">12h00</div><div class="track"><div class="dot"></div>
          <div class="act">🦆 Lac des Castors — ornitologia e piquenique</div>
          <p class="det">Do chalet, desça até o <strong>Lac des Castors</strong> (Lago dos Castores). No verão, é um lugar tranquilo com patos, cisnes e gansos canadenses. No inverno, vira pista de patinação. Se trouxer algo para comer, é o lugar perfeito para um piquenique improvisado com sombra, grama e vista. Há um pequeno pavilhão com lanches básicos.</p>
        </div></div>

        <div class="mag-tl"><div class="time">13h30</div><div class="track"><div class="dot"></div>
          <div class="act">🚶 Descida para Mile End</div>
          <p class="det">Desça do parque pela <strong>Chemin de la Côte-des-Neiges</strong> ou apanhe ônibus/Uber até o <strong>Mile End</strong>. A descida revela outra face de Montréal: casas vitorianas de dois andares com escadas externas em espiral, quintais generosos, arte de rua nos muros. Mile End fica a cerca de 2 km do parque.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎨 Mile End — o bairro mais cool do Canadá</div>
          <p class="det">O <strong>Mile End</strong> é o que acontece quando uma comunidade judaica histórica, artistas, imigrantes e hipsters habitam o mesmo bairro por gerações. A <strong>Rue Saint-Viateur</strong> e a <strong>Rue Bernard</strong> são o coração: ateliês de artistas, galerias alternativas, lojas de discos de vinil, vintage shops icônicas, bistrôs franceses. Pichações assinadas por artistas reconhecidos cobrem os muros. Um dos melhores bairros para caminhar sem destino.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h30</div><div class="track"><div class="dot eat"></div>
          <div class="act">🥯 St-Viateur Bagel — o rival, o segundo capítulo</div>
          <p class="det">Está bem aqui no bairro: <strong>St-Viateur Bagel Shop</strong> (263 Rue Saint-Viateur Ouest). O forno a lenha também nunca para. Sente no balcão, peça um bagel recém-saído do forno com cream cheese e salmão defumado, e compare com o Fairmount da manhã. Os locais têm opinião forte: qual foi o seu favorito? Aqui você entende por que essa discussão dura décadas.</p>
        </div></div>

        <div class="mag-tl"><div class="time">15h30</div><div class="track"><div class="dot"></div>
          <div class="act">🌃 Rue Sainte-Catherine + RÉSO — Cidade Subterrânea</div>
          <p class="det">Do Mile End, desça até a <strong>Rue Sainte-Catherine</strong> — a rua comercial mais longa do Canadá, do Gay Village no leste a Westmount no oeste. Grandes lojas, H&amp;M, Zara, boutiques locais. Mas o verdadeiro segredo está debaixo dos seus pés: o <strong>RÉSO</strong> (<em>Ville Souterraine</em>), o maior complexo de túneis subterrâneos do mundo — <strong>33 km de corredores</strong> conectando 190 edifícios: shoppings, estações de metrô, hotéis, universidades. Acesse por <strong>Les Promenades Cathédrale</strong> (625 Rue Sainte-Catherine O), <strong>Complexe Desjardins</strong> ou <strong>Place Ville Marie</strong>. Entradas pelo metrô McGill, Bonaventure ou Place-d'Armes. Separe 2 a 3 horas.</p>
        </div></div>

        <div class="mag-tl"><div class="time">16h30</div><div class="track"><div class="dot"></div>
          <div class="act">🌳 Plateau-Mont-Royal — última tarde</div>
          <p class="det">Do centro, siga para o <strong>Plateau-Mont-Royal</strong>. O <strong>Boulevard Saint-Laurent</strong> (La Main) é a espinha dorsal cultural — cada quarteirão tem seu personagem. As <strong>Puces de Saint-Laurent</strong> (mercado de pulgas vintage) são uma atração à parte para levar um objeto único de volta. A Rue Saint-Denis é mais francesa: cafés de calçada, livrarias em francês, a sensação de estar num quartier de Paris.</p>
        </div></div>

        <div class="mag-tl"><div class="time">18h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Retorno ao hotel — preparar para o jantar</div>
          <p class="det">Volte ao Wyndham Garden para descansar, tomar banho e se preparar para o jantar de despedida. Este é o ritual do último dia: um banho mais longo, roupas escolhidas com cuidado, a sensação agridoce de que amanhã tudo isso ficará para trás. Amanhã: desfazer malas, checkout, aeroporto YUL, voo de volta ao Brasil.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🍽 Jantar de Despedida — Toqué! ou Au Pied de Cochon</div>
          <p class="det"><strong>Toqué!</strong> (900 Place Jean-Paul-Riopelle) é o restaurante mais importante da história da gastronomia canadense. O chef <strong>Normand Laprise</strong> inaugurou o Toqué em 1993 e redefiniu o "fine dining canadense": ingredientes do Quebec exaltados com técnica francesa rigorosa. Jardins de produtores locais fornecem os vegetais. Ambiente sóbrio e elegante, serviço impecável. Reserve com <strong>semanas ou meses de antecedência</strong>. <em>Alternativa igualmente digna:</em> <strong>Au Pied de Cochon</strong> (536 Rue Duluth Est) — mais animado, menos formal, igualmente genial. Martin Picard e o foie gras são indissociáveis do imaginário gastronômico canadense.</p>
        </div></div>

        <div class="mag-tl"><div class="time">21h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🌃 Última noite em Montréal</div>
          <p class="det">Depois do jantar, ainda há energia para a noite montréalaise. A <strong>Crescent Street</strong> é a rua mais badalada do centro — anglófona, animada, dezenas de bares lado a lado. A Rue Saint-Denis tem um ritmo mais tranquilo e francês. Se o <strong>Festival de Jazz</strong> estiver acontecendo, há concertos ao ar livre gratuitos pela cidade — especialmente na <em>Place des Arts</em>. Uma última cerveja artesanal local, uma última conversa em francês, um último olhar para Montréal à noite.</p>
        </div></div>

        <div class="mag-tl"><div class="time">23h30</div><div class="track"><div class="dot"></div>
          <div class="act">🧳 Retorno ao hotel — fazer as malas</div>
          <p class="det">O último ritual da viagem: a mala que começa a ser refeita para o retorno. Lembranças, roupas, aquele maple syrup comprado em alguma loja da rota. Amanhã o voo parte às 13h15 do Aeroporto Pierre Elliott Trudeau (YUL) — acordar cedo para o café, checkout às 8h30 e saída para o aeroporto às 9h. Boa noite, Montréal.</p>
        </div></div>

      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações em destaque</div>
      <h2 class="mag-title">O melhor de Montréal</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/mont_royal"><span class="ic">⛰️</span><h3>Parc du Mont-Royal</h3><p>Desenhado por Frederick Law Olmsted em 1876, o parque que deu nome à cidade oferece a melhor vista de Montréal. O Chalet du Mont-Royal é o ponto de chegada de toda caminhada que vale a pena.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🎨</span><h3>Mile End</h3><p>O bairro mais criativo do Canadá. Arte de rua, lojas vintage, galerias independentes, os dois maiores bagel shops do mundo e o espírito boêmio que tornou Montréal uma capital cultural.</p></div>
        <div class="mag-card"><span class="ic">🥯</span><h3>St-Viateur Bagel Shop</h3><p>Fundado em 1957, assado em forno a lenha 24h por dia. O bagel de Montréal — menor, mais denso e levemente adocicado que o de Nova York — é uma categoria à parte na panificação norte-americana.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>Plateau-Mont-Royal</h3><p>O bairro onde Montréal é mais ela mesma. Boulevard Saint-Laurent e Rue Saint-Denis são artérias de cultura, gastronomia e vida noturna num cenário de arquitetura vitoriana bem preservada.</p></div>
        <div class="mag-card"><span class="ic">🏙️</span><h3>RÉSO — Ville Souterraine</h3><p>O maior complexo subterrâneo do mundo: 33 km de túneis conectando 190 edifícios. Shoppings, metrô, hotéis e universidades ligados debaixo da terra. Acesso pelas estações McGill, Bonaventure e Place-d'Armes, ou pelas entradas na Rue Sainte-Catherine.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>Rue Sainte-Catherine</h3><p>A rua comercial mais longa do Canadá, que corta Montréal de leste a oeste. Grandes lojas, boutiques, restaurantes e acesso direto ao RÉSO subterrâneo. O coração comercial da cidade.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Alimentação</div>
      <h2 class="mag-title">Refeições do dia</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Café da manhã</div><h3>Fairmount Bagel</h3><div class="addr">📍 74 Ave Fairmount Ouest, Montréal, QC</div><p>O bagel mais antigo de Montréal — assado em forno a lenha desde 1919, sem interrupção. Um bagel com cream cheese e lox na calçada do Mile End é uma das melhores maneiras de começar um dia. Você verá os bagels sendo enrolados à mão e colocados no forno na sua frente.</p></div>
      <div class="mag-resto"><div class="tier">Almoço</div><h3>St-Viateur Bagel + piquenique no parque</h3><div class="addr">📍 263 Rue Saint-Viateur Ouest, Montréal, QC</div><p>Combine o bagel no St-Viateur (para fechar a comparação com o Fairmount) com frutas, queijos e algo para beber comprados numa épicerie do Mile End. Suba e faça um piquenique no Lac des Castors ou num gramado do Mont-Royal. Uma das refeições mais memoráveis possíveis — sem restaurante, sem garçom, com skyline.</p></div>
      <div class="mag-resto"><div class="tier">Jantar de despedida · Reserva com antecedência</div><h3>Toqué!</h3><div class="addr">📍 900 Place Jean-Paul-Riopelle, Montréal, QC</div><p>O restaurante que colocou a gastronomia canadense no mapa mundial. Normand Laprise é uma lenda viva — trabalha com produtores do Quebec há mais de 30 anos. O menu degustação é a escolha certa para a última noite: 6 a 8 pratos que contam a história da terra e das estações do Quebec. ~$120–180 CAD/pessoa sem bebidas.</p></div>
      <div class="mag-resto"><div class="tier">Alternativa jantar</div><h3>Au Pied de Cochon</h3><div class="addr">📍 536 Rue Duluth Est, Montréal, QC</div><p>Se o Toqué não tiver vaga, é um substituto mais do que digno. Martin Picard reinventou a cozinha quebecoíse com excesso intencional e alegria genuína. O poutine de foie gras, a paleta de porco, o pernil assado — nada aqui é modesto, e tudo é delicioso. Reserve ou chegue cedo. Vale a espera.</p></div>

        <p>Dezesseis dias atrás, você pousou em Orlando sem saber exatamente o que te esperava. Tinha um roteiro, alguns hotéis reservados e a expectativa de ver o Brasil jogar uma Copa do Mundo ao vivo. O que aconteceu foi mais do que isso.</p>

        <p>E o Brasil. Sempre o Brasil — jogado em telas enormes de sports bars, em praças, com estranhos que viraram torcedores por uma hora. Porque futebol é isso: a língua que dispensa tradução.</p>
        <p>Hoje é 4 de julho — Dia da Independência americana. Apropriado que você deixe o continente exatamente quando os EUA celebram a si mesmos. Uma última ironia geográfica do destino.</p>
        <p>Vai para casa mais rico. Não em dinheiro — nunca é isso. Mais rico em referências, em perspectiva, em memórias que ninguém pode tirar. A próxima viagem começa a ser planejada antes que essa acabe.</p>

          <p class="det">O último café da manhã em solo canadense. Se ainda der tempo antes do checkout, a opção ideal é o <strong>Crew Café</strong> (620 Rue William, Griffintown) — café de especialidade bem torrado, brunch leve, ambiente de startup criativa. Alternativa mais sentimental: passar no <strong>Fairmount Bagel</strong> ou <strong>St-Viateur Bagel</strong> para um último bagel para levar. A decisão sobre qual bagel é melhor pode ser deixada em aberto — algo para resolver na próxima visita.</p>

          <div class="act">🏨 Checkout — Wyndham Garden Montréal Centre-Ville</div>
          <p class="det">O checkout final. Confira se não esqueceu nada no quarto — carregadores, documentos na gaveta, itens no banheiro. Guarde o cartão de crédito canadense facilmente acessível: você ainda vai usar no aeroporto. A equipe do hotel pode guardar a bagagem enquanto você toma o café se precisar.</p>

          <p class="det">Do hotel até o <strong>Aéroport International Pierre-Elliott-Trudeau de Montréal (YUL)</strong> são aproximadamente <strong>25 minutos de táxi ou Uber</strong> em condições normais. Endereço do aeroporto: 800 Blvd Roméo-Vaillancourt, Dorval, QC H4Y 0A4. <em>Opção metrô/trem:</em> o <strong>Réseau Express Métropolitain (REM)</strong> conecta o centro ao aeroporto — estação Gare Centrale até a estação YUL/Aéroport, cerca de 25 min e $7 CAD. Confortável e sem tráfego.</p>

          <p class="det">Chegando 3h45 antes da partida (13h15), você tem tempo confortável. Faça o check-in pelo balcão da <strong>Arajet</strong> ou use o check-in online se já não fez. Despache a bagagem, passe pela segurança e siga para a área de embarque internacional. O aeroporto YUL tem dois terminais; a maioria dos voos internacionais parte do <strong>Terminal 1</strong>.</p>

          <p class="det">O Aeroporto Trudeau tem uma boa seleção de lembranças canadenses. Esta é sua última janela para comprar: <strong>Maple syrup</strong> — grades de xarope puro do Québec, de diferentes intensidades (dourado/âmbar/escuro). <strong>Kinder Surprise</strong> — o chocolate com brinquedo surpresa <em>que é ilegal nos EUA</em> (mas perfeitamente legal no Canadá). Compre agora o que não comprou nos EUA. <strong>Chocolates canadenses</strong> — Crispy Crunch, Coffee Crisp, Aero, Oh Henry! — todos da linha canadense da Nestlé, diferentes dos americanos. <strong>Produtos de beleza canadenses</strong> — e qualquer lembrança de Canada Day que ainda não tenha comprado.</p>

        <div class="mag-tl"><div class="time">chegada</div><div class="track"><div class="dot night"></div>
          <div class="act">🇧🇷 Aterrisagem em GRU — bem-vindo a casa</div>

        <p>Dois caminhos igualmente bons para a última manhã. O Crew Café em Griffintown tem o melhor espresso de Montréal e um ambiente que resume o espírito da cidade: industrial, criativo, bilíngue. O Fairmount Bagel é mais poético — terminar onde começou o dia 15, num ciclo que fecha com sabor de mel e lenha.</p>

    <p class="mag-tagline">Onde o aroma do charuto cubano ainda paira sobre os tijolos de uma era dourada que recusou ser esquecida.</p>
    <div class="mag-hero-meta">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A capital mundial do charuto</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>No final do século XIX, um visionário espanhol chamado Vicente Martínez Ybor escolheu uma área pantanosa ao nordeste de Tampa para construir uma cidade dentro de uma cidade. Era 1885, e Ybor — pronuncia-se "EE-bor" — trouxe consigo sua fábrica de charutos de Cayo Hueso, fugindo de greves trabalhistas. Com ele veio uma força de trabalho de artesãos cubanos, espanhóis, italianos e judeus sefarditas, todos unidos pelo ritual preciso de enrolar folhas de tabaco à mão.</p>
        <p>No auge, entre 1890 e 1930, Ybor City era a capital mundial do charuto, produzindo mais de 500 milhões de unidades por ano. Não era apenas uma fábrica ao ar livre: era uma república operária completa, com seus clubes sociais, restaurantes, teatros e os <em>lectores</em> — leitores pagos que liam em voz alta romances e jornais enquanto os trabalhadores enrolavam charutos em silêncio. José Martí, herói da independência cubana, veio aqui em 1891 em busca de apoio para a revolução. Ybor City atendeu.</p>
        <p>A chegada das máquinas nas décadas de 1930 e 1940 e, em seguida, a Depressão, começaram a esvaziar as fábricas. Mas Ybor sobreviveu, graças às famílias cubanas que jamais abandonaram o bairro. Hoje o National Historic Landmark District abrange dezenas de edifícios originais de tijolo vermelho — e aquelas galinhas que circulam livremente pelas ruas são um símbolo vivo dessa resiliência excêntrica.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i1" alt="Arquitetura histórica de Ybor City">
        <figcaption>Ybor City — arquitetura histórica de tijolo e ferro forjado</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Pelas ruas da Séptima</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🚶</span><h3>Caminhar pela 7ª Avenida</h3><p>A espinha dorsal do bairro: 10 quarteirões de calçamento histórico, lojas de charutos, restaurantes e bares. As fachadas de tijolo e as lanternas de ferro criam um cenário de outra era.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Ybor City Museum State Park</h3><p>Numa antiga padaria de 1896, narra a história do bairro: os <em>lectores</em>, as mutualidades, a vida dos trabalhadores. O jardim de <em>casitas</em> restauradas é imperdível.</p></div>
        <div class="mag-card"><span class="ic">🍷</span><h3>Columbia Restaurant</h3><p>Fundado em 1905, o restaurante mais antigo da Flórida em operação contínua. Arquitetura espanhola-cubana e show de flamenco ao vivo durante o jantar.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>Tabaqueiras artesanais</h3><p>O Arturo Fuente e o King Corona Cigars são paradas clássicas. Mesmo que não fume, assistir ao mestre enrolar um charuto é como ver escultura ao vivo.</p></div>
        <div class="mag-card"><span class="ic">🐔</span><h3>As galinhas livres de Ybor</h3><p>Centenas de galinhas circulam livres pelas calçadas. Descendentes das aves criadas pelos cubanos no início do século XX, têm proteção legal da cidade.</p></div>
        <div class="mag-card"><span class="ic">🎶</span><h3>Noite na Sétima</h3><p>Depois das 22h a avenida se transforma. Gaspar's Grotto, New World Brewery e Czar Bar puxam o circuito, do punk ao flamenco. Ybor à noite pertence a Tampa de verdade.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">☀️</span>Manhã e noite são bairros diferentes</h4><p>De manhã: calma, cafés abertos, músicos ensaiando. À noite: bares cheios. Idealmente, faça as duas — manhã para o museu e charutos, noite para o Columbia.</p></div>

      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O bairro que financiou a independência de Cuba</b><span>José Martí visitou Ybor quatro vezes entre 1891 e 1895. Nos discursos nas tabaqueiras, conseguiu doações dos operários — que chegavam a dar um dia inteiro de salário — para a guerra contra a Espanha.</span></div></li>
        <li><div><b>Os leitores que educaram uma geração</b><span>Os <em>lectores</em> eram contratados pelos próprios trabalhadores para ler em voz alta durante o expediente — jornais, Tolstói, Dickens, Zola. Em 1900 havia mais de 150 leitores ativos em Ybor.</span></div></li>
        <li><div><b>As galinhas são legalmente protegidas</b><span>A cidade reconhece as galinhas como patrimônio cultural do bairro e proíbe capturá-las. O "Ybor City Chicken Conservancy" cuida das aves doentes — a população passa de 300.</span></div></li>
        <li><div><b>O sanduíche que disputou uma guerra</b><span>O Cuban Sandwich foi criado em Ybor por volta de 1900. Por décadas Miami reivindicou a paternidade; em 2012 Tampa registrou-o formalmente como patrimônio culinário municipal.</span></div></li>
        <li><div><b>Theodore Roosevelt partiu daqui para Cuba</b><span>Em 1898, na Guerra Hispano-Americana, Roosevelt acampou com os Rough Riders em Ybor e bebeu café cubano nas ruas antes de zarpar para San Juan Hill.</span></div></li>

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Do jardim da cervejaria ao parque de classe mundial</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Em 1959, a Anheuser-Busch — empresa cervejeira que fabricava a famosa Budweiser — abriu ao público uma área de hospitalidade em Tampa onde os visitantes podiam ver os cavalos Clydesdales da marca, tomar uma cerveja e conhecer um pequeno jardim de pássaros exóticos. Ninguém imaginava que aquele modesto "jardim" se tornaria, décadas depois, um dos parques temáticos mais reconhecidos do mundo, único na combinação entre um zoológico de padrão internacional e atrações de adrenalina pura.</p>
        <p>Ao longo dos anos 1960 e 1970, o parque expandiu progressivamente sua coleção de animais africanos, construindo réplicas de savanas e selvas tropicais que permitiam — pela primeira vez em larga escala nos EUA — que animais como elefantes, leões, hipopótamos e zebras vivessem em habitats que imitavam seu ambiente natural. O conceito era revolucionário: em vez do zoológico tradicional com jaulas, o Busch Gardens apostou em espaços abertos onde o visitante se torna o observador dentro de um safári.</p>
        <p>A partir dos anos 1990, a equação ficou ainda mais fascinante com a adição de montanhas-russas de classe mundial. O Kumba (1993) foi um marco: a maior e mais rápida da costa leste americana à época. Vieram depois o Montu, o SheiKra — com sua queda vertical de 61 metros a 112 km/h — e o Cheetah Hunt, que em 2011 estabeleceu um novo padrão de velocidade no estado. O parque encontrou sua identidade singular: de manhã você contempla uma manada de búfalos africanos e de tarde grita de terror e alegria numa inversão a 120 km/h.</p>
        <p>Hoje pertencente ao grupo SeaWorld Entertainment (que adquiriu o parque da InBev em 2009), o Busch Gardens Tampa Bay mantém uma robusta missão de conservação — financia projetos de proteção de espécies na África subsaariana — ao mesmo tempo em que entrega entretenimento que rivaliza com qualquer parque do planeta. Para famílias brasileiras acostumadas ao Hopi Hari ou ao Beto Carrero, a escala e a qualidade aqui serão uma revelação.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i3" alt="Atrações do Busch Gardens">
        <figcaption>Busch Gardens — atrações do parque</figcaption>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Montanhas-russas e safári</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🦈</span><h3>Iron Gwazi — a estrela</h3><p>A atração nº1, de 2022, e uma das melhores híbridas (madeira + aço) do mundo: 63 m de altura, 122 km/h e uma primeira queda de <strong>91° — mais que vertical</strong>, com doze momentos de airtime e três inversões. É <em>o</em> motivo para correr quando o parque abrir.</p></div>
        <div class="mag-card"><span class="ic">🎢</span><h3>SheiKra — a queda vertical</h3><p>O ícone clássico: uma dive coaster que sobe 61 m e despenca em queda livre vertical a 112 km/h, terminando num splashdown. A pausa de três segundos na borda do precipício antes de mergulhar é literalmente inesquecível.</p></div>
        <div class="mag-card"><span class="ic">🐍</span><h3>Montu — a invertida lendária</h3><p>Invertida clássica de 1996 que ainda figura entre as melhores dos EUA: 45 m, 96 km/h e sete inversões. Foi a primeira do mundo com o looping Immelmann. Envelheceu surpreendentemente bem — suave e potente.</p></div>
        <div class="mag-card"><span class="ic">🐯</span><h3>Tigris — lançamento triplo</h3><p>A montanha-russa de lançamento mais alta da Flórida (2019): dispara para frente e para trás a 100 km/h, com um inline twist a 45 m. Curta, compacta e eletrizante — mas de baixa capacidade, então a fila cresce rápido.</p></div>
        <div class="mag-card"><span class="ic">🌀</span><h3>Kumba — a veterana de aço</h3><p>A clássica de 1993, ainda barulhenta e divertidíssima: 44 m, 96 km/h, sete inversões e corkscrews entrelaçados. Bônus estratégico — costuma ter as <strong>menores filas</strong> entre as grandes, ótima para encaixar a qualquer hora.</p></div>
        <div class="mag-card"><span class="ic">🦅</span><h3>Falcon's Fury — queda de 102 m</h3><p>A torre de queda livre mais alta da América do Norte. Antes de soltar, ela inclina você 90° para baixo — olhando direto para o chão. Terror puro de poucos segundos, com vista incrível no caminho até o topo.</p></div>
        <div class="mag-card"><span class="ic">🪃</span><h3>Serengeti Flyer — balanço gigante</h3><p>O balanço pendular "dueling" mais alto e rápido do mundo (2023): 41 m e 110 km/h, com vista para a savana no ponto mais alto. Adrenalina "familiar-plus" para quem quer emoção sem inversões.</p></div>
        <div class="mag-card"><span class="ic">🐆</span><h3>Cheetah Hunt — o safári veloz</h3><p>Inspirada no guepardo — o animal mais rápido da Terra —, acelera de 0 a 100 km/h em segundos e serpenteia por 1,5 km de trilhos que passam por dentro do habitat de guepardos reais. Une adrenalina e biologia de forma genial.</p></div>
        <div class="mag-card"><span class="ic">🦒</span><h3>Serengeti Plain — safári de ônibus</h3><p>Uma savana de 29 hectares onde zebras, girafas, rinocerontes e búfalos vivem em liberdade. O passeio de ônibus safári (incluso no ingresso) leva grupos para dentro do habitat com guia. O Serengeti Safari Tour Premium (pago à parte) permite alimentar girafas à mão.</p></div>
        <div class="mag-card"><span class="ic">🦁</span><h3>Edge of Africa — imersão total</h3><p>Um percurso a pé por habitats de leões, hienas, hipopótamos, meerkats e crocodilos — com vidros e separações mínimas que criam uma proximidade impressionante. Em alguns pontos, apenas 5 cm de vidro separam você de um leão macho adulto.</p></div>
        <div class="mag-card"><span class="ic">🎭</span><h3>Shows ao vivo</h3><p>Vários shows diários: aves de rapina em voo livre, espetáculos acrobáticos de temática africana e, sazonalmente, concertos de artistas da cena musical americana. Consulte a grade no app do parque no dia da visita.</p></div>
        <div class="mag-card"><span class="ic">🧒</span><h3>Sesame Street Safari of Fun</h3><p>A área dedicada às crianças menores, com personagens do Sesame Street, brinquedos de água, mini-montanhas-russas e atividades interativas com tema de safári. Ideal para crianças de 2 a 8 anos: sombria, divertida e menos lotada que as áreas principais.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Ranking das Atrações</div>
      <h2 class="mag-title">A ordem das melhores</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Ordenado por qualidade e singularidade. Cruze com a estratégia de filas e o roteiro do dia, logo abaixo, para decidir a ordem.</p>

        <li><div><b>Tier S · Imperdíveis</b><span><strong>1. Iron Gwazi</strong> — a melhor do parque e referência mundial em híbridas. <strong>2. SheiKra</strong> — a dive coaster icônica, com a pausa de suspense na borda dos 61 m. <strong>3. Montu</strong> — invertida lendária, sete inversões impecáveis.</span></div></li>
        <li><div><b>Tier A · Muito boas</b><span><strong>4. Tigris</strong> — lançamento triplo intenso e compacto. <strong>5. Cheetah Hunt</strong> — a mais longa do parque; <em>baixa capacidade, fica cheia o dia todo</em>. <strong>6. Falcon's Fury</strong> — a queda livre de 102 m. <strong>7. Kumba</strong> — clássica divertida, raramente com fila grande.</span></div></li>
        <li><div><b>Tier B · Se sobrar tempo</b><span><strong>Serengeti Flyer</strong>, <strong>Cobra's Curse</strong> (spin coaster familiar) e <strong>Phoenix Rising</strong> (suspensa nova, 2024). E as experiências com animais: <strong>Serengeti Safari</strong> (pago, à parte), <strong>Edge of Africa</strong> e o novo <strong>Lion &amp; Hyena Ridge</strong> (inaugurado em 2026).</span></div></li>
      </ul>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Tempos de Fila — Fim de Junho</div>
      <h2 class="mag-title">Quando a fila aperta</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Junho é um dos meses mais cheios, e <strong>sábado é o pior dia da semana</strong> (multidão típica de 7 a 9 numa escala de 10). Estimativas realistas de espera, em minutos:</p>
      <ul class="mag-numlist">
        <li><div><b>Iron Gwazi</b><span>Abertura 20–40 · Pico (12–15h) 60–90 · Fim de tarde 30–50 ↓ — costuma esvaziar no meio/fim do dia, bom alvo para re-ride.</span></div></li>
        <li><div><b>Cheetah Hunt</b><span>Abertura 15–30 · Pico 60–75 · Fim de tarde 50–70 ⚠ — baixa capacidade: a fila, uma vez formada, não cede.</span></div></li>
        <li><div><b>SheiKra</b><span>Abertura 10–25 · Pico 45–70 · Fim de tarde 30–45.</span></div></li>
        <li><div><b>Montu</b><span>Abertura 5–20 · Pico 40–60 · Fim de tarde 25–40.</span></div></li>
        <li><div><b>Tigris</b><span>Abertura 15–30 · Pico 50–75 · Fim de tarde 40–60 ⚠ — baixa capacidade.</span></div></li>
        <li><div><b>Kumba</b><span>Abertura 5–15 · Pico 30–45 · Fim de tarde 20–35.</span></div></li>
        <li><div><b>Falcon's Fury</b><span>Abertura 5–20 · Pico 40–60 · Fim de tarde 25–40.</span></div></li>
        <li><div><b>Serengeti Flyer</b><span>Abertura 10–20 · Pico 40–60 · Fim de tarde 30–45.</span></div></li>
      </ul>
      <div class="mag-callout">
        <span class="lbl">Estratégias de fila</span>
        <p>Evite chegar entre 10h e 13h (pico de chegada). O <strong>Quick Queue</strong> (a partir de ~US$ 60, preço dinâmico) vale fortemente num sábado de junho com poucas horas no parque. <strong>Não há fila single rider</strong> confiável no Busch Gardens Tampa — não conte com ela. Use o <strong>app oficial</strong> (filas em tempo real) para escolher o próximo alvo.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Roteiro Sugerido do Dia</div>
      <h2 class="mag-title">Hora a hora no parque</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Atenção ao horário</span>
        <p>Os calendários de junho/2026 indicam abertura às <strong>10h</strong> (não 9h). Confirme o horário exato do dia 20/06 no site oficial na semana da viagem — a estratégia de <em>rope drop</em> abaixo funciona em qualquer horário, basta ajustar os relógios. O plano assume abertura às 10h.</p>
      </div>
      <ul class="mag-numlist">
        <li><div><b>09h15 · Chegada</b><span>Estacionamento e portão. O parque fica a ~5 min do hotel. Passe pela segurança e posicione-se no portão antes do rope drop. Ative o Quick Queue se for usar.</span></div></li>
        <li><div><b>10h00 · Rope drop: Cheetah Hunt PRIMEIRO</b><span>Contraintuitivo, mas é a de menor capacidade entre as grandes — uma vez cheia, fica cheia o dia todo. Pegue-a com 15–30 min em vez de 70.</span></div></li>
        <li><div><b>10h25 · Iron Gwazi</b><span>Vá direto enquanto a fila ainda está em 20–40 min. Se sobrar gás, faça re-ride na hora.</span></div></li>
        <li><div><b>11h00 · Tigris + Cobra's Curse</b><span>Ambas de baixa capacidade e na mesma região — faça antes que as filas estourem.</span></div></li>
        <li><div><b>11h45 · SheiKra e Montu</b><span>A região do Egito/Stanleyville ainda estará razoável; encaixe as duas extremas aqui.</span></div></li>
        <li><div><b>12h30 · Kumba + Falcon's Fury</b><span>Kumba raramente lota; Falcon's Fury sai rápido nesta janela.</span></div></li>
        <li><div><b>13h15 · Almoço + Serengeti Safari</b><span>Almoce cedo-ish e, se reservou, faça o safári agora — hora boa, porque as filas de russa estão no pico e você está fora delas. Sem safári? Faça o trem <em>Serengeti Express</em> e o <em>Edge of Africa</em> (sombra + animais no calor).</span></div></li>
        <li><div><b>14h30 · Janela de tempestade / shows</b><span>Junho na Flórida = trovoadas quase diárias entre 14h e 17h, e as russas <strong>fecham com raios</strong>. Use para um show coberto, almoço estendido ou lojas. Se o tempo abrir, Iron Gwazi costuma esvaziar — ótimo re-ride.</span></div></li>
        <li><div><b>15h45 · Limpa os pendentes</b><span>Volte aos alvos que ficaram (Serengeti Flyer, Phoenix Rising) ou re-rides nas favoritas — as filas começam a ceder após 16h.</span></div></li>
        <li><div><b>16h30 · Encerramento</b><span>Última volta na predileta (Iron Gwazi ou SheiKra), SkyRide para a vista de despedida e saída rumo ao hotel.</span></div></li>
      </ul>
      <div class="mag-callout">
        <span class="lbl">🌧️ Lembretes para junho</span>
        <p>Calor extremo + umidade (hidrate sem parar, protetor FPS50+, garrafa reutilizável); capa de chuva fina na mochila (serve para a tempestade <em>e</em> para o Congo River Rapids); tênis e roupa leve — muita caminhada. A <strong>Stanley Falls Flume foi fechada em 2025</strong>, então o Congo River Rapids é a única atração clássica de molhar.</p>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌅</span>Estratégia de chegada</h4><p>Chegue 30–45 min antes da abertura (o parque deve abrir às 10h em junho — confirme na semana). As de baixa capacidade (Cheetah Hunt, Tigris) e a campeã Iron Gwazi têm filas curtas só na primeira hora e passam de 60–90 min após o meio-dia. Faça as radicais no rope drop; safáris e shows ficam para a tarde.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Baixe o app antes</h4><p>O app oficial mostra filas em tempo real, mapa interativo e grade de shows. Essencial para otimizar o dia. Baixe em casa com Wi-Fi — no parque, a conexão pode ser lenta nos fins de semana.</p></div>
        <div class="mag-tip"><h4><span class="ic">💰</span>Quick Queue pode valer</h4><p>Em dias muito movimentados, o Quick Queue (entrada pela fila preferencial) custa US$ 30–70 extras mas economiza 3–4 horas de fila. Numa visita única, considere seriamente.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Hidratação no calor</h4><p>Em junho e julho, a temperatura real (somada ao calor do asfalto) chega a 42°C. Chapéu, protetor FPS50+ e garrafa d'água reutilizável são obrigatórios. A água no parque custa US$ 4–5; leve de casa na mochila.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>All-Day Dining</h4><p>O pacote de refeições ilimitadas custa ~US$ 40/pessoa e vale em 7 restaurantes (uma refeição a cada 90 min). Para uma família em dia longo, é bem mais econômico que pagar à la carte.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>Melhores fotos de animais</h4><p>O melhor momento é das 10h às 11h30, quando os animais estão mais ativos antes do calor. O Serengeti Overlook — plataforma elevada sobre a savana — oferece ângulos panorâmicos perfeitos para câmeras com zoom.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎡</span>Combine com Adventure Island</h4><p>O parque aquático Adventure Island fica a 500 m e é do mesmo grupo. Ingressos combinados saem mais baratos e são perfeitos para refrescar depois das russas. Ideal para a semana de calor de junho.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Compre online com antecedência</h4><p>Ingressos no site oficial com 7+ dias de antecedência têm 20–35% de desconto sobre a bilheteria. Baixe os QR codes antes de sair do hotel para evitar problemas com internet na entrada.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades Fascinantes</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Começou como um passeio de fábrica de cerveja</b><span>Quando abriu em 1959, o Busch Gardens era literalmente o jardim da cervejaria Anheuser-Busch de Tampa — os visitantes faziam um tour, recebiam amostras grátis de cerveja e passeavam pela área de pássaros exóticos. A entrada era gratuita. Só começou a cobrar ingresso em 1965, quando a expansão com animais africanos tornou os custos insustentáveis.</span></div></li>
        <li><div><b>Um dos maiores zoológicos dos EUA em número de espécies</b><span>Com mais de 12.000 animais de 300 espécies, é classificado como zoológico AZA de padrão científico máximo — o mesmo nível do San Diego Zoo. A coleção africana é uma das mais completas do Hemisfério Ocidental, com espécies raras como o okapi e o addax.</span></div></li>
        <li><div><b>O SheiKra ficou um tempo sem uma das correias de segurança</b><span>Quando estreou em 2005, era uma das únicas montanhas-russas do mundo apenas com lap bars e sem correia de ombro — decisão deliberada para maximizar a sensação de queda livre. Em 2007 uma das carruagens ganhou proteção de ombro opcional, mas o modelo sem correia permaneceu — e continua sendo a escolha dos mais corajosos.</span></div></li>
        <li><div><b>Os guepardos do parque têm nome e história</b><span>Os guepardos do habitat ao longo do Cheetah Hunt vieram de programas de conservação em parceria com reservas na Namíbia e no Quênia. Cada animal tem nome, ficha veterinária e história documentada. O parque mantém um blog público sobre a vida dos animais — e às vezes transmite ao vivo o nascimento de filhotes.</span></div></li>
        <li><div><b>Sede de um dos maiores festivais noturnos dos EUA</b><span>O "Howl-O-Scream" (Halloween) e o "Christmas Town" transformam o parque à noite de outubro a janeiro. O Christmas Town ilumina tudo com mais de 3 milhões de lâmpadas LED e recebe cerca de 1 milhão de visitantes na temporada — rivalizando com as decorações dos parques Disney em visitantes noturnos na Flórida.</span></div></li>
      </ul>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Gastronomia: Onde Comer</div>
      <h2 class="mag-title">Dentro e perto do parque</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto">
        <div class="tier">Dentro do parque · BBQ americano</div>
        <h3>Zambia Smokehouse</h3>
        <div class="addr">📍 Dentro do Busch Gardens — Área Congo</div>
        <p>O melhor restaurante dentro do parque: churrasco defumado americano com vista para a savana. Costelas, frango e carne de porco saem do fumeiro de hickory. Incluso no plano All-Day Dining.</p>
        <span class="order">Peça: Smoked Ribs + Mac &amp; Cheese</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Próximo ao parque · Americana</div>
        <h3>Ciccio's Water Sports Bar</h3>
        <div class="addr">📍 10002 N 30th St, Tampa, FL 33612</div>
        <p>A 5 minutos do parque, esse bar-restaurante com múltiplas TVs e cerveja gelada é perfeito para o jantar pós-Busch Gardens. Hambúrgueres generosos, nachos e batata frita com molhos variados. Preços razoáveis para a região.</p>
        <span class="order">Peça: Craft Burger + Sweet Potato Fries</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Rede local · Frutos do mar</div>
        <h3>Whiskey Joe's Bar &amp; Grill</h3>
        <div class="addr">📍 7720 W Courtney Campbell Cswy, Tampa</div>
        <p>A 20 minutos de carro, este clássico de Tampa fica sobre a água da Baía de Tampa. Frutos do mar fresquíssimos, pores do sol espetaculares e uma atmosfera de Flórida genuína — muito diferente das lanchonetes turísticas ao redor do parque.</p>
        <span class="order">Peça: Grouper Sandwich + Conch Fritters</span>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Chegando ao parque</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Do aeroporto de Tampa (TPA)</h4><p>O parque fica a 20–25 min do aeroporto, pela I-275 Norte. Uber/Lyft custam US$ 20–30. Não há shuttle do aeroporto, então transporte por app é a opção mais prática para quem chega.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏙️</span>Do Downtown Tampa</h4><p>Do centro são 8 km pela I-275 Norte — cerca de 15 min sem trânsito. Uber/Lyft custam US$ 15–22. A HART (ônibus público) tem a linha 5 com parada na McKinley Drive, a 5 min a pé da entrada.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>Estacionamento próprio enorme: Preferred (mais próximo) US$ 35; Regular US$ 25; Economy (com tram gratuito) US$ 20. Chegue cedo para conseguir o Preferred sem fila — vale para famílias com crianças pequenas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Via I-4 e I-275</h4><p>De Orlando (Disney/Universal), pegue a I-4 Oeste por 80 min até Tampa, depois a I-275 Norte por 5 km. A saída é "Busch Blvd". Google Maps e Waze funcionam perfeitamente. Reserve 90 min nos dias de pico.</p></div>
      </div>
    </section>

    <div class="mag-eyebrow">Flórida · Miami · Atração</div>
    <h1>Little <em>Havana</em></h1>
    <p class="mag-tagline">A Cuba que não se rendeu ao exílio: dominós, son cubano e o melhor café do hemisfério numa rua que guarda uma nação inteira na memória.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>Grátis</b><span>Bairro público</span></div>
      <div class="m"><b>3–5 h</b><span>Duração ideal</span></div>

    <div class="f"><span class="k">Endereço</span><span class="v">SW 8th St (Calle Ocho), Miami</span></div>
    <div class="f"><span class="k">Horário</span><span class="v">Bairro 24h · Lojas 10–21h</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">Gratuita</span></div>
    <div class="f"><span class="k">Melhor dia</span><span class="v">Última sexta do mês</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 3</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A Cuba que cruzou o estreito</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>A história de Little Havana é, antes de tudo, uma história de dignidade diante da perda. Quando Fidel Castro chegou ao poder em Cuba em 1959, uma primeira onda de exilados — sobretudo profissionais liberais, empresários e intelectuais da classe média havanesa — cruzou os 145 quilômetros que separam a ilha de Miami e se instalou nos bairros ao redor da SW 8th Street. Trouxeram pouco na bagagem, mas tudo na memória: a música, a comida, a língua, o ritmo específico da vida cubana.</p>
        <p>Ao longo dos anos 1960, a rua se transformou radicalmente. Padarias, restaurantes, tabaqueiras, bodegas e pequenas igrejas surgiram lado a lado, criando um ecossistema cultural tão completo que muitos exilados passaram décadas em Miami sem precisar falar uma palavra de inglês. A <strong>Calle Ocho</strong> — como a SW 8th Street ficou conhecida — tornou-se a espinha dorsal de uma comunidade que se recusava a ver seu exílio como definitivo; havia sempre a esperança do retorno a Havana.</p>
        <p>Essa esperança ficou cada vez mais distante com as décadas, mas paradoxalmente deu ao bairro uma riqueza ainda maior: a segunda e terceira gerações de cubano-americanos, criadas em Miami mas educadas nas tradições da ilha dos avós, produziram uma cultura híbrida fascinante. <em>Gloria Estefan</em> e <em>Celia Cruz</em> gravaram aqui. Escritores como Oscar Hijuelos e Cristina García beberam desta fonte. O bairro passou a atrair centro-americanos — nicaraguenses, hondurenhos, guatemaltecos — que encontraram na Calle Ocho um ponto de entrada acolhedor na América.</p>
        <p>Hoje, numa ironia gentil da história, Little Havana é também um destino turístico de primeira linha — com o risco de gentrificação e perda de autenticidade que isso implica. Mas o Domino Park, as tabaqueiras da Calle Ocho, o Versailles Restaurant e a memória viva dos velhos cubanos que ainda jogam dominó ao sol garantem que o coração do bairro permanece genuíno. Para um brasileiro, visitar Little Havana é sentir-se em casa e no exterior ao mesmo tempo: a língua e o calor são familiares, mas tudo o mais é Cuba.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i5" alt="Domino Park em Little Havana">
        <figcaption>Maximo Gomez Park — o Domino Park da Calle Ocho</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Frase popular do bairro</span>
        <p>"Miami não é uma cidade americana com muitos cubanos. É uma cidade cubana que acontece estar nos Estados Unidos."</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Pela Calle Ocho</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🁫</span><h3>Maximo Gomez Park — O Domino Park</h3><p>O coração pulsante de Little Havana: um pequeno parque onde, desde os anos 1970, os velhos cubanos se reúnem diariamente para jogar dominó, conversar em espanhol e manter viva a memória de Havana. Cabem apenas 64 jogadores por vez, e a lista de espera por uma mesa é levada muito a sério. Visitantes são bem-vindos a observar — e às vezes convidados a jogar.</p></div>
        <div class="mag-card"><span class="ic">🎵</span><h3>Ball &amp; Chain — Jazz e Salsa ao Vivo</h3><p>Um dos bares mais famosos de Miami, com shows ao vivo todas as noites: jazz, salsa, son cubano e mambo. Ambiente autêntico, colorido e cheio de vida. Na última sexta do mês (Viernes Culturales) faz parte do circuito de arte e música que toma conta de toda a Calle Ocho.</p></div>
        <div class="mag-card"><span class="ic">🖼️</span><h3>Tower Theater — Cinema Histórico</h3><p>Construído em 1926 no estilo art déco mediterrâneo, foi o primeiro cinema de Miami a exibir filmes legendados em espanhol — e assim tornou-se o ponto de convergência cultural da comunidade cubana. Restaurado em 2002, hoje serve como espaço cultural e cinemateca. A fachada é um dos cartões-postais mais fotografados do bairro.</p></div>
        <div class="mag-card"><span class="ic">⭐</span><h3>Walk of Fame Cubano</h3><p>Ao longo da Calle Ocho há estrelas no calçamento homenageando personalidades hispânicas: Celia Cruz, Gloria Estefan, Willy Chirino, Olga Guillot. É o equivalente cubano do Hollywood Walk of Fame — cada estrela carrega uma história de resistência, saudade e triunfo artístico.</p></div>
        <div class="mag-card"><span class="ic">🍵</span><h3>Cafezinho Cubano — Um Ritual</h3><p>O <em>cafecito</em> de Miami não é um café: é uma declaração de identidade. Feito com açúcar turbinado batido com a primeira gota de espresso para criar uma espuma densa (<em>espuma de azúcar</em>), é servido em copinhos minúsculos por ventaninhas de padarias. Versailles e El Pub são os templos máximos desse ritual.</p></div>
        <div class="mag-card"><span class="ic">🌙</span><h3>Viernes Culturales — A Noite Mensal</h3><p>Na última sexta-feira de cada mês a Calle Ocho vira um festival ao ar livre: galerias abrem as portas, músicos tocam nas calçadas, chefs servem comida cubana em tendas e artistas exibem trabalhos nas ruas. O evento gratuito atrai milhares de pessoas e é, de longe, a melhor maneira de vivenciar o espírito do bairro.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🗓️</span>Planeje para a última sexta</h4><p>Se a viagem tiver qualquer flexibilidade, visite Little Havana na última sexta do mês, durante o Viernes Culturales. O bairro fica transformado — uma versão impossível de experimentar em qualquer outro dia.</p></div>
        <div class="mag-tip"><h4><span class="ic">🕐</span>Melhor horário para o Domino Park</h4><p>Os velhos jogadores chegam cedo — por volta das 10h já há partidas. O pico é entre 14h e 17h, quando o parque está mais animado. Chegue com respeito: observe, pergunte antes de fotografar e não interrompa partidas em andamento.</p></div>
        <div class="mag-tip"><h4><span class="ic">🇧🇷</span>Vantagem do português</h4><p>O espanhol cubano é próximo o suficiente do português para que muitas interações funcionem no portunhol. Os moradores mais velhos adoram saber que você é brasileiro e frequentemente puxam conversas longas sobre futebol e música.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>Peça permissão para fotografar</h4><p>Little Havana não é um parque temático. Os jogadores de dominó e moradores são pessoas reais em seu cotidiano. Sempre peça licença antes de fotografar pessoas, especialmente no Domino Park. Um sorriso e "¿puedo tomar una foto?" abrem todas as portas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🥤</span>A ordem correta de comer</h4><p>Estratégia ideal: comece com cafecito e tostada na janela do El Pub de manhã, almoce no Versailles (o mais famoso), tome uma cana de açúcar gelada numa bodega à tarde e feche com jantar no Exquisito ou La Carreta. Não tente fazer tudo de uma vez.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Leve dinheiro em espécie</h4><p>Muitos estabelecimentos menores — ventaninhas de café, barracas de comida, artesanato de rua — aceitam apenas dinheiro. Tenha sempre US$ 20–40 em espécie para não perder as melhores experiências por falta de troco.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚘</span>Uber é a melhor opção</h4><p>O estacionamento na Calle Ocho é frustrante e caro. Uber e Lyft funcionam muito bem em Miami — chegue de app e peça carona na hora de partir. Isso ainda permite tomar uma cervejinha sem se preocupar em dirigir.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades Fascinantes</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O maior carnaval de rua dos EUA acontece aqui</b><span>O Calle Ocho Festival — parte do Carnaval Miami — é o maior festival de rua dos Estados Unidos e um dos maiores do mundo, atraindo mais de 1 milhão de pessoas em um único dia de março. Trinta quarteirões da SW 8th Street viram palcos, food trucks, música ao vivo e dança. Em 1988, estabeleceu o recorde mundial de maior conga line: 119.986 pessoas dançando juntas.</span></div></li>
        <li><div><b>O Versailles não é um restaurante — é um parlamento</b><span>Conhecido como "a cantina da política cubana em exílio". Candidatos presidenciais americanos obrigatoriamente param aqui para fotos e discursos. Decisões sobre Cuba, declarações políticas e manifestações contra o regime de Havana são frequentemente anunciadas no estacionamento. É ao mesmo tempo o restaurante mais famoso e o fórum político mais importante da diáspora cubana.</span></div></li>
        <li><div><b>Os jogadores de dominó foram recrutados pela CIA</b><span>Durante a Guerra Fria, FBI e CIA recrutaram ativamente membros da comunidade cubana de Little Havana para operações contra o regime castrista. Segundo documentos desclassificados, o Domino Park foi por décadas um ponto de encontro informal entre agentes e exilados com vínculos na ilha. Alguns frequentadores mais velhos guardam histórias surpreendentes naquelas mesas.</span></div></li>
        <li><div><b>O bairro quase foi demolido nos anos 1960</b><span>Em meados dos anos 1960, o governo municipal aprovou um projeto de "renovação urbana" que previa demolir grande parte da Calle Ocho para construir uma autoestrada. O projeto foi barrado por um movimento de resistência liderado por mulheres cubanas do bairro — que literalmente se acorrentaram às fachadas das casas. Sem elas, Little Havana hoje não existiria.</span></div></li>
        <li><div><b>Gloria Estefan cresceu a duas quadras daqui</b><span>Uma das maiores estrelas do pop latino de todos os tempos chegou a Miami aos dois anos, como refugiada cubana com os pais. Cresceu frequentando as padarias e igrejas da Calle Ocho. Sua história é literalmente a história de Little Havana: uma criança de exilados que usou a música como ponte entre dois mundos e chegou ao topo — sem nunca esquecer de onde veio.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Onde Comer</div>
      <h2 class="mag-title">Mesas com história</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Cubana · Ícone político · Desde 1971</div><h3>Versailles Restaurant</h3><div class="addr">📍 3555 SW 8th St, Miami, FL 33135</div><p>O restaurante mais famoso de Little Havana e provavelmente o mais politicamente simbólico dos EUA. Espelhos do chão ao teto, ropa vieja imbatível e um cafezinho servido no balcão de mármore que não tem igual no mundo.</p><span class="order">Peça: Ropa Vieja + Arroz Moro + Cafecito</span></div>
      <div class="mag-resto"><div class="tier">Cubana · Bar · Música ao vivo</div><h3>Ball &amp; Chain</h3><div class="addr">📍 1513 SW 8th St, Miami, FL 33135</div><p>Aberto originalmente em 1935, fechado e reaberto em 2014 com fidelidade total ao espírito original. Cocktails cubanos impecáveis (mojito, daiquiri, Cuba Libre), comida de botequim de altíssimo nível e uma banda ao vivo todas as noites.</p><span class="order">Peça: Mojito Clássico + Croquetas de Jamón</span></div>
      <div class="mag-resto"><div class="tier">Cubana · Janela · Rua</div><h3>El Pub Restaurant</h3><div class="addr">📍 1548 SW 8th St, Miami, FL 33135</div><p>O lugar mais autêntico e menos turístico da Calle Ocho: um balcão com janela para a rua onde se serve o melhor cafecito de Miami (debate acalorado), presunto cubano e pastelitos quentes às 7h da manhã. Clientela quase toda do bairro.</p><span class="order">Peça: Pastelito de Guayaba + Cafecito</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Chegando em Little Havana</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Do aeroporto (MIA)</h4><p>O Aeroporto Internacional de Miami fica a 8–12 minutos de Uber ou Lyft, US$ 15–22. Uma das atrações mais acessíveis logisticamente — perfeita para uma primeira tarde em Miami antes do hotel.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏙️</span>Do Downtown</h4><p>Do Downtown (Brickell, Bayside) são apenas 5–10 minutos de Uber. O Metrobus tem linhas que passam pela SW 8th Street (8 e 11), mas com bagagem ou crianças o app é muito mais prático.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏖️</span>De Miami Beach</h4><p>De South Beach, o Uber/Lyft custa US$ 20–35 e leva 20 a 40 minutos conforme o trânsito (evite o pico entre 17h e 19h). O MacArthur Causeway pode ser intenso — planeje com margem.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>Há vagas de rua pagas na SW 8th Street (parquímetros, US$ 1–2/h). O estacionamento da Miami Dade College Wolfson Campus (perto do Tower Theater) é mais barato. Ainda assim, Uber é fortemente recomendado.</p></div>
      </div>
    </section>

<template id="tpl-page-wynwood_walls">

    <h1>Wynwood <em>Walls</em></h1>
    <p class="mag-tagline">O maior museu de arte de rua a céu aberto do mundo: onde um bairro industrial abandonado tornou-se a capital global do grafite contemporâneo.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>US$ 12</b><span>Entrada adulto</span></div>
      <div class="m"><b>2–4 h</b><span>Duração ideal</span></div>
      <div class="m"><b>2009</b><span>Fundação</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Endereço</span><span class="v">2520 NW 2nd Ave, Miami, FL</span></div>
    <div class="f"><span class="k">Horário</span><span class="v">Seg–Qui 11–23h · Sex–Dom 11–24h</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">US$ 12 · US$ 5 (5–12 anos)</span></div>
    <div class="f"><span class="k">Artistas</span><span class="v">+50 países representados</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 3</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">De armazém abandonado a tela global</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>No início dos anos 2000, Wynwood era um conjunto de armazéns industriais abandonados ao noroeste do centro de Miami — sem atrações, sem restaurantes, sem razão para visitar. As ruas vazias eram frequentadas apenas por moradores de baixa renda e, ocasionalmente, por artistas em busca de aluguel barato e paredes disponíveis. Ninguém imaginava que em menos de uma década Wynwood se tornaria um dos bairros mais fotografados do planeta.</p>
        <p>A transformação tem um nome: <strong>Tony Goldman</strong>. O visionário desenvolvedor imobiliário nova-iorquino chegou por volta de 2009 com uma ideia radicalmente simples: em vez de demolir os armazéns, cobri-los de arte. Goldman contactou os maiores nomes do grafite e da arte de rua do mundo — Shepard Fairey (criador do icônico "Hope" de Obama), <em>Os Gemeos</em> (os brasileiros de São Paulo), Kenny Scharf, Ron English — e convidou-os a pintar as paredes externas dos seus galpões sem restrições de tema ou tamanho.</p>
        <p>As Wynwood Walls abriram em dezembro de 2009 durante a Art Basel Miami Beach — o maior festival de arte contemporânea das Américas — e causaram sensação imediata. Galeristas, colecionadores, críticos e celebridades que vinham para a Art Basel desviavam para ver aquelas paredes impossíveis. O boca a boca foi instantâneo: em semanas, Wynwood estava em todas as revistas de arte do mundo. Tony Goldman morreu em 2012, mas sua fundação continua gerenciando e expandindo o projeto.</p>
        <p>Hoje, Wynwood não é mais apenas as Walls: é um bairro inteiro coberto de arte. Mais de oitenta galerias, centenas de murais em cada esquina, restaurantes estrelados, breweries artesanais, lojas de moda e hotéis de design transformaram a composição demográfica e econômica da região. A gentrificação é uma realidade — os aluguéis subiram 400% em dez anos — mas a arte permanece onipresente. Para qualquer visitante com sensibilidade estética, Wynwood redefine o que uma cidade pode fazer com seus próprios espaços.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i7" alt="Murais de arte urbana em Wynwood">
        <figcaption>Wynwood — murais que cobrem cada superfície do bairro</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Tony Goldman, fundador (1943–2012)</span>
        <p>"Wynwood prova que a arte pode ser a infraestrutura mais poderosa de uma cidade. Não estamos construindo museus — estamos colocando arte onde as pessoas vivem."</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Pelo bairro-galeria</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎨</span><h3>As Wynwood Walls — O Epicentro</h3><p>O complexo original: galpões industriais cujas paredes são telas permanentes de artistas de renome mundial. A entrada paga (US$ 12) dá acesso ao pátio central com murais que se renovam parcialmente a cada ano. A loja da fundação vende prints originais assinados e produtos com obras do acervo.</p></div>
        <div class="mag-card"><span class="ic">🖌️</span><h3>Wynwood Doors — A Extensão Gratuita</h3><p>O complexo vizinho às Walls, de acesso gratuito, tem algumas das obras mais impressionantes do bairro — incluindo murais gigantes de Os Gemeos e Shepard Fairey. O pátio interno tem food trucks e uma área de shows ao ar livre, com ambiente mais descontraído e frequentado por locais.</p></div>
        <div class="mag-card"><span class="ic">🚶</span><h3>Wandering Wynwood — A Caminhada Livre</h3><p>A melhor experiência não está dentro de nenhum complexo: está nas ruas ao redor. Cada quarteirão entre a NW 20th e a NW 29th Street, e entre a NW 1st e a NW 5th Avenue, é coberto de murais surpreendentes. Siga seu instinto, dobre em qualquer esquina interessante — sempre vai encontrar algo extraordinário.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Wynwood Brewing Company</h3><p>A primeira cervejaria artesanal de Miami, no coração do bairro, com interior decorado com arte de rua e um cardápio rotativo de cervejas próprias. O Pop's Porter (escura com notas de chocolate e café) e a Wynwood IPA são os clássicos. O pátio externo é perfeito para uma pausa na caminhada.</p></div>
        <div class="mag-card"><span class="ic">🖼️</span><h3>Galerias Independentes</h3><p>Wynwood tem mais de 80 galerias de arte contemporânea, de espaços estabelecidos como Primary Projects e R&amp;Company a estúdios de artistas abertos ao público. Muitas têm entrada gratuita e visitação às quartas e sextas à noite. A Art Basel em dezembro é o auge, mas o circuito funciona o ano todo.</p></div>
        <div class="mag-card"><span class="ic">📸</span><h3>Wynwood à Noite — Luzes e Neon</h3><p>À noite é outra experiência: as instalações de neon e luz acendem, bares e restaurantes ficam cheios, a música vaza pelas portas abertas e as ruas ganham energia elétrica. O contraste das cores vibrantes dos murais com a iluminação noturna cria fotografia singular. Sextas e sábados são o auge.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Orgulho Brasileiro</div>
      <h2 class="mag-title">Os Gemeos em Wynwood</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Para a família brasileira que visitar Wynwood, há um motivo especial de orgulho: <em>Os Gemeos</em> — Otávio e Gustavo Pandolfo, nascidos em São Paulo em 1974 — são dois dos artistas mais importantes de toda a história das Wynwood Walls. Os irmãos paulistanos foram convidados por Tony Goldman para a abertura do projeto em 2009 e pintaram um dos murais mais fotografados do complexo: um painel monumental com personagens amarelos em trajes folclóricos brasileiros, característicos do estilo inconfundível dos dois.</p>
        <p>Os Gemeos cresceram no Cambuci, em São Paulo, e começaram a pintar nas ruas da capital paulista nos anos 1980 e 1990, influenciados pelo grafite nova-iorquino e pelo surrealismo da própria cultura. Hoje têm obras permanentes em Nova York, Londres, Paris, Berlim e, claro, Miami. Quando estiver em Wynwood, procure o mural deles com atenção — cada detalhe conta uma história.</p>
      </div>
      <div class="mag-chips">
        <span class="mag-chip">🇧🇷 Os Gemeos · São Paulo</span>
        <span class="mag-chip soft">🇺🇸 Shepard Fairey · Los Angeles</span>
        <span class="mag-chip soft">🇺🇸 Kenny Scharf · Nova York</span>
        <span class="mag-chip soft">🇧🇪 ROA · Gante, Bélgica</span>
        <span class="mag-chip soft">🇬🇧 D*Face · Londres</span>
        <span class="mag-chip soft">🇮🇹 Blu · Bolonha, Itália</span>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Melhores Spots de Foto</div>
      <h2 class="mag-title">Onde a luz cai melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">📍</span><h3>Mural Os Gemeos</h3><p>NW 2nd Ave entre 25th e 26th St. O mural dos brasileiros com os personagens amarelos característicos. Melhor luz de manhã (10h–12h), quando o sol bate de frente na parede norte.</p></div>
        <div class="mag-card"><span class="ic">📍</span><h3>Entrada das Wynwood Walls</h3><p>A fachada da entrada principal na NW 2nd Ave é um mural em si. O portão de ferro forjado com arte ao fundo é uma das fotos mais icônicas do bairro. Chegue antes das 11h para evitar filas.</p></div>
        <div class="mag-card"><span class="ic">📍</span><h3>NW 24th Street</h3><p>Um corredor inteiro de murais consecutivos nos dois lados da rua — parece um túnel de arte. Fica fora do complexo pago, portanto gratuito e menos movimentado. Perfeito para retratos com arte ao fundo.</p></div>
        <div class="mag-card"><span class="ic">📍</span><h3>Rooftop do Wynwood Walls</h3><p>O terraço da loja da fundação (acessível com o ingresso) oferece vista panorâmica dos telhados pintados do bairro — uma perspectiva que a maioria dos visitantes não conhece. Leve zoom ou use o modo retrato.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar melhor</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌅</span>Melhor horário para fotos</h4><p>A luz da manhã (10h–12h) é ideal — evita as sombras duras do meio-dia e a contraluz da tarde. Se preferir o bairro animado, volte a partir das 19h, quando os bares abrem e as luzes neon acendem.</p></div>
        <div class="mag-tip"><h4><span class="ic">👟</span>Use tênis confortáveis</h4><p>Uma visita completa — Walls + bairro ao redor — envolve facilmente 8–12 km a pé em calçamento irregular. Salto alto e sandálias são armadilhas clássicas do turista. Tênis esportivos são o calçado oficial do bairro.</p></div>
        <div class="mag-tip"><h4><span class="ic">🗓️</span>Evite sábados ao meio-dia</h4><p>Sábados entre 13h e 17h são o pico de visitação. As ruas ficam tão cheias que uma foto sem pessoas no quadro é quase impossível. Prefira chegar às 11h (abertura) ou depois das 18h.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎪</span>Art Basel em dezembro</h4><p>Se sua viagem coincidir com dezembro, a Art Basel Miami Beach transforma Wynwood num epicentro cultural mundial: novos murais pintados ao vivo, galerias com abertura especial, festas abertas ao público e celebridades da arte nas ruas. Experiência única no ano.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔦</span>A experiência noturna</h4><p>Wynwood à noite (sexta e sábado a partir das 20h) é radicalmente diferente: menos fotografia de arte, mais vida de bairro. Bares e restaurantes cheios, instalações de luz acesas, clima de festival permanente. Separe uma noite especificamente para isso.</p></div>
        <div class="mag-tip"><h4><span class="ic">💶</span>Cartão funciona em todo lugar</h4><p>Diferente de Little Havana, Wynwood é totalmente voltado ao turismo contemporâneo: bares, restaurantes e galerias aceitam cartão (inclusive internacionais com chip). Não é necessário dinheiro em espécie, embora gorjetas em cash sejam sempre apreciadas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚫</span>Segurança nas bordas do bairro</h4><p>O núcleo de Wynwood (entre NW 20th e 29th St, NW 1st a 5th Ave) é muito seguro e bem policiado. Evite ruas escuras além dessas fronteiras, especialmente à noite. Fique na área iluminada e movimentada — há mais que suficiente para ver ali.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎭</span>Tour guiado compensa</h4><p>Existem tours a pé (US$ 25–40) que contextualizam as obras com a história dos artistas e a evolução do bairro. Para quem tem interesse real em arte contemporânea, a diferença entre ver os murais com e sem contexto é enorme. Reserve via Airbnb Experiences ou Miami Art Tours.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades Fascinantes</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>De bairro sem-saída a destino de US$ 1 bilhão</b><span>Em 2000, os imóveis valiam menos de US$ 10 por pé quadrado. Hoje, em 2026, o valor médio ultrapassa US$ 500 — uma valorização de 5.000% em 25 anos. O projeto de arte que Goldman iniciou com menos de US$ 5 milhões gerou um ecossistema estimado em mais de US$ 1 bilhão em valor imobiliário e movimenta mais de US$ 100 milhões por ano em turismo. É estudado em Harvard e Columbia como caso de arte como ferramenta de desenvolvimento urbano.</span></div></li>
        <li><div><b>Os murais são pintados com spray — sem pincel, sem tela</b><span>Com raríssimas exceções, todos os murais são criados com latas de spray sobre concreto e tijolo — a técnica clássica do grafite urbano. Artistas como Os Gemeos chegam ao local apenas com esboços em papel e recriam, improvisando, obras às vezes com mais de 15 metros de altura. O processo leva de 3 dias a 3 semanas conforme a complexidade.</span></div></li>
        <li><div><b>Artistas recebem zero em cachê — e não se importam</b><span>A maioria dos artistas que pintou as Walls não recebeu nenhum pagamento financeiro. A moeda era a visibilidade. Tony Goldman cobria transporte, hospedagem e materiais — e em troca o artista tinha uma tela urbana permanente diante de milhões de pessoas. Para muitos, como Shepard Fairey, a exposição de Wynwood foi o trampolim para carreiras que hoje valem dezenas de milhões.</span></div></li>
        <li><div><b>Wynwood inspirou bairros pelo mundo — inclusive no Brasil</b><span>O modelo foi copiado e adaptado em dezenas de cidades: Shoreditch em Londres, Kreuzberg em Berlim, Vila Madalena em São Paulo e o Corredor Cultural no Rio são, em alguma medida, herdeiros do experimento de 2009. A Vila Madalena — com seu Beco do Batman — é a versão brasileira mais próxima, mas Wynwood ainda é, em escala e consistência, um caso único.</span></div></li>
        <li><div><b>Barack Obama e LeBron James já foram pintados aqui</b><span>Ao longo dos anos, murais de personalidades reais foram criados nas paredes — retratos monumentais de Barack Obama (por Shepard Fairey), LeBron James, Muhammad Ali e, mais recentemente, diversas figuras do movimento Black Lives Matter. Wynwood não é apenas decorativo: é politicamente engajado, e os murais refletem os debates do momento em que foram criados.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Onde Comer</div>
      <h2 class="mag-title">Mesas no bairro-galeria</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Contemporânea · Latinx · Estrelado</div><h3>Alter Restaurant</h3><div class="addr">📍 223 NW 23rd St, Miami, FL 33127</div><p>O melhor restaurante de Wynwood e um dos mais respeitados de Miami. O chef Brad Kilgore cria pratos que são eles próprios obras de arte: técnica francesa com ingredientes da Flórida e influências latinoamericanas. Reserva obrigatória com semanas de antecedência.</p><span class="order">Peça: Tasting Menu do Chef (US$ 95)</span></div>
      <div class="mag-resto"><div class="tier">Americana · Craft Beer · Descontraída</div><h3>Wynwood Brewing Company</h3><div class="addr">📍 565 NW 24th St, Miami, FL 33127</div><p>A cervejaria artesanal do bairro, com ambiente coberto de grafite e petiscos de botequim americano. Perfeito para uma pausa durante a caminhada pelos murais. O pátio externo cria uma atmosfera descontraída e autêntica.</p><span class="order">Peça: Pop's Porter + Nachos Supremos</span></div>
      <div class="mag-resto"><div class="tier">Fusion · Asiática · Trendy</div><h3>KYU Miami</h3><div class="addr">📍 251 NW 25th St, Miami, FL 33127</div><p>Um dos restaurantes mais badalados de Wynwood: cozinha asiática com braseiro a lenha de carvalho. Os pratos chegam com defumado e caramelização que criam perfis de sabor únicos. O brunch de domingo é famoso em todo Miami.</p><span class="order">Peça: Cauliflower + Grilled Branzino</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Chegando em Wynwood</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Do aeroporto (MIA)</h4><p>De Uber ou Lyft, Wynwood fica a 15–25 minutos pela NW 36th Street, US$ 18–28. Parada natural para quem chega a Miami e quer começar a explorar antes do hotel — especialmente se o check-in for tarde.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏖️</span>De Miami Beach / South Beach</h4><p>De South Beach são 20–30 minutos de Uber pela I-195, conforme o trânsito, US$ 20–35. O Metromover (trem gratuito do centro) + Uber pode ser mais econômico: use o trem até Downtown e chame o carro de lá.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏙️</span>Do Downtown / Brickell</h4><p>Wynwood fica a apenas 3 km do centro financeiro — 10–15 minutos de Uber (US$ 12–18) ou cerca de 30 minutos a pé pela NW 2nd Avenue, passando por Overtown.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>Há vagas de rua pagas ao redor do bairro (US$ 2–3/h) e garagens na NW 24th Street. Nos fins de semana a partir das 17h fica escasso. Recomendação: venha de Uber para o jantar e atividades noturnas — não vale o estresse de dirigir.</p></div>
      </div>
    </section>

    <h1>Fort Worth <em>Stockyards</em></h1>
    <p class="mag-tagline">Onde o Old West ainda respira: longhorns percorrem a Exchange Avenue como faziam há mais de um século, num dos distritos históricos mais autênticos dos Estados Unidos.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>Grátis</b><span>Distrito público</span></div>
      <div class="m"><b>11h · 16h</b><span>Cattle Drive</span></div>

    <div class="f"><span class="k">Entrada</span><span class="v">Gratuita (eventos à parte)</span></div>
