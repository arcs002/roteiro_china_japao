    <section class="mag-section tint">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Comer em Dallas <span class="sub">sem estourar o orçamento</span></h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Dallas come bem barato: brisket fumado por 16 horas em Deep Ellum, taquerias de Mexico City na N. Fitzhugh, Tex-Mex de receita de família e soul food do South Dallas em porções que viram duas refeições.</p>
      <div class="mag-callout"><span class="lbl">Dica de bolso</span><p>Os melhores BBQ joints só servem almoço e fecham quando a carne acaba — chegue às 11h e divida uma bandeja entre dois. Taquerias e padarias do lado leste/sul têm tacos a US$2–3 e servem o dia inteiro: é onde os dallasitas comem de verdade.</p></div>
      <div class="mag-dishes">
        <div class="mag-dish"><div class="n">Beef Brisket</div><div class="d">Peito de boi fumado em carvalho por horas — casca de pimenta-do-reino, smoke ring rosado, gordura derretida. O carro-chefe texano.</div></div>
        <div class="mag-dish"><div class="n">Breakfast Tacos</div><div class="d">Ovo, queijo, batata e bacon ou chorizo em tortilha — o café da manhã universal de Dallas, por trocados.</div></div>
        <div class="mag-dish"><div class="n">Enchiladas Tex-Mex</div><div class="d">Recheadas e cobertas de queijo amarelo derretido com chili gravy — a alma do Tex-Mex de Dallas.</div></div>
        <div class="mag-dish"><div class="n">Kolaches</div><div class="d">Massa doce ou salgada (salsicha e jalapeño) herdada dos tchecos de West, TX, a uma hora ao sul. Pegue na padaria.</div></div>
        <div class="mag-dish"><div class="n">Fried Catfish</div><div class="d">Bagre empanado e frito, com hush puppies e molho tártaro — clássico do soul food sulista, farto e barato.</div></div>
        <div class="mag-dish"><div class="n">Frozen Margarita</div><div class="d">A bebida-padrão do calor texano: gelada, batida no liquidificador, obrigatória com tacos.</div></div>
      </div>
      <div class="mag-resto" style="margin-top:20px;">
        <div class="tier">BBQ Texano · Deep Ellum · $$ · vale o esplurge</div>
        <h3>Pecan Lodge</h3>
        <div class="addr">📍 2702 Main St · Deep Ellum</div>
        <p>O brisket mais famoso de Dallas, o único esplurge da lista — mas ainda paga-se por peso, então dá para comer bem sem exagerar. Espere fila; almoço apenas, fecha quando acaba a carne (~15h).</p>
        <span class="order">Pedir: beef brisket + jalapeño cheddar sausage (dividam entre dois)</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Tacos Mexico City · N. Fitzhugh · $</div>
        <h3>El Come Taco</h3>
        <div class="addr">📍 2513 N Fitzhugh Ave</div>
        <p>Taqueria familiar desde 2013 que trouxe os tacos de rua da Cidade do México para Dallas — tudo feito na hora, dez mesas, ambiente sem firula. Os mexicanos da cidade juram que é o mais autêntico.</p>
        <span class="order">Pedir: taco al pastor + alambre + guacamole</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Tex-Mex Clássico · Oak Lawn · $$</div>
        <h3>Mia's Tex-Mex</h3>
        <div class="addr">📍 4334 Lemmon Ave · Oak Lawn</div>
        <p>Aberto em 1981 pela família Enriquez, é o Tex-Mex de receita caseira que os dallasitas levam visitantes para conhecer. Os brisket tacos originais do "Butch" são lendários e o atendimento trata todo mundo como família.</p>
        <span class="order">Pedir: original brisket tacos + chile relleno (terça, US$9,95) + frozen margarita</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Soul Food · South Dallas · $</div>
        <h3>Sweet Georgia Brown</h3>
        <div class="addr">📍 2840 E Ledbetter Dr · South Dallas</div>
        <p>O orgulho do sul de Dallas há quase 30 anos: frango frito crocante, ribs, mac & cheese e batata-doce amanteigada. As porções são tão absurdas que um "prato" vira duas ou três refeições — o melhor custo-benefício de soul food da cidade.</p>
        <span class="order">Pedir: fried chicken ou fried catfish + greens + mac & cheese</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Café da Esquina · Bishop Arts · $</div>
        <h3>Hattie's / cafés do Bishop Arts</h3>
        <div class="addr">📍 W 7th–8th St · Bishop Arts District</div>
        <p>O bairro mais charmoso de Oak Cliff concentra cozinha sulista e cafés baratos a pé um do outro. Hattie's serve comfort food do sul desde 2002; nas ruas vizinhas há sorvete artesanal, cafés e mercados onde se come bem por pouco antes de explorar as galerias.</p>
        <span class="order">Pedir: chicken & waffles / griddlecakes de fubá + café local</span>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para aproveitar Dallas</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Aeroportos</h4><p>DFW é o hub principal — DART Orange Line conecta ao Downtown em 45 min. Love Field (DAL) fica a 15 min do Downtown de carro/Uber, usado pela Southwest para voos domésticos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Transporte local</h4><p>O DART light rail existe mas cobre apenas o Downtown e algumas áreas. Para Deep Ellum, Bishop Arts e Arlington, use Uber/Lyft. Carro alugado facilita muito além do Downtown.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏟️</span>AT&amp;T Stadium — Copa</h4><p>Arlington não tem acesso por metrô. Uber é a única opção prática. Saia com 90 min de antecedência para jogos. Estacionamento no estádio custa ~$50. Junho: até 38–40°C — hidrate-se.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Clima em junho</h4><p>Quente e úmido: 35–40°C com tempestades bruscas à tarde. Leve roupas leves, protetor solar e capa de chuva. Os espaços fechados têm AC poderoso — leve uma camada.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏨</span>Onde se hospedar</h4><p>Uptown e Arts District são as melhores localizações — perto a pé do Downtown, com restaurantes e vida noturna. Deep Ellum tem boutique hotels para quem quer estar no bairro mais animado.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛡️</span>Segurança</h4><p>Dallas é segura nas áreas turísticas. Deep Ellum à noite tem segurança privada nas ruas principais. Evite caminhar sozinho longe do Downtown depois da meia-noite. Guarde eletrônicos em bolsas seguras.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>Reservas de restaurantes</h4><p>Lucia (Bishop Arts) exige reserva com 2–3 semanas. BBQ (Pecan Lodge, Terry Black's) não aceita reserva — chegue às 11h ou esteja disposto a esperar. Top Knot e Gemma pedem reserva via OpenTable.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Gorjeta</h4><p>Padrão Texas: 18–20% em restaurantes sit-down, 15% em bar, $2–3 por bebida. BBQ joints e food trucks têm jar de gorjeta — deixe algo se o serviço foi bom. Uber e Lyft: 15–20%.</p></div>
      </div>
    </section>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">"Keep Austin Weird" — e eles levam a sério</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Existe uma razão pela qual Austin resiste a definições simples. É a capital do Texas — austero, conservador, imenso — mas funciona como um enclave criativo, progressista e caótico no coração do estado mais texano possível. A Universidade do Texas traz 51 mil estudantes que precisam de música às 2h da manhã e tacos às 3h. O governo estadual traz burocratas que depois das 17h viram clientes regulares dos bares de Rainey Street. E o <strong>tech boom</strong> recente — que transformou Austin na "Silicon Hills" — trouxe dinheiro suficiente para sustentar uma cena gastronômica que rivaliza com as melhores do país.</p>
        <p>A música é o coração pulsante de tudo. Mais músicos por habitante do que qualquer outra cidade americana. Mais de 250 casas de show ativas. O South by Southwest (SXSW) transformado em fenômeno cultural global. Na Sixth Street numa quinta à noite, você pode cruzar a rua três vezes e ouvir blues, country e hip-hop num raio de cem metros. A música não é entretenimento em Austin — é a própria linguagem social da cidade.</p>
        <p>Franklin Barbecue é uma instituição religiosa. Aaron Franklin ganhou o James Beard Award — o Oscar da gastronomia americana — pelo seu brisket fumado 16 horas num defumador de carvalho. A fila começa às 8h da manhã para um restaurante que abre ao meio-dia. Pessoas chegam de outros estados especificamente para isso. O ritual da espera — conversas com desconhecidos, café da calçada, o cheiro crescente de fumaça à medida que a manhã avança — faz parte da experiência tanto quanto o brisket em si.</p>
        <p>E então há os morcegos. 1,5 milhão deles, vivendo desde 1980 sob o Congress Avenue Bridge, emergindo todo entardecer numa espiral negra que dura quase uma hora. Austin poderia tê-los removido. Em vez disso, colocou assentos na margem do rio, criou visitas guiadas e adotou os morcegos como mascote oficial não-oficial da cidade. Isso diz tudo sobre Austin: estranheza bem-vinda, abraçada com orgulho e transformada em atração turística de nível mundial.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i53" alt="Austin, Texas — skyline e Lady Bird Lake">
        <figcaption>Austin — entre o Capitólio rosa e as águas do Lady Bird Lake</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Austin</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Austin é um mosaico de bairros com personalidades distintas, cada um com sua própria história e razão de ser.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🛍️</span><h3>South Congress (SoCo)</h3><p>Vintage, murais e alma austinita. Cheira a café coado, protetor solar e couro de bota de cowboy. Aqui está o mural "I Love You So Much", os trailers de comida com filas honestas, as lojas de vintage e o Continental Club com música ao vivo toda noite. É o Austin que Austin quer ser — entre a 1st e a Elizabeth.</p></div>
        <div class="mag-card"><span class="ic">🎵</span><h3>Sixth Street</h3><p>A "Dirty Sixth" é barulhenta, cheirosa a cerveja e inesquecível numa sexta à noite. A rua fecha para carros das 21h em diante; o asfalto fica com gente e som competindo de cada porta aberta — blues aqui, country ali, um cover de Led Zeppelin três portas adiante. Energia pura de cidade universitária americana.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Rainey Street</h3><p>Casinhas residenciais dos anos 1950 viraram fileira de bares com jardins ao ar livre e trailers de comida no quintal. A multidão é mais velha que a Sixth Street, a conversa mais possível. Banger's Sausage House tem 100 chopes de pressão. O lugar certo para uma boa noite sem precisar gritar.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>East Austin</h3><p>East 6th Street e East Cesar Chavez são os endereços que todo austinita cool menciona antes que fiquem mainstream. Coffee shops de origem única, barbearias com fila, Franklin Barbecue servindo o BBQ mais badalado da América e galerias que abrem às 22h. O bairro que muda mais rápido em Austin.</p></div>
        <div class="mag-card"><span class="ic">🎓</span><h3>West Campus / UT Area</h3><p>O entorno da University of Texas pulsa com a energia de 51 mil estudantes. Na Guadalupe &amp; 21st fica o mural do sapo "Hi How Are You" de Daniel Johnston — ícone indie adotado por Kurt Cobain. Livrarias Half Price Books, food trucks de frango frito e cafés cheios às 23h.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver e fazer</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/texas_state_capitol"><span class="ic">🏛️</span><h3>Texas State Capitol</h3><p>O capitólio mais alto dos EUA — acima do Capitólio de Washington. Construído em granito rosa do Texas em 1888, a cúpula de ferro fundido é visível de toda a Congress Avenue. Rotunda com acústica notável e murais históricos. Tours gratuitos de hora em hora.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/south_congress"><span class="ic">🛍️</span><h3>South Congress Avenue</h3><p>A espinha dorsal do Austin autêntico. Do Capitólio até a Elizabeth Street: murais que valem fotografar, trailers de comida, lojas de vintage com artefatos dos anos 70 e o Jo's Coffee com o famoso mural "I love you so much" na parede lateral.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/congress_bridge"><span class="ic">🦇</span><h3>Congress Avenue Bridge</h3><p>A maior colônia urbana de morcegos da América do Norte emerge todo entardecer numa nuvem que pode durar 45 minutos. Chegue 30 minutos antes do pôr do sol para garantir posição. Absolutamente gratuito e absolutamente inesquecível. Verifique austinbats.org.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/franklin_bbq"><span class="ic">🥩</span><h3>Franklin Barbecue</h3><p>O melhor brisket dos Estados Unidos segundo praticamente todos que entendem de BBQ. Aaron Franklin ganhou o James Beard Award por isso. Chegue às 8h — abre ao meio-dia — e espere na fila conversando com peregrinos do mundo todo. Peregrinação obrigatória.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🏚️</span><h3>The Old Bakery &amp; Emporium</h3><p>1006 Congress Avenue, construído em 1876 — um dos poucos prédios históricos sobreviventes do centro. Hoje administrado por voluntários seniores que vendem artesanato texano e servem limonada. Um oásis de calma num trecho agitado da Congress.</p></div>
        <div class="mag-card"><span class="ic">🎶</span><h3>Sixth Street &amp; Red River District</h3><p>O coração da cena musical de Austin. Red River Street (entre 6th e 9th) tem os melhores clubs: Stubb's Amphitheater (shows ao ar livre), Emo's, Mohawk. A Dirty Sixth fica fechada para carros nos fins de semana — toda a rua vira área de pedestre musical.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>Barton Springs Pool</h3><p>Uma piscina natural de água de nascente a 20°C constantes, dentro do Zilker Park. Em junho com 38°C do lado de fora, entrar nessa água é uma bênção. Aberta desde 1917, é onde o Austin local vai se recuperar no fim de semana.</p></div>
        <div class="mag-card"><span class="ic">🖼️</span><h3>Blanton Museum of Art (UT)</h3><p>O maior museu universitário dos EUA, no campus da UT. 18 mil obras, incluindo a escultura "Ellsworth Kelly Austin" — uma capela de concreto com vitrais coloridos considerada por muitos críticos a obra de arte mais importante construída nos EUA no século XXI.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Murais Icônicos</div>
      <h2 class="mag-title">Austin ao ar livre</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Austin é uma galeria de arte a céu aberto. Os murais não são decoração — são declarações de identidade numa cidade que leva "Keep Austin Weird" com seriedade de manifesto. Um roteiro pedestre de murais leva 2h e conta a história da cidade melhor do que qualquer museu.</p>
      <div class="mag-cards">
        <div class="mag-card"><span class="ic">❤️</span><h3>I Love You So Much</h3><p>1300 S Congress Ave (Jo's Coffee). O mural mais fotografado de Austin. Uma declaração de amor grafitada por uma namorada à outra em 2010 — e ficou para sempre. Fila de turistas o dia todo.</p></div>
        <div class="mag-card"><span class="ic">🐸</span><h3>Hi How Are You</h3><p>Guadalupe &amp; 21st St (West Campus). O sapo alienígena de Daniel Johnston, desenhado em 1993. Kurt Cobain usava a camiseta deste mural. Ícone da cultura indie mundial.</p></div>
        <div class="mag-card"><span class="ic">🧈</span><h3>You're My Butter Half</h3><p>2001 E MLK Jr Blvd (East Austin). Dois pedaços de torrada se abraçando — criado por Casey Donahew como homenagem ao casamento. Um dos murais mais queridos pelos austinitas.</p></div>
        <div class="mag-card"><span class="ic">🎸</span><h3>Willie Nelson</h3><p>130 E Elizabeth St / S Congress. O patrono de Austin em tamanho real — chapéu, trança, guitarra Trigger. Tão inseparável de Austin quanto o próprio capitólio. Fotogênico a qualquer hora.</p></div>
        <div class="mag-card"><span class="ic">👋</span><h3>Greetings from Austin</h3><p>1720 S 1st St (Bouldin Creek). Inspirado nos postais vintage dos anos 1940 — letras gigantes preenchidas com cenas da vida austinita. Colorido, nostálgico e muito bem executado.</p></div>
        <div class="mag-card"><span class="ic">🦸‍♀️</span><h3>Wonder Woman</h3><p>Congress Ave Bridge (sul). Pintado para celebrar o lançamento do filme, ganhou status permanente. Fica na parede sul da ponte dos morcegos — dois ícones de Austin num só lugar.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Comer em Austin <span class="sub">sem estourar o orçamento</span></h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">A alma de Austin está nos food trucks e nas taquerias: migas tacos premiados, tacos de suadero ao estilo Cidade do México, breakfast tacos de US$3 e o melhor BBQ do planeta — pago por peso, então dá para comer barato.</p>
      <div class="mag-callout"><span class="lbl">Dica de bolso</span><p>Coma onde a fila é de food truck, não de restaurante: os melhores tacos da cidade saem de trailers a US$2,75–3,50 a unidade. Para o Franklin, leve cadeira de camping e chegue cedo — a fila é o único "preço". Tex-Mex clássico rende mais no almoço.</p></div>
      <div class="mag-dishes">
        <div class="mag-dish"><div class="n">Brisket de Franklin</div><div class="d">Peito de boi fumado em carvalho — casca de pimenta-do-reino, smoke ring rosado, gordura derretida. James Beard Award.</div></div>
        <div class="mag-dish"><div class="n">Migas Tacos</div><div class="d">Ovo mexido com tiras de tortilha frita crocante, pico, queijo e abacate. O café da manhã sagrado de Austin.</div></div>
        <div class="mag-dish"><div class="n">Suadero Taco</div><div class="d">Carne de fralda cozida lenta, estilo Cidade do México, servida só com cebola e coentro em tortilha de milho.</div></div>
        <div class="mag-dish"><div class="n">Queso (Bob Armstrong)</div><div class="d">Molho de queijo derretido com camadas de carne, guacamole e creme — o queso mais famoso da cidade.</div></div>
        <div class="mag-dish"><div class="n">Trailer Park Taco</div><div class="d">Clássico de food truck: frango frito, queso e jalapeños. O fast-food que Austin elevou de categoria.</div></div>
        <div class="mag-dish"><div class="n">Frozen Margarita</div><div class="d">A bebida-padrão do calor texano — Austin reivindica ter inventado a versão congelada.</div></div>
      </div>
      <div class="mag-resto" style="margin-top:20px;">
        <div class="tier">BBQ Central Texas · East Austin · $$ · vale o esplurge</div>
        <h3>Franklin Barbecue</h3>
        <div class="addr">📍 900 E 11th St · East Austin</div>
        <p>A peregrinação. Chegue às 8h, abrem ao meio-dia. O brisket é de outra dimensão — fumaça de carvalho, casca de pimenta-do-reino, gordura derretida. Paga-se por peso e a fila é o real "esplurge": leve cadeira de camping.</p>
        <span class="order">Pedir: brisket fatty + pork ribs + jalapeño cheddar sausage</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Food Truck Mexicano · Webberville Rd · $</div>
        <h3>Veracruz All Natural</h3>
        <div class="addr">📍 2505 Webberville Rd · East Austin (e outras 6 unidades)</div>
        <p>Fundado pelas irmãs Vazquez, virou sinônimo do melhor taco da cidade — tortilha feita na hora, ingredientes comprados frescos todo dia. Os migas tacos entraram na lista dos 5 melhores tacos dos EUA do Food Network.</p>
        <span class="order">Pedir: migas taco + taco de peixe + suco natural</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Tacos Mexico City · Arbor Food Park · $</div>
        <h3>Cuantos Tacos</h3>
        <div class="addr">📍 1108 E 12th St · East Austin</div>
        <p>Trailer de tacos de rua estilo Cidade do México: menu enxuto de suadero, carnitas, buche e longaniza. Bib Gourmand do Michelin (2024–25) e eleito o melhor taco do Texas pelo Yelp. Tacos a US$2,75, pequenos, de 2–3 mordidas.</p>
        <span class="order">Pedir: tacos de suadero (com cebola e coentro) + quesadilla</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Tex-Mex Clássico · Zilker · $$</div>
        <h3>Matt's El Rancho</h3>
        <div class="addr">📍 2613 S Lamar Blvd · Zilker/South Lamar</div>
        <p>Instituição familiar e berço do Bob Armstrong Dip — o queso em camadas que um comissário de terras texano pediu "de surpresa" há mais de 40 anos e até hoje é o prato mais pedido da casa. Tex-Mex farto e despretensioso.</p>
        <span class="order">Pedir: Bob Armstrong Dip + enchiladas + margarita</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Tacos Criativos · South 1st · $</div>
        <h3>Torchy's Tacos</h3>
        <div class="addr">📍 South 1st St (matriz) · várias unidades</div>
        <p>Nasceu de um trailer vermelho em 2006 e dominou Austin. Algumas unidades abrem até tarde — perfeito e barato depois da Sixth Street.</p>
        <span class="order">Pedir: Trailer Park + Dirty Sanchez + queso</span>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para aproveitar Austin</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Aeroporto</h4><p>Austin-Bergstrom (AUS) fica a 20 min do Downtown. Não há metrô até o aeroporto. Táxi ~US$ 35, Uber/Lyft ~US$ 20–25. O ônibus expresso CapMetro (rota 100) sai por ~US$ 1,25 mas leva 45 min.</p></div>
        <div class="mag-tip"><h4><span class="ic">🥩</span>Franklin BBQ — protocolo</h4><p>Chegue às 8h, leve cadeira de camping. A fila é social — converse com os vizinhos. Leve US$ 60–80 (aceitam cartão). Peça brisket (ponta e centro), ribs e ao menos uma salsicha jalapeño. Acaba às vezes antes das 14h.</p></div>
        <div class="mag-tip"><h4><span class="ic">🦇</span>Morcegos — horário</h4><p>O horário de emergência dos morcegos varia. Verifique austinbats.org no dia. Em junho costuma ser entre 20h15–20h45 (pôr do sol). Posição ideal: margem sul da ponte, no Lady Bird Lake. Binóculos melhoram muito.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌧️</span>Clima de junho</h4><p>Quente e potencialmente com tempestades bruscas à tarde: 35–40°C, calor úmido. Roupas de algodão leve, FPS 50+, garrafa de água. Os espaços fechados têm AC forte — leve camada extra. A chuva é rápida mas intensa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Vida noturna</h4><p>Sixth Street anima depois das 21h, com pico após meia-noite. Quinta e sexta são as melhores noites — sábado lota. Red River District (6th–9th) tem música ao vivo de mais qualidade. Cover de US$ 5–15 na maioria.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Transporte local</h4><p>Austin não tem metrô funcional para turistas. Uber/Lyft resolvem os deslocamentos. SoCo, Downtown e Sixth Street são caminháveis entre si. Alugue bicicleta (Austin B-Cycle / MetroBike) para Zilker Park e o Lady Bird Lake Trail.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Gorjeta</h4><p>Austin é generosa: 20% em restaurantes, US$ 1–2 por drinque, US$ 2–5 para músicos ao vivo (muitos tocam por gorjeta). Trailers de comida têm jar — deixe algo. Uber/Lyft: 15–20%. Coffee shops: 10–15%.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎫</span>Reservas</h4><p>Uchi exige reserva 2–3 semanas antes via Resy; Lenoir e Barley Swine, 1 semana. Franklin BBQ não aceita reserva. Bares da Sixth Street são walk-in, assim como Jo's e Torchy's. Para shows no Stubb's, compre ingressos online.</p></div>
      </div>
    </section>

    <h1>San <em>Antonio</em></h1>
    <p class="mag-tagline">Fundada em 1718 — mais antiga que os próprios Estados Unidos. Cinco missões UNESCO, o Alamo onde a história do Texas foi escrita com sangue, e o River Walk que pulsa vinte e quatro horas por dia.</p>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">Onde a história do Texas foi feita</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Patrimônio Mundial UNESCO · 2015</span>
        <p>As cinco missões franciscanas fundadas ao longo do Rio San Antonio no século XVIII foram declaradas Patrimônio Mundial da UNESCO em 2015. O <strong>Alamo</strong> (Mission San Antonio de Valero, 1718) é a mais famosa, mas Mission San José, Mission Concepción, Mission San Juan e Mission Espada completam um conjunto de arquitetura colonial espanhola único nos EUA. Entrada gratuita em todas.</p>
      </div>
      <div class="mag-prose">
        <p>San Antonio é mais velha do que os Estados Unidos. Fundada em 1718 pelos franciscanos espanhóis às margens do Rio San Antonio, a cidade existia há 58 anos quando Jefferson escreveu a Declaração de Independência. Essa antiguidade se sente em cada pedra — nas paredes de calcário branco do Alamo, nos arcos da Mission San José, nas ruas do King William Historic District com suas mansões vitorianas de comerciantes alemães do século XIX. É uma cidade que não fingiu ser moderna antes da hora.</p>
        <p>O Alamo é obrigação — não apenas como atração, mas como experiência histórica genuína. Em fevereiro-março de 1836, 189 defensores (entre eles Davy Crockett e Jim Bowie) resistiram por 13 dias ao exército de 1.800 homens de Santa Anna. Todos morreram. A narrativa da batalha — heróica ou trágica, dependendo de qual lado da fronteira você está — moldou a identidade texana de forma irreversível. Caminhar pelo mesmo pátio de calcário é uma das experiências mais solenemente carregadas de história dos EUA.</p>
        <p>Mas San Antonio em 2026 não vive apenas de história pesada. O <strong>River Walk</strong> — 24 km de caminhos ao longo do rio, um nível abaixo das ruas — é uma das experiências urbanas mais singulares dos EUA. Restaurantes com mesas sobre a água, barcaças que deslizam silenciosamente, buganvílias cor-de-rosa penduradas sobre as pontes de pedra. À noite, com as lanternas refletidas na água, tem uma qualidade que parece europeia — San Sebastián, talvez, ou Veneza em versão texana.</p>
        <p>E há a comida. San Antonio não apenas pratica o Tex-Mex — San Antonio o inventou. O <em>puffy taco</em> (concha de massa frita e estufada, preenchida com carne, queijo e guacamole) é uma criação local que não existe em nenhum outro lugar com a mesma autenticidade. O Mi Tierra, aberto desde 1941, serve 24 horas e tem paredes cobertas de flores de papel colorido. Comer barbacoa de cabeça de boi na manhã de domingo num mercado de bairro com mariachis ao fundo é uma das experiências mais genuinamente texano-mexicanas imagináveis.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i22" alt="San Antonio River Walk">
        <figcaption>O River Walk — o coração secreto de San Antonio, um nível abaixo da cidade</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">No Roteiro</div>
      <h2 class="mag-title">Dia em San Antonio</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#day/10"><span class="ic">⛪</span><h3>Dia 10 · Dom 28/jun</h3><p>Alamo + River Walk + Buc-ee's — história, água e a última parada texana antes do Canadá.</p><span class="go">Ver dia completo →</span></a>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de San Antonio</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Do peso histórico do Alamo à sofisticação gastronômica do Pearl, San Antonio é um mosaico de territórios distintos — quase todos caminháveis entre si pelo River Walk.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏛️</span><h3>Downtown / Alamo Plaza</h3><p>O centro histórico cheira a calcário aquecido pelo sol e churros de carrinho. A missão branca cercada de jardins, o Courthouse e a San Fernando Cathedral enquadram a praça num conjunto urbano de rara integridade. À noite, os bares ganham country e tejano ao vivo.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>River Walk</h3><p>Um mundo paralelo um nível abaixo das ruas. Calçada de paralelepípedo com cheiro de jasmim, o murmúrio das barcaças, garçons correndo com margaritas entre mesas quase dentro d'água. À noite, luzes de corda refletidas transformam tudo num canal veneziano texano.</p></div>
        <div class="mag-card"><span class="ic">🎪</span><h3>Market Square / El Mercado</h3><p>O maior mercado mexicano fora do México, talvez o mais autêntico ao norte do Rio Grande. Couro, especiarias, milho tostado, talavera de Puebla. No coração, o Mi Tierra está aberto 24 horas desde 1941, com flores de papel cobrindo cada centímetro do teto.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>La Villita</h3><p>O bairro mais antigo de San Antonio — construções do século XVIII em adobe e calcário que hoje abrigam galerias, ateliês e boutiques independentes. Entrada gratuita, ritmo completamente diferente do turismo massivo do Alamo. No fim de semana, artistas trabalham nas portas abertas.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>The Pearl District</h3><p>A antiga cervejaria Pearl (1883) transformada na área gastronômica mais sofisticada da cidade. Farmers Market de fim de semana, restaurantes como Cured e NAO competindo em nível nacional, e o Hotel Emma — instalado na antiga sala de máquinas — o hotel mais bonito do Texas. A 2 km do Alamo, a pé pelo River Walk.</p></div>
        <div class="mag-card"><span class="ic">🏘️</span><h3>King William Historic District</h3><p>Comerciantes alemães ergueram mansões vitorianas ao sul do Downtown no século XIX — King William Street foi a primeira rua de prestígio da cidade. Hoje, um bairro residencial histórico com galerias independentes, o San Antonio Art League Museum e as melhores bed-and-breakfasts. Uma caminhada fora do circuito padrão.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver e fazer</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/the_alamo"><span class="ic">🏰</span><h3>The Alamo</h3><p>A missão mais famosa do Texas e um dos monumentos mais visitados dos EUA. A entrada na missão é gratuita; o museu expandido cobra ingresso (reserve online). Reserve ao menos 90 minutos para o tour completo. A solenidade do lugar é real — respeite o silêncio pedido.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/riverwalk"><span class="ic">🌊</span><h3>San Antonio River Walk</h3><p>24 km de caminhos ao longo do rio, um nível abaixo das ruas. Passeio de barcaça histórica, restaurantes sobre a água, bares e hotéis. O trecho entre a Crockett Street e o Pearl District é o mais bonito — caminhe tudo antes de escolher onde parar.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/pearl_district"><span class="ic">🍺</span><h3>The Pearl District</h3><p>Antiga cervejaria Pearl (1883) transformada em distrito gastronômico e cultural. Farmers Market aos sábados e domingos de manhã. O Hotel Emma na sala de máquinas original é um dos mais belos do Texas; restaurantes de nível nacional como Cured e NAO ficam aqui.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">⛪</span><h3>San Fernando Cathedral</h3><p>A catedral em funcionamento contínuo mais antiga dos EUA, fundada em 1731 — 45 anos antes da Independência americana. A fachada neogótica foi adicionada em 1868; o interior original da missão ainda é visível. Missa em espanhol todos os dias.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>La Villita Historic Arts Village</h3><p>South Alamo Street — o bairro mais antigo da cidade, em adobe e calcário do século XVIII. Galerias, ateliês de artesanato abertos, cerâmica feita à mão. Entrada gratuita, ritmo lento, ignorado pelos ônibus de turismo. Melhor pela manhã.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>El Mercado / Market Square</h3><p>O maior mercado mexicano fora do México. Dois prédios históricos recheados de artesanato, prata, chapéus de mariachi, talavera. O Mi Tierra no coração do complexo: 24 h desde 1941, decoração que parece crescer organicamente há décadas. Vá pela manhã.</p></div>
        <div class="mag-card"><span class="ic">⛪</span><h3>Mission San José — UNESCO</h3><p>A "Rainha das Missões" — a mais bem preservada das cinco franciscanas. A roseta esculpida em pedra da fachada é considerada a mais elaborada do Barroco do Novo Mundo. Fica a 6 km do Downtown (de carro ou ônibus). Vale o desvio para quem tem tempo.</p></div>
        <div class="mag-card"><span class="ic">🚤</span><h3>Rio San Antonio Cruises</h3><p>Tour de barcaça pelo River Walk com narração histórica — 35 minutos e 2,5 km de rio. Saídas frequentes da dock próxima ao Hilton Palacio del Rio. Ótima perspectiva da cidade a partir da água. À noite, com luzes e reflexos, é outra experiência.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">O River Walk em detalhe</span>
        <p>O Paseo del Río foi construído nos anos 1930 a partir do projeto do arquiteto <strong>Robert Hugman</strong> — numa época em que a cidade debatia drenar o canal para construir uma estrada. Hugman venceu o debate e projetou cada detalhe: a largura das calçadas, a altura dos muros, as 21 pontes de pedra, a iluminação. São <strong>24 km de caminhos</strong>, <strong>21 pontes históricas</strong>, inaugurado em <strong>1938</strong> e visitado por <strong>11 milhões de pessoas por ano</strong>. O melhor momento é ao entardecer: a temperatura cai, os restaurantes acendem as lanternas, e o rio reflete tudo numa duplicata perfeita.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Comer em San Antonio <span class="sub">sem estourar o orçamento</span></h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">San Antonio é o berço do Tex-Mex — e come barato no Westside: puffy tacos a US$3, barbacoa de domingo nas padarias de bairro, pan dulce feito à mão e taquerias familiares que abriram nos anos 1960 e nunca mudaram.</p>
      <div class="mag-callout"><span class="lbl">Dica de bolso</span><p>O ritual local é a barbacoa de domingo de manhã: vá numa panadería do Westside, peça tacos de barbacoa, pan dulce e um Big Red — café da manhã farto por poucos dólares. Os puffy tacos clássicos custam US$2–3,50; fuja do River Walk turístico e atravesse para o lado oeste.</p></div>
      <div class="mag-dishes">
        <div class="mag-dish"><div class="n">Puffy Taco</div><div class="d">Concha de tortilha frita e estufada, recheada de carne, queijo e guacamole. Invenção exclusiva de San Antonio.</div></div>
        <div class="mag-dish"><div class="n">Barbacoa de Cabeza</div><div class="d">Carne de cabeça de boi cozida lentamente, servida nas padarias e botecos de bairro nas manhãs de domingo.</div></div>
        <div class="mag-dish"><div class="n">Pan Dulce</div><div class="d">Conchas, marranitos e empanadas feitos à mão nas panaderías do Westside — o doce que acompanha a barbacoa.</div></div>
        <div class="mag-dish"><div class="n">Enchiladas Tex-Mex</div><div class="d">Com queijo amarelo e molho de chile ancho — o idioma gastronômico da fronteira tejana.</div></div>
        <div class="mag-dish"><div class="n">Chili con Carne</div><div class="d">Herança das "chili queens" das praças do século XIX — sem feijão, só carne e pimentas.</div></div>
        <div class="mag-dish"><div class="n">Frijoles Charros</div><div class="d">Feijão pinto cozido com bacon, chouriço e pimentas, no caldo. Acompanhamento clássico de toda mesa.</div></div>
      </div>
      <div class="mag-resto" style="margin-top:20px;">
        <div class="tier">Tex-Mex Histórico · Market Square · $$ · desde 1941</div>
        <h3>Mi Tierra Café y Panadería</h3>
        <div class="addr">📍 218 Produce Row · Market Square</div>
        <p>Aberto desde 1941, nunca fechou (24h). O teto coberto de flores de papel acumuladas por décadas é parte do folclore. Vá no café da manhã de domingo, com mariachi ao fundo, para sentir o San Antonio real — e pegue pão doce barato na padaria ao lado.</p>
        <span class="order">Pedir: enchiladas verdes + tamales + pan dulce da padaria</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Puffy Tacos · San Antonio Original · $</div>
        <h3>Henry's Puffy Tacos</h3>
        <div class="addr">📍 6030 Bandera Rd · Westside</div>
        <p>A família Tello serve o puffy taco desde 1978 — a concha frita e estufada que só existe em San Antonio com essa autenticidade. Almoço apenas, barato, fecha quando acaba a massa.</p>
        <span class="order">Pedir: puffy taco de carne picada + queijo amarelo + guacamole caseiro</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Puffy Tacos · Westside · $ · desde 1956</div>
        <h3>Ray's Drive Inn</h3>
        <div class="addr">📍 822 SW 19th St · Westside</div>
        <p>O outro pretendente ao título de inventor do puffy taco, num antigo ice house de 1956 no coração do Westside. Servem mais de 500 puffy tacos por dia, do jeito antigo, a US$2–3,50 cada. Tex-Mex de esquina, autêntico e baratíssimo.</p>
        <span class="order">Pedir: puffy taco de picadillo + bean & cheese</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Panadería · Westside · $ · desde 1961</div>
        <h3>Bedoy's Bakery</h3>
        <div class="addr">📍 803 W Hildebrand Ave · Westside</div>
        <p>Aberta pela família Bedoy em 1961, é a parada clássica do ritual de domingo: pan dulce feito na hora (conchas, marranitos, empanadas) e, nos fins de semana, barbacoa, menudo e tortilhas de farinha. Comida de bairro, preço de bairro.</p>
        <span class="order">Pedir: tacos de barbacoa (sáb/dom) + conchas + Big Red</span>
      </div>
      <div class="mag-resto">
        <div class="tier">Taquería de Bairro · Southtown · $ · desde 1969</div>
        <h3>El Milagrito Café</h3>
        <div class="addr">📍 521 Woodlawn Ave · Southtown/Westside</div>
        <p>Taquería familiar operando desde 1969, com tacos de barbacoa e pratos fartos de café da manhã a preços que continuam refrescantemente baixos. O tipo de lugar despretensioso onde os san-antonianos comem todo dia.</p>
        <span class="order">Pedir: tacos de barbacoa + huevos rancheros + café de olla</span>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para aproveitar San Antonio</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🏰</span>The Alamo — ingressos</h4><p>A entrada na missão original é gratuita e sem reserva. O "Alamo Experience" (museu expandido, tour guiado, multimídia) custa ~US$ 30 e deve ser reservado online com antecedência — especialmente em junho. Abre às 9h, fecha às 17h30.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌊</span>River Walk — como navegar</h4><p>Fica um nível abaixo das ruas — as descidas estão a cada 2–3 quarteirões. O passeio de barcaça sai da dock próxima ao Hilton e custa ~US$ 15. O trecho entre o Alamo e o Pearl é o mais bonito — caminhe tudo antes de escolher restaurante.</p></div>
        <div class="mag-tip"><h4><span class="ic">✈️</span>Aeroporto e transporte</h4><p>O San Antonio International (SAT) fica a 20 minutos do Downtown. Carro recomendado para as missões UNESCO (estão espalhadas). O Downtown histórico — Alamo, River Walk, Market Square, La Villita — é completamente caminhável.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Clima em junho</h4><p>Quente e úmido — 36–40°C de dia. O River Walk tem alguma sombra natural, mas a Alamo Plaza é exposta. Leve protetor, chapéu e água. Tempestades bruscas à tarde, passam rápido. À noite refresca um pouco: 27–30°C.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌮</span>Domingo de manhã</h4><p>O melhor dia em San Antonio: o Farmers Market do Pearl abre às 9h, os botecos de barbacoa servem desde as 7h, e o Alamo fica menos lotado. Mi Tierra no café da manhã de domingo com mariachi ao fundo é a experiência san-antoniana definitiva.</p></div>
        <div class="mag-tip"><h4><span class="ic">🗣️</span>Bilinguismo</h4><p>San Antonio é 64% hispânica — a maior porcentagem entre as grandes cidades do Texas. Espanhol é completamente funcional em qualquer restaurante ou mercado, com menus nos dois idiomas. Um "buenos días" sempre é bem recebido.</p></div>
        <div class="mag-tip"><h4><span class="ic">🦫</span>Buc-ee's — parada obrigatória</h4><p>Na saída de San Antonio rumo ao próximo destino, pare num Buc-ee's: o maior posto do mundo (tamanho de supermercado), com banheiros impecáveis, jerky artesanal, kolaches, fudge caseiro e 120 bombas. Experiência americana única.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Gorjeta e pagamento</h4><p>20% em restaurantes sit-down é esperado. Mi Tierra e os botecos de taco muitas vezes são cash-only nos itens mais baratos — leve algum dinheiro. O River Walk aceita cartão em todo lugar. Uber funciona bem na área central.</p></div>
      </div>
    </section>

    <h1>Houston <em>⚽</em></h1>
    <p class="mag-tagline">A cidade mais diversa dos EUA. 145 línguas, 91 nações, o melhor churrasco do Texas — e um jogo da Copa do Mundo.</p>
    <div class="mag-hero-meta">

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">A metrópole que ninguém esperava</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Houston é maior do que o estado de Nova Jersey em área e mais diversa do que qualquer outra cidade nos Estados Unidos. É o tipo de lugar que só existe na América — e mesmo assim, só existe aqui.</p>
        <p>São 145 línguas faladas nas ruas, 91 nações representadas no sistema escolar, e uma cena gastronômica que desafia qualquer reputação de cidade de "só carne e churrasco". Banh mi vietnamita ao lado de suya nigeriana ao lado de Tex-Mex ao lado do melhor barbecue do estado. A Hillcroft Avenue é chamada de "Little India meets Little Pakistan". A comunidade vietnamita de Houston é a maior do país. Não existe outro lugar nos EUA igual a isso.</p>
        <p>Para esta viagem, Houston é essencialmente sinônimo de Copa do Mundo: o <strong>NRG Stadium</strong> recebe múltiplos jogos do Mundial 2026, e o dia 29 de junho é o dia do jogo. O roteiro está calibrado para isso — Truth BBQ de entrada, NRG no horário nobre da tarde, e Buc-ee's em Luling na ida ou na volta. Uma celebração à altura.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i56" alt="Houston — skyline e cena urbana">
        <figcaption>Houston — a metrópole mais diversa dos Estados Unidos</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Copa do Mundo 2026</div>
      <h2 class="mag-title">Houston no Mundial</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">FIFA World Cup 2026 · 1C × 2F · NRG Stadium</span>
        <p>29 de junho de 2026, 14h local. O <strong>NRG Stadium</strong> tem capacidade para 72.220 pessoas e é o palco de múltiplos jogos da Copa 2026. Construído originalmente para o Houston Texans da NFL, o estádio fica no Medical Center / South Main corridor — cerca de 20 minutos do centro e a 10 minutos da Truth BBQ. Estacionamento pago nos lotes adjacentes; o metrô METRORail (Red Line) conecta o Downtown ao estádio.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Houston</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Houston não tem centro de verdade — é um arquipélago de bairros, cada um com sua própria identidade. Para este dia, o mais relevante é o entorno do NRG, mas vale saber o que existe.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎨</span><h3>Midtown / Montrose</h3><p>O bairro mais caminhável de Houston. Foco LGBTQ+, galerias, bares, restaurantes vietnamitas e thai, energia criativa. O coração cultural da cidade.</p></div>
        <div class="mag-card"><span class="ic">🏡</span><h3>The Heights</h3><p>Casas vitorianas restauradas, antiquários, cervejarias artesanais. Onde fica a Truth BBQ. Um dos bairros mais caracterizados da cidade.</p></div>
        <div class="mag-card"><span class="ic">🖼️</span><h3>Museum District</h3><p>19 museus em menos de 2,5 km. Houston Museum of Natural Science, Museum of Fine Arts, Children's Museum. Área verde e aprazível.</p></div>
        <div class="mag-card"><span class="ic">🏙️</span><h3>Downtown</h3><p>Centro empresarial, arquitetura moderna, Discovery Green (parque urbano). Pouco vibrante nos fins de semana, mas próximo ao NRG.</p></div>
        <div class="mag-card"><span class="ic">🥢</span><h3>Chinatown</h3><p>Um dos maiores do Sul dos EUA. Predominantemente vietnamita e chinês, com supermercados, pho, banh mi e dim sum que competem com qualquer cidade da Califórnia.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver e fazer</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <div class="mag-card"><span class="ic">⚽</span><h3>NRG Stadium</h3><p>Palco do jogo 1C × 2F da Copa 2026. Capacidade 72.220. Teto retrátil — único estádio da NFL com essa característica. A estrutura ao lado, o NRG Astrodome ("oitava maravilha do mundo" quando inaugurado em 1965), ainda existe como landmark histórico. Acesso pelo MetroRail Red Line (estação Reliant Park) ou estacionamento. <strong>Copa 2026 · Prioridade máxima.</strong></p></div>
        <div class="mag-card"><span class="ic">🔥</span><h3>Truth BBQ</h3><p>110 S Heights Blvd, The Heights. Eleita #9 pelo Texas Monthly em 2025 — a bíblia do barbecue texano. Brisket de 14 horas de defumação, ribs que caem do osso, banana pudding de encerramento. Funciona até acabar a carne (geralmente antes das 15h). Fila inevitável, mas a Truth tem sistema de espera por texto. A 20 minutos do NRG. <strong>Pré-jogo · Chegar cedo.</strong></p></div>
        <div class="mag-card"><span class="ic">🦫</span><h3>Buc-ee's de Luling</h3><p>I-10, Luling, TX — no caminho entre San Antonio e Houston. O maior Buc-ee's do mundo: 75.000 sq ft (quase 7.000 m²), 120 bombas de gasolina, 80 caixas, brisket assado na hora, kolaches, fudge, t-shirts, e o famoso castor mascote. Uma atração turística disfarçada de posto de gasolina. Imperdível — separe 30 minutos mínimos. <strong>No caminho · I-10 East.</strong></p></div>
        <div class="mag-card"><span class="ic">🚀</span><h3>NASA Space Center Houston</h3><p>Se o tempo permitir: 45 minutos do Downtown, este é o centro de visitantes do Johnson Space Center — onde os astronautas são treinados e onde a missão de controle de Houston gerencia a ISS. Réplica do ônibus espacial Independence sobre o Boeing 747 carrier. Dificilmente cabe no dia do jogo, mas merece nota para uma visita futura. <strong>Se sobrar tempo · 45 min do centro.</strong></p></div>
      </div>
    </section>

    <section class="mag-section">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Houston <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">Houston é a cidade mais diversa dos EUA — e isso vira prato barato e honesto: brisket de smokehouse, crawfish viet-cajun, taquerias mexicanas, pho na Bellaire e o corredor indo-paquistanês de Hillcroft. A grana rende.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>Comece o dia com breakfast tacos (US$1,60–2 cada) ou kolaches numa padaria tcheca de bairro. À tarde, várias casas de crawfish e pho têm happy hour com preços de almoço. Os melhores lugares ficam nos strip malls — não nos shoppings de turista.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Brisket</div><div class="d">peito bovino defumado 14h, o coração do BBQ texano</div></div>
    <div class="mag-dish"><div class="n">Breakfast tacos</div><div class="d">ovo, batata, queijo e bacon na tortilla — café da manhã de Houston</div></div>
    <div class="mag-dish"><div class="n">Viet-Cajun crawfish</div><div class="d">lagostim no tempero cajun com manteiga de alho e capim-limão</div></div>
    <div class="mag-dish"><div class="n">Bánh mì</div><div class="d">sanduíche vietnamita em baguete crocante — US$6–8, o lanche perfeito</div></div>
    <div class="mag-dish"><div class="n">Fajitas</div><div class="d">skirt steak na chapa — inventadas no Ninfa's em 1973</div></div>
    <div class="mag-dish"><div class="n">Kolaches</div><div class="d">massa tcheca recheada (salsicha ou damasco), herança da Central Texas</div></div>
  </div>
  <div class="mag-resto">
    <div class="tier">Barbecue · The Heights · $$ · vale o esplurge</div>
    <h3>Truth BBQ</h3>
    <div class="addr">📍 110 S Heights Blvd · The Heights</div>
    <p>Texas Monthly Top 10. Brisket defumado 14h, ribs, salsichão jalapeño e o famoso banana pudding. É a única "extravagância" da lista — chegar até as 11h para garantir lugar antes da fila acabar com a carne.</p>
    <span class="order">Pedir: brisket + ribs + jalapeño sausage + banana pudding</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Viet-Cajun · Bellaire/SW · $$</div>
    <h3>Crawfish &amp; Noodles</h3>
    <div class="addr">📍 11360 Bellaire Blvd · Asiatown</div>
    <p>O berço do crawfish viet-cajun, do chef Trong Nguyen — apareceu no Ugly Delicious e no Parts Unknown, mas continua sendo refúgio de locais. Lagostim na manteiga de alho e capim-limão, dá pra sujar a mão sem doer no bolso. Tem happy hour à tarde.</p>
    <span class="order">Pedir: crawfish viet-cajun (temporada fev–maio) + garlic noodles</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Tex-Mex · East End · $$</div>
    <h3>The Original Ninfa's on Navigation</h3>
    <div class="addr">📍 2704 Navigation Blvd · East End</div>
    <p>O restaurante que inventou a fajita — sério, foi aqui, com Ninfa Rodriguez em 1973. A casa original ainda funciona no East End: fajitas de skirt steak, queso flameado, margaritas. Instituição texana de preço camarada.</p>
    <span class="order">Pedir: fajitas originais + queso blanco</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Vietnamita · Bellaire / Midtown · $</div>
    <h3>Corredor da Bellaire Blvd (Asiatown)</h3>
    <div class="addr">📍 Bellaire Blvd · também Midtown</div>
    <p>A Bellaire é a artéria do Houston vietnamita: dezenas de casas de pho, bánh mì, frutos do mar a vapor e chè (sobremesas geladas). Tigela grande de pho sai por uns US$14, bánh mì por US$6–8 — comida de verdade, preço de lanche.</p>
    <span class="order">Pedir: bún bò Huế + bánh mì đặc biệt</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Indo-Paquistanês · Hillcroft · $</div>
    <h3>Corredor de Hillcroft (Mahatma Gandhi District)</h3>
    <div class="addr">📍 Hillcroft Ave · "Desi District"</div>
    <p>Centenas de restaurantes indianos, paquistaneses, bangladeshis e do Oriente Médio num só corredor. Biryani fumegante, kebabs, tikka e doces — porções enormes por pouco dinheiro. Comida halal autêntica, longe de qualquer armadilha turística.</p>
    <span class="order">Pedir: biryani de carneiro + kulfi</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Café da manhã · todo canto · $</div>
    <h3>Taquerias &amp; kolacherias de bairro</h3>
    <div class="addr">📍 East End, Heights, Spring Branch</div>
    <p>O café da manhã de Houston é taco. Casas como a Brother's Taco House abrem às 5h: breakfast tacos a US$1,60–2 cada. Ao lado, as padarias tchecas vendem kolaches (salsicha-ovo-queijo) — combustível barato antes de um dia inteiro de cidade.</p>
    <span class="order">Pedir: 2 breakfast tacos + kolache de salsicha + café</span>
  </div>
</section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">O que saber antes de chegar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚦</span>Trânsito</h4><p>Houston tem o trânsito mais congestionado do Texas. Evite as I-10, I-45 e I-610 entre 7h–9h e 16h–19h. No dia do jogo, saia de San Antonio pela manhã (antes das 9h) para evitar engarrafamentos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🦫</span>Buc-ee's Luling</h4><p>Fica em Luling, na I-10, coordenadas 29.6617° N, 97.6552° W. Aberto 24h. Melhor parar na ida (Houston-bound) de manhã — mais tranquilo do que na volta. Separe pelo menos 30 minutos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔥</span>Truth BBQ</h4><p>Abre às 11h, fecha quando acaba a carne. Chegue até 11h30 para garantir o brisket intacto. Aceitam pedidos por texto para a fila. Estacionamento gratuito no local. A 20 min do NRG.</p></div>
        <div class="mag-tip"><h4><span class="ic">⚽</span>NRG Stadium</h4><p>MetroRail Red Line (estação NRG Park) funciona no dia do jogo — ótima opção se hospedado no Downtown. Estacionamento custa $20–$40. Portões abrem 2h antes do jogo (12h para o jogo das 14h).</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Calor</h4><p>Junho em Houston: 36–38°C com umidade pesada. O NRG tem ar-condicionado graças ao teto retrátil, mas o trajeto externo é intenso. Hidratação constante, protetor solar, roupa leve.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Volta para SA</h4><p>Jogo das 14h dura ~2h. Saindo às 16h–16h30, a volta para San Antonio pela I-10 West deve levar 3h30–4h30 dependendo do trânsito pós-jogo. Chegada em SA por volta das 20h–21h.</p></div>
      </div>
    </section>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">A capital que surpreende</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Ottawa raramente aparece nos roteiros dos viajantes — o que é exatamente o motivo para visitá-la. Elegante, bilíngue, construída na confluência de três rios, é mais viva do que sua reputação sugere.</p>
      <div class="mag-prose">
        <p>Construída à margem do Rio Ottawa, na fronteira entre Ontário e Quebec, a capital do Canadá tem alguns dos edifícios neogóticos mais dramáticos da América do Norte. As Torres do Parlamento — mesmo em reforma parcial — dominam a skyline com uma autoridade silenciosa. O Canal Rideau (Patrimônio Mundial da UNESCO), inaugurado em 1832, conecta a cidade a Kingston numa obra de engenharia que, no verão, vira corredor de caiaque e ciclismo; no inverno, a pista de patinação mais longa do mundo.</p>
        <p>Mas é o <strong>ByWard Market</strong> — em funcionamento desde 1826 — que pulsa com a vida real de Ottawa: barracas de queijo e mel, restaurantes que vão do pho ao poutine, os lendários BeaverTails e bares que animam as noites de qualquer estação. E no dia 1 de julho, todo esse cenário vira palco para o maior evento anual do país.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i58" alt="Ottawa à beira do rio">
        <figcaption>Ottawa — entre o Rio Ottawa e a fronteira de Quebec</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">No Roteiro</div>
      <h2 class="mag-title">Dias 12 e 13 <span class="sub">30 junho – 1 julho</span></h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <a class="mag-card" href="#day/12"><span class="ic">🍁</span><h3>Dia 12 · Ter · 30/06</h3><p>Voo de chegada e primeiro contato com Ottawa. BeaverTails, ByWard Market à noite e Parliament Hill ao anoitecer.</p><span class="go">Ver dia completo →</span></a>
        <a class="mag-card" href="#day/13"><span class="ic">🎆</span><h3>Dia 13 · Qua · 01/07</h3><p>Canada Day 2026. Parliament Hill, os Snowbirds, LeBreton Flats e os fogos às 22h.</p><span class="go">Ver dia completo →</span></a>
      </div>
      <div class="mag-callout">
        <span class="lbl">Canada Day · 1 de Julho de 2026</span>
        <p>O maior evento anual do Canadá — e Ottawa é o epicentro. <strong>Manhã:</strong> Parliament Hill abre com cerimônias formais, a Guarda de Honra (Ceremonial Guard), bandeiras e hinos — atmosfera solene e bonita. <strong>16h:</strong> os Snowbirds, a esquadrilha acrobática da RCAF, sobrevoam o Parliament Hill — 9 CT-114 Tutors em formação perfeita. <strong>19h:</strong> o ByWard Market vira zona de concertos anos 80, multidão animada, comida de todos os lados. <strong>Todo dia:</strong> LeBreton Flats Park é o hub principal, com atividades familiares e grandes palcos; a Supreme Court tem tours especiais, yoga e comédia; a National Gallery oferece entrada gratuita. <strong>22h:</strong> fogos sobre o Rio Ottawa e o Parliament Hill — 20 minutos visíveis de quase qualquer ponto do centre-ville. Chegue cedo para um bom posto.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Ottawa</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🛍️</span><h3>ByWard Market</h3><p>O coração social de Ottawa. Barracas de mercado desde 1826, restaurantes variados, BeaverTails originais, galerias, bares e vida noturna. O bairro mais animado da cidade, especialmente no Canada Day.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Parliament Hill / Centretown</h3><p>Edifícios do governo, museus nacionais, Canal Rideau. O centro institucional e turístico — mais silencioso nos fins de semana normais, mas transformado no Canada Day.</p></div>
        <div class="mag-card"><span class="ic">🛒</span><h3>Glebe</h3><p>Compras independentes, cafés, Lansdowne Park (estádio de futebol e rugby). Bairro residencial aburguesado com excelentes opções gastronômicas e ambiente tranquilo.</p></div>
        <div class="mag-card"><span class="ic">☕</span><h3>Hintonburg</h3><p>O Ottawa hipster: coffee shops de especialidade, vintage, música ao vivo, cervejaria artesanal. Onde os artistas locais vivem — o bairro mais criativo da cidade na última década.</p></div>
        <div class="mag-card"><span class="ic">🌉</span><h3>Old Hull / Gatineau</h3><p>Do outro lado do Rio Ottawa, já em Quebec. Cena artística animada, o Museu Canadense da História (obra-prima de Douglas Cardinal) e bares que fecham mais tarde (lei do Quebec).</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver em Ottawa</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/parliament_hill"><span class="ic">🏛️</span><h3>Parliament Hill</h3><p>As torres neogóticas do Parlamento Canadense dominam a colina sobre o Rio Ottawa. A Peace Tower (92 m) é o símbolo nacional. Em reforma desde 2018, mas ainda imponente e visitável em parte. No Canada Day, é o palco das cerimônias oficiais — fogos, Snowbirds, cerimônia de cidadania. Tours gratuitos nos dias normais.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/byward_market"><span class="ic">🛍️</span><h3>ByWard Market</h3><p>Em funcionamento desde 1826, é o mercado público mais antigo do Canadá e o coração social de Ottawa. Barracas de produtos frescos pela manhã, restaurantes ao longo do dia, vida noturna à noite. O BeaverTails original fica aqui, pelo Château Laurier. Semanas antes do Canada Day a energia já é diferente.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🚣</span><h3>Canal Rideau</h3><p>Patrimônio Mundial da UNESCO. Construído entre 1826–1832 para fins militares, nunca precisou ser usado na guerra. No verão: caiaque, pedalinho, ciclismo pelas margens. No inverno: pista de patinação de 7,8 km (a maior do mundo). Em julho, as margens são ideais para piquenique no Canada Day.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>National Gallery of Canada</h3><p>Edifício projetado por Moshe Safdie (o mesmo do Habitat 67 em Montreal), com enormes claraboias que inundam os espaços de luz natural. Acervo de arte canadense sem rival — incluindo a Galeria de Arte Inuit. No Canada Day, entrada gratuita. A aranha gigante Maman de Louise Bourgeois guarda a entrada.</p></div>
        <div class="mag-card"><span class="ic">🏺</span><h3>Canadian Museum of History (Gatineau)</h3><p>Atravesse a Alexandra Bridge ao lado do Parliament e você está no Quebec — diante do edifício mais belo do Canadá. Douglas Cardinal projetou formas orgânicas inspiradas na geografia canadense. Dentro: a maior coleção de totens do mundo, a história completa dos povos indígenas e a Grande Sala dos Povos do Pacífico.</p></div>
      </div>
    </section>

    <section class="mag-section">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Ottawa <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">A capital come barato e bem: BeaverTails no ByWard, a melhor cena de shawarma do Canadá, poutine de balcão e o Chinatown da Somerset com pho até de madrugada. Comida de verdade por poucos dólares.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>Ottawa é cidade de shawarma e banh mi: um wrap recheado sai por US$8–10 e um banh mi por US$6–8. As barracas do ByWard Market e os diners 24h (Elgin Street, Zak's) resolvem a fome a qualquer hora — e quase sempre por menos de US$15.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Poutine</div><div class="d">fritas + cheese curds que rangem + gravy — o prato nacional</div></div>
    <div class="mag-dish"><div class="n">BeaverTails</div><div class="d">massa frita em cauda de castor, criada em Ottawa em 1978</div></div>
    <div class="mag-dish"><div class="n">Shawarma</div><div class="d">cordeiro/frango no espeto com molho de alho — paixão local</div></div>
    <div class="mag-dish"><div class="n">Doces de maple</div><div class="d">maple taffy na neve, maple latte, maple butter</div></div>
    <div class="mag-dish"><div class="n">Peameal bacon sandwich</div><div class="d">lombo curado em cornmeal no pão — clássico canadense de mercado</div></div>
    <div class="mag-dish"><div class="n">Butter tarts</div><div class="d">tortinha de manteiga, açúcar e xarope — a sobremesa do Ontário</div></div>
  </div>
  <div class="mag-resto">
    <div class="tier">Doce icônico · ByWard Market · $ · desde 1978</div>
    <h3>BeaverTails</h3>
    <div class="addr">📍 69 George St · ByWard Market (barraca original)</div>
    <p>Massa frita esticada no formato de cauda de castor, criada em Ottawa em 1978. A barraca original fica no ByWard Market, ao lado do Château Laurier. Coberturas do clássico canela-açúcar ao Nutella com banana. Barato, quente e obrigatório.</p>
    <span class="order">Pedir: clássico canela-açúcar (ou Nutella com banana)</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Libanês · ByWard / Rideau · $</div>
    <h3>Shawarma Palace</h3>
    <div class="addr">📍 464 Rideau St · junto ao ByWard Market</div>
    <p>"Ottawa's favourite" desde 1997 e referência do Ottawa Citizen — a cidade que se orgulha de ter o melhor shawarma do Canadá. Porções enormes e molho de alho viciante; abre até 2h nos fins de semana. Peça o prato em vez do wrap.</p>
    <span class="order">Pedir: shawarma platter de cordeiro + extra molho de alho</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Diner 24h · Centretown · $</div>
    <h3>Elgin Street Diner</h3>
    <div class="addr">📍 374 Elgin St · Centretown</div>
    <p>Diner clássico aberto 24h, 7 dias. É aqui que Ottawa come poutine de madrugada — a versão de bacon com cebola caramelizada é a pedida das 2h. Café da manhã o dia inteiro, milkshakes e burgers, tudo honesto e barato.</p>
    <span class="order">Pedir: poutine bacon + cebola caramelizada</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Vietnamita · Somerset (Chinatown) · $</div>
    <h3>Saigon Boy Noodle House</h3>
    <div class="addr">📍 648 Somerset St W · Chinatown / Little Saigon</div>
    <p>O coração do Chinatown da Somerset, onde se concentra a melhor comida barata da cidade. Caldo de pho rico e encorpado, considerado por muitos o melhor de Ottawa, servido até de madrugada. Tigela grande por uns US$14.</p>
    <span class="order">Pedir: phở tái (acém) grande + chả giò</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Mercado · ByWard Market · $</div>
    <h3>Barracas do ByWard Market</h3>
    <div class="addr">📍 ByWard Market · centro</div>
    <p>O mercado mais antigo do Canadá funcionando: bancas de produtores, food trucks e padarias. É onde provar maple taffy puxado na neve, butter tarts frescas e o peameal bacon sandwich — comida canadense de raiz, comprada na mão e comida andando.</p>
    <span class="order">Pedir: peameal bacon sandwich + butter tart + maple taffy</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Frutos do mar · Centretown · $$ · vale o esplurge</div>
    <h3>The Whalesbone</h3>
    <div class="addr">📍 430 Bank St · Centretown</div>
    <p>O único gasto maior da lista, e justificado: pioneiro no Canadá em frutos do mar sustentáveis e rastreáveis. Ostras frescas, fish &amp; chips de respeito e menu que muda conforme o barco chega. Para a noite especial em Ottawa.</p>
    <span class="order">Pedir: ostras do dia + fish &amp; chips</span>
  </div>
</section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">O que saber antes de chegar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">⏰</span>Canada Day: chegue cedo</h4><p>O Canada Day atrai 300.000+ pessoas em Ottawa. Para ver os Snowbirds (16h) com boa vista do Parliament Hill, chegue até as 13h. Para os fogos (22h), o Major's Hill Park e as margens do Canal são os melhores spots.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔴</span>Vista-se</h4><p>Canada Day exige vermelho e branco. Sério. Todo mundo veste, as barracas vendem acessórios por $2–$5, e o visual coletivo da multidão é parte da experiência. Uma bandeira canadense de ombro completa o look.</p></div>
        <div class="mag-tip"><h4><span class="ic">🗣️</span>Bilinguismo</h4><p>Ottawa é oficialmente bilíngue. Em muitos restaurantes e lojas do ByWard Market, o atendimento começa em francês. Um "Bonjour / Hello" de entrada abre todas as portas. O Quebec (Gatineau) é logo ali — a fronteira é a ponte.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚆</span>Transporte</h4><p>Uber funciona bem. O LRT (Light Rail Transit) conecta o aeroporto ao centro em 25 minutos. No Canada Day, o transporte público é reforçado e gratuito em algumas linhas. O centro é caminhável — ByWard Market, Parliament e a Galeria ficam a 15 min a pé uns dos outros.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Moeda</h4><p>Dólar canadense (CAD). Em junho de 2026, ~0,72 USD = 1 CAD. Cartões aceitos em praticamente todo lugar. Tim Hortons e BeaverTails nas barracas podem ser cash-friendly nos dias de evento.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌤️</span>Clima de julho</h4><p>Ottawa em julho: 18–27°C, noites frescas (15°C). Para os fogos à meia-noite, leve uma camada. Verão de Ottawa é glorioso — céu azul, sem umidade extrema, muito diferente de Houston. Protetor solar ainda necessário.</p></div>
      </div>
    </section>

      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">O maior segredo da América do Norte</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Montréal é a cidade que a maioria dos americanos e brasileiros não sabe que existe do jeito que é. A maior cidade francófona fora de Paris, com a densidade e a alma de uma capital europeia — mas com a segurança, a infraestrutura e o espaço do Canadá.</p>
        <p>É uma cidade de bairros, cada um com personalidade tão distinta que parece uma série de cidades sobrepostas: o calçamento de pedras do <strong>Vieux-Montréal</strong> que você poderia jurar ser o Marais de Paris; a energia boêmia do <strong>Plateau-Mont-Royal</strong> com suas escadarias externas em espiral — únicas no mundo — pintadas em cores saturadas; a criatividade do <strong>Mile End</strong>, onde uma fábrica de bagels a lenha opera ao lado de um estúdio de gravação indie ao lado de uma sinagoga hasídica. E debaixo de tudo isso, 33 quilômetros de cidade subterrânea — o RÉSO — a maior rede de passagens cobertas do planeta.</p>
        <p>Em julho, Montréal está no seu melhor: o Festival International de Jazz (um dos maiores do mundo, com mais de 500 shows, a maioria gratuitos na Quartier des Spectacles) enche as ruas de música. O calor é perfeito. As esplanadas estão cheias. O Mont-Royal fica ainda mais verde. E o cheiro de madeira queimando da Fairmount Bagel mistura-se ao aroma de café vindo de todos os recantos do Plateau.</p>
        <p><strong>Esta é a última cidade da viagem.</strong> Depois de 15 dias atravessando o sul dos EUA e chegando ao Canadá, Montréal é um final à altura — não um epílogo, mas um clímax.</p>
      </div>
      <div class="mag-callout">
        <span class="lbl">Vox Pop · Plateau-Mont-Royal</span>
        <p>Montréal não é Paris do Novo Mundo. É Montréal — o que é infinitamente mais interessante.</p>
      </div>
