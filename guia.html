    <section class="mag-section">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Uma cidade de bairros inconfundíveis</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Mais do que qualquer outra cidade desta viagem, Montréal é definida pelos seus bairros. Cada um tem identidade, idioma predominante, arquitetura e vibe próprios. Conhecer Montréal é conhecer seus bairros.</p>
      <div class="mag-cards two">
        <a class="mag-card" href="#page/vieux_montreal"><span class="ic">🏛️</span><h3>Vieux-Montréal</h3><p>O coração histórico, fundado em 1642. Ruas de pedra, edifícios dos séculos XVIII e XIX, o Vieux-Port às margens do Rio São Lourenço. A Basílica Notre-Dame fica aqui. À noite, os restaurantes nas ruas Saint-Paul e Saint-Jacques competem com qualquer boulevard parisiense. La Grande Roue ilumina o porto. Turístico, sim — mas genuíno em cada pedra.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🌙</span><h3>Plateau-Mont-Royal</h3><p>A alma real de Montréal. As lendárias escadarias externas (escaliers) sobem as ruas em espiral colorida. Duplex e triplex de tijolo com varandas na frente. Cafés em cada esquina. A Avenue du Mont-Royal repleta de boutiques independentes. É aqui que a Montréal verdadeira — a do quebecer bilíngue e culto — vive e respira.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Mile End</h3><p>O bairro mais fascinante do Canadá, talvez. A comunidade hasídica caminha ao lado de músicos indie, artistas, a geração criativa de toda a cidade. Aqui ficam as duas maiores padarias de bagel do mundo — a Fairmount (1919) e a St-Viateur (1957). Ambas abertas 24h, com forno a lenha. Aqui também nasceu o Arcade Fire.</p></div>
        <div class="mag-card"><span class="ic">🌆</span><h3>Downtown / Centre-Ville</h3><p>A espinha dorsal comercial: a Rue Sainte-Catherine com seus 11 km de lojas, teatros e restaurantes. A McGill University com seu campus neoclássico. E por baixo de tudo, a entrada para o RÉSO — 33 km de galerias subterrâneas conectando hotéis, museus, metrô e shopping centers.</p></div>
        <div class="mag-card"><span class="ic">🧺</span><h3>Rosemont / Petite-Patrie</h3><p>O bairro onde os montréalenses de verdade vivem. O Marché Jean-Talon — maior mercado ao ar livre do Canadá — fica aqui, com produtores do Quebec, fromageries, charcuteries, especiarias. Menos turístico, mais autêntico. Uma caminhada pela Rue Beaubien revela a cidade que os guias raramente mostram.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver e viver em Montréal</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/notre_dame_montreal"><span class="ic">⛪</span><h3>Basílica Notre-Dame de Montréal</h3><p>Inaugurada em 1829, um dos interiores religiosos mais impressionantes da América do Norte — azul-cobalto profundo, ouro, iluminação dramática, órgão de 7.000 canos. À noite, o show AURA transforma o interior numa experiência de luz e som imersiva de 45 minutos. Reserve com antecedência: os ingressos esgotam.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/mont_royal"><span class="ic">🏔️</span><h3>Parc du Mont-Royal</h3><p>O pulmão verde de Montréal, projetado pelo mesmo Frederick Law Olmsted que criou o Central Park (1876). Do Belvédère Kondiaronk, a vista panorâmica é uma das melhores da América do Norte. Aos domingos, os Tam-Tams (percussão coletiva espontânea) são tradição desde 1979. Em julho, o parque está verde e movimentado até as 22h.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/vieux_montreal"><span class="ic">🏛️</span><h3>Vieux-Montréal + Vieux-Port</h3><p>O centro histórico e o porto antigo formam o corredor mais fotogênico da cidade. A Place Jacques-Cartier, a Rue Saint-Paul, a arquitetura New France preservada. O Vieux-Port converte os docks em espaço público de lazer, com La Grande Roue de 60m no extremo leste. À noite, o reflexo das luzes no São Lourenço fica gravado na memória.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🏟️</span><h3>Estádio Olímpico e Tour de Montréal</h3><p>A torre inclinada mais alta do mundo (165m, 45° de inclinação) e o estádio das Olimpíadas de 1976, um monumento à ambição quebecer. O observatório no topo oferece vista de 360° da cidade e do São Lourenço. O Biodôme (ecossistemas do hemisfério ocidental) fica ao lado.</p></div>
        <div class="mag-card"><span class="ic">🎡</span><h3>La Grande Roue de Montréal</h3><p>A roda-gigante de 60 metros no Vieux-Port é o ponto final perfeito de uma noite no centro histórico. Cabines fechadas e climatizadas, vista do São Lourenço, do Vieux-Montréal e do skyline ao entardecer. Funciona até 23h no verão. Compre ingresso online para evitar filas.</p></div>
        <div class="mag-card"><span class="ic">🌃</span><h3>RÉSO — A Cidade Subterrânea</h3><p>33 quilômetros de corredores conectando 80% dos escritórios do centro, 35 estações de metrô, 1.600 lojas, 200 restaurantes e 40 bancos. Em julho o apelo prático é menor, mas como experiência urbana única no mundo, vale uma exploração de 30 minutos saindo de qualquer estação do Centre-Ville. A estação McGill conecta diretamente ao Museu de Belas-Artes.</p></div>
      </div>
    </section>

    <section class="mag-section">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Montréal <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">A cidade com mais restaurantes por habitante da América do Norte come glorioso e barato: smoked meat de delicatessen, a guerra dos bagels do Mile End, poutine de casse-croûte e frango português grelhado no carvão.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>O melhor de Montréal é o "apportez votre vin" (BYOB) — muitos bistrôs deixam levar o próprio vinho e cortam metade da conta. Para o lanche barato: bagel quente do forno (uns CA$1,50 a unidade), smoked meat sandwich e poutine de casse-croûte resolvem por menos de CA$15.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Smoked meat</div><div class="d">peito bovino curado e defumado, no pão de centeio com mostarda</div></div>
    <div class="mag-dish"><div class="n">Poutine</div><div class="d">fritas + cheese curds + gravy — melhor no casse-croûte</div></div>
    <div class="mag-dish"><div class="n">Bagel de Montréal</div><div class="d">menor, mais doce e denso, cozido em água com mel, forno a lenha</div></div>
    <div class="mag-dish"><div class="n">Tourtière</div><div class="d">torta de carne quebequense, especiarias quentes — comida de inverno</div></div>
    <div class="mag-dish"><div class="n">Frango na rotisserie</div><div class="d">frango assado estilo St-Hubert/português, com molho e fritas</div></div>
    <div class="mag-dish"><div class="n">Maple</div><div class="d">xarope de bordo em tudo — da sobremesa ao tire d'érable na neve</div></div>
  </div>
  <p class="mag-lead">A Guerra dos Bagels: <strong>Fairmount</strong> (1919, Mile End) é o mais antigo — bagel menor, mais doce e denso, fervido em água com mel e assado em forno a lenha 24h. <strong>St-Viateur</strong> (1957, a duas quadras) é o rival — textura mais elástica, "mochi", casca crocante, também 24h. Os dois batem qualquer bagel nova-iorquino: compre nos dois, coma comparando e forme sua opinião.</p>
  <div class="mag-resto">
    <div class="tier">Delicatessen Judeu · The Main · $$ · 1928</div>
    <h3>Schwartz's Deli</h3>
    <div class="addr">📍 3895 Boulevard Saint-Laurent · The Main</div>
    <p>A instituição de Montréal desde 1928. Smoked meat defumado por dias, com tempero secreto, servido no centeio com mostarda amarela. Fila sempre, sem reservas, mesa compartilhada — e vale cada minuto. Sanduíche em pé no balcão sai mais em conta.</p>
    <span class="order">Pedir: smoked meat sandwich (medium fat) + pickle</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Poutine · Plateau · $ · 24h</div>
    <h3>La Banquise</h3>
    <div class="addr">📍 994 Rue Rachel E · Plateau</div>
    <p>O templo da poutine, aberto 24h. Mais de 30 variações, da clássica (fritas + cheese curds + gravy) às exageradas (pulled pork, foie gras). A fila às 2h depois do Jazz Fest faz parte do programa. Barato e lendário.</p>
    <span class="order">Pedir: La Classique + La T-Rex (para dividir)</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Casse-croûte · Plateau · $ · desde 1982</div>
    <h3>Chez Claudette</h3>
    <div class="addr">📍 351 Avenue Laurier E · Plateau / Mile End</div>
    <p>O casse-croûte (lanchonete greasy-spoon) que os locais defendem contra as poutinerias famosas. Desde 1982, mais de 50 poutines no cardápio, muitas criadas por clientes fiéis. Nostalgia pura, execução perfeita do clássico e preço de bairro.</p>
    <span class="order">Pedir: poutine classique + clube sandwich</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Português · Plateau (junto ao Portugal) · $</div>
    <h3>Romados</h3>
    <div class="addr">📍 115 Rue Rachel E · Plateau</div>
    <p>Os imigrantes portugueses deram a Montréal o frango piri-piri grelhado no carvão, e a Romados é a referência: frango suculento, fritas e pão por um preço imbatível. Take-out movimentado, porções generosas — comida de fila justa.</p>
    <span class="order">Pedir: meio frango piri-piri + fritas + pastel de nata</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Padaria · Mile End · $</div>
    <h3>St-Viateur &amp; Fairmount Bagel</h3>
    <div class="addr">📍 Rue Saint-Viateur / Rue Fairmount · Mile End</div>
    <p>As duas padarias da Guerra dos Bagels, a duas quadras uma da outra, ambas 24h e em forno a lenha. Bagel saindo quente do forno por cerca de CA$1,50 — o café da manhã (ou madrugada) mais barato e mais montrealense que existe.</p>
    <span class="order">Pedir: sesame bagel quente em cada uma, para comparar</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Bistronomie · Saint-Henri · $$$ · vale o esplurge</div>
    <h3>Joe Beef</h3>
    <div class="addr">📍 2491 Rue Notre-Dame O · Saint-Henri</div>
    <p>O único grande gasto da lista — e talvez o restaurante mais influente do Canadá na última década. Menu que muda diariamente, produto do Quebec e técnica francesa sem pose. Reserva com semanas de antecedência; deixe para a noite que vale o esplurge.</p>
    <span class="order">Pedir: ostras da costa leste + côte de boeuf</span>
  </div>
</section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Julho em Montréal</div>
      <h2 class="mag-title">A cidade no seu auge</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Julho é o melhor mês para visitar Montréal. A cidade inteira parece ter saído de um longo inverno e decidido celebrar sem parar.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎷</span><h3>Festival International de Jazz</h3><p>Um dos maiores festivais de jazz do mundo. +500 shows, dos quais +350 gratuitos na Quartier des Spectacles. Começa no final de junho, vai até início de julho. A Rue Sainte-Catherine fecha para carros e vira corredor de música.</p></div>
        <div class="mag-card"><span class="ic">😄</span><h3>Just for Laughs</h3><p>O maior festival de comédia do mundo, também em julho. Shows pagos com comediantes internacionais e performances de rua gratuitas no Latin Quarter. Fundado em 1983, hoje tem edições em Toronto, Sydney e Chicago.</p></div>
        <div class="mag-card"><span class="ic">🌡️</span><h3>Clima perfeito</h3><p>22–27°C. Noites frescas em torno de 16°C. Sem umidade extrema. Céu azul a maior parte do tempo. As esplanadas dos restaurantes ficam abertas até meia-noite. O Mont-Royal até as 22h. A vida acontece na rua.</p></div>
        <div class="mag-card"><span class="ic">🚴</span><h3>BIXI (Bike-share)</h3><p>O sistema de bike-share de Montréal é referência mundial — lançado em 2009, inspirou o Citi Bike de Nova York. Em julho, é a melhor forma de explorar o Plateau, o Mile End e as margens do Canal de Lachine. App BIXI, cartão de crédito.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">O que saber antes de chegar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🙋</span>Bonjour — a palavra mais importante</h4><p>Sempre comece com "Bonjour" em qualquer loja, restaurante ou hotel. Em Montréal a maioria responde em inglês se necessário, mas o cumprimento francês é um gesto de respeito que abre todas as portas. "Merci" e "s'il vous plaît" completam o arsenal básico.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚇</span>Metrô</h4><p>4 linhas (Orange, Green, Blue, Yellow), 68 estações. Vieux-Montréal (Champ-de-Mars), Mont-Royal (Mont-Royal), Mile End (Laurier ou Outremont), Olympic Stadium (Pie-IX ou Viau). Bilhete único ~$4 CAD, day pass ~$11 CAD.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌙</span>AURA na Notre-Dame</h4><p>O show acontece às sextas e sábados, geralmente às 18h e 21h30. Ingressos ~$50 CAD. Reserve em moment-factory.com/aura. Leve suéter leve — a basílica é fria mesmo no verão. Dura 45 minutos, em silêncio reverente.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎷</span>Jazz Fest</h4><p>Os shows gratuitos na Quartier des Spectacles começam por volta das 18h e vão até meia-noite. Chegue cedo para palcos menores. O app oficial lista tudo. Muito do melhor jazz acontece nos palcos menores da Rue Sainte-Catherine.</p></div>
        <div class="mag-tip"><h4><span class="ic">🥪</span>Schwartz's · Estratégia</h4><p>Não reserva. A fila pode ser de 45–60 minutos nos picos (12h–14h e 18h–20h). Melhor ir às 11h quando abrem ou às 15h. O menu é simples: smoked meat em três níveis de gordura (lean, medium, fat). Peça medium.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Última noite · O que fazer</h4><p>A última noite da viagem merece atenção. Sugestão: jantar no Vieux-Montréal, subir a La Grande Roue ao entardecer, caminhar pela Rue Saint-Paul, parar num bar do Plateau. Se houver Jazz Fest, terminar com uma hora de música ao ar livre na Quartier des Spectacles é o final perfeito.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">Fim de viagem · Dia 16 · 04/07</span>
        <p>Quinze dias. Nove cidades. Dois países. Uma Copa do Mundo. Canada Day em Ottawa. O bagel da Fairmount às seis da manhã. O Riverwalk de San Antonio na chuva de junho. A basílica Notre-Dame em silêncio azul. No dia 4 de julho, o voo de YUL parte de volta ao Brasil — e a sensação de que algumas viagens não terminam quando o avião pousa. <strong>YUL → GRU · 04/07/2026 · Dia 16.</strong></p>
      </div>
    </section>

    <p class="mag-tagline">Adrenalina pura de manhã, mergulho na história cubana à noite — o melhor de Tampa num sábado perfeito.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>10h</b><span>Abertura do parque</span></div>

      <h2 class="mag-title">Hora a hora</h2>
      <div class="mag-rule"></div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">08h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">☕ Café da manhã no hotel</div>
          <p class="det">O Sleep Inn serve café continental incluso — ovos, waffle, sucos. Come bem e bebe bastante água: dia quente na Flórida + montanhas-russas exige hidratação. Protetor solar antes de sair.</p>
        </div></div>

        <div class="mag-tl"><div class="time">10h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎢 Chegada ao Busch Gardens — rope drop</div>
          <p class="det">O parque fica a 5 minutos do hotel, então saia por volta das 9h15. <strong>Esteja no portão na abertura</strong> — em junho costuma abrir às 10h: as filas só ficam curtas na primeira hora. Compre o ingresso online e vá direto para a <strong>Cheetah Hunt</strong> e depois a <strong>Iron Gwazi</strong> — as que lotam mais cedo.</p>
          <div class="mag-callout"><span class="lbl">Dica de ouro</span><p>Baixe o app oficial do Busch Gardens — mostra as filas em tempo real. Num sábado de junho, o <strong>Quick Queue</strong> (fura-fila, a partir de ~US$ 60) pode salvar horas.</p></div>

          <div class="act">🎠 Manhã — as montanhas-russas</div>
          <p class="det">Aproveite a primeira hora de filas curtas nas campeãs (ranking e tempos no <a href="#page/busch_gardens">guia completo do parque</a>):</p>
          <div class="mag-chips"><span class="mag-chip">Iron Gwazi — híbrida nº1</span><span class="mag-chip">Cheetah Hunt — 0 a 96 km/h</span><span class="mag-chip">SheiKra — mergulho 70 m</span><span class="mag-chip soft">Tigris · Montu · Kumba</span></div>
          <p class="det"><strong>Iron Gwazi</strong> (2022) é a estrela — híbrida com queda de 91°. <strong>Cheetah Hunt</strong> dispara a 96 km/h em 4 segundos. <strong>SheiKra</strong> é o mergulho vertical de 70 m sem fundo no assoalho.</p>

          <div class="act">🍽 Almoço no parque — Zagora Café</div>
          <p class="det">O <strong>Zagora Café</strong> é o melhor custo-benefício dentro do parque — buffet estilo africano. Alternativamente, o <strong>Serengeti Overlook</strong> tem vista para o safári. Descanse os pés por 30 minutos.</p>

          <div class="act">🦅 Tarde — Edge of Africa e mais</div>
          <p class="det">Com as filas estabilizadas, explore a segunda metade do parque:</p>

          <p class="det"><strong>Falcon's Fury</strong>: a torre gira você para baixo antes de soltar — 60 metros. <strong>Edge of Africa</strong> é um percurso a pé com leões e hipopótamos à vista através de vidros.</p>

        <div class="mag-tl"><div class="time">16h30</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Retorno ao hotel — descanso</div>
          <p class="det">Volta ao Sleep Inn, banho rápido, pés para cima por 30 minutos. A tarde de parque no calor da Flórida cobra seu preço — recarga obrigatória antes de Ybor City.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🍷 Jantar no Columbia Restaurant — Ybor City</div>
          <p class="det">Um dos jantares mais memoráveis da viagem. O <strong>Columbia</strong> (2117 E 7th Ave) é o <strong>restaurante mais antigo da Flórida</strong>, fundado em 1905. Azulejos espanhóis, flamenco ao vivo, teto ornamentado. Imprescindível reservar. Peça o <em>Cuban flan</em> e a sangria da casa.</p>
        </div></div>

        <div class="mag-tl"><div class="time">21h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🌃 Passeio noturno em Ybor City — 7ª Avenida</div>
          <p class="det">A <strong>7ª Avenida</strong> de noite é um show à parte. Bares com música ao vivo, charutos sendo enrolados na calçada, músicos de rua. Vibes de New Orleans misturado com a Cuba dos anos 1940. Explore o <strong>Centro Español</strong> e os botecos históricos.</p>

          <p class="det">Amanhã é dia de road trip até Miami (~4h30) e jogo no Hard Rock Stadium. Checkout cedo — deixe as malas semi-arrumadas à noite para ganhar tempo.</p>

          <p class="det">Pegue a <strong>I-75 Sul</strong> a partir de Tampa. A rota é direta e bem sinalizada, passando por <em>Sarasota</em>, <em>Fort Myers</em> e <em>Naples</em> antes de virar para o leste rumo a Miami. Ponha um podcast ou playlist — são 4h30 de estrada aberta, paisagem de wetlands da Flórida.</p>

          <div class="act">🐾 Dogs &amp; Cats Walkway — Mers Ferry Park</div>
          <p class="det">Uma das instalações artísticas mais charmosas de Miami — e totalmente gratuita. O <strong>Dogs &amp; Cats Walkway</strong> no <strong>Mers Ferry Park</strong> (próximo à orla) reúne <strong>52 esculturas gigantes de alumínio</strong> de cães e gatos, cada uma pintada por artistas locais com identidade própria. Instalação permanente ao ar livre, perfeita para uma parada rápida (~30 min) antes de Little Havana — cores vibrantes e ótima para fotos.</p>
          <div class="mag-callout"><span class="lbl">Informações práticas</span><p><strong>Local:</strong> Mers Ferry Park, orla de Miami · <strong>Entrada:</strong> gratuita · <strong>Tempo sugerido:</strong> 30 min · <strong>Tipo:</strong> instalação permanente ao ar livre.</p></div>

          <div class="act">🇨🇺 Little Havana — Calle Ocho &amp; Versailles</div>
          <p class="det">Miami começa aqui. A <strong>Calle Ocho (SW 8th Street)</strong> é o coração da cultura cubana nos EUA — cheiro de café com leite, charuto cubano e dominó no <strong>Maximo Gomez Park (Domino Park)</strong>. Almoce no <strong>Versailles Restaurant</strong>: o mais famoso restaurante cubano das Américas, frequentado por presidentes e artistas. Não vai decepcionar. Guia completo em <a href="#page/little_havana">Little Havana</a>.</p>

          <p class="det">De Little Havana, 10 minutos de carro até o <strong>Wynwood Arts District</strong>. O <strong>Wynwood Walls</strong> é um museu a céu aberto com murais de artistas de 30 países — a maior exposição de arte outdoor do mundo. Caminhe também pelas ruas ao redor (NW 2nd Ave, NW 25th St) — cada esquina é uma obra. Tome um café no <strong>Panther Coffee</strong> antes de partir para o jogo. Veja o <a href="#page/wynwood_walls">guia do Wynwood</a>.</p>
        </div></div>

          <div class="act">🚗 Partida para o Hard Rock Stadium</div>
          <p class="det">Saia de Wynwood às 16h30 para chegar ao Hard Rock Stadium por <strong>17h00</strong>. O trânsito em dia de jogo pode ser intenso — use o Waze. No estacionamento do complexo, chegar cedo garante vaga mais próxima e menos estresse na saída. Garanta água e lanche antes de entrar (os preços dentro são altos).</p>

          <div class="mag-callout"><span class="lbl">Copa do Mundo FIFA 2026 — Grupo A</span><p><strong>Uruguai × Cabo Verde</strong> · Domingo, 21/06/2026 · 19h00 (ET) · Hard Rock Stadium, Miami Gardens, FL · Capacidade 65.326 lugares · Transmissão Fox Sports / Telemundo.</p></div>

          <p class="det">Apito inicial às 19h. Você está dentro de um estádio da Copa do Mundo nos Estados Unidos — experiência que marca para a vida. Uruguai, com Cavani, Darwin Núñez e Valverde, entra como favorito. Mas Cabo Verde é o país que a Copa revelou ao mundo. Curta cada minuto — fotografe, vibre, absorva.</p>

      <div class="mag-resto"><div class="tier">Café</div><h3>Rápido em Tampa — antes da estrada</h3><div class="addr">📍 Na saída de Tampa — Morris Bridge Rd</div><p>O dia de road trip começa cedo. Café da manhã no próprio hotel (se oferecer) ou parada rápida na estrada. O Dunkin' na I-75 Sul é sempre uma opção — café americano grande e um muffin para a viagem.</p></div>

    <h1>Fort <em>Worth</em></h1>
    <p class="mag-tagline">Do aeroporto ao Velho Oeste em menos de 40 minutos — Stockyards, BBQ de dar inveja e Billy Bob's Texas de noite.</p>

      <h2 class="mag-title">Hora a hora</h2>
      <div class="mag-rule"></div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">07h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Checkout do Rodeway Inn FLL</div>
          <p class="det">Acerte a conta cedo. O aeroporto de Fort Lauderdale (FLL) fica a menos de 5 minutos do hotel — mas chegue com <strong>2h de antecedência</strong> para voos domésticos. O shuttle ou Uber ao terminal custa menos de US$10.</p>
        </div></div>

        <div class="mag-tl"><div class="time">07h30</div><div class="track"><div class="dot"></div>
          <div class="act">✈ Embarque no FLL — voo para Dallas (DFW)</div>
          <p class="det">Check-in feito pelo app. Passe pelo TSA (Pre-Check agiliza muito). O voo FLL → DFW dura cerca de <strong>3 horas</strong>. Operam a rota: American, Spirit, Southwest. Descanse a bordo — o dia em Fort Worth vai ser intenso.</p>
          <div class="mag-callout"><span class="lbl">Fuso horário</span><p>Texas usa o <strong>horário Central (CT)</strong> — 1 hora a menos que o leste (ET). Saindo às 9h de FLL com 3h de voo, você chega às 11h no horário local de Dallas. Ajuste o celular ao pousar.</p></div>
        </div></div>

        <div class="mag-tl"><div class="time">12h00</div><div class="track"><div class="dot"></div>
          <div class="act">🚗 Pouso em DFW — aluguel de carro, drive para Fort Worth</div>
          <p class="det">O DFW International é enorme — siga as placas para <em>Rental Car Center</em> (tem shuttle interno). Pegue o carro e configure o GPS: destino <strong>Stockyards National Historic District, Fort Worth</strong>. São apenas <strong>35 minutos</strong> pelo TX-121 Oeste. Bem-vindo ao Texas.</p>
        </div></div>

        <div class="mag-tl"><div class="time">13h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">🥩 Almoço: Goldee's BBQ ou Panther City BBQ</div>
          <p class="det">Fort Worth tem o melhor BBQ do Texas — e o Texas tem o melhor BBQ do mundo. Duas opções (detalhes nas <a href="#page/fort_worth_stockyards">refeições do dia</a>):</p>
          <div class="mag-chips"><span class="mag-chip">Goldee's — #3 Texas Monthly</span><span class="mag-chip soft">Panther City — nos Stockyards</span></div>
          <p class="det"><strong>Goldee's Barbecue</strong> (4645 Dick Price Rd) foi eleito um dos três melhores do Texas pela Texas Monthly. Fila antes da abertura (11h); brisket de rachar, ribs melosas, salsichas defumadas. Pode acabar rápido — chegar 10h45 é o ideal. Se perder o horário, o <strong>Panther City BBQ</strong> (food truck fixo, 201 E Hattie St) é igualmente delicioso e mais flexível.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h00</div><div class="track"><div class="dot"></div>
          <div class="act">🤠 Fort Worth Stockyards — o Velho Oeste vivo</div>
          <p class="det">Chegada ao <strong>Fort Worth Stockyards National Historic District</strong> — onde o Oeste não é reconstrução turística, é história viva. Ruas de paralelepípedo, currais históricos, cheiro de couro e som de botas no assoalho de madeira. Explore a <strong>Exchange Avenue</strong>, entre no <strong>Cowtown Coliseum</strong> e prepare-se para o momento mais icônico do dia (guia completo: <a href="#page/fort_worth_stockyards">Stockyards</a>):</p>
          <div class="mag-callout"><span class="lbl">Fort Worth Herd · desde 1866</span><p><strong>Texas Longhorn Cattle Drive — 11h e 16h.</strong> Duas vezes por dia, cowboys autênticos conduzem um rebanho de Texas Longhorns pela Exchange Avenue — mesma rota de mais de 10 milhões de cabeças no século XIX. A procissão leva uns 10 minutos mas é pura emoção: chifres enormes, cascos na pedra, cowboys de chapéu e bota. <strong>Posicione-se no lado direito da Exchange Avenue, antes da Stockyards Station.</strong></p></div>
        </div></div>

        <div class="mag-tl"><div class="time">15h30</div><div class="track"><div class="dot"></div>
          <div class="act">🎬 John Wayne — Western Legends nos Stockyards</div>
          <p class="det">Ainda nos Stockyards, vale explorar as <strong>exposições dedicadas aos heróis do cinema western</strong>, incluindo tributos a <strong>John Wayne</strong>, o maior ícone do gênero. O ambiente respira o mesmo Velho Oeste que "O Duque" imortalizou: couro, madeira, poeira e orgulho texano. Lojas e museus temáticos guardam fotos, equipamentos e memorabilia dos cowboys do cinema.</p>
          <div class="mag-callout"><span class="lbl">Dica</span><p>Pergunte aos guias dos Stockyards sobre as exposições de Western cinema heritage — o distrito tem coleções itinerantes e permanentes honrando John Wayne e outros cowboys da era dourada de Hollywood.</p></div>
        </div></div>

        <div class="mag-tl"><div class="time">17h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Check-in La Quinta Dallas North Central</div>
          <p class="det">Deixe as malas no <strong>La Quinta by Wyndham Dallas North Central</strong>. Bem localizado, boa qualidade pelo preço, piscina e academia. Troque de roupa — à noite tem Billy Bob's, então o traje ideal é casual/country: jeans, camisa aberta, botas se tiver. Mas sem pressão — turistas do mundo todo vão de bermuda mesmo.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🎸 Billy Bob's Texas — jantar, shows e honky tonk</div>
          <p class="det">A noite mais texana da sua vida. O <strong>Billy Bob's Texas</strong> é o maior honky tonk do mundo — literalmente. 127.000 pés quadrados de bar, palco, pista de dança, rodeio mecânico e muito mais, num antigo curral dos Stockyards (guia completo: <a href="#page/billy_bobs">Billy Bob's</a>).</p>
          <div class="mag-callout"><span class="lbl">O maior honky tonk do mundo</span><p>Aberto desde 1981, recebeu Willie Nelson, Merle Haggard, Garth Brooks, Waylon Jennings e outros 300 nomes do country. Na segunda pode haver show ao vivo no palco principal (cheque billybobstexas.com). Mesmo sem show grande o ambiente vale: dança country, rodeio mecânico, bilhar e centenas de autógrafos cobrindo as paredes. Coma um hambúrguer no bar ou as costelas defumadas da casa.</p></div>
          <div class="mag-chips"><span class="mag-chip">📍 2520 Rodeo Plaza</span><span class="mag-chip soft">Seg–Sex 11h–2h</span><span class="mag-chip soft">Entrada ~US$5–15</span><span class="mag-chip soft">Rodeio mecânico toda noite</span></div>
        </div></div>

        <div class="mag-tl"><div class="time">22h00</div><div class="track"><div class="dot"></div>
          <div class="act">🚗 Retorno ao hotel — boa noite, Texas</div>
          <p class="det">Uber ou carro de volta ao La Quinta. Amanhã o roteiro continua rumo a Dallas — verifique a programação do Dia 5. O Texas ainda tem muito a oferecer.</p>
        </div></div>

      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações do dia</div>
      <h2 class="mag-title">Fort Worth — o Velho Oeste autêntico</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/fort_worth_stockyards"><span class="ic">🐂</span><h3>Fort Worth Stockyards</h3><p>Distrito histórico nacional onde o gado texano era concentrado antes de seguir pelos trilhos para o resto dos EUA. Hoje preserva a cultura cowboy com o Cattle Drive diário, rodeios, currais, lojas de couro e o melhor ambiente western do país.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/billy_bobs"><span class="ic">🎸</span><h3>Billy Bob's Texas</h3><p>O maior honky tonk do mundo — 6.000 pessoas de capacidade, palco principal que recebeu os maiores nomes do country americano, rodeio mecânico, múltiplos bares e uma pista de dança que nunca para. Uma instituição cultural texana.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🏟️</span><h3>Cowtown Coliseum</h3><p>Arena histórica de 1908 onde ocorreu o primeiro rodeio profissional indoor dos EUA. Ainda em operação com shows semanais (Pawnee Bill's Wild West Show, sextas e sábados). Vale entrar mesmo sem show — o interior impressiona.</p></div>
        <div class="mag-card"><span class="ic">🎬</span><h3>John Wayne &amp; Western Legends</h3><p>O distrito dos Stockyards abriga memorabilia e exposições dedicadas aos heróis do cinema western, incluindo John Wayne. O espírito do Velho Oeste que "O Duque" imortalizou respira vivo nas ruas de paralelepípedo da Exchange Avenue.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Alimentação</div>
      <h2 class="mag-title">Refeições do dia</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Café / Viagem</div><h3>Aeroporto FLL — lanche rápido</h3><div class="addr">📍 Fort Lauderdale Intl · Terminal D/E</div><p>Sem tempo para café elaborado — lanche no aeroporto antes do embarque. A maioria dos terminais do FLL tem cafeterias razoáveis. Coma algo no portão para não passar 3 horas com fome no voo.</p></div>
      <div class="mag-resto"><div class="tier">Almoço · #3 Texas Monthly 2024</div><h3>Goldee's Barbecue</h3><div class="addr">📍 4645 Dick Price Rd · Fort Worth</div><p>Eleito um dos três melhores BBQ do Texas inteiro pela Texas Monthly. O brisket é fumado por 12+ horas até atingir aquela casca escura perfeita por fora e derretendo por dentro. Não há cardápio — você pede pelo peso. Abre às 11h (fecha quando acabar).</p><span class="order">Peça: Brisket (fatty), Beef Ribs, Jalapeño Cheddar Sausage, Banana Pudding</span></div>
      <div class="mag-resto"><div class="tier">Jantar · Nos Stockyards</div><h3>Billy Bob's Texas — no próprio bar</h3><div class="addr">📍 2520 Rodeo Plaza · Stockyards</div><p>Dentro do Billy Bob's há opções de jantar no bar — hambúrgueres, costelas, nachos, batata assada. Não é alta gastronomia, mas comer costela defumada ouvindo country ao vivo é uma das grandes experiências americanas. Cerveja texana (Shiner Bock ou Lone Star) é obrigatória.</p><span class="order">Peça: Smoked Ribs, Pulled Pork Sandwich, Shiner Bock draft</span></div>
    </section>

      <div class="mag-callout"><span class="lbl">Chegada na madrugada</span><p>Após a chegada às 2h30 vinda de Arlington, o dia começa <strong>sem pressa</strong>. Austin funciona tarde — a maioria dos lugares só abre às 11h. O ritmo lento de manhã é proposital e sábio.</p></div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">09h30</div><div class="track"><div class="dot eat"></div>
          <div class="act">☕ Café da manhã sem pressa</div>
          <p class="det">O dia começa com calma. <a href="#page/south_congress">Jo's Coffee</a> no South Congress é a escolha certa: café de especialidade servido no balcão, mesas ao ar livre sob o famoso mural "I Love You So Much" — o ponto de encontro da Austin coolhunter. Ou café no próprio hotel para recuperar energia antes de sair.</p>
        </div></div>

        <div class="mag-tl"><div class="time">10h30</div><div class="track"><div class="dot"></div>
          <div class="act">🏛️ Texas State Capitol — rotunda e jardins</div>
          <p class="det">O <a href="#page/texas_state_capitol">Capitólio do Texas</a> é deliberadamente 14 pés mais alto que o de Washington D.C. — porque no Texas tudo tem que ser maior. Construído em 1888 em granito rosa texano de Marble Falls. Explore os jardins externos com monumentos, entre na rotunda para ver a cúpula e faça o tour gratuito pelas câmaras legislativas. Detalhes arquitetônicos a cada ângulo.</p>
        </div></div>

        <div class="mag-tl"><div class="time">11h45</div><div class="track"><div class="dot"></div>
          <div class="act">🏚️ The Old Bakery &amp; Emporium — 1876</div>
          <p class="det">Parada obrigatória entre o Capitólio e o South Congress (1006 Congress Ave). Uma das construções mais antigas de Austin ainda de pé — ex-padaria de 1876 que sobreviveu às demolições do século XX. Hoje é loja de arte e artesanato administrada por idosos (Austin PARD): cerâmica, artesanato texano feito à mão, souvenirs genuinamente locais. Entrada gratuita. Uma janela discreta para o Austin de antes da gentrificação.</p>
        </div></div>

        <div class="mag-tl"><div class="time">12h30</div><div class="track"><div class="dot eat"></div>
          <div class="act">🍽 Almoço no Clay Pit — Indian Cuisine</div>
          <p class="det">A menos de 10 minutos a pé do Capitólio, o <strong>Clay Pit</strong> é uma das melhores surpresas de Austin: culinária indiana-americana premiada num casarão histórico de 1890. Tikka masala, saag paneer, naan fresco de tandoor. Ambiente escuro e fresco — perfeito para o calor de meio-dia. 1601 Guadalupe St.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎨 Congress Avenue — lojas e murais</div>
          <p class="det">O boulevard principal de Austin conecta o Capitólio ao Lady Bird Lake. Caminhada tranquila pelos 2 km de Congress Avenue: livrarias independentes, boutiques locais, galerias de arte e murais de street art pelas laterais. Pare para fotos nos murais mais famosos da avenida.</p>
        </div></div>

        <div class="mag-tl"><div class="time">15h00</div><div class="track"><div class="dot"></div>
          <div class="act">🛍️ South Congress Avenue — vintage, Jo's e o mural</div>
          <p class="det">O coração boêmio de Austin. O <a href="#page/south_congress">SoCo</a> tem as melhores lojas vintage do Texas, food trucks na calçada e o epicentro instagramável da cidade: o mural "I Love You So Much" na parede do Jo's Coffee (1300 S Congress). Dude Sweet Chocolate, Güero's Tacos, Allen's Boots — cada estabelecimento conta a história de um Austin que resiste à gentrificação. Home Slice Pizza, ali do lado, é a melhor pizza estilo nova-iorquino do Texas.</p>
        </div></div>

        <div class="mag-tl"><div class="time">17h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Pausa no hotel — recuperação</div>
          <p class="det">Duas horas de recuperação depois da noite anterior (jogo no AT&amp;T + drive de 3h). A noite em Austin é longa — guarde energia. Banho, descanse e se arrume para a melhor noite noturna do roteiro.</p>
        </div></div>

        <div class="mag-tl"><div class="time">18h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🎵 Sixth Street — jantar e primeiros bares</div>
          <p class="det">Sixth Street é o coração pulsante da cena musical de Austin, a "Live Music Capital of the World". Dos honky-tonks country aos clubs de jazz, de blues a indie rock — cada porta aberta é um show ao vivo. A Old Sixth Street (entre Lavaca e I-35) concentra os bares mais icônicos. Jante em um dos restaurantes da Dirty Sixth antes de explorar a rua.</p>
        </div></div>

        <div class="mag-tl"><div class="time">20h30</div><div class="track"><div class="dot"></div>
          <div class="act">🦇 Congress Avenue Bridge — 1,5 milhão de morcegos</div>
          <p class="det">Uma das experiências mais surreais da viagem. A <a href="#page/congress_bridge">Congress Avenue Bridge</a> abriga a maior colônia urbana de morcegos do mundo: 1,5 milhão de mexican free-tailed bats emergem todas as noites ao entardecer entre março e novembro. No verão, a saída começa por volta de 20h30–21h, pouco após o pôr do sol. Chegue 30 minutos antes para boa posição — o céu escurece em segundos. Impressionante e gratuito.</p>
        </div></div>

        <div class="mag-tl"><div class="time">21h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🎷 Elephant Room + White Horse + Rainey Street</div>
          <p class="det">De volta à cena musical para a segunda parte da noite. O <strong>Elephant Room</strong> (315 Congress Ave) é o templo do jazz em Austin — porão histórico, ambiente intimista, músicos de alto nível toda sexta. O <strong>White Horse</strong> (500 Comal St) é honky-tonk moderno com dança de dois passos ao vivo. <strong>Rainey Street</strong> é o bairro de bares mais descolado — bungalows históricos convertidos em bares com jardins iluminados e clientela local.</p>
        </div></div>

        <div class="mag-tl"><div class="time">23h00</div><div class="track"><div class="dot"></div>
          <div class="act">🚗 Retorno ao hotel — boa noite</div>
          <p class="det">Uber de volta ao Aiden. O fim da primeira semana merece uma pausa — Austin ainda tem muito a oferecer amanhã, com mais energia e sem ressaca de viagem longa.</p>
        </div></div>

      </div>
    </section>

    <section class="mag-section tint">

      <h2 class="mag-title">1,5 milhão de morcegos</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Todo verão, a maior colônia urbana de morcegos do mundo habita as fendas de concreto sob a Congress Avenue Bridge. Os mexican free-tailed bats chegam em março e partem em novembro, mas o pico é exatamente junho. Ao entardecer, emergem num espiral que escurece o céu como uma nuvem viva, voando em direção ao lago para se alimentar. Os 1,5 milhão consomem 10 a 30 toneladas de insetos por noite.</p>
      <div class="mag-chips"><span class="mag-chip">1,5M morcegos</span><span class="mag-chip">Saída ~20h30 (jun)</span><span class="mag-chip">30t insetos/noite</span><span class="mag-chip soft">Temporada mar–nov</span></div>

        <div class="mag-tip"><h4><span class="ic">⏰</span>Horário exato</h4><p>A saída varia com o pôr do sol e a atividade da colônia. Consulte <strong>austinbats.org</strong> (Austin Bat Refuge) no dia para a previsão atualizada. O horário de 20h30 é estimativa para junho; o site publica a hora precisa diariamente.</p></div>

        <div class="mag-card"><span class="ic">🍕</span><h3>Home Slice Pizza</h3><p>A melhor pizza estilo Nova York do Texas — massa fina e fatias gigantes.</p></div>

    <section class="mag-section tint">

      <h2 class="mag-title">Refeições do dia</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Café da manhã</div><h3>Jo's Coffee</h3><div class="addr">📍 1300 S Congress Ave · South Congress</div><p>A cafeteria mais icônica de Austin: café de especialidade, ambiente ao ar livre e o famoso mural "I Love You So Much" pintado por Amy Cook. Croissants, avocado toast e o espresso que alimenta a cena criativa de SoCo.</p><span class="order">Dica: o mural fica na parede lateral — vá cedo (9h30) para menor movimento e boa luz para fotos.</span></div>
      <div class="mag-resto"><div class="tier">Almoço</div><h3>Clay Pit</h3><div class="addr">📍 1601 Guadalupe St · próximo ao Capitólio</div><p>Indian-American cuisine em casarão histórico de 1890 a passos do Capitólio. Tikka masala cremoso, lamb korma, naan de tandoor fresquíssimo. Premiado múltiplas vezes pela Austin Chronicle. Ambiente fresco e escuro — perfeito para o calor de meio-dia.</p></div>
      <div class="mag-resto"><div class="tier">Jantar</div><h3>Home Slice Pizza</h3><div class="addr">📍 1415 S Congress Ave · South Congress</div><p>A melhor pizza estilo Nova York do Texas. Massa fina, molho de tomate San Marzano, queijo fresco e ambiente de bairro genuíno. Slices gigantes no balcão para um pedágio rápido, ou mesa completa para a experiência inteira.</p><span class="order">Alternativa: cozinha tailandesa em Rainey Street, perfeita antes de explorar os bares à noite.</span></div>

      <p class="mag-lead">Austin é a capital mundial da live music. Mais de 250 venues com shows ao vivo toda semana — esta noite, quatro paradas essenciais.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎷</span><h3>The Elephant Room</h3><p>Jazz · Downtown. Porão histórico sob a Congress Avenue. O clube de jazz mais amado de Austin — musicianship de alto nível, ambiente intimista, coquetelaria clássica. Sexta à noite é quando brilha.</p></div>
        <div class="mag-card"><span class="ic">🤠</span><h3>White Horse</h3><p>Country · East Austin. Honky-tonk moderno com dança de dois passos ao vivo todas as noites. Sem pretensão, com alma — aulas gratuitas de dança no início da noite convidam os turistas a participar.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Rainey Street District</h3><p>Bares · Rainey Street. Bungalows históricos convertidos em bares com jardins externos iluminados. Mais autêntico que a Sixth Street turística — clientela mista de locais e viajantes.</p></div>
        <div class="mag-card"><span class="ic">🎸</span><h3>Dirty Sixth Street</h3><p>Ícone · Sixth Street. A rua mais famosa de Austin entre Lavaca e I-35 — shows em cada bar, sem cover, música ao vivo a cada 20 metros. Turístico mas inegavelmente energético numa sexta.</p></div>

        <div class="mag-tip"><h4><span class="ic">🦇</span>Os morcegos</h4><p>Chegue à Congress Avenue Bridge às 20h para garantir posição. A saída é imprevisível — pode ser 20h30 ou 21h15. Consulte <strong>austinbats.org</strong> no dia. A espera faz parte da experiência.</p></div>

          <p class="det">O <a href="#page/franklin_bbq">Franklin BBQ</a> abre às 11h, mas a fila começa às 8h ou antes. Quanto mais cedo na fila, melhor a chance de conseguir o brisket. Hidrate-se, coloque protetor solar e vista roupas confortáveis.</p>

          <div class="act">🪑 Entre na fila do Franklin BBQ</div>

          <div class="act">🍖 Franklin BBQ abre as portas — 900 E 11th St</div>
          <p class="det">O churrasco mais famoso dos EUA. Aaron Franklin ganhou o James Beard Award 2015 — primeiro pitmaster da história a recebê-lo. Pedidos obrigatórios: <strong>Brisket</strong> (mínimo 1/2 lb — a black bark de sal e pimenta é lendária), <strong>Pork Ribs</strong>, <strong>Jalapeño Sausage</strong>. Adicione os acompanhamentos: coleslaw, feijão, pão branco. Tudo vendido por peso. Costuma esgotar até as 13h.</p>

          <div class="act">🍽 Almoço no picnic de Franklin BBQ</div>
          <p class="det">Mesas de piquenique ao ar livre. Aaron Franklin ganhou o James Beard Award em 2015 — o Oscar da gastronomia americana. A Texas Monthly chama de "o melhor BBQ do Texas". A casca negra de sal e pimenta, o smoke ring rosado, a gordura que derrete — simplesmente inesquecível.</p>

        </div></div>

          <div class="act">🛒 Lojas da South Congress</div>

          <p class="det">O mural mais fotografado de Austin: "i love you so much" pintado na parede externa do Jo's Coffee (1300 S Congress Ave, esquina com W James St). Fila para foto é comum, mas vale. Tome um café também. Dica: ao lado há a barraquinha de tacos <em>Jo's Hot Coffee Good Food</em> — boa, barata e sempre lotada.</p>

    <section class="mag-section tint">

      <h2 class="mag-title">Por que Franklin BBQ é insubstituível</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout"><span class="lbl">James Beard Award 2015</span><p>Em 2015, Aaron Franklin tornou-se o <strong>primeiro pitmaster a ganhar o James Beard Award</strong> para "Best Chef: Southwest" — o prêmio mais importante da gastronomia americana. Não é só um BBQ: é uma instituição cultural do Texas.</p></div>
      <div class="mag-prose">
        <p>A Texas Monthly — a publicação mais respeitada sobre culinária texana — frequentemente elege o Franklin como o melhor BBQ do estado. <strong>Eles vendem tudo todos os dias, sem exceção.</strong> Fila média: 2 a 4 horas.</p>
        <p>O brisket tem uma <strong>black bark</strong> de sal e pimenta negra, smoke ring rosado perfeito e gordura intramuscular que derrete na boca. As ribs caem do osso. Não existe reserva, não existe delivery, não existe exceção — só aparecer e esperar.</p>

    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Hotel</span><span class="v">Ottawa Embassy Hotel &amp; Suites</span></div>
    <div class="f"><span class="k">Hub principal</span><span class="v">LeBreton Flats Park (abre 9h)</span></div>
    <div class="f"><span class="k">Transporte</span><span class="v">A pé (10 min) + ônibus/metrô</span></div>
    <div class="f"><span class="k">Snowbirds</span><span class="v">16h sobre Parliament Hill</span></div>
    <div class="f"><span class="k">Fogos</span><span class="v">22h · LeBreton Flats Park</span></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Feriado Nacional · 1º de Julho</div>
      <h2 class="mag-title">Bem-vindo ao Canada Day 🍁</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>O Canada Day de 2026 cai numa quarta-feira — e você está em Ottawa, a capital federal, no coração de tudo. A cerimônia no Parliament Hill reúne centenas de milhares de pessoas; é ao mesmo tempo um espetáculo político, musical e cívico sem igual. O Governador-Geral e o Primeiro-Ministro discursam, aviões CF-18 Hornet cruzam o céu, bandas ao vivo tocam o dia inteiro. E à noite, fogos de artifício iluminam o Rio Ottawa com o Parlamento como cenário.</p>
      </div>
      <div class="mag-chips">
        <span class="mag-chip">Vista vermelho &amp; branco</span>
        <span class="mag-chip">Ganhe uma bandeirinha grátis</span>
        <span class="mag-chip">Hub: LeBreton Flats Park</span>
        <span class="mag-chip soft">Snowbirds 16h — Parliament Hill</span>
        <span class="mag-chip soft">Fogos 22h — LeBreton Flats</span>
        <span class="mag-chip soft">Entrada gratuita — National Gallery</span>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Programação do dia</div>
      <h2 class="mag-title">Hora a hora</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Estratégia do dia</span>
        <p><strong>LeBreton Flats vs. Parliament Hill — a grande questão.</strong> LeBreton tem os shows principais e os fogos, mas Parliament Hill tem os Snowbirds e a cerimônia da guarda. Estratégia: manhã no Parliament Hill (Guarda 10h), tarde em LeBreton (cerimônia 12h), voltar ao Parliament Hill para os Snowbirds (16h), noite em LeBreton para o show e os fogos (22h).</p>
      </div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">08h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">☕ Café da manhã no hotel — e correr</div>
          <p class="det">Tome o café da manhã rapidamente — hoje não é dia de leisurar na mesa. Leve água, protetor solar e, se tiver, uma toalha para sentar na grama. Traje: vermelho e branco, de preferência. O LeBreton Flats Park abre às 9h e o Parliament Hill começa a encher logo cedo.</p>
        </div></div>

        <div class="mag-tl"><div class="time">09h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎪 LeBreton Flats Park abre — Hub Principal 2026</div>
          <p class="det"><strong>LeBreton Flats Park</strong> é o hub oficial do Canada Day 2026 — fica aberto das 9h até após os fogos. Já de manhã: atividades para família, pintura de murais, estandes interativos e artistas diurnos. Diferente de anos anteriores, o centro gravitacional do feriado migrou do Parliament Hill para o LeBreton. Mas a estratégia inteligente é circular entre os dois pontos ao longo do dia.</p>
        </div></div>

        <div class="mag-tl"><div class="time">09h30</div><div class="track"><div class="dot"></div>
          <div class="act">🎖️ Parliament Hill — RCAF Pipes &amp; Drums + Guarda Cerimonial</div>
          <p class="det">Posicione-se no <strong>gramado frontal do Parliament Hill</strong> para as apresentações da <strong>RCAF Pipes &amp; Drums</strong> (Royal Canadian Air Force) e da <strong>Guarda Cerimonial</strong>. Soldados em uniformes vermelhos e bearskin hats desfilam em formação impecável. Os voluntários distribuem <strong>bandeirinhas canadenses gratuitas</strong>. Este é um dos momentos mais fotogênicos da viagem: a Centennial Flame, a fachada do Centre Block, a multidão em vermelho e branco. Veja o <a href="#page/parliament_hill">guia completo do Parlamento</a>.</p>
        </div></div>

        <div class="mag-tl"><div class="time">12h00</div><div class="track"><div class="dot"></div>
          <div class="act">🍁 Cerimônia Nacional do Meio-Dia — LeBreton Flats Park</div>
          <p class="det">Às 12h em ponto começa a <strong>National Noon Ceremony</strong> no <strong>LeBreton Flats Park</strong> — e não no Parliament Hill, como em anos anteriores. Esta é a cerimônia oficial de 2026: discursos, O Canada, o ritual cívico central do feriado nacional. Dura até 13h30. Posicione-se com antecedência — o parque estará cheio. Vale cada minuto.</p>
        </div></div>

        <div class="mag-tl"><div class="time">13h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">🍟 Almoço — poutine no ByWard Market</div>
          <p class="det">Após a cerimônia, dirija-se ao <strong>ByWard Market</strong> para almoço. A opção clássica: <strong>Smoke's Poutinerie</strong> — a rede mais famosa do Canadá para poutine. Batata frita, queijo-coalho fresco (os <em>squeaky cheese curds</em>) e molho branco. Experimente também os lendários <strong>BeaverTails</strong> — massa frita em formato de cauda de castor, coberta com açúcar de canela. É o snack mais canadense que existe. Veja o <a href="#page/byward_market">guia completo do mercado</a>.</p>
        </div></div>

        <div class="mag-tl"><div class="time">13h30</div><div class="track"><div class="dot"></div>
          <div class="act">🧘 Suprema Corte do Canadá — "Om Canada!" (opção tarde)</div>
          <p class="det">A <strong>Suprema Corte do Canadá</strong> abre das 9h às 17h30 com programação especial: <strong>yoga ao ar livre "Om Canada!"</strong>, o mágico <strong>Eric Leclerc</strong>, comédia improvisada ao vivo e visitas guiadas ao histórico edifício Art Déco. Uma pausa mais tranquila e curiosa no meio do dia agitado. Fica a caminho entre LeBreton e Parliament Hill.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h00</div><div class="track"><div class="dot"></div>
          <div class="act">🧺 ByWard Market — Kids Zone &amp; mercado público</div>
          <p class="det">O <strong>ByWard Market</strong> tem programação própria no Canada Day: <strong>Kids Zone</strong>, atividades familiares e o mercado público funcionando em plena forma. É o mercado mais antigo do Canadá (1826). Menos lotado que LeBreton, com uma atmosfera mais relaxada — boa pedida para recarregar antes do grande momento da tarde.</p>
        </div></div>

        <div class="mag-tl"><div class="time">16h00</div><div class="track"><div class="dot"></div>
          <div class="act">✈ SNOWBIRDS — Show Aéreo sobre Parliament Hill</div>
          <p class="det">Este é o destaque absoluto da tarde: os <strong>CF Snowbirds</strong> — a esquadrilha acrobática oficial do Canadá, equivalente canadense dos Blue Angels americanos. Às <strong>16h00–16h30</strong>, nove aeronaves CT-114 Tutor cortam o céu de Ottawa em formação, com fumaça colorida, manobras rasantes e acrobacias sincronizadas. Posicione-se <strong>perto do Parliament Hill</strong> para ter o Parlamento e o céu como cenário. É um espetáculo que faz a multidão enlouquecer — não perca.</p>
        </div></div>

        <div class="mag-tl"><div class="time">17h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎨 National Gallery of Canada — entrada gratuita hoje</div>
          <p class="det">Aproveite o período entre os Snowbirds e a noite para visitar o <strong>National Gallery of Canada</strong>, projetado por <strong>Moshe Safdie</strong>. No Canada Day, a entrada é <strong>gratuita</strong>. A coleção inclui o maior acervo de arte canadense do mundo e a impressionante <em>Rideau Chapel</em> de vidro medieval. Uma hora aqui é tempo bem gasto antes do jantar.</p>
        </div></div>

        <div class="mag-tl"><div class="time">18h00</div><div class="track"><div class="dot eat"></div>
          <div class="act">🍽 Jantar — preparação para a noite</div>
          <p class="det">Jantar com calma antes do grande finale. Boa pedida: <strong>The Keg Steakhouse</strong> (170 Bank Street, clássico canadense de carnes) ou <strong>The Shore Club</strong> (frutos do mar premium). Se quiser algo mais rápido, o ByWard Market tem dezenas de opções. Calcule o horário para estar de volta ao LeBreton Flats por volta das 19h30.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🎸 ByWard Market — Zona de Concerto Anos 80 (19h–23h)</div>
          <p class="det">Na <strong>York Street</strong>, o ByWard Market se transforma na <strong>80s Retro Concert Zone</strong> das 19h às 23h. Músicas dos anos 80 ao vivo, multidão animada, atmosfera descontraída. Uma ótima alternativa ao LeBreton se você quiser um ambiente menos lotado antes dos fogos — ou uma parada divertida enquanto aguarda o show principal.</p>
        </div></div>

        <div class="mag-tl"><div class="time">20h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🎤 Show Nacional — "Celebrating our Canada!" — LeBreton Flats</div>
          <p class="det">Das <strong>20h às 22h</strong>, o <strong>LeBreton Flats Park</strong> recebe o grande show nacional da noite: <em>"Celebrating our Canada!"</em> — artistas canadenses ao vivo, música, dança e apresentações culturais. Simultaneamente, no <strong>Old Hull/Gatineau</strong> (do outro lado do Rio Ottawa), os artistas <strong>LOUD</strong> e <strong>Haviah Mighty</strong> se apresentam — uma opção interessante se quiser cruzar a fronteira Quebec-Ontario para ver os fogos de uma perspectiva diferente.</p>
        </div></div>

        <div class="mag-tl"><div class="time">22h00</div><div class="track"><div class="dot night"></div>
          <div class="act">🎆 Tim Hortons Canada Day Fireworks — LeBreton Flats Park</div>
          <p class="det">O espetáculo final: os <strong>Tim Hortons Canada Day Fireworks</strong>, lançados perto do <strong>LeBreton Flats Park</strong>. Por cerca de 30 minutos, o céu de Ottawa explode em vermelho, branco e dourado. A dica de perspectiva alternativa: do lado de <strong>Old Hull/Gatineau</strong>, Quebec — cruzar a Alexandra Bridge dá uma visão do Parlamento com o rio à frente, fotogênica de um jeito diferente. Este é, sem exagero, um dos momentos mais memoráveis de toda a viagem.</p>
        </div></div>

        <div class="mag-tl"><div class="time">22h45</div><div class="track"><div class="dot"></div>
          <div class="act">🌃 Retorno ao hotel</div>
          <p class="det">Após os fogos, a saída é lenta — centenas de milhares de pessoas se movendo ao mesmo tempo. Prefira a caminhada ao ByWard Market (10 min) a tentar pegar táxi ou Uber, que ficam com preços e esperas absurdas no Canada Day. A caminhada noturna pela cidade iluminada em vermelho e branco tem seu próprio charme. Amanhã: partida para Montréal.</p>
        </div></div>

      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações em destaque</div>
      <h2 class="mag-title">Ottawa hoje</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <a class="mag-card" href="#page/parliament_hill"><span class="ic">🏛️</span><h3>Parliament Hill</h3><p>O centro nevrálgico do Canada Day. O Centre Block, a Peace Tower com seus sinos, a Centennial Flame — tudo isso compõe o cenário do maior feriado canadense. O gramado frontal vira o epicentro do país por um dia.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/byward_market"><span class="ic">🧺</span><h3>ByWard Market</h3><p>O mercado público mais antigo do Canadá (1826). No Canada Day, barracas, música de rua, BeaverTails e poutine formam uma festa gastronômica popular. O coração informal de Ottawa, a minutos do Parlamento.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🎨</span><h3>National Gallery of Canada</h3><p>Arquitetura de Moshe Safdie, o maior acervo de arte canadense do mundo e a impressionante Rideau Chapel de vidro medieval. Entrada gratuita no Canada Day — uma oportunidade rara.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>Rideau Canal</h3><p>Patrimônio Mundial da UNESCO desde 2007. Uma das maiores obras de engenharia do século XIX, hoje um corredor verde que atravessa Ottawa. No inverno, a maior pista de patinação do mundo (7,8 km).</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Alimentação</div>
      <h2 class="mag-title">Refeições do dia</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Café da manhã</div><h3>Café no Hotel</h3><div class="addr">📍 Ottawa Embassy Hotel &amp; Suites</div><p>Rápido e funcional — hoje o tempo é precioso. O hotel oferece o básico para começar bem: café, fruta, torradas. O objetivo é estar no Parliament Hill às 09h30 e garantir lugar no gramado.</p></div>
      <div class="mag-resto"><div class="tier">Almoço · Poutine</div><h3>Smoke's Poutinerie — Poutine Clássica</h3><div class="addr">📍 ByWard Market — várias unidades na área</div><p>A rede de poutine mais famosa do Canadá. No Canada Day, comer poutine no ByWard Market é quase um ritual. Batata frita crocante, queijo-coalho fresco (os curds fazem um barulho característico ao morder — sinal de frescor) e molho branco rico. Barata, farta, autenticamente canadense.</p><span class="order">Pedir: a clássica ou a "Quebecoise" com mais ingredientes</span></div>
      <div class="mag-resto"><div class="tier">Jantar · Carnes · desde 1971</div><h3>The Keg Steakhouse + Bar</h3><div class="addr">📍 170 Bank Street — 15 min a pé do Parliament Hill</div><p>Um clássico canadense de carnes fundado em 1971 em Vancouver. Ambiente rústico-elegante, filés bem feitos, batatas rústicas e o famoso bolo de chocolate Keg. Boa pedida antes dos fogos — substancioso e confortável. Reserve mesa com antecedência: o Canada Day enche tudo.</p></div>
      <div class="mag-resto"><div class="tier">Alternativa jantar · Frutos do mar</div><h3>The Shore Club</h3><div class="addr">📍 Ottawa, ON — área central</div><p>Frutos do mar de qualidade premium em ambiente mais sofisticado. Ostras, lagosta, peixe fresco. Uma boa pedida se quiser celebrar o Canada Day com mais estilo. Reserve com antecedência — principalmente hoje.</p></div>
    </section>

    <div class="mag-eyebrow">Dia 14 de 16 · Qui, 02 Jul · Montréal ⛪</div>
    <h1>Bonjour, <em>Montréal</em></h1>
    <p class="mag-tagline">Da capital federal para a metrópole do Quebec — a cidade que mistura Paris, Nova York e algo que não existe em nenhum outro lugar.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>~2h</b><span>Ottawa → Montréal</span></div>

  <div class="mag-facts">
    <div class="f"><span class="k">Checkout</span><span class="v">Ottawa Embassy Hotel &amp; Suites</span></div>
    <div class="f"><span class="k">Hotel</span><span class="v">Wyndham Garden Centre-Ville</span></div>

    <div class="f"><span class="k">Reserva urgente</span><span class="v">AURA + Joe Beef</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Programação do dia</div>
      <h2 class="mag-title">Hora a hora</h2>
      <div class="mag-rule"></div>
      <div class="mag-timeline">

        <div class="mag-tl"><div class="time">08h30</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Checkout — Ottawa Embassy Hotel &amp; Suites</div>
          <p class="det">Faça o checkout tranquilamente. A viagem até Montréal leva 2 horas, e não há pressa — o check-in no Wyndham Garden é a partir do meio-dia. Aproveite para tomar café no hotel ou comprar algo no ByWard Market antes de pegar estrada.</p>
        </div></div>

        <div class="mag-tl"><div class="time">09h30</div><div class="track"><div class="dot"></div>
          <div class="act">🚆 Saída para Montréal — VIA Rail ou carro</div>
          <p class="det"><strong>Opção trem (recomendada):</strong> a <strong>VIA Rail</strong> opera Ottawa → Montréal com trens modernos. A estação é a Ottawa Train Station (200 Tremblay Rd). Duração: 2h a 2h15. O trem chega na <em>Gare Centrale</em>, no centro de Montréal. Mais relaxante que dirigir, boa paisagem. <strong>Opção carro:</strong> Highway 417 Leste, entrando na Highway 40 rumo a Montréal. 200 km, 2h em tráfego normal — cruzando a fronteira Ontário–Quebec.</p>
        </div></div>

        <div class="mag-tl"><div class="time">11h30</div><div class="track"><div class="dot"></div>
          <div class="act">🍁 Chegada em Montréal</div>
          <p class="det">Bem-vindo ao Quebec — onde os sinais são em francês, o sotaque é único no mundo e a energia é diferente de qualquer cidade canadense. Montréal é a segunda maior cidade francófona do mundo após Paris. Do trem, você desce diretamente na <strong>Gare Centrale</strong>, ligada ao centro pelo REM.</p>
        </div></div>

        <div class="mag-tl"><div class="time">12h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏨 Check-in Wyndham Garden Montréal Centre-Ville</div>
          <p class="det">O <strong>Wyndham Garden Montréal Centre-Ville</strong> fica em localização excelente — a pé de quase tudo no centro. Se o quarto não estiver pronto, deixe a bagagem na concierge e saia para almoçar. A Rue Sainte-Catherine, principal avenida comercial do centro, fica a minutos do hotel.</p>
        </div></div>

        <div class="mag-tl"><div class="time">11h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏟️ Complexo Olímpico de Montréal — Torre Inclinada</div>
          <p class="det">Primeira parada: o <strong>Stade Olympique</strong> (4141 Ave Pierre-De Coubertin), construído para as <strong>Olimpíadas de 1976</strong> e projetado por <strong>Roger Taillibert</strong>. O destaque é a <strong>Tour de Montréal</strong> — a torre inclinada mais alta do mundo, 175 metros. Suba de funicular até o mirante: a vista abrange toda a ilha, o Rio Saint-Laurent e as montanhas no horizonte. Ingresso ~$25 CAD. No complexo ficam também o Biodôme, o Insectarium e o Planétarium. Reserve cerca de 1 hora. Fica no extremo leste da ilha — visite antes de seguir para o centro.</p>
        </div></div>

        <div class="mag-tl"><div class="time">12h30</div><div class="track"><div class="dot eat"></div>
          <div class="act">🍟 La Banquise — a melhor poutine de Montréal</div>
          <p class="det"><strong>La Banquise</strong> (374 Rue Rachel Est) é peregrinação. Aberta 24h, 7 dias, serve mais de <strong>30 variações de poutine</strong> — da clássica à T-Rex (carne moída, salsicha, pimenta e muito mais). As filas são parte da experiência. Você já comeu poutine na viagem — mas a de Montréal tem identidade própria. Este é o capítulo definitivo.</p>
        </div></div>

        <div class="mag-tl"><div class="time">14h00</div><div class="track"><div class="dot"></div>
          <div class="act">⛪ Basílica Notre-Dame de Montréal</div>
          <p class="det">Prepare-se para o interior mais impressionante da viagem inteira. A <strong>Basílica Notre-Dame</strong> foi construída entre 1824 e 1829 — uma explosão de azul profundo, ouro e madeira entalhada. O altar principal é rodeado por estátuas douradas. O teto em azul noturno pintado de estrelas douradas cria um céu artificial que tira o fôlego. Capacidade para 3.000 pessoas. Entrada ~$7 CAD. Veja o <a href="#page/notre_dame_montreal">guia completo da basílica</a>.</p>
        </div></div>

        <div class="mag-tl"><div class="time">16h00</div><div class="track"><div class="dot"></div>
          <div class="act">🌙 Show AURA na Basílica Notre-Dame</div>
          <p class="det">O show <strong>AURA</strong> transforma a basílica num teatro de imersão total. Projeções mapeadas em todas as superfícies — teto, paredes, altar, vitral — sincronizadas com música original que ressoa pela nave. 35 minutos de uma experiência que redefine "audiovisual". Compre ingresso online com antecedência (~$30 CAD). Um dos espetáculos mais comentados do Canadá.</p>
          <div class="mag-callout"><span class="lbl">Nota importante</span><p>O AURA esgota regularmente. Sessões às 18h30 e 21h, com sessões extras em alta temporada. ~$30–35 CAD/pessoa, 35 minutos. Reserve no site oficial (basiliquenotredame.ca) ou por telefone. Versões em inglês e francês disponíveis. <strong>Reserve antes de viajar.</strong></p></div>
        </div></div>

        <div class="mag-tl"><div class="time">17h00</div><div class="track"><div class="dot"></div>
          <div class="act">🏛️ Vieux-Montréal — Cidade Velha</div>
          <p class="det">A <strong>Vieux-Montréal</strong> é a parte mais antiga da cidade — ruas de paralelepípedo, fachadas dos séculos XVII ao XIX, galerias de arte e bons restaurantes. A <strong>Rue Saint-Paul</strong> é a rua mais antiga de Montréal (1672) e uma das mais fotogênicas da América do Norte. A <strong>Place Jacques-Cartier</strong> é a praça central, animada de vendedores e artistas de rua. Caminhe sem pressa — veja o <a href="#page/vieux_montreal">guia completo do Vieux-Montréal</a>.</p>
        </div></div>

        <div class="mag-tl"><div class="time">18h30</div><div class="track"><div class="dot"></div>
          <div class="act">🌊 Pôr do sol no Vieux-Port — Rio Saint-Laurent</div>
          <p class="det">O <strong>Vieux-Port</strong> de Montréal é um dos melhores lugares para ver o pôr do sol no Canadá. O sol desce pelo Rio Saint-Laurent, iluminando a superfície em âmbar e ouro. As ilhas ao fundo — Île Sainte-Hélène, onde ficava a Expo 67 — completam a moldura. Um momento de quietude antes do jantar.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h00</div><div class="track"><div class="dot"></div>
          <div class="act">🎡 La Grande Roue de Montréal — a maior roda-gigante do Canadá</div>
          <p class="det">Logo ali no <strong>Vieux-Port</strong>: a <strong>La Grande Roue de Montréal</strong>, a maior roda-gigante do Canadá com <strong>60 metros</strong>. As cabines são fechadas e climatizadas, com vistas de 360° do Rio Saint-Laurent, do skyline e da Vieux-Montréal abaixo. Uma volta dura ~20 minutos. Ingresso ~$20–25 CAD. Especialmente bonita ao anoitecer, quando as luzes da cidade acendem. Perfeita como último programa depois de percorrer o Vieux-Port a pé.</p>
        </div></div>

        <div class="mag-tl"><div class="time">19h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🍷 Jantar — Joe Beef ou Au Pied de Cochon</div>
          <p class="det"><strong>Joe Beef</strong> (441 Rue Notre-Dame Ouest) é, segundo muitos críticos, o melhor restaurante do Canadá. O chef David McMillan criou um lugar que parece uma cabana de caçador chique — menu que muda diariamente, foco em ingredientes do Quebec, carnes excepcionais, lista de vinhos extraordinária. Reserva obrigatória com semanas de antecedência. <em>Alternativa igualmente lendária:</em> <strong>Au Pied de Cochon</strong> (536 Rue Duluth Est) do chef Martin Picard — foie gras em tudo, porco em todas as formas, calorias sem remorso.</p>
        </div></div>

        <div class="mag-tl"><div class="time">21h30</div><div class="track"><div class="dot night"></div>
          <div class="act">🌃 Plateau-Mont-Royal — noite boêmia</div>
          <p class="det">O <strong>Plateau</strong> é o bairro mais vibrante de Montréal à noite. O <strong>Boulevard Saint-Laurent</strong> (La Main) concentra bares, restaurantes e casas noturnas por quilômetros. A <strong>Rue Saint-Denis</strong>, paralela, é mais francesa — cafés, livrarias, bistrôs. Em julho, pode cruzar com artistas do <strong>Festival de Jazz de Montréal</strong>, um dos maiores do mundo.</p>
        </div></div>

        <div class="mag-tl"><div class="time">23h00</div><div class="track"><div class="dot"></div>
          <div class="act">🚶 Retorno ao hotel</div>
          <p class="det">Amanhã é o último dia inteiro em Montréal — e inclui a subida ao Mont-Royal pela manhã. Durma bem.</p>
        </div></div>

      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações em destaque</div>
      <h2 class="mag-title">Montréal pela primeira vez</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <div class="mag-card"><span class="ic">🏟️</span><h3>Complexo Olímpico — Torre de Montréal</h3><p>Construído para as Olimpíadas de 1976 (Roger Taillibert). A Torre é a torre inclinada mais alta do mundo — 175 m. O funicular sobe ao mirante com vista panorâmica de toda a ilha. Ingresso ~$25 CAD.</p></div>
        <a class="mag-card" href="#page/notre_dame_montreal"><span class="ic">⛪</span><h3>Basílica Notre-Dame de Montréal</h3><p>Interior em azul profundo e ouro que rivaliza com as grandes catedrais europeias. O show AURA transforma o espaço numa experiência de imersão total. Uma das construções mais fotografadas do Canadá.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/vieux_montreal"><span class="ic">🏛️</span><h3>Vieux-Montréal</h3><p>Ruas de paralelepípedo, arquitetura dos séculos XVII ao XIX, Place Jacques-Cartier e Rue Saint-Paul. A cidade velha mais bem preservada da América do Norte, viva dia e noite.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🎡</span><h3>La Grande Roue de Montréal</h3><p>A maior roda-gigante do Canadá — 60 metros, cabines climatizadas, vista do Saint-Laurent e do skyline. No Vieux-Port, funciona o ano todo. Espetacular ao anoitecer. Ingresso ~$20–25 CAD.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>Vieux-Port</h3><p>O porto histórico à beira do Rio Saint-Laurent. Pôr do sol extraordinário, ciclovia à beira-rio, La Grande Roue e o coração da cidade velha. O lugar onde Montréal encontra o rio que a fez existir.</p></div>
        <div class="mag-card"><span class="ic">🌙</span><h3>Plateau-Mont-Royal</h3><p>O bairro mais cool do Canadá. Saint-Laurent, Saint-Denis, cafés franceses, arte de rua, vida noturna e a energia boêmia que tornou Montréal famosa internacionalmente.</p></div>
      </div>
    </section>

    <section class="mag-section">

      <h2 class="mag-title">Refeições do dia</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Almoço</div><h3>La Banquise</h3><div class="addr">📍 374 Rue Rachel Est, Montréal, QC</div><p>Aberta 24h/7 dias, é o templo da poutine montréalaise. Mais de 30 variações, do clássico ao exuberante. Os cheese curds devem fazer aquele barulho característico ao morder. Fila pode ser longa: chegue na abertura ou fora do horário de pico.</p></div>
      <div class="mag-resto"><div class="tier">Jantar · Reserva obrigatória</div><h3>Joe Beef</h3><div class="addr">📍 441 Rue Notre-Dame Ouest, Montréal, QC</div><p>O restaurante mais comentado do Canadá. Menu que muda todo dia, foco total em ingredientes do Quebec, ambiente de cabana de caçador sofisticada. David McMillan cozinha como se cada refeição fosse a última. ~$80–120 CAD/pessoa. Reserve com semanas — ou meses — de antecedência.</p></div>
