  <style>
/* ════════════════════════════════════════════════════════════════
   Global shell chrome (bottom-nav, picker, loading bar) + base tokens.
   All page styling now lives in the scoped #mag-design block below.
   ════════════════════════════════════════════════════════════════ */
:root {
  --ink: #1a1a1a;
  --paper: #f7f4ef;
  --paper-dark: #ede9e2;
  --accent: #c8522a;
  --accent-light: #e8845e;
  --green: #2d6a4f;
  --blue: #1d3557;
  --gold: #d4a017;
  --muted: #6b6460;
  --rule: #d0cac2;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); }
img { max-width: 100%; }

/* Mobile bottom nav */
#spa-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1a1a1a;
  height: 56px;
  flex-direction: row;
  align-items: stretch;
  z-index: 9999;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bn-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  gap: 2px;
  color: rgba(255,255,255,0.5);
  font-family: 'Spline Sans Mono', ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: none;
  background: none;
  padding: 4px 0;
  transition: color .15s;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.bn-item:active { color: #e8623a; }
.bn-item .bn-icon { font-size: 19px; line-height: 1; }

/* Picker overlay */
#spa-picker {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(0,0,0,0.55);
  align-items: flex-end;
}
#spa-picker.open { display: flex; }
#spa-picker-panel {
  background: #1a1a1a;
  width: 100%;
  max-height: 72vh;
  overflow-y: auto;
  border-radius: 16px 16px 0 0;
  padding: 8px 0 80px;
}
.picker-title {
  font-family: 'Spline Sans Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  padding: 16px 20px 12px;
}
.picker-item {
  display: block;
  padding: 14px 20px;
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  text-decoration: none;
  border-top: 1px solid rgba(255,255,255,0.06);
  -webkit-tap-highlight-color: transparent;
}
.picker-item:active { background: rgba(255,255,255,0.06); }
.picker-item .pi-sub {
  font-family: 'Spline Sans Mono', ui-monospace, monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  display: block;
  margin-top: 2px;
}

/* Loading bar */
#spa-loading {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0;
  background: linear-gradient(90deg,#c8522a,#e8623a);
  z-index: 9999;
  transition: width .3s ease;
  pointer-events: none;
}
#spa-loading.show { width: 100%; }

/* Show the bottom nav on phones and reserve space for it */
@media (max-width: 768px) {
  #spa-bottom-nav { display: flex; }
  body { padding-bottom: 56px; }
}
  </style>

  <!-- ════════════════════════════════════════════════════════════════
       MAG · Editorial redesign design system (mobile-first)
       Scoped under .mag so legacy templates remain untouched during rollout.
       ════════════════════════════════════════════════════════════════ -->
  <style id="mag-design">
  .mag {
    --paper:   #f6f1e7;
    --paper-2: #efe7d8;
    --card:    #fffdf8;
    --ink:     #20201c;
    --ink-soft:#4a4842;
    --muted:   #837c70;
    --rule:    #ddd3c2;
    --accent:  #c8522a;   /* per-city override below */
    --accent-2:#1f6f5c;
    --accent-ink:#8f3214;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --serif:   'Newsreader', Georgia, 'Times New Roman', serif;
    --mono:    'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  /* ── per-city signature palettes ── */
  .mag[data-theme="tampa"]      {--accent:#0e8a8c;--accent-2:#e8902b;--accent-ink:#0b6062;}
  .mag[data-theme="miami"]      {--accent:#e51e7c;--accent-2:#11b6c8;--accent-ink:#a8125a;}
  .mag[data-theme="fort_worth"] {--accent:#b4441f;--accent-2:#d98a3d;--accent-ink:#7d2d12;}
  .mag[data-theme="dallas"]     {--accent:#2a4d9c;--accent-2:#c0392b;--accent-ink:#1c3568;}
  .mag[data-theme="austin"]     {--accent:#7038a0;--accent-2:#e07b39;--accent-ink:#4d246e;}
  .mag[data-theme="san_antonio"]{--accent:#c8522a;--accent-2:#2d8a6b;--accent-ink:#8f3214;}
  .mag[data-theme="houston"]    {--accent:#2b4a7a;--accent-2:#d44a2a;--accent-ink:#1c3556;}
  .mag[data-theme="ottawa"]     {--accent:#c1121f;--accent-2:#1f6f5c;--accent-ink:#8a0c16;}
  .mag[data-theme="montreal"]   {--accent:#2a4d9c;--accent-2:#d4a017;--accent-ink:#1c3568;}

  .mag * { box-sizing: border-box; }
  .mag img { max-width: 100%; }
  .mag ::selection { background: var(--accent); color:#fff; }

  /* ── breadcrumbs ── */
  .mag-crumbs {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
    padding: 11px 18px;
    background: rgba(28,26,22,0.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .mag-crumbs a { color: rgba(255,255,255,.62); text-decoration: none; transition: color .15s; }
  .mag-crumbs a:active, .mag-crumbs a:hover { color: var(--accent-2); }
  .mag-crumbs .here { color: #fff; }
  .mag-crumbs .sep { color: rgba(255,255,255,.28); }
  .mag-crumbs .home { color: var(--accent-2); }

  /* ── hero ── */
  .mag-hero {
    position: relative; isolation: isolate;
    min-height: 78vh; min-height: 78svh;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 28px 20px 30px;
    color: #fff; overflow: hidden;
  }
  .mag-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
  .mag-hero::after {
    content:""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(20,18,15,.15) 0%, rgba(20,18,15,0) 32%, rgba(20,18,15,.55) 72%, rgba(20,18,15,.92) 100%),
      linear-gradient(110deg, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 55%);
  }
  .mag-eyebrow {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 9px;
  }
  .mag-eyebrow::before { content:""; width: 26px; height: 2px; background: var(--accent-2); display:inline-block; }
  .mag-hero .mag-eyebrow { color: #fff; margin-bottom: 14px; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
  .mag-hero h1 {
    font-family: var(--display); font-weight: 900; line-height: .9;
    font-size: clamp(3.4rem, 19vw, 6.5rem);
    letter-spacing: -.02em; margin: 0;
    font-optical-sizing: auto;
    text-shadow: 0 2px 24px rgba(0,0,0,.35);
  }
  .mag-hero h1 em { font-style: italic; color: var(--accent-2); font-weight: 500; }
  .mag-hero .mag-tagline {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(1.05rem, 4.6vw, 1.35rem); line-height: 1.45;
    max-width: 30ch; margin: 16px 0 0; color: rgba(255,255,255,.94);
    text-shadow: 0 1px 10px rgba(0,0,0,.4);
  }
  .mag-hero-meta {
    display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px;
  }
  .mag-hero-meta .m {
    display: flex; flex-direction: column; line-height: 1.05;
  }
  .mag-hero-meta .m b {
    font-family: var(--display); font-weight: 700; font-size: 1.55rem;
  }
  .mag-hero-meta .m span {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255,255,255,.75); margin-top: 3px;
  }

  /* ── facts strip ── */
  .mag-facts {
    background: var(--ink); color: var(--paper);
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .mag-facts .f {
    padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,.09);
    border-right: 1px solid rgba(255,255,255,.09);
  }
  .mag-facts .f .k {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent-2); display:block; margin-bottom: 5px;
  }
  .mag-facts .f .v { font-family: var(--serif); font-size: 14.5px; line-height: 1.3; color:#fff; }

  /* ── sections / typography ── */
  .mag-body { padding: 0; }
  .mag-section { padding: 46px 20px; max-width: 720px; margin: 0 auto; }
  .mag-section + .mag-section { padding-top: 8px; }
  .mag-section.tint { background: var(--paper-2); max-width: none; }
  .mag-section.tint > * { max-width: 720px; margin-left:auto; margin-right:auto; }
  .mag-section > .mag-eyebrow { color: var(--accent-ink); margin-bottom: 12px; }
  .mag-title {
    font-family: var(--display); font-weight: 900; line-height: 1.02;
    font-size: clamp(2rem, 8.5vw, 3rem); letter-spacing: -.015em;
    color: var(--accent); margin: 0 0 6px;
  }
  .mag-title .sub { display:block; color: var(--ink); font-weight: 600; font-size: .62em; font-style: italic; letter-spacing: -.01em; margin-top: 4px; }
  .mag-rule { width: 60px; height: 4px; background: var(--accent-2); border-radius: 2px; margin: 16px 0 22px; }
  .mag-lead { font-size: 1.16rem; line-height: 1.55; color: var(--ink-soft); font-style: italic; margin-bottom: 8px; }

  .mag-prose p { font-size: 1.075rem; line-height: 1.72; margin: 0 0 1.05em; color: var(--ink); }
  .mag-prose p:first-of-type::first-letter {
    font-family: var(--display); font-weight: 900; float: left;
    font-size: 3.6em; line-height: .72; padding: 6px 10px 0 0; color: var(--accent);
  }
  .mag-prose strong { font-weight: 600; }
  .mag-prose em { color: var(--accent-ink); }

  /* ── inline figures ── */
  .mag-figure { margin: 26px 0; }
  .mag-figure img { width: 100%; height: auto; display: block; border-radius: 3px; }
  .mag-figure.wide { margin-left: -20px; margin-right: -20px; border-radius: 0; }
  .mag-figure.wide img { border-radius: 0; }
  .mag-figure figcaption {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-top: 8px; padding: 0 2px;
  }
  .mag-figure.wide figcaption { padding: 8px 20px 0; }

  /* ── generic feature cards ── */
  .mag-cards { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 6px; }
  .mag-card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
    padding: 20px; position: relative; transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  a.mag-card { text-decoration: none; color: inherit; display: block; }
  a.mag-card:active { transform: scale(.99); }
  .mag-card .ic { font-size: 24px; display: block; margin-bottom: 10px; }
  .mag-card h3 { font-family: var(--display); font-weight: 700; font-size: 1.22rem; line-height: 1.12; color: var(--ink); margin: 0 0 7px; }
  .mag-card p { font-size: .98rem; line-height: 1.55; color: var(--ink-soft); margin: 0; }
  .mag-card .go {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); display: inline-block; margin-top: 12px; font-weight: 500;
  }
  a.mag-card::after {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background: var(--accent); border-radius: 6px 0 0 6px; opacity: 0; transition: opacity .18s;
  }
  a.mag-card:hover::after { opacity: 1; }

  /* ── numbered list (curiosidades) ── */
  .mag-numlist { list-style: none; padding: 0; margin: 8px 0 0; counter-reset: n; }
  .mag-numlist li { display: flex; gap: 16px; padding: 18px 0; border-top: 1px solid var(--rule); }
  .mag-numlist li::before {
    counter-increment: n; content: counter(n,decimal-leading-zero);
    font-family: var(--display); font-weight: 900; font-size: 1.5rem; color: var(--accent-2);
    line-height: 1; flex: none;
  }
  .mag-numlist b { display: block; font-family: var(--display); font-size: 1.08rem; margin-bottom: 4px; color: var(--ink); }
  .mag-numlist span { font-size: .98rem; line-height: 1.55; color: var(--ink-soft); }

  /* ── tips grid ── */
  .mag-tips { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .mag-tip { background: var(--card); border-radius: 6px; padding: 16px 18px; border-left: 3px solid var(--accent-2); }
  .mag-tip h4 { font-family: var(--display); font-weight: 600; font-size: 1.02rem; margin: 0 0 5px; color: var(--ink); }
  .mag-tip p { font-size: .94rem; line-height: 1.5; color: var(--ink-soft); margin: 0; }
  .mag-tip .ic { margin-right: 6px; }

  /* ── callout / pro-tip ── */
  .mag-callout {
    background: color-mix(in srgb, var(--accent-2) 12%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent-2) 35%, transparent);
    border-radius: 6px; padding: 16px 18px; margin: 18px 0;
  }
  .mag-callout .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); display:block; margin-bottom: 6px; font-weight: 600; }
  .mag-callout p { font-size: .98rem; line-height: 1.55; margin: 0; color: var(--ink); }

  /* ── chips ── */
  .mag-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .mag-chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
    background: var(--ink); color: #fff; padding: 7px 12px; border-radius: 100px;
  }
  .mag-chip.soft { background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--rule); }

  /* ── dishes / restaurants ── */
  .mag-dishes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mag-dish { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; }
  .mag-dish .n { font-family: var(--display); font-weight: 600; font-size: 1.02rem; margin-bottom: 4px; }
  .mag-dish .d { font-size: .9rem; line-height: 1.45; color: var(--ink-soft); }
  .mag-resto { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; margin-bottom: 12px; }
  .mag-resto .tier { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
  .mag-resto h3 { font-family: var(--display); font-weight: 700; font-size: 1.2rem; margin: 4px 0 8px; }
  .mag-resto .addr { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .mag-resto p { font-size: .96rem; line-height: 1.55; color: var(--ink-soft); margin: 0 0 10px; }
  .mag-resto .order { font-size: .9rem; font-style: italic; color: var(--accent-ink); display: block; padding-top: 8px; border-top: 1px dashed var(--rule); }

  /* ── day timeline ── */
  .mag-timeline { margin-top: 8px; }
  .mag-tl { display: grid; grid-template-columns: 56px 1fr; gap: 0; position: relative; }
  .mag-tl .time { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent-ink); padding-top: 2px; text-align: right; padding-right: 14px; letter-spacing: -.02em; }
  .mag-tl .track { position: relative; padding: 0 0 26px 22px; border-left: 2px solid var(--rule); }
  .mag-tl:last-child .track { border-left-color: transparent; }
  .mag-tl .dot { position: absolute; left: -8px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); }
  .mag-tl .dot.eat  { background: var(--accent-2); }
  .mag-tl .dot.night{ background: #3a3566; }
  .mag-tl .act { font-family: var(--display); font-weight: 600; font-size: 1.12rem; line-height: 1.15; margin-bottom: 6px; color: var(--ink); }
  .mag-tl .det { font-size: 1rem; line-height: 1.62; color: var(--ink-soft); margin: 0; }
  .mag-tl .det a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  /* ── day nav (prev/next) ── */
  .mag-daynav { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); margin-top: 8px; }
  .mag-daynav a { background: var(--card); padding: 18px 16px; text-decoration: none; display: flex; flex-direction: column; gap: 3px; }
  .mag-daynav a.next { text-align: right; align-items: flex-end; }
  .mag-daynav .dir { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mag-daynav .lbl { font-family: var(--display); font-weight: 600; font-size: 1.02rem; color: var(--accent); }

  /* ══ CROSS-LINK RAILS — the interlinking UI ══ */
  .mag-related { background: var(--ink); color: var(--paper); padding: 34px 0 30px; }
  .mag-related .grp { padding: 0 20px; margin-bottom: 24px; }
  .mag-related .grp:last-child { margin-bottom: 0; }
  .mag-related .grp > .mag-eyebrow { color: var(--accent-2); margin-bottom: 14px; }
  .mag-rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 8px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .mag-rail::-webkit-scrollbar { height: 0; }
  .mag-relcard {
    flex: 0 0 76%; max-width: 280px; scroll-snap-align: start; text-decoration: none;
    background: #2a2823; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .mag-relcard.day { flex-basis: 60%; }
  .mag-relcard .thumb { position: relative; aspect-ratio: 16/10; background: #1a1916; overflow: hidden; }
  .mag-relcard .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mag-relcard .thumb::after { content:""; position:absolute; inset:0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.5)); }
  .mag-relcard .meta { padding: 12px 14px; }
  .mag-relcard .kind { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); }
  .mag-relcard .nm { font-family: var(--display); font-weight: 700; font-size: 1.12rem; color: #fff; line-height: 1.1; margin-top: 4px; }
  .mag-relcard .sub { font-family: var(--serif); font-size: .86rem; color: rgba(255,255,255,.6); margin-top: 3px; }
  .mag-relcard:active { border-color: var(--accent-2); }
  /* compact day pills row */
  .mag-relchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .mag-relchip { text-decoration: none; background: #2a2823; border: 1px solid rgba(255,255,255,.1); border-radius: 100px; padding: 9px 15px; color: #fff; font-family: var(--mono); font-size: 12px; display: inline-flex; gap: 7px; align-items: center; }
  .mag-relchip .e { font-size: 14px; }
  .mag-relchip:active { border-color: var(--accent-2); color: var(--accent-2); }

  /* ── footer ── */
  .mag-footer { background: var(--ink); color: rgba(255,255,255,.55); text-align: center; padding: 30px 20px 110px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; }
  .mag-footer a { color: var(--accent-2); text-decoration: none; }

        <p>Você estará na região de Dallas/Fort Worth durante dois jogos da Seleção: <strong>Brasil × Haiti</strong> (Sex 19/jun, 21h ET) e <strong>Escócia × Brasil</strong> (Qua 24/jun, 18h ET). Abaixo, os melhores sports bars da região com craft beer, telas grandes e ambiente de Copa.</p>

        <h3>Peticolas Brewing Co.</h3>
        <div class="addr">📍 2601 Oak Lawn Ave, Dallas</div>
        <p>A cervejaria mais comprometida com futebol de Dallas. O logo lembra um escudo de clube, o dono torce para o Everton, e o taproom é sede do Dallas Beer Guardians (torcida do FC Dallas). Criaram cervejas temáticas para Copas anteriores ("Thrilla in Brazilla"). Múltiplos andares, sinuca, ping pong.</p>

        <p>Mais de 50 TVs e um plano de 104 watch parties temáticas — uma para cada seleção. Buffet all-you-can-eat disponível em dias de jogo, localização próxima da TCU.</p>
      </div>
    </section>

    <!-- BUC-EE'S -->
    <section class="mag-section" id="bucees">
      <div class="mag-eyebrow">Road Trip Guide</div>
      <h2 class="mag-title">🦫 Buc-ee's — os dois ícones do roteiro</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Buc-ee's não é um posto de gasolina — é uma instituição texana. Lojas de dezenas de milhares de metros quadrados, os banheiros mais limpos dos EUA, brisket cortado na hora, Beaver Nuggets (a pipoca caramelada que vicia), parede inteira de beef jerky e merchandise que só existe lá.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏛️</span><h3>New Braunfels — o ícone histórico</h3><p>Por uma década foi o maior posto de conveniência do mundo: 66.000 m², 83 banheiros (eleitos os melhores dos EUA em 2012). Fica exatamente na metade da I-35 entre Austin e San Antonio — a parada perfeita no <strong>Dom 28/06</strong>. Reserve 30–45 min. 📍 2760 IH-35 N, New Braunfels.</p></div>
        <div class="mag-card"><span class="ic">🏆</span><h3>Luling — o maior do mundo</h3><p>Aberto em junho de 2024, destronou o próprio New Braunfels com 75.000 m² — o maior posto de conveniência do planeta. Fica a ~1h de San Antonio na I-10. Pare na ida (<strong>Seg 29/06</strong>) para não atrasar o almoço BBQ pré-jogo em Houston. 📍 10070 W IH-10, Luling.</p></div>
      </div>
      <h3 class="mag-title" style="font-size:20px;margin-top:24px;">O que comprar em todo Buc-ee's</h3>
      <ul class="mag-numlist">
        <li><div><b>Beaver Nuggets</b><span>Pipoca caramelada viciante — leve várias embalagens.</span></div></li>
        <li><div><b>Brisket sandwich</b><span>Feito na hora, melhor do que muitos BBQ joints.</span></div></li>
        <li><div><b>Beef jerky da parede</b><span>Escolha por peso; tem sabores exóticos.</span></div></li>
        <li><div><b>Fudge artesanal</b><span>Prove antes de comprar — dezenas de sabores.</span></div></li>
        <li><div><b>Kolaches</b><span>Pastel tcheco-texano, doce ou salgado.</span></div></li>
        <li><div><b>T-shirt exclusiva da unidade</b><span>Design único por cidade.</span></div></li>
        <li><div><b>Merchandise Buc-ee's</b><span>Canecas, coolers e bonés do castor.</span></div></li>
        <li><div><b>Yeti / RTIC com logo Buc-ee's</b><span>Só vende nos postos.</span></div></li>
      </ul>
    </section>

    <!-- BBQ GUIDE -->
    <section class="mag-section tint" id="bbq">
      <div class="mag-eyebrow">Master Guide</div>
      <h2 class="mag-title">🔥 BBQ Guide — Texas Monthly Top 50 · 2025</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">O Texas Monthly publica sua lista dos 50 melhores BBQ do Texas a cada quatro anos — é a bíblia do churrasco americano. A edição de maio de 2025 é a mais recente. Abaixo, todos os destaques do roteiro em ordem de prioridade.</p>

      <div class="mag-eyebrow" style="margin-top:8px;">Fort Worth + DFW</div>
      <div class="mag-resto">
        <div class="tier">#3 · Texas Monthly 2025</div>
        <h3>Goldee's Barbecue</h3>
        <div class="addr">📍 4645 Dick Price Rd, Fort Worth</div>
        <p>O platter "Fort Worth the Wait" (≈$95): meio quilo de brisket, turkey, pork ribs, pulled pork + salsichas artesanais + 5 sides. Bark preta e suculenta, costela perfeita. Foi #1 do Texas em 2021. Chegue antes da abertura.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">#7 · Texas Monthly 2025 · Estreia no Top 10</div>
        <h3>Dayne's Craft BBQ</h3>
        <div class="addr">📍 Aledo, TX — desvio de ~30 min da I-30</div>
        <p>Aledo (~30 min de Fort Worth). Estreou no top 10 em 2025 — para quem quiser fazer o desvio extra e provar o mais novo dos grandes.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">Top 50 · Texas Monthly 2025</div>
        <h3>Panther City BBQ</h3>
        <div class="addr">📍 201 E Hattie St, Fort Worth</div>
        <p>Fundado em 2018 por Ernest Morales e Chris Magallanes. Brisket com bark de personalidade, menu criativo. Mais acessível e prático que o Goldee's para o almoço do dia de chegada em Fort Worth.</p>
      </div>

      <div class="mag-eyebrow" style="margin-top:16px;">Dallas</div>
      <div class="mag-resto">
        <div class="tier">Honorable Mention · Texas Monthly 2025</div>
        <h3>Terry Black's Barbecue</h3>
        <div class="addr">📍 3025 Main St, Dallas (Deep Ellum)</div>
        <p>Estilo Central Texas clássico no melhor bairro da cidade. Brisket, salsichas jalapeño-cheddar, banana pudding. O local perfeito para o jantar no Deep Ellum — combine com os bares e murais da região.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">Top 50 · Texas Monthly 2025</div>
        <h3>Slow Bone BBQ</h3>
        <div class="addr">📍 2234 Irving Blvd, Dallas</div>
        <p>De volta ao Top 50 em 2025. Destaque para o sweet potato praline como acompanhamento — único em todo o Texas: uma batata-doce caramelada com pecans que chega perto de ser sobremesa.</p>
      </div>

      <div class="mag-eyebrow" style="margin-top:16px;">Austin</div>
      <div class="mag-resto">
        <div class="tier">#2 do Estado · Texas Monthly 2025</div>
        <h3>LeRoy and Lewis Barbecue</h3>
        <div class="addr">📍 121 Pickle Rd, Austin</div>
        <p>Ranking acima do Franklin — com menos fila. Menu inovador: beef cheeks defumados, brisket com criatividade, influências diversas. Food truck sem o sofrimento da fila épica do Franklin.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">#6 do Estado · Texas Monthly 2025</div>
        <h3>InterStellar BBQ</h3>
        <div class="addr">📍 1700 E Cesar Chavez St, Austin · Qua–Dom 11h–21h</div>
        <p>Abre até as 21h (Qua–Dom) — perfeito para o jantar da noite de chegada em Austin (Sex 26/06). Espaço amplo, ótima sinalização, brisket consistente e suculento.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">Ícone · James Beard Award · Fila Épica</div>
        <h3>Franklin Barbecue</h3>
        <div class="addr">📍 900 E 11th St, Austin · Sáb 27/06, chegue às 08h30</div>
        <p>A mais famosa experiência de BBQ do mundo. A fila começa antes das 9h, o restaurante abre às 11h e fecha quando acaba a carne. Leve cadeira. Viva como experiência social, não como almoço.</p>
      </div>

      <div class="mag-eyebrow" style="margin-top:16px;">Houston</div>
      <div class="mag-resto">
        <div class="tier">#9 · Texas Monthly 2025 · Único Houston no Top 10</div>
        <h3>Truth BBQ</h3>
        <div class="addr">📍 110 S Heights Blvd, Houston · Chegue às 11h</div>
        <p>A 20 min do NRG Stadium. O único representante de Houston no top 10. Brisket, pork ribs e salsichas artesanais. O Smoked and Fried Tea-Brined Pork Chop é a indicação especial do editor.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">Michelin Guide Houston 2025</div>
        <h3>Blood Bros. BBQ</h3>
        <div class="addr">📍 5425 Bellaire Blvd, Bellaire</div>
        <p>BBQ com fusão asiática, vietnamita e coreana — só existe em Houston. Bao com pork belly e mel, ribs com gochujang. A experiência mais diferente de BBQ em todo o roteiro.</p>
      </div>
      <div class="mag-resto">
        <div class="tier">Michelin Star · Craft BBQ</div>
        <h3>CorkScrew BBQ</h3>
        <div class="addr">📍 26608 Keith St, Spring, TX</div>
        <p>Migrou de food trailer para estabelecimento com estrela Michelin. Pulled pork e pork ribs são os grandes destaques. Fica em Spring (~45 min de Houston) — ideal se quiser desviar um pouco da rota principal.</p>

    <div class="mag-eyebrow">Flórida, EUA · Dias 1 &amp; 2</div>
    <h1>Tampa</h1>
    <p class="mag-tagline">O segredo mais bem guardado da Flórida — charutos cubanos, praias do Golfo e adrenalina de parque numa cidade que ainda pertence aos seus moradores.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>~400 mil</b><span>População</span></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">A Flórida que ninguém te contou</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Tampa não aparece nos cartazes de turismo da Flórida. Não tem a fama glamourosa de Miami nem o apelo familiar de Orlando. E é exatamente por isso que ela é especial. Aqui a cidade ainda respira com os pulmões dos seus próprios moradores — imigrantes cubanos que vieram enrolar charutos nas décadas de 1880, pescadores que conhecem o melhor spot de camarão do Golfo, e uma nova geração de chefs que reinventou a culinária hispano-floridiana sem perder a alma original.</p>
        <p>A história de Tampa começa com o tabaco. Quando Vicente Martínez Ybor transferiu sua fábrica de charutos de Cuba para a Flórida em 1885, ele não apenas trouxe um produto — trouxe um povo inteiro. Cubanos, espanhóis e italianos chegaram aos milhares, construindo Ybor City com suas paredes de tijolo vermelho, varandas de ferro forjado e o aroma permanente de tabaco tostado. Os trabalhadores das fábricas contratavam "leitores" — homens que liam em voz alta obras de Cervantes, Marx e jornais cubanos enquanto os outros enrolavam charutos em silêncio.</p>
        <p>Hoje Tampa é uma cidade de contrastes produtivos. Na mesma tarde você pode atravessar Ybor City entre paralelepípedos históricos e galos de rua, chegar ao Busch Gardens para ficar de cabeça para baixo a 105 km/h, e encerrar a noite no Riverwalk assistindo o pôr do sol sobre a Baía de Tampa com uma cerveja artesanal na mão.</p>
        <p>Em junho a cidade enfrenta seu clima mais dramático: manhãs ensolaradas e escaldantes que invariavelmente terminam em tempestades tropicais à tarde, espetáculos de raios que fazem os floridenses pararem na calçada para assistir. A chuva passa em vinte minutos e o calor volta.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i45" alt="Tampa à beira d'água">
        <figcaption>Tampa Bay — entre o Golfo do México e a baía</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Tampa</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Tampa é um mosaico de bairros com personalidades distintas, cada um com sua própria história e razão de ser.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏛️</span><h3>Ybor City</h3><p>O coração histórico. Ruas de paralelepípedo, arquitetura espanhola-italiana-cubana, galos soltos e aroma de charutos. À noite, o distrito boêmio mais animado da cidade.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>Downtown &amp; Riverwalk</h3><p>Quase 5 km de calçadão às margens do Rio Hillsborough. Museus, restaurantes, o Amalie Arena e as torres refletidas na água. Melhor de tarde e ao pôr do sol.</p></div>
        <div class="mag-card"><span class="ic">🌳</span><h3>Hyde Park</h3><p>O bairro mais elegante, com casas vitorianas sob árvores centenárias. Hyde Park Village concentra as melhores butiques independentes e restaurantes.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>South Howard (SoHo)</h3><p>Onde Tampa bebe e come bem. Bares de craft beer, restaurantes criativos e a vida noturna da geração local.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que fazer em Tampa</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/ybor_city"><span class="ic">🏛️</span><h3>Ybor City</h3><p>O bairro histórico cubano é um lugar que precisa ser vivido. Caminhe pela 7th Avenue entre fábricas de charutos restauradas, entre nas tabacarias onde artesãos ainda enrolam à mão, e observe os galos protegidos por lei desde os tempos dos imigrantes.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/busch_gardens"><span class="ic">🎢</span><h3>Busch Gardens Tampa Bay</h3><p>Safári africano somado a montanhas-russas de classe mundial. O SheiKra mergulha 60 m; o Cheetah Hunt acelera a 96 km/h; o Iron Gwazi é uma das melhores híbridas do mundo. Entre as emoções, rinocerontes e girafas pastam em savanas recriadas.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/tampa_riverwalk"><span class="ic">🌊</span><h3>Tampa Riverwalk</h3><p>Quase 5 km de calçadão conectam o Tampa Museum of Art, o Armature Works (mercado gastronômico) e o Florida Aquarium. Perfeito no início da manhã antes do calor ou ao entardecer.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🐬</span><h3>Florida Aquarium</h3><p>Um dos melhores dos EUA, com foco nos ecossistemas da Flórida. A seção de corais do Golfo impressiona. É possível mergulhar com tubarões mediante reserva.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Tampa <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">A alma de Tampa está em Ybor City e West Tampa: pão cubano fresquinho, cafecito no balcão e o legítimo Cuban Sandwich — inventado aqui, com salame, herança dos imigrantes das fábricas de charuto.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>Coma como local: peça o Cuban Sandwich no balcão das padarias históricas (La Segunda, Brocato's) por uma fração do preço de restaurante, regado a cafecito de poucos centavos. Os almoços de cafeteria da La Teresita — arroz, feijão e pernil — saem baratíssimos e enchem.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Cuban Sandwich</div><div class="d">Presunto, pernil, queijo suíço, picles, mostarda e salame, prensado em pão cubano. A versão tampeña é a original.</div></div>
    <div class="mag-dish"><div class="n">Deviled Crab</div><div class="d">Croquete picante de caranguejo de massa de pão. Criação genuinamente tampeña, vendida nas padarias por trocados.</div></div>
    <div class="mag-dish"><div class="n">Pão Cubano</div><div class="d">Assado diariamente com folha de palmito por cima — 18 mil pães por dia só na La Segunda desde 1915.</div></div>
    <div class="mag-dish"><div class="n">Café Cubano</div><div class="d">Espresso ultra-concentrado com açúcar batido em espuma, servido em copinhos minúsculos no balcão.</div></div>
    <div class="mag-dish"><div class="n">Empanadas e Pastelitos</div><div class="d">Salgadinhos de massa folhada recheados de carne, frango ou goiabada com queijo. Herança cubana-espanhola.</div></div>
    <div class="mag-dish"><div class="n">Arroz con Pollo</div><div class="d">Arroz amarelo cozido com frango, açafrão e ervilhas. O prato-clássico das mesas españolas-cubanas de Ybor.</div></div>
  </div>
  <div class="mag-resto" style="margin-top:20px;">
    <div class="tier">Padaria cubana · Ybor City · $</div>
    <h3>La Segunda Bakery &amp; Cafe</h3>
    <div class="addr">📍 Ybor City (matriz histórica desde 1915)</div>
    <p>A padaria que abastece metade de Tampa com pão cubano e a melhor relação custo-sabor da cidade. Balcão de cafecito, croquetas, deviled crab e Cuban Sandwich montado na hora — autenticidade absoluta por preço de café da esquina.</p>
    <span class="order">Pedir: Cuban Sandwich + Cafecito + um deviled crab</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Cafeteria cubana · West Tampa · $</div>
    <h3>La Teresita</h3>
    <div class="addr">📍 West Tampa · W Columbus Dr</div>
    <p>Favorita histórica de West Tampa: balcão estilo lanchonete com fila que anda rápido, pratos do dia fartos de pernil, arroz e feijão, e banana-da-terra. É onde os locais comem bem gastando pouco, longe das rotas turísticas.</p>
    <span class="order">Pedir: prato do dia (roast pork) + tostones + cortadito</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Sanduicheria · West Tampa · $</div>
    <h3>West Tampa Sandwich Shop</h3>
    <div class="addr">📍 3904 N Armenia Ave · West Tampa</div>
    <p>Botequim de bairro famoso pelo "honey Cuban" — o sanduíche que ganhou fama nacional quando Obama o pediu em 2012. Pequeno, sem frescura e barato, é Cuban Sandwich de verdade feito pra vizinhança.</p>
    <span class="order">Pedir: Honey Cuban Sandwich ("Obama") + batido de frutas</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Sanduicheria histórica · Ybor City · $</div>
    <h3>Brocato's Sandwich Shop</h3>
    <div class="addr">📍 Ybor City (desde 1948)</div>
    <p>Instituição de Tampa desde 1948, com fila na porta. O Cuban vem em cinco tamanhos — do extra-small de 4 polegadas ao "Joe's Special" de 38 cm. Não é o mais tradicional, mas o ambiente de bairro e o preço valem a parada.</p>
    <span class="order">Pedir: Cuban Sandwich (tamanho médio) + deviled crab</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Ícone histórico · Ybor City · Desde 1905 · $$$ — vale o esplurge</div>
    <h3>Columbia Restaurant</h3>
    <div class="addr">📍 2117 E 7th Ave · Ybor City</div>
    <p>O restaurante mais antigo da Flórida e a maior obra-prima da culinária española-cubana nos EUA. Um quarteirão inteiro com 15 salões de azulejos sevilhanos; sextas e sábados têm flamenco ao vivo. É caro, mas é uma experiência histórica única — reserve para uma noite especial.</p>
    <span class="order">Pedir: 1905 Salad (preparada na mesa) + Arroz con Pollo + sangria espanhola</span>
  </div>
</section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para chegar e se virar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌧️</span>Calor e chuva de junho</h4><p>Manhãs ensolaradas (34°C+) e tempestades tropicais quase toda tarde, entre 14h e 17h. Planeje atividades ao ar livre pela manhã.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧴</span>Protetor solar obrigatório</h4><p>O sol do Golfo é brutal mesmo com nuvens. FPS 50+ reaplicado a cada 2 h e hidratação constante.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎢</span>Busch Gardens: chegue cedo</h4><p>Esteja no portão na abertura (≈10 h). As filas triplicam depois do meio-dia. Compre os ingressos online.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Segurança em Ybor</h4><p>Animada e segura de dia e início da noite nas áreas movimentadas. Evite ruelas desertas depois da meia-noite.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Tampa → Miami</h4><p>Via I-75, cerca de 4h30 de carro. Trecho agradável pelo interior — planeje uma parada na metade.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏨</span>Onde se hospedar</h4><p>Ybor para imersão (barulhento à noite), Downtown para conveniência, Westshore para hotéis de rede com bom custo-benefício.</p></div>

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">A cidade de duas almas</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Miami é a única grande cidade americana onde você pode pedir café sem falar inglês. É a metrópole dos EUA onde o espanhol é a língua da rua, do mercado e da política. Não é um detalhe — é a essência de uma cidade construída sobre camadas de migrações: cubanos que fugiram de Castro nos anos 1960, haitianos que chegaram de jangada nos 1980, colombianos, venezuelanos, brasileiros, nicaraguenses. Cada onda deixou seus bairros, seus sabores, sua música.</p>
        <p>O verniz glamouroso de South Beach — carros de luxo, hotéis Art Deco pastel, modelos na Ocean Drive — é real, mas é apenas uma camada. Debaixo dela fica a Magic City genuína: as mesas de dominó no Domino Park de Little Havana onde cubanos de oitenta anos jogam desde o exílio, os murais de Wynwood que transformaram um depósito em distrito de arte contemporânea, o Overtown histórico onde o jazz negro floresceu quando músicos negros não podiam se hospedar nos hotéis de South Beach em que tocavam.</p>
        <p>Em 2026 Miami é uma das cidades-sede da Copa do Mundo. O <strong>Hard Rock Stadium</strong>, em Miami Gardens (20 min do centro), recebe jogos da fase de grupos e possivelmente eliminatórias. Para o roteiro, o jogo <strong>Uruguai × Cabo Verde</strong> (Dom 21/06, 19h) é a âncora do dia — toda a visita acontece sob a eletricidade de uma cidade que vai receber o mundo pela primeira vez em 32 anos.</p>
        <p>Junho não é a melhor época meteorológica — é o início da temporada de furacões, com calor sufocante (35°C+) e umidade de 90%. Mas é quando a cidade está mais ela mesma: antes das festas que encarecem tudo em outubro, antes do inverno que traz os turistas do norte. Em junho Miami pertence aos seus moradores — e a você.</p>
      </div>

      <h2 class="mag-title">Miami no palco do mundo</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">FIFA World Cup 2026 · Sede Miami</span>
        <p>O <strong>Hard Rock Stadium</strong>, casa do Miami Dolphins, é um dos 16 estádios-sede da Copa do Mundo 2026 nos EUA, Canadá e México. Com capacidade para 65 mil torcedores, fica em Miami Gardens, a 20 minutos de carro do centro. O jogo do roteiro é <strong>Uruguai × Cabo Verde</strong>, fase de grupos. A cidade toda estará em modo Copa — fan zones, bandeiras de todas as nações e o zumbido de 200 nacionalidades num só lugar.</p>
      </div>
      <div class="mag-chips"><span class="mag-chip">Dom 21/06 · 19h</span><span class="mag-chip">Uruguai × Cabo Verde</span><span class="mag-chip soft">Grupo A · Hard Rock Stadium</span></div>

    <section class="mag-section">
      <div class="mag-eyebrow">No Roteiro</div>
      <h2 class="mag-title">Dia 3 em Miami</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Um dia intenso: cultura latinoamericana em Little Havana e Wynwood de manhã e tarde, Copa do Mundo à noite.</p>
      <div class="mag-cards">
        <a class="mag-card" href="#day/3"><span class="ic">⚽</span><h3>Dia 3 · Dom 21/06</h3><p>Manhã em Little Havana, tarde no Wynwood, e às 19h o jogo Uruguai × Cabo Verde no Hard Rock Stadium.</p><span class="go">Ver o dia completo →</span></a>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Miami</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Miami é uma cidade fragmentada em territórios culturais distintos — cada bairro tem sua própria língua, cozinha e ritmo.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🇨🇺</span><h3>Little Havana</h3><p>A Calle Ocho é a espinha dorsal do exílio cubano. Domino Park, tabacarias artesanais, restaurantes de ropa vieja, o Tower Theater — um bairro que guarda a memória de uma Cuba que não existe mais e a reinventa a cada geração.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Wynwood</h3><p>Antigo depósito industrial transformado no mais importante distrito de arte de rua do mundo. O Wynwood Walls iniciou a transformação em 2009 com Tony Goldman — hoje é um laboratório de arte contemporânea com cafés, restaurantes e a melhor cena de craft beer da cidade.</p></div>
        <div class="mag-card"><span class="ic">🏖️</span><h3>South Beach (SoBe)</h3><p>O cartão-postal de Miami. A Ocean Drive é um museu vivo de Art Deco dos anos 1930, com fachadas pastel de rosa, amarelo e turquesa. Praias de areia branca fina com água transparente — chegue cedo para achar lugar.</p></div>
        <div class="mag-card"><span class="ic">🏙️</span><h3>Brickell</h3><p>O Manhattan de Miami: arranha-céus de vidro, restaurantes de chef estrelado e o Brickell City Centre para compras. É o coração financeiro e o destino de jantares para quem quer gastar bem.</p></div>
        <div class="mag-card"><span class="ic">🌳</span><h3>Coconut Grove</h3><p>O bairro mais antigo de Miami, com árvores enormes cobrindo ruas estreitas. Atmosfera desacelerada e boêmia — cafés ao ar livre, boutiques independentes e o Peacock Park às margens da Baía de Biscayne.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que fazer em Miami</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/little_havana"><span class="ic">🇨🇺</span><h3>Little Havana</h3><p>Mais que um bairro — um ato de resistência cultural. Na Calle Ocho, cubanos de três gerações mantiveram viva uma cultura enquanto aguardavam um retorno que para muitos nunca chegou. Domino Park, El Crédito Cigar Factory, Versailles Restaurant e o Festival Calle Ocho (o maior festival latino outdoor do mundo).</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/wynwood_walls"><span class="ic">🎨</span><h3>Wynwood Walls</h3><p>O projeto que transformou um bairro de depósitos abandonados numa meca global da arte urbana. As paredes do complexo original são repintadas por artistas convidados do mundo todo — o que você vê hoje não estará aqui no próximo ano. Em torno dele, todo o bairro virou tela: murais, galerias e gastronomia.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🐾</span><h3>Dogs &amp; Cats Walkway — Mers Ferry Park</h3><p>Uma das instalações de arte pública mais surpreendentes da Flórida: 52 esculturas monumentais de alumínio de cães e gatos ao longo da passarela do parque junto à baía. A luz do sol no alumínio polido cria efeitos fotográficos extraordinários. Entrada gratuita e raramente mencionada nos roteiros convencionais.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Art Deco Historic District</h3><p>South Beach guarda o maior conjunto de arquitetura Art Deco do mundo — mais de 800 edifícios construídos entre 1923 e 1943, preservados pelo Historic Preservation Office de Miami Beach. Caminhar pela Ocean Drive ao amanhecer, com as ruas vazias e as fachadas pastel na primeira luz, é uma das experiências mais fotogênicas dos EUA.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Miami <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">Miami se come de pé, no balcão: cafecito pela ventanita, croquetas a qualquer hora, frita cubana e griot haitiano. A cidade latina mais saborosa dos EUA é também uma das mais baratas se você seguir os locais.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>A <strong>ventanita</strong> — a janelinha de café cubano — foi inventada no Versailles e está em toda padaria de Little Havana. Cafecito, cortadito e pastelitos custam centavos e dão o ritmo do dia. Para um almoço farto e barato, vá aos clássicos de bairro de Calle Ocho e Little Haiti, não às mesas de South Beach.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Cafecito</div><div class="d">O café cubano de Miami: espresso adoçado com açúcar batido em espuma. Servido pela ventanita por trocados.</div></div>
    <div class="mag-dish"><div class="n">Croquetas</div><div class="d">Croquetes de presunto ou frango, fritos e servidos a todo momento nas padarias cubanas. Café da manhã ideal.</div></div>
    <div class="mag-dish"><div class="n">Cuban Sandwich</div><div class="d">Presunto, lechón, queijo suíço, picles e mostarda prensados em pão cubano. Em Miami, sem salame.</div></div>
    <div class="mag-dish"><div class="n">Frita Cubana</div><div class="d">O "hambúrguer cubano": disco de carne temperada com batata-palha por cima, no pão cubano. Street food clássica.</div></div>
    <div class="mag-dish"><div class="n">Ropa Vieja</div><div class="d">Carne desfiada cozida com tomate, pimentão e cominho. O prato nacional cubano e a alma de Little Havana.</div></div>
    <div class="mag-dish"><div class="n">Griot</div><div class="d">Pedaços de porco marinados e fritos, com arroz, feijão e pikliz picante. O orgulho de Little Haiti.</div></div>
  </div>
  <div class="mag-resto" style="margin-top:20px;">
    <div class="tier">Ícone cultural · Little Havana · $$</div>
    <h3>Versailles Restaurant</h3>
    <div class="addr">📍 Calle Ocho · Little Havana (desde 1971)</div>
    <p>Chamado de "A Embaixada Cubana": cada decisão da comunidade exilada passa informalmente por aqui, e foi onde nasceu a ventanita. A comida — ropa vieja, picadillo, croquetas — é excelente, farta e de preço justo. O que você compra é história viva, sem pagar caro.</p>
    <span class="order">Pedir: Ropa Vieja + Arroz Moro + Tostones, e cafecito na ventanita pra fechar</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Sanduicheria · Little Havana · $$</div>
    <h3>Sanguich de Miami</h3>
    <div class="addr">📍 Calle Ocho · Little Havana</div>
    <p>Começou em 2017 como um contêiner e virou referência (Bib Gourmand do Michelin) pelo melhor Cuban da cidade. Tudo é feito do zero — o porco marina uma semana, o pão e os picles são da casa. Autenticidade premiada por preço de lanchonete.</p>
    <span class="order">Pedir: El Cubano + Pan con Croqueta + milkshake</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Street food cubana · West Miami · $</div>
    <h3>El Mago de las Fritas</h3>
    <div class="addr">📍 5828 SW 8th St · West Miami (desde 1984)</div>
    <p>Um dos últimos grandes balcões de frita cubana mantendo viva uma tradição de comida de rua. Carne temperada, batata-palha e pão cubano amanteigado, servidos com a personalidade gigante do dono. Comida de verdade, baratíssima, há 40 anos.</p>
    <span class="order">Pedir: Frita Cubana + batido de mamey</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Cozinha haitiana · Little Haiti · $</div>
    <h3>Chef Creole</h3>
    <div class="addr">📍 Little Haiti</div>
    <p>O clássico de Little Haiti que Anthony Bourdain visitou: griot, oxtail e peixe frito servidos no balcão ou na barraca de telhado de palha ao lado. O griot vem com arroz, feijão e a famosa pikliz picante. Porções fartas, sabor caribenho intenso e preço de bairro.</p>
    <span class="order">Pedir: Griot com pikliz + oxtail, dividir</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Clássico de frutos do mar · South Beach · Desde 1913 · $$$ — vale o esplurge</div>
    <h3>Joe's Stone Crab</h3>
    <div class="addr">📍 South Beach</div>
    <p>O único esplurge da lista, e justificado: as Stone Crab Claws são uma experiência única — a garra é retirada e o caranguejo volta ao mar (e regenera), tornando-o um dos frutos do mar mais sustentáveis. Servidas frias com o molho secreto. Caro, mas uma instituição de 1913. Dica: o balcão de take-away ao lado sai bem mais em conta.</p>
    <span class="order">Pedir: Stone Crab Claws (medium) + Key Lime Pie</span>
  </div>
</section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para chegar e se virar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">⚽</span>Copa 2026 — logística</h4><p>O Hard Rock Stadium fica em Miami Gardens, 20 km ao norte do centro. De Uber leva ~25 min sem trânsito — em dia de jogo, espere mais. Chegue 2h antes. O surge pricing do Uber será enorme depois do apito final.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Calor e umidade em junho</h4><p>Junho é intenso: 35°C+ com umidade de 80–90%. Caminhar ao ar livre entre 11h e 16h é esgotante. Planeje refeições longas com ar-condicionado no período mais quente.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>Wynwood é caminhável</h4><p>Diferente da maioria de Miami, Wynwood é completamente caminhável — não precisa de carro dentro do bairro. Chegue de Uber, explore a pé e vá embora de Uber.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Tampa → Miami de carro</h4><p>A I-75 (Alligator Alley) atravessa os Everglades em ~4h30. A alternativa pela I-4 + I-95 pela costa leste leva o mesmo ou mais. A Alligator Alley é mais direta e mais bonita.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Dólar vale muito aqui</h4><p>Miami é uma das cidades mais caras dos EUA. Restaurantes em South Beach e Brickell têm preços de Nova York. Little Havana e Wynwood são mais acessíveis — e frequentemente melhores.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Segurança</h4><p>As áreas turísticas (South Beach, Wynwood, Brickell, Little Havana diurna) são seguras. Cuidado com bolsos em áreas movimentadas de SoBe à noite. O instinto de cidade grande é suficiente.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Visão Geral</div>
      <h2 class="mag-title">O fim da Chisholm Trail</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Existe uma diferença fundamental entre Dallas e Fort Worth que os texanos entendem bem: Dallas é uma cidade que gostaria de ser Nova York; Fort Worth é uma cidade que não gostaria de ser nada além de si mesma. A apenas 48 km de distância, as duas formam a quarta maior metrópole dos Estados Unidos — mas têm almas completamente opostas. Dallas é arranha-céus, moda e petróleo. Fort Worth é cavalos, botas de couro e a melhor costela defumada do Hemisfério Ocidental.</p>
        <p>A história de Fort Worth começa com a carne. Depois da Guerra Civil Americana, as pradarias do Texas transbordavam de longhorns semi-selvagens sem valor comercial — até que alguém percebeu que os mercados do norte pagariam bem por elas. A <strong>Chisholm Trail</strong> tornou-se a maior rota de gado da história americana: entre 1867 e 1884, mais de cinco milhões de cabeças foram conduzidas por cowboys desde o Texas até os matadouros do Kansas. Fort Worth era a última cidade de tamanho antes dos meses de pradaria — onde os cowboys gastavam os salários acumulados, bebiam, jogavam e viviam. A cidade se orgulha do apelido <em>"Where the West Begins"</em>.</p>
        <p>Hoje os Stockyards National Historic District preservam aquela era com fidelidade impressionante — não como museu artificial, mas como lugar vivo onde cowboys de verdade ainda trabalham, leilões de gado ainda acontecem às segundas-feiras, e longhorns Texas autênticos desfilam pela Exchange Avenue duas vezes por dia. Caminhar pelos paralelepípedos entre homens de chapéu Stetson e botas genuínas, com o cheiro de fumaça de BBQ e cerveja gelada no ar, é uma das experiências mais autenticamente americanas disponíveis a um turista.</p>
        <p>E depois do pôr do sol, o <strong>Billy Bob's Texas</strong> abre suas portas. Com capacidade para 6.000 pessoas e 40 mesas de sinuca, é oficialmente o maior honky-tonk do mundo — um hangar convertido em templo da música country e da dança de salão, onde touros mecânicos e rodeos reais convivem com palcos onde tocaram Willie Nelson, Waylon Jennings e George Strait. É a experiência texana no volume máximo.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i49" alt="Fort Worth — Velho Oeste vivo">
        <figcaption>Fort Worth — os Stockyards e o Texas que você imaginou</figcaption>

      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Fort Worth Herd · Todos os dias</span>
        <p>O único <strong>cattle drive urbano diário</strong> dos Estados Unidos: vaqueiros a cavalo conduzem longhorns Texas autênticos — com chifres que chegam a 2 metros de ponta a ponta — pela Exchange Avenue, nos Stockyards. Espetáculo gratuito de poucos minutos que concentra a essência inteira do Velho Oeste numa única imagem. Chegue 15 minutos antes para garantir posição na calçada. <strong>Não perca o das 16h</strong> — a luz do final de tarde cria fotografias extraordinárias.</p>

    <section class="mag-section">
      <div class="mag-eyebrow">Bairros</div>
      <h2 class="mag-title">Os territórios de Fort Worth</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">Fort Worth é uma cidade de personalidades distintas — do Velho Oeste nos Stockyards à alta cultura no Cultural District, a 3 km de distância.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">⭐</span><h3>Stockyards National Historic District</h3><p>A joia da coroa de Fort Worth. Paralelepípedos históricos, fachadas do século XIX, lojas western autênticas, o Billy Bob's, leilão de gado, boiada diária — e o cheiro inconfundível de couro e churrasco que paira no ar.</p></div>
        <div class="mag-card"><span class="ic">🎭</span><h3>Sundance Square</h3><p>O coração do downtown, com uma praça central animada e concentração de restaurantes, teatros e bares. Muito mais human-scale que Dallas — um downtown onde se caminha com prazer.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Near Southside</h3><p>O bairro criativo: galerias independentes, cervejarias artesanais, restaurantes farm-to-table e uma energia de bairro que cresceu organicamente sem perder a autenticidade.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Cultural District</h3><p>A surpresa maior de Fort Worth: o Kimbell Art Museum (arquitetura de Louis Kahn, Caravaggio e Michelangelo), o Amon Carter e o Modern Art Museum — tudo caminhável, a 3 km dos Stockyards.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que fazer em Fort Worth</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/fort_worth_stockyards"><span class="ic">🤠</span><h3>Fort Worth Stockyards</h3><p>O Distrito Histórico Nacional dos Stockyards não tem equivalente nos EUA. No auge do século XIX, mais de dois milhões de cabeças de gado passavam aqui por ano. Hoje o complexo preserva aquela era com fidelidade notável: lojas de botas feitas à mão, chapeleiros moldando feltro sob medida, o Cowtown Coliseum com rodeos e a boiada na Exchange Avenue às 11h e 16h. Genuinamente histórico, não uma reconstituição Disney.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/billy_bobs"><span class="ic">🎸</span><h3>Billy Bob's Texas</h3><p>O maior honky-tonk do mundo: 40 mesas de sinuca, múltiplos bares, uma arena de rodeio indoor com touros reais nas sextas e sábados, e um palco principal onde tocaram praticamente todos os grandes nomes do country — de Willie Nelson a Garth Brooks. O prédio foi um celeiro de gado de 1910 que serviu como loja PX do Exército na Segunda Guerra. Em 1981 virou lenda.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🐮</span><h3>Texas Longhorn Cattle Drive</h3><p>O evento mais fotografado de Fort Worth. Vaqueiros autênticos em montarias, com roupas de trabalho reais (não fantasias), conduzem um rebanho de longhorns Texas pela Exchange Avenue. Os chifres de um adulto chegam a 2,4 metros — quando a boiada passa a poucos metros, a escala surpreende. Gratuito, todos os dias, 11h e 16h.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Kimbell Art Museum</h3><p>Um dos melhores museus de arte dos EUA — e pouquíssimos sabem que está em Fort Worth. Coleção com Caravaggio, Velázquez, Goya, Picasso e Matisse numa arquitetura magistral de Louis Kahn (1972). A luz natural filtrada pelos tetos abobadados de concreto é em si uma obra. Entrada gratuita para a coleção permanente.</p></div>
      </div>
    </section>

    <section class="mag-section">
  <div class="mag-eyebrow">Gastronomia</div>
  <h2 class="mag-title">Comer em Fort Worth <span class="sub">sem estourar o orçamento</span></h2>
  <div class="mag-rule"></div>
  <p class="mag-lead">Em Fort Worth come-se BBQ como religião, Tex-Mex como tradição de família e chicken-fried steak como herança do oeste. O melhor disso tudo é barato — vendido por peso em pits e em cantinas de bairro.</p>
  <div class="mag-callout">
    <span class="lbl">Dica de bolso</span>
    <p>BBQ texano vende por peso (libra) e por ordem de chegada — chegue cedo, peça uma bandeja para dividir e pague só pelo que comer. Para um jantar farto e baratíssimo, as cantinas Tex-Mex e taquerias do North Side servem porções gigantes que alimentam duas pessoas.</p>
  </div>
  <div class="mag-dishes">
    <div class="mag-dish"><div class="n">Brisket</div><div class="d">O corte soberano do BBQ texano: peito bovino defumado 12–18 h em carvalho. A casca preta esconde carne que desmancha.</div></div>
    <div class="mag-dish"><div class="n">Beef Ribs</div><div class="d">Costela bovina defumada lentamente — cada osso do tamanho de um antebraço. A dinosaur rib impressiona no visual e no sabor.</div></div>
    <div class="mag-dish"><div class="n">Chicken-Fried Steak</div><div class="d">Bife empanado e frito estilo frango frito, coberto de molho branco de pimenta. Prato texano por excelência, generosíssimo.</div></div>
    <div class="mag-dish"><div class="n">Tacos de Birria</div><div class="d">Carne cozida lentamente, taco dobrado e tostado, servido com o consomê para mergulhar. A onda mexicana do North Side.</div></div>
    <div class="mag-dish"><div class="n">Enchiladas Tex-Mex</div><div class="d">Tortilhas recheadas cobertas de chili con carne e queijo derretido. O coração da culinária Tex-Mex de Fort Worth.</div></div>
    <div class="mag-dish"><div class="n">Jalapeño Cheddar Sausage</div><div class="d">Linguiça artesanal defumada com jalapeño e cheddar — obrigatória em qualquer bandeja de BBQ texano.</div></div>
  </div>
  <div class="mag-resto" style="margin-top:20px;">
    <div class="tier">BBQ · arredores de Fort Worth · $$</div>
    <h3>Goldee's BBQ</h3>
    <div class="addr">📍 4645 Dick Price Rd · Fort Worth</div>
    <p>A ascensão mais meteórica da história do BBQ texano: abriu em 2021 e já liderou o ranking da Texas Monthly. O brisket tem casca considerada técnica perfeita pelos críticos mais exigentes do estado. Vendido por peso, esgota em horas — mas custa muito menos que qualquer restaurante chique.</p>
    <span class="order">Chegar cedo. Pedir: Brisket (fatty) + Beef Rib + Jalapeño Sausage, dividir</span>
  </div>
  <div class="mag-resto">
    <div class="tier">BBQ · Near Southside · $$</div>
    <h3>Panther City BBQ</h3>
    <div class="addr">📍 201 E Hattie St · Near Southside</div>
    <p>Mais acessível e igualmente sério, com toques tex-mex (elotes, brisket elote). É o lugar para o BBQ de alto nível sem a fila épica do Goldee's. O jalapeño cheese sausage é especialmente elogiado.</p>
    <span class="order">Pedir: Brisket + Jalapeño Sausage + Banana Pudding</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Tex-Mex · North Side · Desde 1935 · $$</div>
    <h3>Joe T. Garcia's</h3>
    <div class="addr">📍 2201 N Commerce St · North Side</div>
    <p>Instituição familiar desde 1935, da era em que Tex-Mex nem era moda. Pátios enormes com fontes e palmeiras, porções gigantescas e preços muito camaradas. As enchiladas e fajitas vêm do mesmo jeito caseiro de quase um século atrás.</p>
    <span class="order">Pedir: o menu fixo de enchiladas + fajitas, com margarita no pátio</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Taqueria · East Side / Rosedale · $</div>
    <h3>Birrieria y Taqueria Cortez</h3>
    <div class="addr">📍 E Rosedale St · East Side</div>
    <p>Começou como food truck no East Side e virou a primeira taqueria de Fort Worth reconhecida pelo Guia Michelin. A estrela são os tacos de birria — carne bovina cozida lentamente, grelhada e servida com o consomê para mergulhar. Autêntico e baratíssimo.</p>
    <span class="order">Pedir: Quesabirria tacos + consomê extra</span>
  </div>
  <div class="mag-resto">
    <div class="tier">Diner clássico · Near Southside · $</div>
    <h3>Paris Coffee Shop</h3>
    <div class="addr">📍 704 W Magnolia Ave · Near Southside</div>
    <p>Lanchonete de bairro desde os anos 1920, com banquetas no balcão e comfort food do sul. É o endereço certo para o chicken-fried steak texano — empanado, frito e afogado em molho branco — por preço de almoço de trabalhador. Cafés da manhã fartos e blue-plate specials.</p>
    <span class="order">Pedir: Chicken-Fried Steak com purê e gravy + torta de fruta</span>
  </div>
</section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Práticas</div>
      <h2 class="mag-title">Para chegar e se virar</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🔥</span>Calor extremo em junho</h4><p>Fort Worth chega a 37–40°C de dia com umidade baixa — calor seco e intenso. Hidrate-se sempre. As manhãs são mais toleráveis; evite caminhar muito entre 13h e 17h.</p></div>
        <div class="mag-tip"><h4><span class="ic">🐂</span>Cattle Drive: posição ideal</h4><p>Chegue 15 min antes na Exchange Avenue. O melhor ângulo fica do lado esquerdo da rua olhando para o Coliseum. A boiada passa a poucos metros — sem vidro ou grades entre você e os longhorns.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎸</span>Billy Bob's Texas</h4><p>Abre às 11h. Entrada ~US$6 na semana, mais nos fins de semana com shows. O rodeo de touros é sextas e sábados às 21h (~US$5 extra). Segunda à noite costuma ter bandas locais sem lotação excessiva.</p></div>
        <div class="mag-tip"><h4><span class="ic">⏰</span>BBQ: chegar cedo</h4><p>Os melhores BBQs esgotam. Goldee's e Panther City costumam acabar o brisket antes das 14h. Chegue na abertura (≈11h) para garantir todos os cortes.</p></div>
        <div class="mag-tip"><h4><span class="ic">👢</span>Compras western autênticas</h4><p>A M.L. Leddy's faz botas sob medida desde 1922 — artesanato real, não turismo. Mesmo sem comprar, ver um artesão moldar couro é fascinante. Chapéus sob medida no Maverick Fine Western Wear.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Fort Worth → Austin ou Dallas</h4><p>Dallas fica a 48 km (~45 min). Austin a 310 km (~3 h pela I-35). Ambas são opções diretas para o próximo trecho do roteiro.</p></div>
      </div>
    </section>

      <h2 class="mag-title">A contradição texana personificada</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Dallas é a contradição texana em estado puro: arranha-céus de vidro azul e botas de couro no Neiman Marcus, arte contemporânea de classe mundial e smoked BBQ de fumeiro, o fantasma de Kennedy nas ruas do Dealey Plaza e o estádio de futebol americano mais caro já construído na história. The Big D — uma das metrópoles americanas de crescimento mais acelerado, atraindo trabalhadores de tecnologia, artistas e chefs — consegue, de alguma forma inexplicável, manter sua alma texana intacta no meio de todo esse frenesi moderno.</p>
        <p>A história pesa. É impossível caminhar pelas ruas do Downtown sem sentir o peso de novembro de 1963. O Sixth Floor Museum no Dealey Plaza é um dos museus mais emocionalmente carregados dos Estados Unidos — a janela do depósito de livros escolares de onde saíram os tiros, o gramado verde, a curva fatal. Dallas enfrentou essa história, construiu um monumento à memória e seguiu em frente.</p>
        <p>Mas Dallas em 2026 é muito mais do que o peso do passado. O <strong>Arts District</strong> — 20 quarteirões contíguos de cultura, o maior do país — abriga o Dallas Museum of Art com sua coleção de 24 mil obras, o Nasher Sculpture Center com jardins assinados por Renzo Piano, e o AT&amp;T Performing Arts Center. Caminhando para leste, <strong>Deep Ellum</strong> pulsa como o coração musical e boêmio da cidade: murais gigantes cobrem fachadas inteiras, bares de blues e jazz derramam música pelas calçadas, e a Pecan Lodge serve o brisket mais disputado do Texas.</p>
        <p>Para quem vem à Copa 2026, Dallas oferece o contexto perfeito: uma cidade que leva futebol americano com a seriedade de uma religião — os Cowboys são "America's Team" — mas que abre seus bares com generosidade para qualquer esporte. O AT&amp;T Stadium em Arlington é uma verdadeira catedral do entretenimento: 100 mil lugares, a maior tela suspensa do mundo, e uma arquitetura que diz ao visitante que o Texas não faz nada pela metade.</p>
      </div>

      <h2 class="mag-title">Territórios de Dallas</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎨</span><h3>Deep Ellum</h3><p>O bairro mais autêntico de Dallas tem cheiro de defumador, tinta de grafite e cerveja artesanal. Nos anos 1920-30, Blind Lemon Jefferson e Lead Belly tocavam blues aqui. Hoje, murais de três andares cobrem os tijolos vermelhos, a Pecan Lodge faz filas na porta, e bares como Trees e Ruins mantêm música ao vivo sete noites por semana.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>Bishop Arts District</h3><p>Oak Cliff nunca foi o bairro nobre — e por isso o Bishop Arts conseguiu se tornar o mais interessante. Livrarias de bairro, cafés, galerias de garagem, o restaurante Lucia (concorrente ao James Beard). No fim de semana, as calçadas de paralelepípedo ganham um ritmo quase europeu.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Dallas Arts District</h3><p>Vinte quarteirões contíguos de cultura — o maior distrito de artes dos EUA. O DMA com 24 mil peças, o Nasher com Picasso e Rodin no jardim de Renzo Piano, o Winspear Opera House que à noite se ilumina como um cristal vermelho. O Klyde Warren Park, sobre uma rodovia, é a praça central da vida cultural.</p></div>
        <div class="mag-card"><span class="ic">🍸</span><h3>Uptown</h3><p>Se Deep Ellum é a alma, Uptown é o músculo jovem. McKinney Avenue é a espinha dorsal: restaurantes lotados às 19h, bares de cobertura com vista para o skyline, o bonde histórico gratuito. Onde a geração de 25 a 35 anos que migrou para os empregos de tecnologia do DFW vive, janta e bebe.</p></div>
        <div class="mag-card"><span class="ic">🌆</span><h3>Downtown</h3><p>Mais vivo do que seu passado de escritórios sugere. Dealey Plaza guarda a história mais pesada da cidade. O AT&amp;T Discovery District revitalizou um quarteirão com arte pública interativa. O Farmers Market traz produtores rurais nos fins de semana. À noite, o skyline da margem norte do Trinity é dos mais dramáticos do interior americano.</p></div>
      </div>

    <section class="mag-section">
      <div class="mag-eyebrow">Atrações</div>
      <h2 class="mag-title">O que ver e fazer</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards">
        <a class="mag-card" href="#page/dealey_plaza"><span class="ic">🪟</span><h3>Dealey Plaza + Sixth Floor Museum</h3><p>A janela do 6º andar do Texas School Book Depository de onde Lee Harvey Oswald atirou em 22 de novembro de 1963. O museu é cronologicamente perfeito e emocionalmente devastador. O gramado, a curva da Elm Street — tudo igual às fotografias históricas. Reserve 2h e leve lenço.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/deep_ellum"><span class="ic">🎨</span><h3>Deep Ellum</h3><p>Mais do que um bairro — um estado de espírito. Os murais de Okuda San Miguel, Shepard Fairey e artistas locais cobrem dezenas de fachadas. Caminhe pelas ruas Main, Elm e Commerce no fim da tarde, fotografe tudo, entre em qualquer bar com música ao vivo. A noite começa de verdade depois das 21h.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/dallas_arts_district"><span class="ic">🏛️</span><h3>Dallas Arts District</h3><p>O DMA tem entrada gratuita permanente. O Nasher Sculpture Center cobra ingresso mas vale cada centavo — Picasso, Rodin e Serra no jardim de Renzo Piano. O Klyde Warren Park sobre a Woodall Rodgers Freeway é um dos melhores parques urbanos dos EUA: food trucks, biblioteca ao ar livre, área kids.</p><span class="go">Guia completo →</span></a>
        <a class="mag-card" href="#page/bishop_arts_district"><span class="ic">🛍️</span><h3>Bishop Arts District</h3><p>Um quarteirão de estabelecimentos independentes em Oak Cliff. O restaurante Lucia (indicado ao James Beard), a Emporium Pies (a melhor torta do Texas, segundo os texanos), a Oddfellows para brunch. Fora do circuito turístico padrão — venha de Uber e explore sem pressa.</p><span class="go">Guia completo →</span></a>
        <div class="mag-card"><span class="ic">🐄</span><h3>Pioneer Plaza</h3><p>Três dúzias de longhorns em bronze em tamanho real conduzidos por cowboys a cavalo — a maior escultura em bronze do mundo. Ao lado do Convention Center, é uma das fotos obrigatórias de Dallas, com o skyline ao fundo. Gratuito, aberto 24h.</p></div>
        <div class="mag-card"><span class="ic">🌐</span><h3>Reunion Tower — GeO-Deck</h3><p>A esfera geodésica de 170 metros virou o símbolo visual de Dallas. O GeO-Deck no topo tem visão panorâmica 360°, telescópios HD e plataforma ao ar livre. À noite, com as luzes da cidade, é inesquecível. A 5 minutos a pé do Dealey Plaza.</p></div>
        <div class="mag-card"><span class="ic">🏟️</span><h3>AT&amp;T Stadium — Copa 2026</h3><p>A "Jerry World" em Arlington: 100 mil lugares, maior tela HD suspensa do mundo (160 m × 27 m), US$ 1,3 bilhão de construção. Para Japão × Suécia em 25/06: saia do Downtown às 17h30 (Uber direto, 30 min). Não há DART até Arlington. Leve protetor solar — junho chega a 38°C.</p></div>
        <div class="mag-card"><span class="ic">💎</span><h3>Nasher Sculpture Center</h3><p>2001 Flora Street, no coração do Arts District. O jardim de travertino e vegetação de Renzo Piano é um dos espaços mais serenos da cidade. Picasso, Rodin, Matisse, Richard Serra e dezenas de gigantes da escultura moderna num espaço íntimo e bem curado.</p></div>
        <div class="mag-card"><span class="ic">🦕</span><h3>Perot Museum of Nature and Science</h3><p>O prédio de Thom Mayne parece um bloco de concreto pousado de forma imperfeita sobre o chão — e o interior é tão impressionante quanto. Cinco andares de ciência, com dinossauros do Texas, geologia, energia e um laboratório de nanotecnologia. Excelente com crianças e adultos.</p></div>
