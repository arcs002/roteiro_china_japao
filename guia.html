  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Nascido de uma tragédia</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">O River Walk existe por causa de uma das maiores tragédias da história de San Antonio: a grande enchente de 1921, que matou 50 pessoas e varreu quarteirões inteiros de negócios do centro em questão de horas.</p>
      <div class="mag-prose">
        <p>Em setembro de 1921, depois de chuvas torrenciais, o Rio San Antonio transbordou catastroficamente. A enchente destruiu casas, negócios e infraestrutura por todo o centro histórico. A resposta imediata das autoridades foi o que qualquer prefeito pragmático provavelmente faria: propostas sérias de canalizar o rio, cobri-lo com concreto e transformá-lo num esgoto fechado. Por pouco, San Antonio não perdeu seu rio para sempre.</p>
        <p>O que salvou o rio foi uma coalizão improvável de cidadãos, arquitetos e urbanistas, liderados pela visionária Kathleen Bywater "Kit" Barnes. Em 1929, o arquiteto paisagista <strong>Robert H.H. Hugman</strong> apresentou seu plano revolucionário: em vez de cobrir o rio, transformá-lo num passeio europeu de canais, com lojas, cafés e jardins abaixo do nível da rua. O projeto foi aprovado em 1938 com fundos do New Deal de Franklin Roosevelt, e o primeiro trecho abriu ao público naquele mesmo ano.</p>
        <p>Nas décadas seguintes, o River Walk expandiu-se gradualmente. A transformação definitiva veio com a Feira Mundial de 1968, quando San Antonio recebeu investimentos massivos em hotéis, restaurantes e infraestrutura turística ao longo dos canais. Hoje, o Paseo del Río é o principal atrativo turístico do Texas e recebe mais de 11 milhões de visitantes por ano — mais do que o próprio Alamo, a apenas dois quarteirões de distância.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i23" alt="River Walk à beira do Rio San Antonio">
        <figcaption>O River Walk — à beira do Rio San Antonio, um nível abaixo da cidade</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências à beira d'água</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🚣</span><h3>Passeio de barcaça</h3><p>Os Rio Cruises percorrem 2,5 km do canal central em barcaças abertas para 40 pessoas, com narração sobre a história do rio. O passeio dura 35 minutos e é especialmente mágico ao entardecer, quando as luzes começam a se refletir na água.</p></div>
        <div class="mag-card"><span class="ic">🌙</span><h3>River Walk à noite</h3><p>A transformação noturna é dramática: milhares de luzes nas árvores ciprestes, reflexos dourados na água escura, música ao vivo vazando pelos restaurantes. Um dos passeios noturnos mais românticos dos EUA. Não deixe de ver a área do Arneson River Theatre.</p></div>
        <div class="mag-card"><span class="ic">🏰</span><h3>O Alamo (2 min a pé)</h3><p>A missão franciscana do século XVIII e cenário da batalha de 1836 fica a menos de 10 minutos a pé do coração do River Walk. Entrada gratuita. O contraste entre o silêncio austero da missão e o burburinho festivo do canal é uma experiência única de San Antonio.</p></div>
        <div class="mag-card"><span class="ic">🌮</span><h3>Jantar à beira do canal</h3><p>Mais de 50 restaurantes têm mesas diretamente no nível do canal. Do Tex-Mex autêntico à culinária contemporânea, jantar enquanto barcaças e pedestres passam a centímetros da sua mesa é um dos prazeres únicos da cidade.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>Pearl District (extremo norte)</h3><p>A antiga cervejaria Pearl, convertida em bairro gastronômico e cultural, marca o extremo norte do River Walk. Com mercado de produtores nos fins de semana, restaurantes de chef celebrados e lojas artesanais, é o polo mais sofisticado e menos turístico do passeio.</p></div>
        <div class="mag-card"><span class="ic">🎭</span><h3>Arneson River Theatre</h3><p>Um teatro ao ar livre único no mundo, com o palco numa margem e as arquibancadas na outra, separados pelo canal. Construído em 1939 como parte do projeto original, recebe shows de dança folclórica, concertos e apresentações culturais. Verifique a programação antes de ir.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">National Geographic Traveler</span>
        <p>O River Walk é o sonho de um arquiteto realizado por um acidente da história: uma tragédia transformada em beleza permanente, um rio que poderia ter sido enterrado e em vez disso floresceu.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌙</span>Vá à noite</h4><p>O River Walk é bonito de dia, mas é transformado à noite. As luzes nas árvores, os reflexos na água e o ambiente festivo são completamente diferentes — tente reservar pelo menos uma refeição noturna à beira do canal.</p></div>
        <div class="mag-tip"><h4><span class="ic">🗺️</span>Baixe o mapa offline</h4><p>O sistema de rampas e escadarias que conecta o nível da rua ao River Walk é confuso para iniciantes. O Google Maps funciona bem, mas tenha o mapa offline pois a conexão pode ser fraca abaixo do nível da rua.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍽️</span>Reserve com antecedência</h4><p>Os restaurantes no nível do canal (especialmente no fim de semana e no jantar) lotam rapidamente. Reserve com pelo menos 2–3 dias de antecedência no OpenTable ou direto com os restaurantes.</p></div>
        <div class="mag-tip"><h4><span class="ic">⚠️</span>Escadarias molhadas</h4><p>Após chuvas, as pedras das escadarias que descem ao canal ficam escorregadias. Use calçados com boa aderência e segure os corrimãos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>Explore além do trecho central</h4><p>A maioria dos turistas fica presa entre o Alamo e a Commerce Street. Caminhe até o Pearl District ao norte — a diferença de atmosfera é enorme e vale muito a pena.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Barco: compre na bilheteria física</h4><p>Evite os revendedores nas rampas. Compre diretamente nas bilheterias oficiais da Rio San Antonio Cruises para garantir o preço oficial e evitar cobranças duplicadas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎄</span>Festival de Luzes no Natal</h4><p>Se a viagem for em dezembro, o River Walk se transforma com 50.000 luzes coloridas decorando os ciprestes — uma das decorações de Natal mais bonitas dos EUA.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Calor extremo no verão</h4><p>San Antonio é quente e úmida de junho a agosto. O nível do canal é ligeiramente mais fresco, mas ainda assim planeje pausas em restaurantes com ar-condicionado a cada 45–60 minutos.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Quase foi um esgoto</b><span>Em 1921, após a enchente catastrófica, a maioria dos engenheiros e autoridades propunha canalizar o rio inteiramente em concreto e cobri-lo com uma via expressa. O projeto foi efetivamente aprovado antes de ser revertido graças à pressão de cidadãos e arquitetos. San Antonio quase perdeu seu maior tesouro para sempre.</span></div></li>
        <li><div><b>Um nível abaixo da realidade</b><span>O River Walk fica em média 6 metros abaixo do nível das ruas. Isso cria uma experiência quase surrealista: você pode estar a metros de uma avenida movimentada e sentir-se completamente em outro mundo, rodeado por ciprestes centenários e o som da água.</span></div></li>
        <li><div><b>As comportas que controlam o rio</b><span>Para prevenir novas enchentes, o rio tem um sistema sofisticado de comportas e um reservatório subterrâneo (o Olmos Dam) que pode conter o equivalente a 6 bilhões de litros d'água. Em risco de enchente, o nível do canal pode ser reduzido em horas.</span></div></li>
        <li><div><b>Mais visitado que o Alamo</b><span>Paradoxalmente, o Alamo — o monumento histórico mais famoso do Texas, a dois quarteirões — recebe cerca de 3 milhões de visitantes por ano. O River Walk, "apenas" um passeio urbano, recebe mais de 11 milhões. É o atrativo turístico mais visitado do Texas por larga margem.</span></div></li>
        <li><div><b>Os ciprestes têm mais de 200 anos</b><span>Os imponentes ciprestes-careca que bordejam o canal — alguns com mais de 200 anos — existiam muito antes do River Walk. Foram deliberadamente incorporados ao projeto de 1938 e hoje são elementos centrais da estética e da identidade do passeio. A cidade tem leis rígidas protegendo cada árvore.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer e beber</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Tex-Mex Refinado · River Walk</div><h3>Boudro's Texas Bistro</h3><div class="addr">📍 421 E Commerce St (nível do canal)</div><p>O restaurante mais celebrado diretamente no canal, com mesa ao nível d'água e culinária que eleva o Tex-Mex à alta gastronomia. O guacamole preparado à mesa com manga fresca e jalapeño é lendário em San Antonio. Reserva obrigatória.</p><span class="order">Pedir: guacamole à mesa</span></div>
      <div class="mag-resto"><div class="tier">Churrasco Texano · Pearl District</div><h3>The Granary 'Cue &amp; Brew</h3><div class="addr">📍 602 Avenue A · Pearl District</div><p>No extremo norte do River Walk, serve o melhor churrasco defumado de San Antonio. Brisket defumado por 18 horas, costelas suínas e salsichas artesanais. Ambiente de cervejaria, cerveja artesanal local, mesas longas compartilhadas.</p><span class="order">Pedir: brisket + costela suína</span></div>
      <div class="mag-resto"><div class="tier">Mexicano Clássico · Histórico · Desde 1946</div><h3>Casa Rio</h3><div class="addr">📍 430 E Commerce St</div><p>O restaurante mais antigo do River Walk e pioneiro na ideia de colocar mesas ao nível do canal. Comida mexicana tradicional, margaritas geladas e cadeiras coloridas à beira d'água. Não é o mais sofisticado, mas a história e a localização são incomparáveis.</p></div>
    </section>

      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">✈️</span>Do aeroporto</h4><p>O San Antonio International (SAT) fica a 13 km do centro. Uber/Lyft custam US$ 15–22 e levam 20–30 minutos. O ônibus VIA 5 (Airport Express) vai direto ao centro por US$ 1,30.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé</h4><p>Do centro histórico, acesse o River Walk por qualquer rampa nas ruas principais: Commerce, Market ou Losoya. As escadarias são sinalizadas com placas azuis "River Walk".</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>VIA Metropolitan</h4><p>Várias linhas chegam ao centro histórico. O VIA Streetcar (gratuito) percorre o centro, conectando a Alamo Plaza ao River Walk. Bilhete de ônibus regular: US$ 1,30.</p></div>

  <nav class="mag-crumbs">

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i24" alt="Parliament Hill">
    <div class="mag-eyebrow">Ottawa, Ontário · Canadá · Atração</div>
    <h1>Parliament <em>Hill</em></h1>
    <p class="mag-tagline">A colina mais importante do Canadá — Gothic Revival, chamas eternas e a alma de uma nação, com o melhor tour gratuito do país.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>Grátis</b><span>Tour incluso</span></div>
      <div class="m"><b>92 m</b><span>Torre da Paz</span></div>

    <div class="f"><span class="k">Estilo</span><span class="v">Gothic Revival</span></div>
    <div class="f"><span class="k">Canada Day</span><span class="v">1 de Julho · 50.000 pessoas</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dias 12 e 13</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A colina que fez uma nação</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Nota de viagem 2026 · Bloco Central em renovação</span>
        <p>O Centre Block (bloco central, com a Torre da Paz) está em renovação até aproximadamente 2028. O exterior e os terrenos continuam abertos e acessíveis. Tours do interior são realizados no East Block e no West Block, igualmente impressionantes. Verifique <em>parl.ca</em> para a programação atualizada.</p>
      </div>
      <div class="mag-prose">
        <p>Parliament Hill não é apenas o endereço do governo canadense — é o símbolo físico de como um país pacífico, diverso e deliberadamente não-americano escolheu se representar para o mundo.</p>
        <p>A escolha de Ottawa como capital do Canadá em 1857 foi, ela própria, um ato de diplomacia. A rainha Vitória, solicitada a decidir entre as cidades rivais de Toronto, Quebec, Kingston e Montreal, escolheu Ottawa — uma cidade pequena e geograficamente estratégica, suficientemente distante da fronteira americana para ser defendida em caso de invasão, e suficientemente neutra para não favorecer nem os colonos anglófonos de Ontário nem os francófonos de Quebec.</p>
        <p>Os edifícios do Parlamento foram erguidos entre 1859 e 1876 no estilo <em>Gothic Revival</em>, escolhido deliberadamente por evocar as tradições parlamentares britânicas — especialmente o Parlamento de Westminster em Londres. O arquiteto principal, Thomas Fuller, projetou torres, ameias e ornamentos inspirados nas catedrais medievais da Europa, mas adaptados ao clima brutal do norte canadense. O resultado é uma arquitetura de poder que parece ter brotado diretamente do calcário amarelado da própria colina.</p>
        <p>Um incêndio catastrófico em 1916 destruiu quase todo o Centre Block original, poupando apenas a Biblioteca do Parlamento — salva porque um funcionário teve a presença de espírito de fechar as portas de ferro a tempo. O bloco central foi reconstruído entre 1916 e 1927, com a Torre da Paz adicionada como memorial aos soldados canadenses da Primeira Guerra Mundial. É essa versão reconstruída — majestosa, austera e carregada de simbolismo — que os visitantes conhecem hoje.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i25" alt="Parliament Hill em detalhe">
        <figcaption>Parliament Hill — o Canadá em pedra calcária</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências na colina</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🔥</span><h3>A Chama Centenária</h3><p>A Centennial Flame arde ininterruptamente desde 1967, quando foi acesa para marcar o centenário da Confederação Canadense. Rodeada pelos escudos de armas de todas as províncias e territórios, é o ponto de encontro informal de Ottawa — e o melhor local para fotos com a Torre da Paz ao fundo.</p></div>
        <div class="mag-card"><span class="ic">🎖️</span><h3>Troca da Guarda</h3><p>De junho a agosto, todos os dias às 10h, os Foot Guards e a Governor General's Foot Guard realizam a cerimônia com uniformes históricos de gala — busbies de pele, casacas vermelhas e rifles reluzentes. Dura cerca de 30 minutos e é gratuita. Chegue 20 minutos antes.</p></div>
        <div class="mag-card"><span class="ic">🏛️</span><h3>Tour Gratuito do Parlamento</h3><p>Considerado por muitos o melhor tour gratuito do Canadá, inclui o East Block, com as câmaras históricas preservadas como estavam no século XIX, e o West Block, adaptado como câmara temporária durante a renovação. Reserve com antecedência no site oficial.</p></div>
        <div class="mag-card"><span class="ic">📚</span><h3>Biblioteca do Parlamento</h3><p>O único espaço que sobreviveu ao incêndio de 1916 é de beleza arrebatadora: sala circular de 16 m de altura, estantes de madeira escura em múltiplos andares, estátua de mármore da rainha Vitória ao centro e luz natural pelos vitrais. Um dos interiores mais bonitos do Canadá.</p></div>
        <div class="mag-card"><span class="ic">🍁</span><h3>Canada Day (1 de Julho)</h3><p>Parliament Hill é o epicentro das celebrações, com mais de 50.000 pessoas reunidas nos gramados. Shows musicais, fogos de artifício e a presença tradicional do Governador-Geral e do Primeiro-Ministro. Se sua viagem coincidir, é uma das experiências mais canadenses que existem.</p></div>
        <div class="mag-card"><span class="ic">🌅</span><h3>Vista do Rio Ottawa</h3><p>A traseira da colina oferece uma vista deslumbrante do Rio Ottawa e da margem de Quebec ao fundo, com as Gatineau Hills cobertas de neve no inverno. O jardim traseiro tem esculturas e monumentos, e é bem menos movimentado que a fachada principal.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">The Globe and Mail</span>
        <p>Nenhum outro lugar no Canadá carrega tanto peso simbólico, tanta história comprimida em pedra calcária — e ainda assim permanece completamente aberto ao público, gratuito, acessível a qualquer pessoa que queira caminhar até lá.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🎫</span>Reserve o tour com antecedência</h4><p>Os tours gratuitos têm vagas limitadas e se esgotam rápido, especialmente no verão. Acesse <em>parl.ca</em> e reserve com pelo menos 3–5 dias de antecedência. Tours em inglês e francês.</p></div>
        <div class="mag-tip"><h4><span class="ic">⏰</span>Chegue cedo para a Troca da Guarda</h4><p>Em dias de verão ensolarados, a cerimônia das 10h atrai grandes multidões. Chegue às 9h30 para garantir boa posição — especialmente se tiver crianças ou quiser fotografar.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛂</span>Controle de segurança</h4><p>Para entrar nos edifícios é necessário passar por detector de metais e apresentar documento com foto. Não leve grandes mochilas — os procedimentos podem demorar 15–20 minutos.</p></div>
        <div class="mag-tip"><h4><span class="ic">❄️</span>Verão vs. inverno</h4><p>No verão, os gramados ficam lotados de turistas e piqueniques. No inverno, a colina coberta de neve com a Torre da Paz é uma das imagens mais icônicas do Canadá — e o Canal Rideau congelado fica ali ao lado para patinar.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏛️</span>O East Block é subestimado</h4><p>A maioria foca no Centre Block (em reforma até 2028). O East Block, acessível, preserva salas do século XIX intactas — incluindo o gabinete original do primeiro primeiro-ministro do Canadá, John A. Macdonald.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛍️</span>Combine com o ByWard Market</h4><p>O mercado histórico fica a apenas 10 minutos a pé, descendo a rua. É o roteiro clássico de meio dia em Ottawa: Parlamento de manhã, almoço no ByWard Market à tarde.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔔</span>Carrilhão da Torre da Paz</h4><p>O carrilhão de sinos toca às 12h (verão) e em datas especiais. Se estiver nos arredores ao meio-dia, pare para ouvir — é um dos sons mais característicos de Ottawa.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>A biblioteca que sobreviveu ao fogo</b><span>O incêndio de 3 de fevereiro de 1916 destruiu o Centre Block em horas, numa noite de inverno a −20°C. A única estrutura que sobreviveu foi a Biblioteca do Parlamento, salva por um funcionário chamado Connolly que fechou as pesadas portas de ferro a tempo. Sem esse gesto, mais de 125.000 livros teriam sido perdidos.</span></div></li>
        <li><div><b>O segredo dos gatos do Parlamento</b><span>Por décadas, uma colônia de gatos semissalvagens viveu nos arredores da colina, alimentada por uma guardiã voluntária chamada René Chartrand, e tolerada como controladora de pragas. Quando a colônia foi removida nos anos 2000, gerou uma das maiores polêmicas de Ottawa — com petições, manifestações e cobertura nacional.</span></div></li>
        <li><div><b>A chama que nunca deveria ser permanente</b><span>A Centennial Flame foi acesa originalmente para durar apenas um ano — as celebrações do centenário de 1967. Foi tão bem recebida que o governo decidiu mantê-la permanentemente. Hoje arde há mais de 55 anos consecutivos, alimentada por gás natural.</span></div></li>
        <li><div><b>O centro geográfico de um impasse</b><span>A escolha de Ottawa como capital foi deliberadamente conciliatória: na fronteira entre Ontário (anglófono) e Quebec (francófono), era equidistante das duas maiores comunidades do Canadá. Até hoje, Ottawa é a única cidade bilíngue legalmente designada do país em nível federal.</span></div></li>
        <li><div><b>A reforma de $5 bilhões</b><span>A renovação atual do Centre Block — a maior na história do edifício — está orçada em mais de CAD $5 bilhões e deve durar até 2030. Inclui reforço estrutural completo, modernização de sistemas e restauração de todos os detalhes em pedra. É considerada a maior obra de restauração de um edifício histórico em andamento no hemisfério ocidental.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer e beber</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Canadense Clássico · Château Laurier · $$$</div><h3>Zoe's at the Château</h3><div class="addr">📍 1 Rideau St</div><p>No histórico Château Laurier, a menos de 5 minutos a pé da colina, serve culinária canadense contemporânea num ambiente art nouveau deslumbrante. Perfeito para o almoço após o tour do Parlamento. Reserva fortemente recomendada.</p></div>
      <div class="mag-resto"><div class="tier">Alta Culinária Canadense · $$$$</div><h3>Beckta Dining &amp; Wine</h3><div class="addr">📍 226 Nepean St</div><p>O restaurante mais premiado de Ottawa, com menu degustação focado em ingredientes canadenses de origem local. O chef Stephen Beckta é figura central da cena gastronômica da capital. Ambiente íntimo e elegante num casarão histórico. Reserva com dias de antecedência.</p></div>
      <div class="mag-resto"><div class="tier">Pub Canadense · Casual · $$</div><h3>The Highlander Pub</h3><div class="addr">📍 89 Sparks St</div><p>O pub mais próximo da colina, frequentado por parlamentares, jornalistas e funcionários públicos. Ambiente descontraído, boa seleção de cervejas canadenses e um cardápio de conforto com poutine e sanduíches generosos.</p></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>

      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>Metrô O-Train</h4><p>A linha Confederation (Linha 1) tem a estação Parliament a 300 metros da colina. Bilhete único: CAD $3,75. Passe diário por $11,25. A estação também conecta ao Aeroporto Internacional de Ottawa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>Ônibus OC Transpo</h4><p>Várias linhas chegam ao centro de Ottawa, com paradas próximas à colina. O Transit App tem rotas em tempo real. Integração gratuita entre ônibus e metrô com o mesmo bilhete por 90 minutos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé</h4><p>Do ByWard Market: 10 min. Do Château Laurier: 5 min. Do Canal Rideau (Locks): 8 min. Ottawa é eminentemente caminhável no centro histórico — a colina é o ponto de referência para tudo.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Estacionamento no centro é caro e limitado. Os lotes pagos mais próximos ficam na Wellington Street e na Metcalfe Street. Orçe CAD $20–30 por dia. Garagens do governo frequentemente disponíveis nos fins de semana por menos.</p></div>

      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Quase 200 anos de mercado</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Quando a maioria das cidades canadenses ainda era floresta, o ByWard Market já vendia verduras, madeira e carne salgada para os primeiros colonos que chegavam pelo Rio Ottawa. Nenhum outro lugar em Ottawa acumulou tantas camadas de história sobre um mesmo quarteirão.</p>
        <p>O mercado foi estabelecido em 1826 pelo coronel John By — o mesmo engenheiro militar que supervisionou a construção do Canal Rideau, o grandioso projeto de infraestrutura que ligaria Ottawa a Kingston em caso de nova guerra com os americanos. By dividiu o terreno ao norte da colina em lotes regulares para comerciantes e fazendeiros, criando o sistema de mercado ao ar livre que, com poucas transformações, persiste até hoje.</p>
        <p>Por mais de um século, o ByWard Market foi essencialmente um mercado agrícola — o lugar onde fazendeiros do vale do Ottawa traziam suas colheitas, criadores de gado vendiam animais e pescadores chegavam com o produto fresco do rio. O mercado interno, construído em 1927 e ainda em uso, foi projetado para abrigar vendedores durante os rigorosos invernos de Ottawa, quando expor mercadorias ao ar livre significaria perdê-las ao gelo.</p>
        <p>A transformação do ByWard em destino cultural e gastronômico acelerou nos anos 1980 e 1990, quando a área ao redor foi sendo ocupada por restaurantes, bares e boutiques. Hoje o "bairro ByWard" é um dos destinos noturnos mais animados de Ottawa, com dezenas de restaurantes, bares de coquetéis e cafés funcionando até as madrugadas de fim de semana. Mas o coração do mercado — as bancas de flores frescas, os agricultores e o cheiro de pão quente saindo das padarias — permanece essencialmente o mesmo há quase dois séculos.</p>
      </div>
      <figure class="mag-figure wide">

      <h2 class="mag-title">Experiências no mercado</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🦫</span><h3>BeaverTails — A iguaria original</h3><p>A barraca original de BeaverTails fica aqui — este é o local onde a pastilha de massa frita em forma de cauda de castor foi inventada em 1978. Polvilhada com canela e açúcar ou coberta com Nutella e banana, é a sobremesa símbolo do Canadá. Fila quase garantida, mas vale.</p></div>
        <div class="mag-card"><span class="ic">🌸</span><h3>Bancas de flores e produtores</h3><p>Na primavera e no verão, as bancas de flores frescas na entrada são uma explosão de cor que rivaliza com qualquer mercado europeu. Tulipas em maio (durante o festival nacional), girassóis no verão, abóboras no outono — cada estação transforma as bancas.</p></div>
        <div class="mag-card"><span class="ic">🧀</span><h3>Queijos e artesanato canadense</h3><p>O mercado coberto interno abriga vendedores de queijos artesanais do Quebec e Ontário, mel de trevo do vale do Ottawa, geleias de frutas silvestres e artesanato indígena. O melhor lugar de Ottawa para comprar presentes autenticamente canadenses, com história por trás de cada produto.</p></div>
        <div class="mag-card"><span class="ic">🌷</span><h3>Festival da Tulipa (maio)</h3><p>O Canadian Tulip Festival — o maior festival de tulipas do mundo fora da Holanda — usa o ByWard Market como sede de vários eventos. Em maio, a combinação das bancas de flores com as tulipas nos parques ao redor é de beleza rara. Mais de 1 milhão de tulipas florescem em Ottawa.</p></div>
        <div class="mag-card"><span class="ic">☕</span><h3>Cafés e brunch de bairro</h3><p>O bairro tem concentração extraordinária de cafés independentes e restaurantes de brunch. Nos fins de semana de manhã, locais e turistas lotam as mesas ao ar livre das ruas York e George para brunch com bagels, panquecas e cafés de especialidade.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Galerias e boutiques</h3><p>As ruas ao redor — especialmente a Sussex Drive e a York Street — abrigam galerias de arte, lojas de design canadense e boutiques de moda independentes. A Sussex Drive, que liga o ByWard à Parliament Hill, é também onde fica a residência oficial do Primeiro-Ministro.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">A invenção canadense mais deliciosa</span>
        <p>Em 1978, Grant e Pam Hooker montaram uma barraca no ByWard Market vendendo uma receita de família: massa de trigo frita, esticada no formato da cauda de um castor (o animal símbolo do Canadá), polvilhada com canela e açúcar. O sucesso foi imediato. Hoje a <strong>BeaverTails</strong> é uma rede com mais de 100 locais no Canadá e no exterior — mas a barraca original do ByWard Market ainda existe, e comer um BeaverTails ali é um ritual de passagem para qualquer visitante de Ottawa.</p>
      </div>
      <div class="mag-callout">
        <span class="lbl">Ottawa Citizen</span>
        <p>O ByWard Market é a prova de que algumas coisas não precisam mudar para permanecer relevantes. Quase dois séculos de mercado, e o cheiro de pão fresco e flores ainda é o melhor GPS de Ottawa.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🗓️</span>Sábado de manhã é o ápice</h4><p>O mercado funciona todos os dias, mas o sábado entre 9h e 13h é quando os produtores trazem o melhor produto fresco, as flores estão mais abundantes e o ambiente atinge seu pico de animação.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏛️</span>Combine com a Parliament Hill</h4><p>O trajeto clássico de meio dia: visite a Parliament Hill de manhã (tour gratuito às 10h), caminhe 10 minutos até o ByWard Market para almoço e café da tarde. Distância: 900 metros pela Sussex Drive.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍟</span>Poutine: compare antes de escolher</h4><p>Há pelo menos 6 lugares no mercado e arredores servindo poutine. A discussão sobre quem faz a melhor de Ottawa é tão séria quanto a política canadense. Tente pelo menos dois locais para formar sua opinião.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏠</span>O mercado coberto é subestimado</h4><p>A maioria dos turistas fica apenas nas bancas externas. O mercado coberto interno tem vendedores de produtos artesanais, queijeiros, confeiteiros e artistas locais — e é muito mais tranquilo que as ruas em volta.</p></div>
        <div class="mag-tip"><h4><span class="ic">🦫</span>Chegue cedo para BeaverTails</h4><p>Nos fins de semana de verão, a fila da barraca original pode ter 20–30 minutos. Chegue antes das 10h ou no início da tarde para evitar o pico. O original com canela e açúcar continua sendo o melhor.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Vida noturna intensa</h4><p>O bairro se transforma após as 21h — especialmente nas ruas York e Clarence. Bares, música ao vivo e restaurantes animados atraem uma multidão jovem. Uma das melhores opções de entretenimento noturno de Ottawa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🍁</span>Compras canadenses</h4><p>Xarope de bordo, artesanato indígena autêntico e queijos locais são os melhores presentes para levar do ByWard. Prefira vendedores no mercado coberto — produtos mais autênticos e preços mais justos que nas lojas turísticas.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌷</span>Festival da Tulipa em maio</h4><p>Em maio, o ByWard Market é parte central do Canadian Tulip Festival. Bancas especiais, eventos culturais e a beleza das tulipas em cada esquina tornam este o melhor mês para visitar Ottawa.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Obama comeu aqui</b><span>Durante sua visita oficial ao Canadá em 2009, o presidente Barack Obama pediu especificamente para visitar o ByWard Market e comer um BeaverTail. A visita gerou cobertura global e transformou o mercado num destino ainda mais procurado por turistas americanos. A barraca mantém até hoje uma foto emoldurada do momento.</span></div></li>
        <li><div><b>A poutine como diplomacia cultural</b><span>Ottawa tem a reputação de servir a melhor poutine fora do Quebec — e o ByWard Market é o epicentro dessa disputa. A poutine (batatas fritas com queijo coalho e gravy) foi criada no Quebec nos anos 1950, mas hoje é considerada o prato nacional não-oficial do Canadá. Cada barraca do ByWard tem sua versão secreta.</span></div></li>
        <li><div><b>A Sussex Drive mais famosa</b><span>A rua que margeia o ByWard Market — Sussex Drive — é a mais cerimonial do Canadá. Além da residência do Primeiro-Ministro (número 24), abriga a residência do Governador-Geral (Rideau Hall), a embaixada americana e vários consulados. É também a rota do cortejo oficial durante visitas de chefes de estado.</span></div></li>
        <li><div><b>O mercado que resistiu aos shoppings</b><span>Nos anos 1970 e 1980, quando shoppings modernos ameaçavam esvaziar os mercados tradicionais na América do Norte, o ByWard resistiu graças a uma política municipal que proibiu grandes redes varejistas de se instalarem no bairro. Essa decisão, controversa na época, salvou o caráter único do mercado e hoje é citada como modelo de preservação urbana.</span></div></li>
        <li><div><b>A origem do nome "ByWard"</b><span>O nome é uma homenagem ao coronel John By, o engenheiro militar britânico que desenhou Ottawa (então Bytown) e estabeleceu o mercado em 1826. "Ward" refere-se ao distrito administrativo que ele criou — o "By's Ward". O mercado é, portanto, literalmente "o mercado do distrito do coronel By".</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer e beber</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Canadense Contemporâneo · Premiado · $$$</div><h3>Play Food &amp; Wine</h3><div class="addr">📍 1 York St</div><p>Um dos restaurantes mais aclamados de Ottawa, com menu de pequenos pratos (tapas estilo canadense) e lista de vinhos notável. O chef Stéphane Gravel usa ingredientes sazonais da região de Ottawa-Gatineau. Ambiente descontraído mas cuidadosamente editado. Reserva altamente recomendada.</p></div>
      <div class="mag-resto"><div class="tier">Café e Brunch · Favorito local · $$</div><h3>Wilf &amp; Ada's</h3><div class="addr">📍 246 Dalhousie St</div><p>O café favorito dos moradores para brunch de fim de semana. Ovos beneditinos criativos, tostadas com abacate e salmão defumado, bagels com cream cheese e gravlax. Fila nas manhãs de sábado, mas o café — de torra local — já vale a espera.</p></div>
      <div class="mag-resto"><div class="tier">Doce Canadense · Icônico · $</div><h3>BeaverTails — Barraca Original</h3><div class="addr">📍 ByWard Market Square</div><p>A barraca original, fundada em 1978. O BeaverTail clássico vem com canela e açúcar, mas as variações com Nutella, Reese's ou limão siciliano são igualmente irresistíveis. Consumir ao ar livre caminhando pelo mercado é parte da experiência.</p><span class="order">Custo: CAD $6–9 por unidade</span></div>

        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé</h4><p>Da Parliament Hill: 10 minutos pela Sussex Drive. Do Château Laurier: 5 minutos. Do Canal Rideau (Locks): 8 minutos. O ByWard Market fica no coração do centro histórico — tudo é acessível a pé.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚇</span>O-Train</h4><p>A estação Parliament (Linha 1) fica a 12 minutos a pé do mercado, descendo pela Sussex Drive. A estação Rideau, na extremidade leste da linha, fica a apenas 7 minutos a pé e é mais conveniente para o mercado.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚴</span>Bicicleta</h4><p>Ottawa tem excelente infraestrutura cicloviária. O sistema de bike-share Capital Bikeshare tem estações no ByWard Market e ao longo da Sussex Drive. O passeio pela beira do Canal Rideau até o mercado é um dos programas mais agradáveis da cidade.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>Vários estacionamentos pagos nas ruas Clarence, York e Murray. Garagens no Marriott Ottawa (55 Colonel By Dr) e no Ottawa Convention Centre são mais baratas que as ruas. CAD $15–25 por dia. Alguns oferecem tarifas especiais de tarde nos fins de semana.</p></div>

    <h1>Basílica <em>Notre-Dame</em></h1>
    <p class="mag-tagline">O interior mais extraordinário do Canadá — teto azul cobalto, 11.000 tubos de órgão e um espetáculo de luz que paralisa o tempo.</p>
    <div class="mag-hero-meta">

    <div class="f"><span class="k">Tubos de órgão</span><span class="v">11.000 · Casavant Frères</span></div>
    <div class="f"><span class="k">Show AURA</span><span class="v">CAD $30–50 por pessoa</span></div>

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A catedral que definiu uma cidade</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Notre-Dame de Montréal não é apenas a basílica mais visitada do Canadá — é a prova de que a audácia arquitetônica pode transformar uma cidade inteira. Quando foi inaugurada em 1829, era o maior edifício religioso da América do Norte.</p>
        <p>A história começa com uma ironia cultural: a basílica mais emblemática de Montréal foi projetada por um arquiteto protestante americano. <strong>James O'Donnell</strong>, nascido na Irlanda e radicado em Nova York, ganhou o concurso em 1823 com um projeto de Gothic Revival que os padres sulpicianos adotaram imediatamente. O'Donnell ficou tão encantado com o trabalho que se converteu ao catolicismo antes de morrer em 1830 — e foi o único não-padre sepultado na cripta da basílica, distinção que mantém até hoje.</p>
        <p>A construção durou de 1824 a 1829, e o edifício foi imediatamente reconhecido como uma maravilha. As duas torres da fachada — a Perseverance (leste) e a Temperance (oeste) — foram as estruturas mais altas de Montréal por décadas. A nave principal, com capacidade para 3.000 pessoas, foi projetada para impressionar convertidos e fiéis com a grandiosidade da fé católica numa época em que a Igreja era a principal instituição social do Quebec francófono.</p>
        <p>A transformação do interior que conhecemos hoje veio em 1872, quando o arquiteto <strong>Victor Bourgeau</strong> redesenhou o santuário. Foi Bourgeau quem criou o extraordinário interior azul-cobalto salpicado de dourado: os arcos com folhas de ouro, as estátuas de madeira pintada, os vitrais importados de Limoges e, acima de tudo, o teto de azul profundo com estrelas douradas que evoca simultaneamente o céu noturno e o manto da Virgem Maria. É considerado um dos interiores religiosos mais belos das Américas.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i29" alt="Interior da Basílica Notre-Dame">
        <figcaption>Basílica Notre-Dame — interior azul-cobalto e dourado</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Experiência imperdível · AURA</span>
        <p>Desde 2017, a basílica recebe o espetáculo imersivo da <strong>Moment Factory</strong> (estúdio por trás de projeções para Madonna e Nine Inch Nails). Durante 45 minutos, o interior é transformado por projeções em mapping 3D, música orquestral e luz que revelam camadas da história do edifício. Renovado em 2022. <strong>Reserva antecipada é essencial</strong> — os shows lotam semanas antes no verão. Reserve em basiliquenotredame.ca.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências na basílica</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">💙</span><h3>O interior azul-cobalto</h3><p>Ao entrar pela porta principal, o impacto é imediato. O azul profundo do teto — pontilhado de estrelas douradas em relevo — cria a sensação de estar dentro de uma noite estrelada. Dedique pelo menos 20 minutos observando os detalhes: nenhuma foto captura a escala e a profundidade da cor.</p></div>
        <div class="mag-card"><span class="ic">🎵</span><h3>O órgão Casavant Frères</h3><p>O órgão de 11.000 tubos instalado em 1891, construído pelos irmãos Casavant de Saint-Hyacinthe (Quebec), é um dos maiores instrumentos de tubos do Canadá. Concertos ocorrem periodicamente — verifique a programação. Mesmo em silêncio, ocupa toda a contrafachada com grandiosidade.</p></div>
        <div class="mag-card"><span class="ic">🪵</span><h3>Capelas laterais e retábulos</h3><p>As capelas laterais contêm retábulos de madeira entalhada e dourada de qualidade excepcional, muitos do século XIX. A Chapelle du Sacré-Coeur (1891) tem um retábulo moderno em bronze de Charles Daudelin (1988) que contrasta dramaticamente com o Gothic Revival ao redor.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Vitrais de Limoges</h3><p>Importados de Limoges (França) em 1929 para o centenário do edifício, não retratam cenas bíblicas tradicionais — mas sim a história religiosa de Montréal e do Quebec. Uma escolha iconográfica incomum que os guias adoram explicar em detalhe.</p></div>
        <div class="mag-card"><span class="ic">🌙</span><h3>Show AURA (noturno)</h3><p>O espetáculo da Moment Factory transforma a basílica num teatro de luz e som. Sessões às 18h30 e 20h de quarta a domingo (verificar calendário). Completamente diferente da visita diurna — e igualmente essencial. Reserve com semanas de antecedência no verão.</p></div>
        <div class="mag-card"><span class="ic">📍</span><h3>Place d'Armes ao redor</h3><p>A praça em frente é o coração histórico de Montréal, com a estátua de Paul de Chomedey (fundador da cidade) ao centro. Ao redor, alguns dos mais belos exemplos de arquitetura neoclássica e art déco da cidade. Uma hora explorando a praça complementa a visita.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">Architectural Digest</span>
        <p>Entrar na Notre-Dame de Montréal é como ser engolido pelo céu noturno — o azul profundo, as estrelas douradas, o silêncio carregado de séculos. É um dos interiores mais perturbadoramente belos do hemisfério ocidental.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌗</span>Visite de manhã E à noite</h4><p>A visita diurna (com luz natural pelos vitrais) e o show AURA noturno são experiências completamente distintas e igualmente memoráveis. Se possível, faça as duas no mesmo dia: pela manhã e volte para o show à noite.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎫</span>Reserve o AURA com antecedência</h4><p>No verão (junho–agosto), as sessões podem esgotar com 2–3 semanas de antecedência. Reserve no site oficial antes de chegar a Montréal. Os ingressos não são reembolsáveis — confirme as datas da viagem primeiro.</p></div>
        <div class="mag-tip"><h4><span class="ic">👔</span>Código de vestimenta</h4><p>A basílica é um local de culto ativo. Cubra os ombros e evite shorts muito curtos. Na entrada há lenços para empréstimo. Nos fins de semana pela manhã podem ocorrer missas — a visita turística fica restrita durante os ofícios.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧑‍🏫</span>Tour guiado vale muito</h4><p>Os guias da basílica (CAD $6 adicional) fornecem contexto histórico e teológico que transforma a experiência. Pergunte sobre o significado iconográfico dos vitrais — a história da Igreja no Quebec que eles retratam é fascinante.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>Fotografia</h4><p>Permitida sem flash durante a visita. A melhor foto do interior é da entrada central, olhando para o altar — você captura o teto azul, a nave completa e o retábulo dourado numa única imagem. Leve lente grande-angular.</p></div>
        <div class="mag-tip"><h4><span class="ic">🏛️</span>Combine com o Vieux-Montréal</h4><p>A basílica fica no coração do Vieux-Montréal. Reserve pelo menos 3 horas para explorar as ruas de paralelepípedos, os armazéns do século XIX convertidos em restaurantes e as margens do Rio São Lourenço a poucos quarteirões.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Bilhetes combinados</h4><p>O ingresso padrão (CAD $6) dá acesso à nave e às capelas laterais. O combinado com o AURA (CAD $45–55) inclui ambas as visitas com desconto. Vale para quem planeja fazer as duas atividades.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Céline Dion se casou aqui</b><span>Em 17 de dezembro de 1994, Céline Dion e seu empresário René Angélil realizaram aqui uma cerimônia que parou Montréal. A noiva usou um vestido de Mirella e Steven Gentile com tiara de pedras preciosas e véu de seis metros. Centenas de fãs esperaram do lado de fora sob a neve.</span></div></li>
        <li><div><b>O arquiteto protestante que se converteu</b><span>James O'Donnell era protestante quando ganhou o concurso para projetar a maior basílica católica da América do Norte. Durante a construção, ficou tão tocado que se converteu ao catolicismo — tornando-se o único não-padre sepultado na cripta. Seu túmulo pode ser visitado na visita guiada.</span></div></li>
        <li><div><b>11.000 tubos, uma família</b><span>O órgão Casavant Frères foi construído pelos irmãos Joseph-Claver e Claver-Zoël Casavant, de Saint-Hyacinthe. A família é responsável por mais de 3.700 órgãos no mundo — a maior fabricante de órgãos de tubos do hemisfério ocidental. A empresa opera no mesmo endereço desde 1879.</span></div></li>
        <li><div><b>O teto que não é pintado</b><span>O famoso azul-cobalto do teto não é tinta — é uma ilusão criada por revestimento de madeira entalhada e pintada em camadas superpostas, com relevos dourados que criam profundidade. Quando Bourgeau redesenhou o interior em 1872, o desafio técnico era considerável. O resultado ainda surpreende especialistas em conservação.</span></div></li>
        <li><div><b>Maior da América do Norte em 1829</b><span>Quando inaugurada, era o maior edifício religioso de toda a América do Norte — maior do que qualquer catedral americana ou canadense da época. Essa distinção durou décadas. Ter sido construída numa cidade colonial relativamente pequena torna o feito ainda mais extraordinário.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer e beber</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Marisco e Charcuterie · Chef Chuck Hughes · $$$</div><h3>Garde Manger</h3><div class="addr">📍 408 Rue Saint-François-Xavier</div><p>O restaurante mais celebrado do Vieux-Montréal, do chef televisivo Chuck Hughes. Num antigo armazém de pedra do século XIX, serve frutos do mar excepcionais e charcuterie artesanal num ambiente íntimo. Reserva obrigatória — especialmente nos fins de semana. A 5 minutos a pé da basílica.</p></div>
      <div class="mag-resto"><div class="tier">Café Especial · Espaço Histórico · $</div><h3>Crew Collective &amp; Café</h3><div class="addr">📍 360 Rue Saint-Jacques</div><p>Instalado na antiga sede do Royal Bank of Canada (1928), com teto de 12 metros, arcos neoclássicos e lustres dourados, é um dos espaços mais impressionantes de Montréal. Café de especialidade excelente, brunch nos fins de semana, atmosfera cinematográfica. A 3 minutos da basílica.</p></div>
      <div class="mag-resto"><div class="tier">Bistrô Quebequense · Brasserie · $$$</div><h3>Taverne Gaspar</h3><div class="addr">📍 901 Square Victoria</div><p>No térreo do Hotel W Montréal, na Place d'Armes em frente à basílica, serve culinária quebequense contemporânea com excelente seleção de cervejas artesanais locais. Perfeito para o jantar antes do show AURA. Ambiente animado, sem dress code rígido.</p></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>Metrô STM</h4><p>Estação Place-d'Armes (Linha Orange), saída direta para a Place d'Armes em frente à basílica. Bilhete único CAD $3.75, passe diário CAD $11. O metrô de Montréal é rápido, limpo e confiável — a melhor opção do centro.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé pelo Vieux-Montréal</h4><p>Do Vieux-Port: 8 minutos. Do Château Ramezay: 10 minutos. Da Gare Centrale: 15 minutos. O Vieux-Montréal inteiro é acessível a pé — e o passeio pelas ruas de paralelepípedo é parte essencial da experiência.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚲</span>BIXI Bike-Share</h4><p>O sistema BIXI tem estações no Vieux-Montréal. Acesso por aplicativo, CAD $1.25 desbloqueio + $0.20/min. Ótimo para explorar o bairro histórico antes ou depois da visita. Várias ciclovias próximas.</p></div>

<article class="mag" data-theme="montreal">

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i30" alt="Parc du Mont-Royal">
    <div class="mag-eyebrow">Montréal, Quebec · Canadá · Atração</div>
    <h1>Parc du <em>Mont-Royal</em></h1>
    <p class="mag-tagline">O pulmão verde de Montréal — desenhado por Olmsted, coroado por uma cruz iluminada e amado por cada geração da cidade.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>200 ha</b><span>Parque urbano</span></div>
      <div class="m"><b>233 m</b><span>Altitude</span></div>
      <div class="m"><b>Grátis</b><span>Sempre aberto</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Área</span><span class="v">200 ha de parque urbano</span></div>
    <div class="f"><span class="k">Altitude</span><span class="v">233 m acima do nível do mar</span></div>
    <div class="f"><span class="k">Projetado por</span><span class="v">Olmsted · 1876</span></div>
    <div class="f"><span class="k">Entrada</span><span class="v">Gratuita · sempre aberto</span></div>
    <div class="f"><span class="k">Cruz iluminada</span><span class="v">31 m · visível a 80 km</span></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A montanha que nomeou uma cidade</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>A montanha que deu nome a Montréal — "Monte Real", o monte real avistado por Jacques Cartier em 1535 — hoje abriga um dos parques urbanos mais extraordinários das Américas, desenhado pelo mesmo homem que criou o Central Park de Nova York.</p>
        <p>Por séculos, o Mont-Royal foi alternadamente terra indígena, propriedade religiosa, campo agrícola e área residencial disputada. As universidades McGill e Université de Montréal instalaram seus câmpus nas encostas inferiores no século XIX, e cemitérios históricos — o Mount Royal Cemetery e o Cimetière Notre-Dame-des-Neiges, dois dos mais belos cemitérios paisagísticos da América do Norte — ocupam faixas substanciais da colina desde os anos 1850.</p>
        <p>A criação do parque foi uma batalha. Depois que especuladores compraram terras no alto da montanha e começaram a derrubar árvores nos anos 1870, os cidadãos pressionaram a cidade. Em 1876, a municipalidade contratou <strong>Frederick Law Olmsted</strong> — que acabara de completar o Central Park — para desenhar um parque público no Mont-Royal. Olmsted passou vários dias percorrendo a colina antes de apresentar seu plano, que seguia seu princípio fundamental: não impor ao terreno uma ordem artificial, mas revelar e ampliar a beleza natural já existente.</p>
        <p>O parque reflete fielmente a filosofia de Olmsted: caminhos que seguem a topografia natural, áreas abertas que alternam com bosques densos, mirantes posicionados para maximizar as vistas sem dramatismo excessivo. A única grande adição posterior foi a cruz de aço iluminada no cume, erguida em 1924 em homenagem a uma promessa do fundador de Montréal, Paul de Chomedey, que em 1643 prometera erguer uma cruz no monte se a cidade sobrevivesse às cheias do São Lourenço. A cruz, iluminada à noite e visível a até 80 quilômetros, tornou-se o símbolo mais reconhecível do horizonte de Montréal.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i31" alt="Vista de Montréal do Mont-Royal">
        <figcaption>Mont-Royal — a vista panorâmica de Montréal</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências na montanha</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏔️</span><h3>Belvédère Kondiaronk</h3><p>O mirante principal, ao lado do Chalet du Mont-Royal, oferece a vista panorâmica mais famosa de Montréal: o skyline completo, o Rio São Lourenço ao fundo e, em dias claros, os Apalaches no horizonte. É de onde o cartão-postal clássico é tirado. Imperdível ao entardecer.</p></div>
        <div class="mag-card"><span class="ic">🏠</span><h3>Chalet du Mont-Royal</h3><p>O chalé histórico no cume, construído em 1932, é o ponto de referência central do parque. O interior tem murais que narram a história de Montréal, e o terraço frontal oferece a vista mais fotografada. Café e lanchonete no verão. Ponto de partida ideal para explorar o parque.</p></div>
        <div class="mag-card"><span class="ic">✝️</span><h3>A Cruz Iluminada</h3><p>A cruz de aço de 31 metros no ponto mais alto é visível de praticamente qualquer ponto de Montréal à noite. Mas estar ao pé dela no topo da montanha — especialmente ao entardecer, quando começa a iluminar-se sobre o horizonte — é completamente diferente e muito mais poderoso.</p></div>
        <div class="mag-card"><span class="ic">🥁</span><h3>Tam-Tams do Domingo</h3><p>Todo domingo de verão (maio a outubro), um evento espontâneo e não-organizado acontece ao redor do monumento Sir George-Étienne Cartier: centenas de pessoas tocam djembês e tambores africanos, outros dançam, alguns jogam frescobol, muitos apenas observam. A tradição mais autenticamente montrealer que existe. Gratuito.</p></div>
        <div class="mag-card"><span class="ic">⛷️</span><h3>Inverno: Esqui e Trenó</h3><p>No inverno, o Mont-Royal se transforma. Pistas de esqui cross-country, trilhas para raquetes de neve e declives para trenó tornam o parque vibrante sob a neve. O Lac aux Castors congela e vira pista de patinação gratuita, com aluguel de patins disponível.</p></div>
        <div class="mag-card"><span class="ic">🍂</span><h3>Outono: Foliagem espetacular</h3><p>De meados de setembro a meados de outubro, o Mont-Royal se cobre de vermelho, laranja e dourado numa explosão que rivaliza com qualquer parque do nordeste americano. As trilhas arborizadas da Olmsted Road — que circunda a montanha — são particularmente deslumbrantes.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">Tam-Tams: a tradição que não tem dono</span>
        <p>Os Tam-Tams começaram no final dos anos 1970 como um ajuntamento informal de músicos e boêmios ao redor do monumento de Cartier. Ninguém os organiza, ninguém os autoriza, ninguém cobra ingresso. Simplesmente acontecem. No pico do verão, mais de 1.000 pessoas participam — percussionistas, dançarinos, praticantes de batalhas medievais (sim, existe um grupo que reenena batalhas todo domingo), vendedores ambulantes, malabaristas e quem só quer sentar na grama e deixar o domingo passar devagar. É o evento mais montrealês que existe.</p>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">O Parque Através das Estações</div>
      <h2 class="mag-title">Cada estação, uma experiência</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🌷</span><h3>Primavera · Mar–Mai</h3><p>Renascimento gradual da vegetação, flores silvestres nas trilhas, retorno dos Tam-Tams em maio. O parque ressurge da neve com energia renovada. Ideal para caminhadas longas e observação de pássaros migrantes.</p></div>
        <div class="mag-card"><span class="ic">☀️</span><h3>Verão · Jun–Ago</h3><p>Alta estação: Tam-Tams todo domingo, piqueniques, ciclismo, vistas cristalinas. Multidões no Belvédère ao entardecer. Noites quentes e animadas. Melhor época para o mirante e o chalé.</p></div>
        <div class="mag-card"><span class="ic">🍁</span><h3>Outono · Set–Nov</h3><p>A estação mais espetacular visualmente: foliagem de cores impossíveis cobre cada trilha. Setembro e outubro são considerados o melhor período do ano para visitar Montréal por muitos viajantes experientes.</p></div>
        <div class="mag-card"><span class="ic">❄️</span><h3>Inverno · Dez–Fev</h3><p>Transformação total: esqui cross-country, patinação no Lac aux Castors, trenó nas encostas. A cruz iluminada sobre a neve branca é uma das imagens mais bonitas de Montréal. Experiência autenticamente quebequense.</p></div>
      </div>
      <div class="mag-callout">
        <span class="lbl">Le Devoir, Montréal</span>
        <p>O Mont-Royal é o coração verde de Montréal — não apenas um parque, mas o lugar onde a cidade inteira vai respirar, se reunir, apaixonar-se e lembrar por que escolheu viver aqui.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🌅</span>Vá ao entardecer</h4><p>A vista do Belvédère Kondiaronk ao pôr do sol é de uma beleza que paralisa. Chegue 45 minutos antes do pôr do sol para garantir lugar no mirante e assistir à cidade se iluminar gradualmente abaixo.</p></div>
        <div class="mag-tip"><h4><span class="ic">🥁</span>Tam-Tams no domingo</h4><p>Se sua viagem incluir um domingo entre maio e outubro, os Tam-Tams ao redor do monumento de Cartier são obrigatórios. Chegue entre 14h e 15h para o pico da animação. Leve uma toalha para sentar na grama.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>Suba pelo caminho de Olmsted</h4><p>A Olmsted Road — o caminho em curva que sobe a montanha seguindo o contorno natural — foi desenhada pelo próprio Olmsted para ser o caminho "certo" de subir. Leva 30–40 minutos a pé e é muito mais bonita que os atalhos diretos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚴</span>Bicicleta é a melhor opção</h4><p>O parque tem ciclovias e a descida pela Olmsted Road é pura diversão. O sistema BIXI tem estações na base da montanha, próximas às estações de metrô Mont-Royal e Édouard-Montpetit.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧺</span>Leve comida para piquenique</h4><p>Há apenas um café no Chalet (verão) e uma lanchonete perto do Lac aux Castors. Para uma experiência completa, compre pão, queijo e vinho num mercado do Plateau-Mont-Royal e faça um piquenique no mirante.</p></div>
        <div class="mag-tip"><h4><span class="ic">🪦</span>Explore os cemitérios vizinhos</h4><p>O Mount Royal Cemetery e o Cimetière Notre-Dame-des-Neiges, adjacentes ao parque, são obras-primas de arquitetura paisagística vitoriana — monumentos históricos, natureza exuberante e silêncio profundo. Abertos ao público, merecem uma hora.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Vista noturna da cruz</h4><p>Para ver a cruz iluminada do alto (em vez de olhar para ela de baixo), suba ao mirante após o anoitecer e observe a cidade iluminada. A combinação das luzes da cidade com a cruz dourada ao fundo é inesquecível.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌳</span>Descida pelo Plateau</h4><p>A descida pela face leste leva ao bairro Plateau-Mont-Royal — o mais vibrante e boêmio, com cafés independentes, restaurantes criativos e a famosa Avenue du Mont-Royal. A combinação parque + bairro é o programa perfeito de um dia.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O mesmo homem do Central Park</b><span>Frederick Law Olmsted é considerado o pai da arquitetura paisagística americana. Além do Central Park (1858) e do Mont-Royal (1876), projetou o Prospect Park, o campus de Stanford, as áreas verdes da Exposição de Chicago (1893) e mais de 500 parques. O Mont-Royal é considerado um dos seus trabalhos mais puros — o terreno irregular o forçou a seguir ainda mais rigidamente seus princípios de respeito à natureza.</span></div></li>
        <li><div><b>A cruz é uma promessa de 1643</b><span>A cruz que coroa o cume honra uma promessa feita 281 anos antes de ser construída. Em 1643, durante uma enchente catastrófica do São Lourenço, Paul de Chomedey de Maisonneuve — fundador de Ville-Marie — prometeu que, se a cidade sobrevivesse, ele próprio carregaria uma cruz até o topo. A cidade sobreviveu, ele cumpriu, e a cruz atual (1924, em aço) é a herdeira direta desse gesto.</span></div></li>
        <li><div><b>Montréal em três idiomas</b><span>O nome "Montréal" vem do francês "Mont Réal" (Monte Real), tradução do italiano "Monte Reale" — o nome que Jacques Cartier, navegante bretão a serviço do rei de França, deu à montanha em 1535 em homenagem ao rei Francisco I. O nome da cidade é, portanto, uma tradução francesa de uma expressão italiana do século XVI em homenagem a um monarca que nunca pisou no Canadá.</span></div></li>
        <li><div><b>A cruz muda de cor</b><span>A iluminação da cruz não é sempre branca. Em ocasiões especiais ela muda: lilás durante a quaresma, azul no Dia de Nossa Senhora, arco-íris durante celebrações da diversidade. Cada mudança tem significado específico e é gerenciada pela Ville de Montréal em coordenação com instituições religiosas e culturais.</span></div></li>
        <li><div><b>Visível de 80 km</b><span>A cruz iluminada de 31 metros é visível a olho nu de até 80 quilômetros em noites claras — o que significa que visitantes chegando de avião frequentemente a avistam antes de qualquer outro elemento da cidade. É, sem dúvida, o símbolo visual mais reconhecível do horizonte montrealês.</span></div></li>
      </ul>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer e beber</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Bistrô Francês Clássico · Plateau · $$$</div><h3>L'Express</h3><div class="addr">📍 3927 Rue Saint-Denis</div><p>O bistrô mais icônico de Montréal, aberto desde 1980 sem interrupção no Plateau-Mont-Royal. Steak tartare, moules marinière, crème brûlée e uma lista de vinhos de Borgonha que envergonharia Paris. Ambiente autenticamente parisiense, atendimento francófono. Reserva obrigatória.</p></div>
      <div class="mag-resto"><div class="tier">Café Italiano · Legendário · $</div><h3>Café Olimpico</h3><div class="addr">📍 124 Rue Saint-Viateur Ouest</div><p>O café mais famoso de Montréal, no Mile End — a 15 minutos a pé da base do Mont-Royal. Espresso e cappuccino preparados com rigor italiano desde 1970. Fila permanente no fim de semana, mas o café justifica qualquer espera. Uma instituição da cidade.</p></div>
      <div class="mag-resto"><div class="tier">Café Casual · No Parque · $</div><h3>Chalet du Mont-Royal (Café)</h3><div class="addr">📍 Chalet du Mont-Royal (cume)</div><p>O café no interior do Chalet histórico serve bebidas quentes, sanduíches, sopas e sobremesas simples de maio a outubro. Preços razoáveis, qualidade decente e uma localização — no topo da montanha, a dois passos da vista panorâmica — absolutamente insuperável.</p></div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>Metrô + caminhada</h4><p>Estação Mont-Royal (Linha Orange): 25 min a pé pela Avenue du Mont-Royal e depois subindo pelo parque. Estação Édouard-Montpetit (Linha Bleue): acesso pela face norte, mais íngreme mas menos movimentada. Bilhete STM CAD $3.75.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>Ônibus 11 (Mont-Royal)</h4><p>O ônibus 11 da STM parte da estação de metrô Mont-Royal e sobe até o Lac aux Castors, no coração do parque. A cada 12–15 minutos nos fins de semana de verão. Integração gratuita com o metrô no mesmo bilhete.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚴</span>BIXI Bike-Share</h4><p>Estações BIXI nas ruas Duluth, Pine e Rachel, na base. A subida pela Olmsted Road de bicicleta é desafiadora mas recompensadora. A descida é pura alegria. CAD $1.25 desbloqueio + $0.20/min ou passe diário por $8.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Estacionamento pago (CAD $5–10) no Lac aux Castors e próximo ao Chalet. Acesso principal pela Voie Camillien-Houde, que atravessa o parque de leste a oeste. Nos fins de semana de verão, o trânsito pode ser lento — prefira o transporte público.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A aposta cultural de Dallas</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Nos anos 1980, Dallas decidiu que queria ser mais do que petróleo e negócios. O resultado, três décadas depois, é o maior distrito de artes contíguo dos Estados Unidos — 20 quarteirões onde arquitetos de classe mundial construíram obras-primas para abrigar arte de classe mundial.</p>
        <p>O projeto nasceu de uma visão ambiciosa: concentrar as principais instituições culturais de Dallas num único corredor urbano denso, caminhável, vivo. O plano original data de 1982, quando a cidade começou a adquirir terrenos no nordeste do centro histórico. Nos anos seguintes, um desfile de arquitetos que incluiu <strong>I. M. Pei, Renzo Piano, Norman Foster e Rem Koolhaas</strong> foi convocado para construir os edifícios que hoje definem o distrito.</p>
        <p>O resultado é notável: em menos de dez minutos a pé é possível passar de um teatro de ópera de acústica de ponta para um jardim de esculturas de Renzo Piano, de uma escola de artes historicamente negra para uma arena digital imersiva da AT&amp;T. O Arts District é uma declaração de que cultura e urbanismo de qualidade não são luxo — são infraestrutura.</p>
        <p>O ponto de virada foi a inauguração do <strong>Klyde Warren Park</strong> em 2012: um parque de 5 acres construído sobre a Woodall Rodgers Freeway enterrada, costurando o Arts District com o bairro Uptown e transformando definitivamente a identidade do corredor cultural. Hoje o parque é o coração vivo do distrito.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i33" alt="Detalhe do Dallas Arts District">
        <figcaption>Dallas Arts District — arquitetura de assinatura num único corredor</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Âncoras do distrito</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🗿</span><h3>Nasher Sculpture Center</h3><p>2001 Flora St. O prédio de Renzo Piano já vale a visita: telhado de alumínio perfurado que filtra a luz natural perfeitamente. Acervo ao ar livre com Picasso, Rodin, Matisse, Richard Serra e de Kooning. Museu sério e jardim de meditação ao mesmo tempo.</p></div>
        <div class="mag-card"><span class="ic">🎭</span><h3>AT&amp;T Performing Arts Center</h3><p>Inclui o Winspear Opera House (Norman Foster, 2009) e o Wyly Theatre (Rem Koolhaas, 2009). Da ópera de classe mundial ao teatro experimental. Mesmo sem ingressos, a arquitetura exterior justifica uma caminhada ao redor.</p></div>
        <div class="mag-card"><span class="ic">🦖</span><h3>Perot Museum of Nature and Science</h3><p>2201 N Field St. O cubo inclinado de Thom Mayne (2012) é uma das estruturas mais arrojadas do Texas. Por dentro: fósseis de dinossauros texanos, geologia do Permian Basin, física interativa e a maior coleção de gemas do sudoeste americano. Imperdível com ou sem crianças.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>Klyde Warren Park</h3><p>Parque gratuito construído SOBRE a autoestrada enterrada — uma das grandes façanhas de urbanismo recente. Food trucks curados, xadrez gigante, shows ao ar livre, yoga gratuito de manhã. Impossível passar por Dallas sem sentar aqui por pelo menos uma hora.</p></div>
        <div class="mag-card"><span class="ic">📱</span><h3>AT&amp;T Discovery District</h3><p>208 S Akard St. A AT&amp;T transformou um quarteirão em experiência imersiva gratuita: painéis de LED de 10 andares, arte digital interativa, projeções arquiteturais ao anoitecer. O espetáculo noturno é de tirar o fôlego. Chegue depois das 19h.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Dallas Museum of Art</h3><p>1717 N Harwood St. Um dos maiores museus de arte dos EUA, acervo permanente gratuito — 24.000 obras de 5.000 anos de história. O prédio de Edward Larrabee Barnes (1984) é elegante. As coleções pré-colombiana e africana são internacionalmente reconhecidas.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🗺️</span>Rota ideal</h4><p>Comece no Perot Museum, siga pelo Klyde Warren Park (café da manhã nos food trucks), percorra Flora Street até o Nasher, depois o DMA. Tarde: AT&amp;T Discovery District ao anoitecer.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎨</span>Dallas Museum of Art</h4><p>A entrada permanente é gratuita todos os dias. Apenas exposições temporárias cobram. Reserve pelo menos 2 horas para o acervo permanente — a ala de arte asiática é frequentemente subestimada e magnífica.</p></div>
        <div class="mag-tip"><h4><span class="ic">🧘</span>Klyde Warren Park: horários</h4><p>Programação gratuita toda semana: yoga às terças e quintas às 8h, concertos ao ar livre aos fins de semana. Consulte klydewarrenpark.org para o calendário atual.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚇</span>DART Light Rail</h4><p>A estação St. Paul (linha verde/vermelha) desce direto no coração do Arts District. De Uptown ou Downtown, o metrô é mais rápido e barato que dirigir. Passe diário $6.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Nasher: reserva antecipada</h4><p>Lotado aos sábados. Compre o ingresso online com antecedência ($10 adultos). O jardim fecha em dias de chuva forte — verifique a previsão antes.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>AT&amp;T Discovery: timing</h4><p>O espetáculo de LED começa ao anoitecer e é melhor depois das 20h no verão. Totalmente gratuito, ao ar livre. Combine com jantar no restaurante Mirador no mesmo quarteirão.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">O que poucos sabem</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O maior distrito contíguo do mundo</b><span>Com 68 acres dedicados exclusivamente às artes, o Dallas Arts District é oficialmente o maior distrito de artes contíguo dos EUA — e um dos maiores do mundo. A concentração de arquitetura de assinatura num único corredor é comparável apenas ao Mall em Washington D.C.</span></div></li>
        <li><div><b>A escola de artes mais antiga do Texas</b><span>A Booker T. Washington High School for the Performing and Visual Arts (1922), no coração do distrito, formou artistas como Erykah Badu, Roy Hargrove e Norah Jones. É uma escola pública — sua presença no Arts District é deliberadamente simbólica.</span></div></li>
        <li><div><b>A autoestrada que virou parque</b><span>O Klyde Warren Park custou $110 milhões — $50M da cidade, $60M de doações privadas. A laje sobre a Woodall Rodgers Freeway tem 5 acres, 1.000 toneladas de solo e suporta árvores maduras. Inaugurado em 2012, triplicou imediatamente o valor imobiliário ao redor.</span></div></li>
        <li><div><b>Renzo Piano e a luz de Dallas</b><span>O telhado do Nasher foi projetado por Renzo Piano para filtrar a luz solar intensa do Texas. Cada lâmina de alumínio perfurado difunde a luz direta mas permite a difusa — iluminando as esculturas naturalmente, sem sombras duras ou superexposição UV.</span></div></li>
        <li><div><b>O Wyly Theatre é de dentro para fora</b><span>O Dee and Charles Wyly Theatre de Rem Koolhaas é revolucionário: os sistemas mecânicos (ar condicionado, elevadores, camarins) ficam na fachada exterior, libertando o interior para ser totalmente reconfigurável. O palco assume configurações que nenhum outro teatro do mundo replica.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Gastronomia</div>
      <h2 class="mag-title">Onde comer no Arts District</h2>
      <div class="mag-rule"></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Quando Dallas decidiu ser estranha</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Se o Arts District é a Dallas das aspirações culturais formais, o Bishop Arts District é a Dallas que prefere a livraria com bar, o mural de rua e a taqueria que não precisa de reserva. É o bairro que prova que autenticidade e qualidade não são mutuamente exclusivos.</p>
        <p>Oak Cliff foi um subúrbio independente antes de ser anexado por Dallas em 1903. Durante décadas, abrigou principalmente famílias trabalhadoras mexicano-americanas, com uma cultura de rua rica e uma identidade própria que sempre resistiu à homogeneização. No final dos anos 1990, o preço do aluguel atraiu artistas, músicos e pequenos empreendedores que transformaram o cruzamento de W Davis Street com Bishop Avenue num dos corredores mais interessantes do Texas.</p>
        <p>Hoje o Bishop Arts District concentra mais de <strong>60 estabelecimentos independentes</strong> em cerca de 10 quarteirões: galerias de arte local, boutiques de moda alternativa, cafés peculiares, restaurantes de todas as origens e, dispersos pelas paredes, murais de artistas locais e nacionais que transformam cada esquina num museu a céu aberto.</p>
        <p>O bairro sobreviveu (por enquanto) à gentrificação por uma razão clara: a comunidade latina original não foi expulsa, foi integrada. Os novos estabelecimentos convivem com as taqueiras de décadas, as padarias mexicanas e os salões de beleza de sempre. É esse equilíbrio improvável que faz do Bishop Arts um lugar genuinamente especial.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i35" alt="Detalhe do Bishop Arts District">
        <figcaption>Bishop Arts — boutiques, murais e o ritmo boêmio de Oak Cliff</figcaption>
