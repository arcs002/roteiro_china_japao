function _dayRange(days) { return days.length > 1 ? days[0] + '–' + days[days.length - 1] : '' + days[0]; }
function _relCardCity(slug) {
  const c = GUIDE.cities[slug];
  return `<a class="mag-relcard" href="#city/${slug}"><div class="thumb"><img data-img-key="${c.img}" alt=""></div>`
    + `<div class="meta"><div class="kind">Cidade · Dias ${_dayRange(c.days)}</div>`
    + `<div class="nm">${c.emoji} ${c.name}</div><div class="sub">${c.region}</div></div></a>`;
}
function _relCardAttr(slug) {
  const a = GUIDE.attractions[slug];
  const hasPage = !!ROUTES['page/' + slug];
  return `<a class="mag-relcard" href="${hasPage ? '#page/' + slug : '#city/' + a.city}"><div class="thumb"><img data-img-key="${a.img}" alt=""></div>`
    + `<div class="meta"><div class="kind">Atração · ${GUIDE.cities[a.city].name}</div>`
    + `<div class="nm">${a.emoji} ${a.name}</div><div class="sub">${hasPage ? 'Ver guia completo →' : 'Ver na cidade →'}</div></div></a>`;
}
function _relChipDay(n) {
  const d = DAY_INFO[n];
  return `<a class="mag-relchip" href="#day/${n}"><span class="e">${d.emoji}</span> Dia ${n} · ${d.date}</a>`;
}
function _grp(label, inner) { return `<div class="grp"><div class="mag-eyebrow">${label}</div>${inner}</div>`; }
function _dayCity(n) { return Object.keys(GUIDE.cities).find(s => GUIDE.cities[s].days.includes(+n)); }

function buildRelated(kind, id) {
  let h = '';
  if (kind === 'city') {
    const c = GUIDE.cities[id];
    h += _grp('No roteiro', `<div class="mag-relchips">${c.days.map(_relChipDay).join('')}</div>`);
    const attrs = Object.keys(GUIDE.attractions).filter(s => GUIDE.attractions[s].city === id);
    if (attrs.length) h += _grp('Atrações em ' + c.name, `<div class="mag-rail">${attrs.map(_relCardAttr).join('')}</div>`);
  } else if (kind === 'day') {
    const cs = _dayCity(id);
    if (cs) h += _grp('A cidade do dia', `<div class="mag-rail">${_relCardCity(cs)}</div>`);
    const attrs = Object.keys(GUIDE.attractions).filter(s => GUIDE.attractions[s].days.includes(+id));
    if (attrs.length) h += _grp('Você vai conhecer', `<div class="mag-rail">${attrs.map(_relCardAttr).join('')}</div>`);
  } else if (kind === 'attraction') {
    const a = GUIDE.attractions[id];
    if (a) {
      h += _grp('Onde fica', `<div class="mag-rail">${_relCardCity(a.city)}</div>`);
      h += _grp('Quando você visita', `<div class="mag-relchips">${a.days.map(_relChipDay).join('')}</div>`);
      const others = Object.keys(GUIDE.attractions).filter(s => GUIDE.attractions[s].city === a.city && s !== id);
      if (others.length) h += _grp('Mais em ' + GUIDE.cities[a.city].name, `<div class="mag-rail">${others.map(_relCardAttr).join('')}</div>`);
    }
  }
  return h;
}

function hydrateImgs(root) {
  root.querySelectorAll('img[data-img-key]').forEach(img => {
    const key = img.getAttribute('data-img-key');
    const url = IMGS[key];
    img.removeAttribute('data-img-key');
    if (url) loadImg(img, key, url);
  });
}

const app = {
  go(path) {
    const h = (path || '').replace(/^#/, '');
    history.pushState(null, '', '#' + h);
    this._render(h);
  },

  _render(path) {
    path = (path || '').replace(/^#/, '');
    const tplId = ROUTES[path] || 'tpl-home';
    const tpl = document.getElementById(tplId);
    const container = document.getElementById('spa-app');
    if (!tpl || !container) return;

    // Loading bar
    const bar = document.getElementById('spa-loading');
    if (bar) { bar.classList.add('show'); setTimeout(() => bar.classList.remove('show'), 350); }

    // Clone template content; images load from local cache or network (see loadImg)
    const frag = tpl.content.cloneNode(true);
    hydrateImgs(frag);
    // Inject cross-link rails into any [data-rel] mount points (cities↔days↔attractions)
    frag.querySelectorAll('[data-rel-kind]').forEach(mount => {
      mount.classList.add('mag-related');
      mount.innerHTML = buildRelated(mount.getAttribute('data-rel-kind'), mount.getAttribute('data-rel-id'));
      hydrateImgs(mount);
    });
    container.innerHTML = '';
    container.appendChild(frag);

    window.scrollTo(0, 0);
    this._closePicker();
  },

  _openDayPicker() {
    const panel = document.getElementById('spa-picker-panel');
    panel.innerHTML = '<div class="picker-title">Escolha o dia</div>' +
      DAY_INFO.slice(1).map(d =>
        `<a class="picker-item" href="#day/${d.n}" onclick="event.preventDefault();app.go('day/${d.n}');">
          ${d.emoji} Dia ${d.n} — ${d.city}
          <span class="pi-sub">${d.date}</span>
        </a>`
      ).join('');
    document.getElementById('spa-picker').classList.add('open');
  },

  _openCityPicker() {
    const panel = document.getElementById('spa-picker-panel');
    panel.innerHTML = '<div class="picker-title">Escolha a cidade</div>' +
      CITY_INFO.map(c =>
        `<a class="picker-item" href="#city/${c.id}" onclick="event.preventDefault();app.go('city/${c.id}');">
          ${c.emoji} ${c.name}
          <span class="pi-sub">Dias ${c.days}</span>
        </a>`
      ).join('');
    document.getElementById('spa-picker').classList.add('open');
  },

  _closePicker() {
    document.getElementById('spa-picker').classList.remove('open');
  },
};

document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href) return;
  if (href === '#home' || href === '#') { e.preventDefault(); app.go('home'); return; }
  if (href.startsWith('#') && href.includes('/')) { e.preventDefault(); app.go(href.slice(1)); }
});

window.addEventListener('popstate', () => {
  app._render((location.hash || '').replace(/^#/, ''));
});

window.addEventListener('DOMContentLoaded', () => {
  app._render((location.hash || '').replace(/^#/, '') || 'home');
});
