  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A capital do Velho Oeste ainda viva</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>No final do século XIX, Fort Worth era conhecida simplesmente como <em>"Cowtown"</em> — a última parada civilizada antes da imensidão selvagem do Texas. O distrito dos Stockyards nasceu em 1887 quando os trilhos da ferrovia chegaram à cidade, transformando o local no maior centro de processamento de gado dos Estados Unidos a oeste de Chicago. No auge da operação, nos anos 1940, mais de quatro milhões de cabeças de gado e dois milhões de porcos passavam por aqui anualmente.</p>
        <p>A construção mais emblemática do distrito, o <strong>Coliseum dos Stockyards</strong>, data de 1908 e ainda hoje é palco de rodeios. A Exchange Avenue — a rua principal — foi durante décadas o coração pulsante do comércio pecuário texano, repleta de bancos, hotéis e saloons onde cowboys poeirentos celebravam o fim de meses de trabalho nas longas boiadas vindas do México e do sul do estado. A própria palavra "rodeo" ganhou seu significado americano moderno aqui.</p>
        <p>Quando a indústria da carne migrou para outros estados nos anos 1950 e 1960, os Stockyards entraram em declínio. A salvação veio na forma de preservação histórica: em 1976, o distrito foi adicionado ao Registro Nacional de Lugares Históricos, e uma revitalização cuidadosa transformou o que poderia ter sido demolição em uma das atrações turísticas mais genuínas do Texas.</p>
        <p>O que distingue os Fort Worth Stockyards de outras atrações temáticas do Old West é que <strong>tudo aqui é real</strong>. Os edifícios são originais, o Hotel Stockyards serve hóspedes desde 1907, e o gado — os magníficos Texas Longhorns com chifres de até dois metros de envergadura — realmente percorre as ruas às 11h e às 16h todos os dias, exatamente como fazia quando o mundo dependia deles para se alimentar.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i9" alt="Fort Worth Stockyards — o Velho Oeste">
        <figcaption>Stockyards — paralelepípedos, longhorns e couro na Exchange Avenue</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências imperdíveis</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">O Cattle Drive · todos os dias</span>
        <p>Às 11h e às 16h, cowboys de chapéu e esporas conduzem uma manada de Texas Longhorns pela Exchange Avenue. Ocupa apenas 10 minutos, mas é absolutamente hipnótico. Chegue 20 minutos antes para garantir posição na calçada.</p>
      </div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏟️</span><h3>Stockyards Championship Rodeo</h3><p>Todo sábado à noite no Cowtown Coliseum (1908), o rodeio mais antigo do mundo ainda em operação. Cowboys competem em bull riding, roping e barrel racing num espaço que cheira a serragem e história.</p></div>

        <div class="mag-card"><span class="ic">🏨</span><h3>Hotel Stockyards (1907)</h3><p>Mesmo sem se hospedar, entre no lobby do hotel mais histórico de Fort Worth. A suíte Bonnie &amp; Clyde leva o nome dos famosos foras-da-lei que supostamente se hospedaram aqui nos anos 1930.</p></div>

        <div class="mag-card"><span class="ic">🛍️</span><h3>Lojas de Cowboy</h3><p>A M.L. Leddy's, aberta desde 1941, fabrica botas e arreios à mão e é o lugar mais respeitado de Fort Worth para artigos de cowboy. Ao lado, butiques vendem chapéus Stetson, cintos e bolo ties.</p></div>

      <ul class="mag-numlist">
        <li><div><b>O caminho de 2.000 milhas</b><span>No auge do século XIX, o famoso Chisholm Trail — rota por onde milhões de cabeças de gado iam do Texas até o Kansas — tinha Fort Worth como ponto de partida. A cidade era literalmente o portão de entrada para a maior migração de gado da história americana.</span></div></li>
        <li><div><b>Os chifres que desbancam todos os recordes</b><span>O Texas Longhorn tem os maiores chifres de qualquer animal do mundo em proporção ao corpo. O recorde pertence a um animal chamado "Sato", com chifres de 3,2 metros de ponta a ponta. Os dos Stockyards têm "apenas" 1,5 a 2 metros — suficiente para impressionar.</span></div></li>

        <p>A história do Billy Bob's começa em 1910, quando o espaço foi construído como um armazém de implementos agrícolas nos arredores dos Stockyards. Décadas depois, na Segunda Guerra Mundial, o exército americano o usou como estábulo para cavalos militares. Nos anos 1970, tornou-se brevemente uma loja de departamentos — até que um grupo de empresários texanos enxergou naquele galpão enorme algo que o mundo ainda não tinha visto.</p>

<template id="tpl-page-dealey_plaza">
<article class="mag" data-theme="dallas">

  <nav class="mag-crumbs">
    <a href="#home" class="home">◆ Roteiro</a>
    <span class="sep">/</span><a href="#city/dallas">Dallas</a>
    <span class="sep">/</span><span class="here">Dealey Plaza</span>
  </nav>

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i12" alt="Dealey Plaza, Dallas">
    <div class="mag-eyebrow">Texas · Dallas · 22 de novembro de 1963</div>
    <h1>Dealey <em>Plaza</em></h1>
    <p class="mag-tagline">O lugar onde o século XX mudou de rumo: a praça onde John F. Kennedy foi assassinado e o museu que documenta com rigor jornalístico um dos eventos mais estudados da história americana.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>$18</b><span>Museu (adulto)</span></div>
      <div class="m"><b>2 h</b><span>Duração ideal</span></div>
      <div class="m"><b>1963</b><span>O assassinato</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Endereço</span><span class="v">411 Elm St, Dallas, TX</span></div>
    <div class="f"><span class="k">Museu</span><span class="v">Ter–Dom 10h–18h (última 17h)</span></div>
    <div class="f"><span class="k">Entrada museu</span><span class="v">$18 adultos · $14 sênior/estudante</span></div>
    <div class="f"><span class="k">Dealey Plaza</span><span class="v">Gratuita · aberta 24h</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 6</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">O momento que dividiu a história em dois</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Às 12h30 do dia 22 de novembro de 1963, a limusine presidencial Lincoln Continental avançava lentamente pela Elm Street, em Dallas, quando disparos ecoaram no espaço aberto da Dealey Plaza. Em segundos, o 35º presidente dos Estados Unidos, John Fitzgerald Kennedy, estava mortalmente ferido. Aquele momento — registrado em 26,6 segundos de filme por Abraham Zapruder, um cidadão comum com uma câmera doméstica — tornou-se talvez o evento mais estudado, analisado e debatido do século XX.</p>
        <p>A Dealey Plaza em si é um espaço urbano modesto — uma praça triangular criada em 1935, batizada em homenagem a George Dealey, fundador do Dallas Morning News. Com o gramado suave, a <strong>Grassy Knoll</strong> e o viaduto Triple Underpass ao fundo, o local tem uma geometria quase cinematográfica que contrasta brutalmente com o peso histórico que carrega. Hoje, é um Monumento Histórico Nacional.</p>
        <p>O <strong>Texas School Book Depository</strong> — o edifício de tijolos de sete andares no lado norte — foi, segundo a Comissão Warren, o local de onde Lee Harvey Oswald disparou. A janela do canto sudeste do sexto andar permanece exatamente como estava naquele dia. Em 1989, o sexto andar foi transformado no hoje excepcional <strong>Sixth Floor Museum</strong>, um dos melhores museus biográficos dos Estados Unidos.</p>
        <p>O museu é, de longe, a melhor maneira de compreender não apenas o assassinato, mas o contexto político da Guerra Fria, o fenômeno cultural de JFK e Jackie, e as consequências sobre a psique americana. O audioguia narra cada exibição com profundidade jornalística, e a experiência de estar na janela — olhando para baixo na direção da rua onde está a marca X no asfalto — produz um silêncio involuntário em praticamente todos os visitantes.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i13" alt="Grassy Knoll, Dealey Plaza">
        <figcaption>Dealey Plaza — a Grassy Knoll e a Elm Street</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Linha do Tempo</div>
      <h2 class="mag-title">Os minutos que mudaram a história</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>11h55 — 22 Nov 1963</b><span>A limusine presidencial parte do Love Field Airport rumo ao centro de Dallas. Kennedy decide manter o teto aberto para melhor contato com a multidão animada.</span></div></li>
        <li><div><b>12h30 — Elm Street</b><span>Ao passar pela Dealey Plaza, disparos são ouvidos. Kennedy é atingido na cabeça e no pescoço. O governador John Connally, no mesmo carro, também é ferido.</span></div></li>
        <li><div><b>13h00 — Parkland Memorial Hospital</b><span>Kennedy é declarado morto. Lyndon B. Johnson é empossado a bordo do Air Force One duas horas depois, com Jackie Kennedy ao lado, ainda com a roupa manchada de sangue.</span></div></li>
        <li><div><b>13h50 — Texas Theatre</b><span>Lee Harvey Oswald é preso num cinema a poucos quilômetros, acusado também de matar um policial no caminho. Dois dias depois, é assassinado ao vivo na TV por Jack Ruby.</span></div></li>
        <li><div><b>1989 — The Sixth Floor Museum</b><span>O sexto andar do antigo Texas School Book Depository é transformado em museu, atraindo hoje mais de 350.000 visitantes por ano de todos os países do mundo.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências no local</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">JFK · Discurso de Posse, 20 Jan 1961</span>
        <p>"Não pergunte o que seu país pode fazer por você — pergunte o que você pode fazer por seu país."</p>
      </div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏛️</span><h3>The Sixth Floor Museum</h3><p>Ocupa os 6º e 7º andares do edifício. A exposição começa com o contexto político dos anos 1960, passa pela campanha e presidência de JFK e culmina nos eventos de novembro de 1963. O audioguia incluído é excepcional — em inglês e espanhol.</p></div>
        <div class="mag-card"><span class="ic">🪟</span><h3>A Janela do Franco-Atirador</h3><p>A janela do canto sudeste do 6º andar — de onde Oswald supostamente atirou — está preservada exatamente como em 1963, por trás de um vidro. Olhar por ela em direção à Elm Street é um dos momentos mais arrepiantes de qualquer visita a Dallas.</p></div>
        <div class="mag-card"><span class="ic">❌</span><h3>Os X na Elm Street</h3><p>No asfalto, duas marcas X indicam os pontos onde JFK foi atingido. Os turistas descem para fotos enquanto o tráfego continua passando. A mistura de história gravíssima e fluxo urbano cotidiano cria um contraste perturbador e inesquecível.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>A Grassy Knoll</h3><p>A "colina gramada" no canto noroeste é o local de onde muitas teorias conspiratórias sugerem que um segundo atirador disparou. Hoje é um gramado pacífico com uma cerca de madeira — mas visitá-la sabendo de sua história transforma tudo.</p></div>
        <div class="mag-card"><span class="ic">📍</span><h3>John F. Kennedy Memorial</h3><p>A dois quarteirões, o arquiteto Philip Johnson projetou um memorial austero e poderoso — uma estrutura aberta de concreto branco que transmite solidão e eternidade. Inaugurado em 1970, raramente lotado.</p></div>
        <div class="mag-card"><span class="ic">📽️</span><h3>O Filme Zapruder</h3><p>O museu exibe o filme de Abraham Zapruder — os 26,6 segundos mais estudados da história da fotografia. Vê-lo no contexto do museu, com todas as informações circundantes, é completamente diferente de assistir num vídeo aleatório na internet.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para uma visita significativa</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🎟️</span>Reserve ingressos online</h4><p>O Sixth Floor Museum pode ter filas, especialmente nos fins de semana. Compre em jfk.org com antecedência. A entrada inclui audioguia — não pule, é fundamental.</p></div>
        <div class="mag-tip"><h4><span class="ic">⏱️</span>Reserve pelo menos 2 horas</h4><p>Quem tenta fazer o museu em 45 minutos sai insatisfeito. A exposição é densa e rica — aloque 2 horas, mais 30–45 min para a praça externa e os X na rua.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚸</span>Cuidado com os carros</h4><p>Os X no asfalto ficam no meio de uma pista ativa. Os turistas descem para fotos o tempo todo — com atenção. Os carros não param. É tecnicamente ilegal cruzar fora da faixa.</p></div>
        <div class="mag-tip"><h4><span class="ic">📅</span>Fechado às segundas</h4><p>O Sixth Floor Museum fecha às segundas. A Dealey Plaza é acessível 24h gratuitamente, mas o museu é o coração da visita — evite segunda-feira.</p></div>
        <div class="mag-tip"><h4><span class="ic">🕊️</span>Combine com o JFK Memorial</h4><p>O memorial de Philip Johnson fica a 5 min a pé, sempre aberto e gratuito. O contraste entre a crueza da Dealey Plaza e a abstração serena do memorial é parte da experiência completa.</p></div>
        <div class="mag-tip"><h4><span class="ic">🤫</span>Atmosfera solene</h4><p>O museu é um espaço de luto nacional. Mantenha volume baixo, respeite quem está emocionado — não é raro ver visitantes chorando, especialmente americanos mais velhos que viveram aquele dia.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que aprofundam a visita</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O filme que o governo comprou por $16 milhões</b><span>O filme de Abraham Zapruder — gravado numa câmera doméstica Bell &amp; Howell — foi comprado pelo governo americano em 1999 pelo equivalente a US$16 milhões. Por décadas a família Zapruder controlou os direitos. É o documento histórico em filme mais importante do século XX.</span></div></li>
        <li><div><b>O assassino assassinado ao vivo na TV</b><span>Lee Harvey Oswald nunca foi julgado. Dois dias após o assassinato, durante a transferência de custódia, Jack Ruby — dono de um clube noturno de Dallas com supostas ligações com a máfia — o matou com um tiro no estômago, ao vivo para dezenas de câmeras. Uma das imagens mais chocantes do jornalismo americano.</span></div></li>
        <li><div><b>350.000 visitantes por ano de 100 países</b><span>O Sixth Floor Museum atrai visitantes de praticamente todos os países, sendo um dos locais mais internacionalmente visitados do Texas. Visitantes do Brasil, Japão, Alemanha e Reino Unido frequentemente chegam sabendo mais sobre o caso do que muitos americanos locais.</span></div></li>
        <li><div><b>O 7º andar: a janela selada</b><span>Acima da janela do atirador, no 7º andar, fica a área de curadoria — e uma segunda janela com a mesma linha de visão sem vidro. Apenas pesquisadores têm acesso. Dali, a perspectiva de 22 metros sobre a Elm Street torna os disparos tecnicamente possíveis, mas ainda controversos para a balística.</span></div></li>
        <li><div><b>Dallas foi "a cidade da vergonha" por décadas</b><span>Por anos após 1963, Dallas carregou o estigma de ser "a cidade que matou Kennedy". A abertura do museu em 1989 foi em parte um ato de reconciliação histórica, transformando um espaço de vergonha em espaço de memória.</span></div></li>
      </ul>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer no Downtown Dallas</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Southern American · 5 min a pé</div><h3>Ellen's Southern Kitchen</h3><div class="addr">📍 1724 N Market St</div><p>Um dos melhores brunchs do Downtown Dallas, a poucos quarteirões da Dealey Plaza. O chicken and waffles, os biscoitos caseiros com gravy e o café coado são o antídoto perfeito para a intensidade emocional do museu.</p><span class="order">$$</span></div>
      <div class="mag-resto"><div class="tier">Texas BBQ · Deep Ellum</div><h3>Pecan Lodge</h3><div class="addr">📍 2702 Main St · Deep Ellum</div><p>Considerado por muitos o melhor brisket de Dallas, a 10 minutos de carro. Se for combinar a Dealey Plaza com uma exploração do Deep Ellum, almoce ou jante aqui — as filas são longas mas valem.</p><span class="order">$$</span></div>
      <div class="mag-resto"><div class="tier">Fine Casual · Impacto Social</div><h3>Café Momentum</h3><div class="addr">📍 1510 Pacific Ave</div><p>Restaurante social único: o staff é composto por jovens saindo do sistema de detenção juvenil, treinados em gastronomia profissional. A comida é surpreendentemente boa e comer aqui tem impacto real. A 8 min da Dealey Plaza.</p><span class="order">$$</span></div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>DART Light Rail</h4><p>A estação West End fica a 3 minutos a pé da Dealey Plaza. A opção mais prática e rápida do Downtown. Use o app DART para planejar o trajeto.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Uber / Lyft</h4><p>Do centro, a corrida é breve (~$10). Do DFW, $40–55. Do Love Field, $20–28. Avise o endereço exato: 411 Elm St.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Carro / Estacionamento</h4><p>Vários estacionamentos pagos no West End district, a partir de $10/dia. O museu não tem estacionamento próprio. Evite estacionar na Elm Street durante a visita.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé do Deep Ellum</h4><p>O Deep Ellum fica a 20 minutos a pé para leste. Se visita os dois em sequência, a caminhada é agradável e passa por partes interessantes do Downtown histórico.</p></div>
      </div>
    </section>

<template id="tpl-page-deep_ellum">
<article class="mag" data-theme="dallas">

  <nav class="mag-crumbs">
    <a href="#home" class="home">◆ Roteiro</a>
    <span class="sep">/</span><a href="#city/dallas">Dallas</a>
    <span class="sep">/</span><span class="here">Deep Ellum</span>
  </nav>

  <header class="mag-hero">
    <img class="mag-hero-img" data-img-key="i14" alt="Deep Ellum, Dallas">
    <div class="mag-eyebrow">Texas · Dallas · Atração</div>
    <h1>Deep <em>Ellum</em></h1>
    <p class="mag-tagline">O bairro onde o blues nasceu no Texas, onde murais gigantes cobrem cada parede e onde 40 casas de show em 6 quarteirões criam a noite mais vibrante do Sul dos Estados Unidos.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>40+</b><span>Casas de show</span></div>
      <div class="m"><b>100+</b><span>Murais de rua</span></div>
      <div class="m"><b>1920s</b><span>Berço do blues</span></div>
    </div>
  </header>

  <div class="mag-facts">
    <div class="f"><span class="k">Localização</span><span class="v">Main St &amp; Commerce St, Dallas</span></div>
    <div class="f"><span class="k">Shows ao vivo</span><span class="v">40+ venues em 6 quarteirões</span></div>
    <div class="f"><span class="k">Murais</span><span class="v">100+ obras de arte de rua</span></div>
    <div class="f"><span class="k">Melhor horário</span><span class="v">Qui–Sáb a partir das 20h</span></div>
    <div class="f"><span class="k">No roteiro</span><span class="v">Dia 5</span></div>
  </div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">Do blues dos anos 1920 à cena mais vibrante do Sul</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>O nome "Deep Ellum" é uma corruptela do inglês falado — "Deep Elm" virou "Deep Ellum" na pronúncia local, referindo-se à Elm Street que cruza o bairro a leste do Downtown. No início do século XX, esta área era o coração da comunidade afro-americana de Dallas, e nos anos 1920 tornou-se um dos mais importantes centros de blues e jazz dos Estados Unidos — ao lado de Chicago, Nova Orleans e Kansas City.</p>
        <p>Lendas como <strong>Blind Lemon Jefferson</strong> — considerado o pai do Texas Blues — e Leadbelly gravaram e se apresentaram nos clubes e ruas do Deep Ellum naquela época. A rua era tão fervilhante que se dizia que você podia "entrar em Deep Ellum com $10 e sair sem nada, sem sapatos e feliz da vida". A prosperidade durou décadas antes de a desindustrialização e o <em>white flight</em> esvaziarem o bairro nos anos 1960 e 70.</p>
        <p>A segunda vida começou nos anos 1980, quando artistas e músicos — atraídos pelos aluguéis baixíssimos — ocuparam os armazéns vazios. A cena alternativa e punk/new wave que brotou aqui produziu bandas de impacto nacional, incluindo os Pantera. O Deep Ellum se tornou o epicentro criativo de Dallas, com galerias, estúdios, bares e casas de show em cada esquina.</p>
        <p>O que você encontra hoje é um bairro maduro que equilibra história e contemporaneidade. Os murais gigantescos que cobrem cada parede disponível — incluindo o famoso rosto de quatro andares na Commerce Street e o mural das três lâmpadas, símbolo visual do bairro — criaram um museu de arte pública ao ar livre que atrai turistas de dia e uma energia noturna incomparável, com mais de 40 casas de show comprimidas em seis quarteirões.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i15" alt="Cena musical de Deep Ellum">
        <figcaption>Deep Ellum — a cena musical viva entre murais e tijolos</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Os Murais Icônicos</div>
      <h2 class="mag-title">Um museu a céu aberto</h2>
      <div class="mag-rule"></div>
      <p class="mag-lead">O mural do rosto gigante na Commerce Street e o das três lâmpadas na Main Street são as fotos mais tiradas no Deep Ellum — chegue durante o dia para a melhor luz.</p>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">👤</span><h3>O Rosto Gigante</h3><p>Na Commerce St, com 4 andares de altura — o mural mais fotografado do bairro.</p></div>
        <div class="mag-card"><span class="ic">💡</span><h3>As Três Lâmpadas</h3><p>Na Main St, ícone visual do bairro e cartão-postal de Deep Ellum.</p></div>
        <div class="mag-card"><span class="ic">🎸</span><h3>Blind Lemon Jefferson</h3><p>Homenagem ao pai do Texas Blues, que tocava nas ruas do bairro nos anos 1920.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>100+ obras espalhadas</h3><p>Novos murais aparecem todo mês — cada visita pode ser diferente da anterior.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Uma noite (ou tarde) no Deep Ellum</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">🎸 40+ casas de show em 6 quarteirões</span>
        <p>Nenhum outro bairro do Sul dos EUA tem esta concentração de música ao vivo. Em qualquer noite de quinta a sábado você entra e sai de cinco venues em uma hora caminhando, ouvindo blues, jazz, rock alternativo, metal e até flamenco — frequentemente com entrada gratuita.</p>
      </div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🎨</span><h3>Mural Walking Tour</h3><p>Durante o dia, o Deep Ellum é um museu de arte de rua. Comece na Main Street, vire na Commerce e percorra as transversais — cada parede tem uma história. Reserve 90 minutos para fotografar com boa luz.</p></div>
        <div class="mag-card"><span class="ic">🎵</span><h3>Deep Ellum Art Co.</h3><p>Um dos venues mais ecléticos, combinando galeria de arte com palco de música ao vivo. Indie, alternativo e experimental numa atmosfera de festa privada em armazém. Programação em deepellumartco.com.</p></div>
        <div class="mag-card"><span class="ic">🥁</span><h3>Trees e Granada Theater</h3><p>O Trees é o venue histórico que definiu a cena alternativa nos anos 1990 — Nirvana, Pearl Jam e os Pantera tocaram aqui antes da fama. O Granada, mais luxuoso, recebe artistas nacionais em ambiente impecável.</p></div>
        <div class="mag-card"><span class="ic">🍺</span><h3>Craft Beer e Bares</h3><p>O Braindead Brewing produz cervejas no próprio bairro. O It'll Do Club é lendário pelas noites de disco e funk. Dezenas de bares competem por sua atenção — a maioria com live music gratuita nas janelas abertas.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>Lojas Independentes</h3><p>Discos de vinil na Good Records, roupas vintage em diversas butiques, e a Kettle Art Gallery, uma das galerias de arte contemporânea mais respeitadas de Dallas.</p></div>
        <div class="mag-card"><span class="ic">📸</span><h3>Golden Hour Photography</h3><p>Uma hora antes do pôr do sol, a luz dourada texana banha os murais de forma cinematográfica. A Commerce Street, com tijolos e murais coloridos, é fotogênica a qualquer hora — mas o golden hour é mágico.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar o bairro ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">☀️</span>Dia vs. noite</h4><p>De dia (10h–18h) é tranquilo, perfeito para murais e lojas. De noite (a partir das 20h) é frenético e ruidoso. Idealmente faça os dois: murais de tarde, shows à noite.</p></div>
        <div class="mag-tip"><h4><span class="ic">📅</span>Quinta é o novo sábado</h4><p>As quintas têm a melhor relação custo-benefício: muitos shows gratuitos ou com cover baixo, e a energia já é alta. Sábados são mais lotados e caros. Para algo mais autêntico e menos turístico, vá numa quinta.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Uber nos dois sentidos</h4><p>Não tente dirigir numa noite de show — estacionamento é infernal. Pegue um Uber para chegar e outro para voltar. Do Downtown custa ~$10.</p></div>
        <div class="mag-tip"><h4><span class="ic">💵</span>Cash para shows pequenos</h4><p>Muitos venues menores exigem dinheiro vivo para covers e consumação. Leve pelo menos $60 em notas pequenas — $20 para covers, $40 para drinques.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>Caminhe, não planeje</h4><p>O charme está na descoberta espontânea. Não crie roteiro rígido — caminhe, ouça qual venue tem a música que te atrai, entre, beba uma cerveja, saia, entre no próximo. É assim que os locais fazem.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌃</span>Segurança noturna</h4><p>Seguro nas ruas principais (Main, Commerce, Elm), especialmente nos horários de pico. Evite ruelas mal iluminadas tarde da noite. As áreas próximas ao I-345 são menos recomendadas após a meia-noite.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades Fascinantes</div>
      <h2 class="mag-title">O que os mapas não mostram</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Blind Lemon Jefferson — o avô do Texas Blues</b><span>Nascido cego em 1893, gravou dezenas de singles na Deep Ellum nos anos 1920 que influenciaram diretamente Bob Dylan, B.B. King e Eric Clapton. É considerado o primeiro grande artista de blues do Texas. Uma placa histórica marca onde tocava na Elm Street.</span></div></li>
        <li><div><b>Os Pantera nasceram no Deep Ellum</b><span>A banda de heavy metal Pantera — uma das mais influentes do gênero nos anos 1990 — tocou inúmeras vezes aqui no início dos anos 1980, quando ainda eram uma banda de glam metal desconhecida. O Trees Club guarda registros dessas apresentações.</span></div></li>
        <li><div><b>O rosto de 4 andares</b><span>O mural mais fotografado do bairro tem quase 15 metros de altura, criado pela artista Phoebe New. Ficou famoso mundialmente após aparecer em matérias sobre o ressurgimento do bairro nos anos 2010 — hoje tão identificado com Dallas quanto a skyline da cidade.</span></div></li>
        <li><div><b>A street art não para de crescer</b><span>Ao contrário de cidades onde murais são protegidos por décadas, aqui novos murais aparecem mensalmente — às vezes pintados sobre os anteriores. O bairro adotou uma política cultural que incentiva a renovação constante, tornando cada visita potencialmente diferente.</span></div></li>
        <li><div><b>O Deep Ellum Arts Festival</b><span>Todo abril, o festival transforma o bairro no maior evento de arte e música ao ar livre do Texas: mais de 200 artistas visuais, 70 bandas em 10 palcos simultâneos e 200.000 visitantes em três dias. Se sua viagem coincidir, priorize.</span></div></li>
      </ul>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Onde Comer</div>
      <h2 class="mag-title">Comer e beber no Deep Ellum</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Texas BBQ · Lendário</div><h3>Pecan Lodge</h3><div class="addr">📍 2702 Main St</div><p>Eleito repetidamente o melhor brisket de Dallas — uma peregrinação obrigatória. O brisket defumado por 14 horas, as costelas de porco e a salsicha jalapeño são obras de arte da culinária texana. Fila grande nos fins de semana — vá antes das 12h ou após as 14h.</p><span class="order">$$ · Pedir: brisket + ribs + jalapeño sausage</span></div>
      <div class="mag-resto"><div class="tier">Brewpub · Artesanal</div><h3>Braindead Brewing</h3><div class="addr">📍 2625 Main St</div><p>A cervejaria artesanal do bairro ocupa um armazém de tijolos com dezenas de torneiras próprias e pub food de qualidade. Ambiente descontraído, perfeito para antes ou entre shows.</p><span class="order">$$ · Pedir: IPA da casa + pretzel gigante</span></div>
      <div class="mag-resto"><div class="tier">Pizza Napolitana · Forno a lenha</div><h3>Cane Rosso</h3><div class="addr">📍 2612 Commerce St</div><p>A melhor pizza de Dallas. Técnica napolitana autêntica com farinha importada e forno a lenha a 480°C. A margherita e a diavola são perfeitas. Ambiente descontraído, perfeito antes dos shows noturnos.</p><span class="order">$$ · Pedir: Margherita ou Diavola</span></div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚇</span>DART Light Rail</h4><p>A estação Deep Ellum Station fica no coração do bairro. De longe a melhor opção — especialmente à noite, evita problemas de estacionamento e permite beber à vontade.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Uber / Lyft</h4><p>Do Downtown Dallas, $8–12. Em noites de show, o pickup pode demorar — agende com antecedência ou caminhe até a Elm Street para mais opções.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Possível durante o dia, mas evite à noite. Estacionamentos pagos perto da Commerce St custam $10–20. Em fins de semana de show grande, pode levar 30 min para achar vaga.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé do Downtown</h4><p>Do centro, a caminhada até o Deep Ellum leva 15–20 min pela Elm Street. Opção agradável de dia — não recomendada para a volta após a meia-noite.</p></div>
      </div>
    </section>

    <div class="mag-eyebrow">Texas · Austin · Atração</div>
    <h1>Texas State <em>Capitol</em></h1>
    <p class="mag-tagline">O maior edifício capitólio dos Estados Unidos por volume, em granito rosa texano, onde a história do Lone Star State se cristalizou em mármore e majestade desde 1888.</p>
    <div class="mag-hero-meta">
      <div class="m"><b>Grátis</b><span>Entrada e tours</span></div>
      <div class="m"><b>1888</b><span>Inauguração</span></div>

  <div class="mag-body">

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">O edifício mais ambicioso do Texas do século XIX</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>Quando o Texas decidiu construir um novo capitólio nos anos 1880, o estado não tinha dinheiro suficiente para o projeto. A solução foi criativa ao extremo: o Texas trocou três milhões de acres de terra no Panhandle pela construção completa do edifício. Esse trato resultou na criação do <strong>XIT Ranch</strong> — o maior rancho sob cerca de arame farpado do mundo, cobrindo uma área maior que o estado de Connecticut. O arquiteto Elijah E. Myers, o mesmo que projetou capitólios em Michigan e Colorado, foi contratado em 1882.</p>
        <p>A construção levou seis anos, de 1882 a 1888, e envolveu mais de mil trabalhadores, incluindo uma polêmica contratação de presos do sistema penal texano e, controversamente, convictos escoceses trazidos da Europa. O granito rosa-avermelhado que dá ao edifício sua cor característica vem inteiramente de Marble Falls, a 90 quilômetros de Austin — uma pedreira que o estado adquiriu especificamente para o projeto e que ainda existe hoje.</p>
        <p>O resultado foi um edifício de estilo Renascentista Americano que, na inauguração em 1888, era o sexto maior do mundo. O cubo de rotunda central, com a cúpula que culmina numa estrela de seis metros de diâmetro no chão do saguão, é uma das composições arquitetônicas mais impressionantes dos EUA do século XIX. A estátua no topo — a "Deusa da Liberdade" — mede 5,5 metros e foi fundida em zinco com acabamento em liga de alumínio.</p>
        <p>Em 1993, uma extensão subterrânea foi inaugurada, adicionando quase 50.000 m² de escritórios abaixo do campus sem alterar o perfil histórico. O campus do Capitólio, com seus gramados, estátuas e monumentos espalhados pelos 9 hectares ao redor, é hoje um dos espaços públicos mais agradáveis e históricos do Texas.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i17" alt="Texas State Capitol — câmara legislativa">
        <figcaption>Texas State Capitol — câmara legislativa e detalhe arquitetônico</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">A comparação que todo texano adora</span>
        <p>Com <strong>100,7 m</strong> de altura, o Texas State Capitol supera os <strong>88,6 m</strong> do US Capitol em Washington, DC. Os texanos não perdem uma oportunidade de lembrar que tudo no Texas é maior — incluindo o Capitólio.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Explorando o Capitólio e seu campus</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Não pule</span>
        <p>As <strong>visitas guiadas gratuitas</strong> são conduzidas por voluntários excepcionalmente bem informados. A tour de 45 minutos inclui o saguão da cúpula, a câmara do Senado, a câmara da Casa dos Representantes e o corredor dos ex-governadores. Saem da sala do visitante a cada 30 minutos.</p>
      </div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">⭕</span><h3>O Saguão da Rotunda</h3><p>O coração do edifício: uma rotunda de sete andares onde o piso tem embutido o Selo do Texas em mosaico colorido. Olhe para cima e veja a estrela de seis metros de diâmetro no teto da cúpula — a perspectiva de baixo é vertiginosa e inesperada para um edifício do século XIX.</p></div>
        <div class="mag-card"><span class="ic">🗣️</span><h3>Câmaras Legislativas</h3><p>O Senado e a Câmara dos Representantes do Texas abrem para visita quando não estão em sessão. Em sessão (geralmente jan–jun de anos ímpares), o público assiste do balcão. Ver a política texana ao vivo é uma experiência cultural única.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Galeria dos Governadores</h3><p>Retratos de todos os governadores do Texas desde a independência em 1836 decoram os corredores do segundo andar. As pinturas dos primeiros governadores — figuras semi-lendárias — contam tanto quanto qualquer livro.</p></div>
        <div class="mag-card"><span class="ic">🌳</span><h3>Os Jardins e Monumentos</h3><p>Os 9 hectares do campus têm 17 monumentos históricos, incluindo memoriais aos veteranos do Texas em cada guerra americana, um memorial ao Alamo e uma estátua equestre do presidente Mirabeau Lamar. Gramados impecáveis, perfeitos para um piquenique.</p></div>
        <div class="mag-card"><span class="ic">🔭</span><h3>Congress Avenue — a perspectiva</h3><p>A foto clássica é tirada da Congress Avenue olhando para o norte — a avenida foi projetada para criar exatamente esta linha de visão. À noite, o edifício é iluminado em vermelho-alaranjado. Desça a avenida até o Rio Colorado para a vista completa.</p></div>
        <div class="mag-card"><span class="ic">🏗️</span><h3>Extensão Subterrânea (1993)</h3><p>Abaixo do gramado norte há uma extensão de quatro andares construída em 1993 para não alterar a silhueta histórica. Os visitantes podem descer — os corredores têm skylights que trazem luz natural e uma sensação surreal de estar sob a história.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para uma visita perfeita</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🆓</span>Completamente gratuito</h4><p>Entrada, visitas guiadas, extensão subterrânea, jardins — tudo gratuito. Um dos melhores "free attractions" dos EUA. Não há necessidade de reserva antecipada para as tours padrão.</p></div>
        <div class="mag-tip"><h4><span class="ic">⏰</span>Chegue antes das 10h</h4><p>As tours mais tranquilas saem nas primeiras horas. Depois das 11h, especialmente de março a outubro, grupos escolares e ônibus de turismo chegam em massa. A cúpula vazia no início da manhã é muito superior.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛂</span>Entrada de segurança</h4><p>Há detectores de metal na entrada — como num aeroporto. Não leve itens proibidos (canivetes, garrafas de vidro etc.). O processo é rápido, mas reserve 10 minutos extras nos dias movimentados.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎵</span>Combine com a 6th Street</h4><p>O Capitólio fica a 10 minutos a pé da famosa 6th Street — o centro da vida noturna. Itinerário clássico: Capitólio de manhã, Sixth Street à noite. A Congress Avenue conecta os dois naturalmente.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔊</span>A acústica da cúpula</h4><p>O saguão da rotunda tem acústica extraordinária: sussurre algo rente à parede e a pessoa do outro lado — a 30 metros — ouvirá claramente. É um fenômeno físico real que os guias demonstram.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento</h4><p>Há estacionamento subterrâneo no campus (entrada pela 13th Street) com tarifas razoáveis. Para visitas curtas, o Uber da região central é mais prático. O Capitol MetroBike tem estações próximas.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">O que os guias adoram contar</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Trocado por 3 milhões de acres</b><span>O Texas literalmente não tinha caixa para pagar o Capitólio em 1882. A solução foi ceder ao consórcio construtor (investidores de Chicago e Londres) 3 milhões de acres no Panhandle — terra que se tornou o lendário XIT Ranch, o maior rancho cercado do mundo, ativo de 1885 a 1912.</span></div></li>
        <li><div><b>Os 7 pés a mais foram intencionais</b><span>O arquiteto Elijah Myers e os legisladores texanos deliberadamente projetaram a cúpula para ser mais alta que a de Washington, DC — uma declaração de orgulho texano e reflexo de que o Texas era o maior estado da União (antes do Alaska, em 1959). A distinção permanece válida para os 48 estados contíguos.</span></div></li>
        <li><div><b>O granito que veio de 90 km de distância</b><span>O granito "Sunset Red" que reveste o exterior veio exclusivamente da pedreira de Marble Falls, adquirida pelo estado. Para transportar 15.000 toneladas de pedra em 1883, uma ferrovia temporária foi construída entre a pedreira e Austin — e desmontada após a obra.</span></div></li>
        <li><div><b>O incêndio que quase apagou tudo</b><span>Em 1983, um incêndio acidental destruiu parcialmente a ala leste, danificando inúmeros artefatos e documentos. A restauração demorou anos e custou mais de US$ 98 milhões — mais que o custo original de 1888. O incêndio acelerou a decisão de construir a extensão subterrânea de 1993.</span></div></li>
        <li><div><b>Apenas o 6º maior capitólio do mundo em 1888</b><span>Na inauguração, era o sexto maior edifício do mundo, atrás apenas da Basílica de São Pedro, do Parlamento Britânico, da Catedral de Colônia, do Panthéon de Paris e do Capitólio dos EUA. Hoje, após a extensão de 1993, é o maior capitólio estadual dos EUA por volume total.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Onde Comer</div>
      <h2 class="mag-title">No entorno do Capitólio</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Fancy BBQ · 10 min a pé</div><h3>Lamberts Downtown Barbecue</h3><div class="addr">📍 401 W 2nd St</div><p>O mais elegante dos restaurantes de BBQ de Austin — "fancy" não é exagero. Brisket e costelas de alta qualidade num ambiente de saloon do século XIX restaurado. Perfeito para o almoço após a visita.</p><span class="order">$$$</span></div>
      <div class="mag-resto"><div class="tier">Mexican Interior · Clássico de Austin</div><h3>Fonda San Miguel</h3><div class="addr">📍 2330 W North Loop Blvd</div><p>O restaurante de culinária mexicana mais respeitado de Austin, a 15 minutos de carro. O brunch de domingo é lendário — enorme bufê de pratos dos estados interiores do México, em ambiente de hacienda colonial autêntica.</p><span class="order">$$$</span></div>
      <div class="mag-resto"><div class="tier">BBQ + Música Ao Vivo · Ícone de Austin</div><h3>Stubb's BBQ</h3><div class="addr">📍 801 Red River St</div><p>A 15 minutos a pé do Capitólio, o Stubb's é simultaneamente churrascaria histórica e um dos venues de música ao vivo mais icônicos dos EUA — Willie Nelson, Radiohead e Adele já tocaram aqui. O brisket é excelente e o ambiente ao ar livre é único.</p><span class="order">$$</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">📱</span>Uber / Lyft</h4><p>Do centro de Austin, corridas custam US$ 8–12. Do aeroporto Austin-Bergstrom (AUS), US$ 20–30. O ponto de embarque é na Congress Ave, lado sul do campus.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>CapMetro Bus</h4><p>A Capital Metro opera diversas linhas que param na Congress Avenue. As linhas 1, 3 e 7 passam em frente ao Capitólio. O app CapMetro mostra horários em tempo real.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚲</span>MetroBike</h4><p>Austin tem um excelente sistema de bicicletas compartilhadas. Há estações do MetroBike na Congress Ave e ao redor do campus — ótima opção para explorar o centro antes ou depois.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Estacionamento</h4><p>Há uma garagem no campus (entrada pela N Congress / 13th St) e estacionamento pago nas ruas ao redor. Nos dias úteis, muitas vagas na Colorado Street liberam após as 18h.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">A alma de Austin em uma avenida</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>South Congress Avenue não é apenas uma rua — é o manifesto vivo de Austin: excêntrica, criativa, autêntica e determinada a manter vivo o espírito de "Keep Austin Weird".</p>
        <p>A avenida tem suas raízes no final do século XIX, quando Austin se expandia ao sul do Rio Colorado. Por décadas, South Congress foi uma artéria comercial modesta, lar de motéis independentes à beira da estrada, borracharias e pequenos negócios locais. O Congress Avenue Bridge, que cruza o rio a poucas quadras ao norte, era o ponto de entrada para visitantes vindos do sul — e South Congress era o primeiro sabor que recebiam da cidade.</p>
        <p>A transformação radical do bairro começou nos anos 1990 e acelerou nos 2000. Artistas, designers e empreendedores criativos atraídos pela Universidade do Texas e pela cena musical começaram a ocupar os espaços comerciais acessíveis da avenida. Lojas vintage, galerias improváveis e restaurantes com personalidade foram substituindo os negócios tradicionais. O resultado foi um corredor único que desafia a gentrificação sem perder a alma.</p>
        <p>Hoje, South Congress é simultaneamente o destino mais instagramável de Austin e um lugar genuinamente frequentado por locais. A tensão entre autenticidade e turismo existe, mas a avenida mantém seu caráter peculiar: você pode comprar botas de couro artesanais numa loja centenária, comer num food trailer estacionado num lote vago e depois fotografar o mural mais famoso do Texas — tudo em menos de uma hora.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i19" alt="South Congress — lojas e murais">
        <figcaption>South Congress — lojas, murais e a vista do Capitólio ao norte</figcaption>
      </figure>
      <div class="mag-callout">
        <span class="lbl">Texas Monthly</span>
        <p>South Congress é Austin em miniatura: irreverente, criativa, deliciosamente estranha — e cada vez mais difícil de replicar em qualquer outro lugar do mundo.</p>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Experiências essenciais</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">❤️</span><h3>Mural "I Love You So Much"</h3><p>Na parede lateral do Jo's Coffee, este simples mural de letras brancas se tornou o ícone cultural mais fotografado de Austin. Criado em 2010 pela artista Amy Cook como declaração à sua namorada, hoje atrai filas no fim de semana. Vá cedo para fotos sem espera.</p></div>
        <div class="mag-card"><span class="ic">👢</span><h3>Allen's Boots &amp; vista do Capitólio</h3><p>A loja de botas de cowboy mais famosa do Texas funciona desde 1977. Mais do que comprar — suba à calçada em frente e olhe ao norte: a perspectiva perfeita do Capitólio ao fundo da avenida é uma das vistas urbanas mais dramáticas do estado.</p></div>
        <div class="mag-card"><span class="ic">🏪</span><h3>Uncommon Objects</h3><p>O mais ambicioso antiquário de Austin: milhares de objetos curiosos distribuídos por vários vendedores num único espaço. Brinquedos dos anos 50, mapas antigos, taxidermia excêntrica, porcelanas do sul profundo. Um museu que você pode comprar. Reserve ao menos uma hora.</p></div>
        <div class="mag-card"><span class="ic">🚐</span><h3>Food Trailers na 6th Street</h3><p>Na esquina de South Congress com a 6th Street, clusters de food trailers oferecem desde tacos de café da manhã até churrasco texano defumado. A cultura de food trailers de Austin nasceu aqui — refeição e aula de história gastronômica ao mesmo tempo.</p></div>
        <div class="mag-card"><span class="ic">🦇</span><h3>Congress Avenue Bridge ao entardecer</h3><p>A poucos minutos a pé ao norte, a ponte abriga a maior colônia urbana de morcegos do mundo — 1,5 milhão de morcegos de cauda livre. Todo entardecer (março a novembro) eles emergem num espetáculo que paralisa a cidade. Chegue 30 minutos antes do pôr do sol.</p></div>
        <div class="mag-card"><span class="ic">🎨</span><h3>Galeria de arte de rua</h3><p>South Congress é uma galeria a céu aberto em constante mutação. Além do mural do Jo's, procure obras em becos laterais, paredes de negócios e até postes. O South Congress Arts District organiza eventos mensais com artistas trabalhando ao vivo nas ruas.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para aproveitar ao máximo</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🗓️</span>Vá na manhã de sábado</h4><p>O movimento é mais animado, as lojas abrem por volta das 10h e os food trailers de café da manhã são uma experiência à parte. Evite domingos à tarde, quando o trânsito é caótico.</p></div>
        <div class="mag-tip"><h4><span class="ic">👟</span>Calçados confortáveis</h4><p>A experiência ideal é percorrer a avenida inteira a pé, de uma ponta à outra. São facilmente 5–6 km contando entradas em lojas e desvios pelos becos.</p></div>
        <div class="mag-tip"><h4><span class="ic">🅿️</span>Estacionamento é um pesadelo</h4><p>Use Uber, Lyft ou o MetroRail. Se insistir em dirigir, há estacionamento público na St. Edward's University, a algumas quadras ao sul.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>Foto no mural sem fila</h4><p>Apareça antes das 9h30 ou depois das 18h em dias de semana. Nos fins de semana, a fila pode ter 30 minutos de espera durante o pico da tarde.</p></div>
        <div class="mag-tip"><h4><span class="ic">👢</span>Compra de botas</h4><p>Allen's Boots e Lucy in Disguise with Diamonds têm seleções vastíssimas e preços honestos. Não compre na primeira loja — passeie antes para comparar estilos e preços.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌙</span>First Thursday</h4><p>Na primeira quinta-feira de cada mês, as lojas ficam abertas até as 22h, há artistas nas ruas e a atmosfera é única. Se a viagem coincidir, não perca.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌡️</span>Calor texano</h4><p>De maio a setembro o calor é intenso. Carregue água, use protetor solar e planeje paradas em cafés ou restaurantes com ar-condicionado a cada hora.</p></div>
        <div class="mag-tip"><h4><span class="ic">🛣️</span>Becos e laterais</h4><p>Alguns dos melhores achados ficam nos becos paralelos à avenida principal. A South 1st Street, uma quadra a oeste, tem uma vibe ainda mais local e menos turística.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que você não sabia</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>O mural mais fotografado do Texas</b><span>O "I Love You So Much" gerou mais de 10 milhões de posts no Instagram desde sua criação em 2010. A artista Amy Cook o pintou como declaração à sua namorada, cofundadora do Jo's Coffee. A caneta usada foi um simples marcador de tinta preta de papelaria comum.</span></div></li>
        <li><div><b>O Austin Motel sobreviveu</b><span>Operando desde 1938, o Austin Motel é um dos poucos motéis de beira de estrada originais que sobreviveu à gentrificação. Com piscina em formato de âncora e arquitetura kitsch dos anos 50, virou ícone cult — e hoje cobra entre US$ 200–400 por noite.</span></div></li>
        <li><div><b>Keep Austin Weird nasceu aqui</b><span>O slogan foi cunhado em 2000 por Red Wassenich, funcionário de uma livraria do bairro, durante uma doação de rádio. A frase era um pedido para que a cidade apoiasse negócios independentes locais — e virou o lema não oficial de Austin.</span></div></li>
        <li><div><b>A vista mais instagramável do Capitólio</b><span>A perspectiva da avenida em direção ao norte, com o domo do Capitólio ao fundo, foi deliberadamente preservada por uma lei municipal que proíbe construções que bloqueiem o "Capitol View Corridor". A lei existe desde 1983.</span></div></li>
        <li><div><b>Food trailers: uma revolução gastronômica</b><span>Austin tem mais food trailers per capita do que qualquer cidade americana. South Congress foi a incubadora do movimento — quando o aluguel comercial era acessível nos anos 2000, chefs criativos usaram trailers como laboratórios culinários de baixo risco. Vários viraram restaurantes celebrados.</span></div></li>
      </ul>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Onde Comer e Beber</div>
      <h2 class="mag-title">Mesas da SoCo</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Pizzaria · Casual</div><h3>Home Slice Pizza</h3><div class="addr">📍 1415 S Congress Ave</div><p>A pizzaria mais amada de Austin funciona no coração de South Congress desde 2005. Massa fina estilo Nova York, ingredientes frescos e atendimento descontraído. A fila do lado de fora no jantar é quase um ritual social.</p><span class="order">$$ · Pedir: pizza de pepperoni + spaghetti al pomodoro</span></div>
      <div class="mag-resto"><div class="tier">Café · Brunch</div><h3>Jo's Coffee</h3><div class="addr">📍 1300 S Congress Ave</div><p>Mais do que o mural icônico em sua parede — o Jo's é um café de bairro genuíno, com mesas ao ar livre, cafés especiais e um cardápio de brunch texano. O local onde Austin se encontra de manhã.</p><span class="order">$ · Pedir: "Bad Ass Coffee" + tacos de ovo</span></div>
      <div class="mag-resto"><div class="tier">Frutos do Mar · Refinado</div><h3>Perla's Seafood &amp; Oyster Bar</h3><div class="addr">📍 1400 S Congress Ave</div><p>O restaurante mais elegante de South Congress, especializado em peixes e frutos do mar frescos. Ostras do Golfo, cocktail de camarão e peixe do dia preparados com técnica de primeira. Varanda coberta de hera para almoços memoráveis. Reserva recomendada.</p><span class="order">$$$</span></div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Como Chegar</div>
      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🚗</span>De carro</h4><p>Do centro de Austin, cruze o Congress Avenue Bridge ao sul. Estacionamento na rua é limitado e pago. Lotes pagos entre as ruas 1st e 3rd, a oeste da avenida. Orçe US$ 8–15 para o dia.</p></div>
        <div class="mag-tip"><h4><span class="ic">📱</span>Ride-share</h4><p>Uber e Lyft são a opção mais prática. Do Downtown o trajeto leva 5–10 minutos e custa US$ 6–12. O ponto de embarque/desembarque mais conveniente é na esquina com Annie Street.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>Ônibus CapMetro</h4><p>A linha 801 (MetroRapid) percorre South Congress de norte a sul, com paradas regulares. Bilhete único US$ 1,25. Passe diário por US$ 2,50 se for usar o transporte várias vezes.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚲</span>Bicicleta</h4><p>Austin tem o sistema de bike-share MetroBike, com estações ao longo de South Congress. O percurso do centro até a SoCo leva cerca de 15 minutos e dá uma perspectiva diferente da avenida.</p></div>

    <section class="mag-section">
      <div class="mag-eyebrow">História e Contexto</div>
      <h2 class="mag-title">O último bastião que acendeu uma nação</h2>
      <div class="mag-rule"></div>
      <div class="mag-prose">
        <p>A história do Alamo começa muito antes de 1836. Fundado em 1718 como uma missão franciscana espanhola — a <em>Misión San Antonio de Valero</em> — o complexo serviu por décadas como ponto de evangelização dos povos indígenas locais. O apelido "Alamo" deriva da cidade de Alamo de Parras, no México, de onde vieram os soldados que guarneceram o local no início do século XIX. Quando o Texas ainda era parte do México, o complexo foi gradualmente desativado como missão e adaptado como fortim militar.</p>
        <p>Em fevereiro de 1836, o Texas estava em plena revolução contra o general Antonio López de Santa Anna, que havia abolido a constituição mexicana de 1824 e concentrado poderes ditatoriais. Um grupo de 189 defensores — entre eles figuras lendárias como o coronel <strong>William Barret Travis</strong>, o frontiersman <strong>Davy Crockett</strong> e o bowieiro <strong>Jim Bowie</strong> — se entrincheirou no Alamo enquanto a independência do Texas era declarada formalmente em Washington-on-the-Brazos, a centenas de quilômetros dali.</p>
        <p>O cerco começou em 23 de fevereiro e durou treze dias. Travis escreveu uma das cartas mais famosas da história americana — endereçada "To the People of Texas &amp; All Americans in the World" — pedindo reforços e declarando que não se renderiam jamais. A carta nunca gerou os reforços prometidos. Na manhã de 6 de março de 1836, antes do amanhecer, o exército de Santa Anna atacou em força por todos os lados. O combate durou menos de 90 minutos. Todos os defensores foram mortos.</p>
        <p>A derrota tornou-se o combustível da vitória final. Seis semanas depois, na Batalha de San Jacinto, o general Sam Houston derrotou Santa Anna em apenas 18 minutos, gritando "Remember the Alamo!" enquanto avançava. Santa Anna foi capturado e obrigado a assinar um tratado reconhecendo a independência do Texas. O sacrifício dos 189 não foi em vão — e as três palavras "Remember the Alamo" tornaram-se um dos gritos de guerra mais poderosos da história americana.</p>
      </div>
      <figure class="mag-figure wide">
        <img data-img-key="i21" alt="Detalhes históricos do Alamo">
        <figcaption>The Alamo — a fachada de pedra calcária, símbolo mais reconhecível do Texas</figcaption>
      </figure>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">A Linha na Areia</div>
      <h2 class="mag-title">Os 13 dias do cerco</h2>
      <div class="mag-rule"></div>
      <div class="mag-callout">
        <span class="lbl">Coronel William Barret Travis · 24 Fev 1836</span>
        <p><em>"I shall never surrender nor retreat... Victory or Death."</em></p>
      </div>
      <ul class="mag-numlist">
        <li><div><b>23 Fev 1836 — Dia 1</b><span>O exército de Santa Anna chega a San Antonio. Travis envia sua carta histórica pedindo socorro. Jim Bowie, já gravemente doente, é incapaz de comandar — Travis assume o controle.</span></div></li>
        <li><div><b>3 Mar 1836 — Dia 9</b><span>Segundo a lenda, Travis reúne os 189 defensores e traça uma linha no chão com a espada, convidando os que querem permanecer a cruzá-la. Todos cruzam, exceto um. Davy Crockett está entre os que cruzam.</span></div></li>
        <li><div><b>6 Mar 1836 — Dia 13, 5h30</b><span>Antes do amanhecer, 1.800 soldados atacam em quatro colunas simultâneas. Após 90 minutos de combate brutal, todos os 189 defensores estão mortos. Santa Anna ordena que os corpos sejam queimados.</span></div></li>
        <li><div><b>21 Abr 1836 — San Jacinto</b><span>"Remember the Alamo!" ressoa enquanto o exército de Sam Houston derrota Santa Anna em 18 minutos na batalha decisiva. O Texas é livre — o sacrifício de 189 homens mudou a história.</span></div></li>
      </ul>
      <div class="mag-chips"><span class="mag-chip">189 defensores</span><span class="mag-chip">1.800 soldados mexicanos</span><span class="mag-chip">13 dias de cerco</span><span class="mag-chip soft">1836</span></div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">O Que Ver e Fazer</div>
      <h2 class="mag-title">Explorando o Alamo e seu entorno</h2>
      <div class="mag-rule"></div>
      <div class="mag-cards two">
        <div class="mag-card"><span class="ic">🏛️</span><h3>A Igreja — o ícone</h3><p>A fachada em pedra calcária da antiga igreja da missão é o símbolo mais reconhecível do Texas. O interior preserva murais e artefatos originais do século XVIII. Entrada gratuita — não pule mesmo que tenha só 30 minutos.</p></div>
        <div class="mag-card"><span class="ic">🏚️</span><h3>Long Barrack Museum</h3><p>O antigo quartel longo — o edifício mais antigo do Texas, de 1724 — abriga hoje um museu com artefatos originais da batalha: armas, documentos, os últimos objetos dos defensores. Uma das exposições mais emocionantes do Sul dos EUA.</p></div>
        <div class="mag-card"><span class="ic">🌿</span><h3>Os jardins históricos</h3><p>O complexo inclui jardins paisagísticos com árvores centenárias e monumentos. Surpreendentemente tranquilo para um local no coração de uma cidade movimentada — a diferença de temperatura sob as pecan trees nos dias quentes é notável.</p></div>
        <div class="mag-card"><span class="ic">🎧</span><h3>Audioguia e tours</h3><p>O audioguia oficial (US$ 7) é excelente e disponível em português. Tours guiados com rangers saem regularmente e aprofundam detalhes da batalha e da história missionária. Recomendado para crianças e adultos.</p></div>
        <div class="mag-card"><span class="ic">🌊</span><h3>The River Walk — 5 min a pé</h3><p>O famoso Paseo del Río começa literalmente a 5 minutos a pé do Alamo. Os 24 km de calçadas ao longo do rio, com restaurantes, bares e barcos turísticos, são o complemento perfeito para uma tarde histórica.</p></div>
        <div class="mag-card"><span class="ic">🛍️</span><h3>Gift Shop do Alamo</h3><p>A loja oficial tem os melhores souvenirs históricos de San Antonio — livros raros sobre a batalha, réplicas de armas e documentos, produtos com o icônico perfil da fachada. Parte da receita financia a preservação do sítio.</p></div>
      </div>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Dicas Essenciais</div>
      <h2 class="mag-title">Para uma visita respeitosa e completa</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">🤫</span>Silêncio e respeito</h4><p>O Alamo é oficialmente um cemitério e local sagrado — os restos de alguns defensores ainda estão no solo sob seus pés. Os guardas pedem e impõem silêncio e remoção de chapéus dentro da Igreja. Um dos poucos espaços públicos dos EUA onde isso é levado a sério.</p></div>
        <div class="mag-tip"><h4><span class="ic">🕘</span>Chegue antes das 9h30</h4><p>O Alamo abre às 9h e as primeiras horas são as mais tranquilas. Depois das 10h30, especialmente de março a agosto, grupos de turistas e crianças em visita escolar lotam o espaço. Andar pelos jardins com pouca gente é muito diferente.</p></div>
        <div class="mag-tip"><h4><span class="ic">🎫</span>Entrada gratuita</h4><p>A entrada no complexo principal (Igreja e jardins) é completamente gratuita. O Long Barrack Museum cobra à parte (~US$ 15). Se tiver que escolher, veja a Igreja gratuitamente — mas o Long Barrack vale cada centavo pelos artefatos originais.</p></div>
        <div class="mag-tip"><h4><span class="ic">🌊</span>Combine com o River Walk</h4><p>O Alamo e o Paseo del Río são a combinação perfeita: visita histórica pela manhã, almoço sobre a água do River Walk, passeio de barco à tarde. San Antonio é compacta e fácil de explorar a pé.</p></div>
        <div class="mag-tip"><h4><span class="ic">📏</span>A linha na areia</h4><p>O guia que disser que a "linha na areia" de Travis é um mito não está errado — a história foi registrada apenas anos depois pela única testemunha sobrevivente. Mas nenhum texano quer ouvir isso. Aceite a lenda e deixe-a fazer seu trabalho emocional.</p></div>
        <div class="mag-tip"><h4><span class="ic">📸</span>Fotografia permitida</h4><p>Fotos são permitidas nos jardins e na entrada — mas não dentro da Igreja, e os guardas são firmes. Fotografe a fachada icônica pela manhã (luz vinda do leste, sem sombras) ou ao entardecer, quando a pedra calcária fica dourada.</p></div>
        <div class="mag-tip"><h4><span class="ic">🔪</span>Davy Crockett e Jim Bowie</h4><p>Para os fãs de história: os objetos pessoais de Davy Crockett (armas e cartas) e de Jim Bowie (a famosa faca Bowie e documentos) estão no Long Barrack Museum — alguns dos artefatos mais emocionantes da história americana do século XIX.</p></div>
      </div>
    </section>

    <section class="mag-section">
      <div class="mag-eyebrow">Curiosidades</div>
      <h2 class="mag-title">Fatos que aprofundam a história</h2>
      <div class="mag-rule"></div>
      <ul class="mag-numlist">
        <li><div><b>Davy Crockett chegou como voluntário, não como soldado</b><span>O lendário fronteirsman do Tennessee, ex-congressista e herói popular, chegou ao Alamo em fevereiro de 1836 com um grupo de 12 voluntários. Não era militar nem tinha obrigação de estar ali. Tinha 49 anos e poderia ter ficado em casa. A presença e a morte no Alamo o tornaram uma figura mítica da cultura americana.</span></div></li>
        <li><div><b>A faca que batizou uma era</b><span>Jim Bowie dá nome ao tipo de faca mais icônico do Velho Oeste — a "Bowie knife", uma lâmina longa de espinha curva que ele popularizou nos duelos dos anos 1820-30. Durante o cerco, Bowie estava tão doente que combateu deitado numa cama, segundo relatos de sobreviventes mexicanos.</span></div></li>
        <li><div><b>O único sobrevivente que contou a linha na areia</b><span>A história de Travis traçando a linha na areia e convidando os homens a cruzá-la foi registrada apenas uma vez — pelo soldado Louis "Moses" Rose, o único que se recusou a cruzar e escapou. Muitos historiadores debatem a autenticidade, mas ela está tão entranhada na identidade texana que poucos se importam com a dúvida.</span></div></li>
        <li><div><b>O prédio mais antigo do Texas tem 300 anos</b><span>O Long Barrack — hoje o museu — foi construído em 1724 pelos missionários franciscanos espanhóis, tornando-o o edifício mais antigo do Texas em uso contínuo. Quando Crockett e Bowie lutaram ali em 1836, o prédio já tinha 112 anos. Hoje tem mais de 300.</span></div></li>
        <li><div><b>A fachada famosa não existia em 1836</b><span>A fachada curvilínea icônica que aparece em todo souvenir do Texas foi adicionada em 1850, 14 anos após a batalha, pelo exército americano que usava o Alamo como depósito. A fachada de 1836 era mais simples. Ironicamente, a versão que o mundo conhece é uma reconstrução posterior à batalha que a tornou famosa.</span></div></li>
      </ul>
    </section>

    <section class="mag-section tint">
      <div class="mag-eyebrow">Gastronomia Próxima</div>
      <h2 class="mag-title">Onde comer em San Antonio</h2>
      <div class="mag-rule"></div>
      <div class="mag-resto"><div class="tier">Tex-Mex · 24 horas · Histórico</div><h3>Mi Tierra Café y Panadería</h3><div class="addr">📍 218 Produce Row · Market Square</div><p>Aberto desde 1941 e funcionando 24 horas por dia, 365 dias por ano, o Mi Tierra é uma instituição de San Antonio. A decoração com milhares de luzes coloridas e os mariachis ao vivo criam uma atmosfera única. Os tacos de carnitas e os tamales são os melhores da cidade.</p><span class="order">Pedir: tacos de carnitas + tamales</span></div>
      <div class="mag-resto"><div class="tier">Modern Tex-Mex · River Walk</div><h3>Acenar</h3><div class="addr">📍 146 E Houston St · River Walk</div><p>Diretamente sobre o Rio San Antonio, a 5 minutos a pé do Alamo. O Tex-Mex contemporâneo com influências do México interior é excelente, mas o motivo principal é a varanda sobre a água — perfeita para o almoço depois da visita histórica.</p></div>
      <div class="mag-resto"><div class="tier">Café Histórico · King William District</div><h3>The Guenther House</h3><div class="addr">📍 205 E Guenther St</div><p>Instalado na mansão de 1860 do fundador da Pioneer Flour Mills, serve um dos melhores brunchs de San Antonio. Waffles, biscoitos caseiros e o histórico German-American breakfast, no bairro histórico mais bonito da cidade, a 10 minutos de carro.</p></div>
    </section>

    <section class="mag-section">

      <h2 class="mag-title">Acesso e transporte</h2>
      <div class="mag-rule"></div>
      <div class="mag-tips">
        <div class="mag-tip"><h4><span class="ic">📱</span>Uber / Lyft</h4><p>Do centro de San Antonio, corridas custam US$ 8–15. Do aeroporto SAT, US$ 20–30. Endereço exato para o GPS: 300 Alamo Plaza, San Antonio, TX 78205.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚌</span>VIA Metropolitan Transit</h4><p>Diversas linhas da VIA param na Alamo Plaza. A linha 301 (Downtown Circulator) é gratuita e faz um loop pelo centro incluindo o Alamo e o River Walk.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚗</span>Carro / estacionamento</h4><p>Vários estacionamentos pagos na Alamo Plaza e arredores, a partir de US$ 10/dia. Os garages na Commerce Street e na Market Street são os mais convenientes e bem sinalizados.</p></div>
        <div class="mag-tip"><h4><span class="ic">🚶</span>A pé do River Walk</h4><p>Do Paseo del Río, o Alamo fica a apenas 5 minutos a pé subindo as escadas para a Alamo Plaza. A conexão entre os dois é simples e natural — explore ambos no mesmo dia.</p></div>

    <h1>River <em>Walk</em></h1>
